  e.target.value = "";
}

/* ---------- OPSLAAN: DE DATA ZIT IN DIT HTML-BESTAND ZELF ----------
   Geen los JSON-bestand meer. Bij het opslaan wordt dit hele HTML-bestand herschreven: de statische
   "mal" (PRISTINE_HTML, hierboven als allereerste vastgelegd) met daarin de huidige `state` als JSON
   ingebed in het lege <script type="application/json" id="finbo-embedded-data"> blokje. Zo blijft
   het altijd één bestand — app + laatste data ineen — dat overal te openen is (ook op een telefoon,
   die de data dan gewoon meteen ziet, zonder dat er iets hoeft te worden verbonden). Alleen om dat
   ene bestand ook automatisch te kunnen wégschrijven is, net als eerst, een expliciete koppeling
   (File System Access API) nodig — dat kan alleen in een desktopbrowser die dat ondersteunt.
   Nog steeds bewust GEEN localStorage/sessionStorage voor de data zelf. Wél wordt, net als in de
   vorige opzet, een kleine VERWIJZING naar het gekoppelde bestand (een FileSystemFileHandle, geen
   data) in IndexedDB onthouden, zodat je niet elke keer opnieuw hoeft te verbinden. */

/* Elke "<" moet ge-escaped worden zodat een categorienaam met daarin toevallig een scriptsluit-tag
   het ingebedde datablok niet kan afbreken — < is een geldige JSON-escape en levert bij het
   uitlezen gewoon weer het teken "<" op. */
function buildHtmlWithEmbeddedData(){
  const dataJson = JSON.stringify(state).replace(/</g, "\\u003C");
  const withData = PRISTINE_HTML.replace(
    /(<script type="application\/json" id="finbo-embedded-data">)[\s\S]*?(<\/script>)/,
    (_m, open, close) => open + dataJson + close
  );
  return "<!DOCTYPE html>\n" + withData;
}

function readEmbeddedData(){
  try{
    const el = document.getElementById("finbo-embedded-data");
    if(!el) return null;
    const txt = el.textContent.trim();
    if(!txt || txt === "{}") return null;
    return JSON.parse(txt);
  }catch(err){ console.error("Kon ingebedde data niet lezen:", err); return null; }
}

/* Zelfde truc, maar dan om de embedded data uit een extern HTML-bestand te lezen (bij handmatig
   verbinden/importeren van een andere kopie van dit bestand). */
function extractEmbeddedDataFromHtml(text){
  const m = text.match(/<script type="application\/json" id="finbo-embedded-data">([\s\S]*?)<\/script>/);
  if(!m) return null;
  const txt = m[1].trim();
  if(!txt || txt === "{}") return null;
  return JSON.parse(txt);
}

/* ---------- CLOUD-SYNC: Supabase + client-side versleuteling ----------
   Vervangt de oude "verbind een bestand op schijf"-opzet volledig. Dataflow:
   - Inloggen (e-mail/wachtwoord) bij Supabase geeft een sessie — bepaalt WIE je bent.
   - Een apart versleutelingswachtwoord (nooit naar Supabase gestuurd, nooit opgeslagen) bepaalt
     of je de data kunt LEZEN — zelfs Supabase zelf ziet alleen de versleutelde blob.
   - Bij elke wijziging (via scheduleAutoSave(), net als voorheen) wordt de state versleuteld en
     naar je eigen rij in `finbo_state` geschreven (Row Level Security zorgt dat dat ook echt
     alleen jouw rij kan zijn — zie finbo_supabase_setup.sql). */

const SUPABASE_URL = "https://qlsnjlnzvbgwvyjnswvd.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFsc25qbG56dmJnd3Z5am5zd3ZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczOTIwNjQsImV4cCI6MjEwMjk2ODA2NH0.5kByeZpQjtB7DPeQtFidOUSrdGst1Ox5_wyUZ9g9wKo";

/* ---- Versleuteling (WebCrypto: PBKDF2 sleutelafleiding + AES-GCM) ----
   Zie finbo_crypto_module.js voor de losstaand geteste versie hiervan — functioneel identiek. */
const FINBO_PBKDF2_ITERATIONS = 300000;
function bufToBase64(buf){ const b=new Uint8Array(buf); let s=""; for(let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
function base64ToBuf(b64){ const bin=atob(b64); const b=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i); return b.buffer; }
async function finboDeriveKey(password, saltBytes){
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name:"PBKDF2", salt:saltBytes, iterations:FINBO_PBKDF2_ITERATIONS, hash:"SHA-256" }, baseKey, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
}
async function finboEncryptState(stateObj, password){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await finboDeriveKey(password, salt);
  const plaintext = new TextEncoder().encode(JSON.stringify(stateObj));
  const ciphertextBuf = await crypto.subtle.encrypt({ name:"AES-GCM", iv }, key, plaintext);
  return { ciphertext: bufToBase64(ciphertextBuf), salt: bufToBase64(salt), iv: bufToBase64(iv) };
}
async function finboDecryptState(record, password){
  const salt = base64ToBuf(record.salt);
  const iv = base64ToBuf(record.iv);
  const key = await finboDeriveKey(password, salt);
  const ciphertext = base64ToBuf(record.ciphertext);
  let plainBuf;
  try{ plainBuf = await crypto.subtle.decrypt({ name:"AES-GCM", iv }, key, ciphertext); }
  catch(err){ throw new Error("FINBO_DECRYPT_FAILED"); }
  return JSON.parse(new TextDecoder().decode(plainBuf));
}

/* ---- Supabase-client + sessie/wachtwoord-state ---- */
const cloudClient = (typeof window.supabase !== "undefined")
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;
let cloudSession = null;       // huidige Supabase auth-sessie (na inloggen)
let encryptionPassword = null; // in het geheugen; optioneel ook tijdelijk in sessionStorage, zie hieronder
let saveErrorFlag = false;
let autoSaveTimer = null;

/* ---- Versleutelingswachtwoord tijdelijk onthouden bij verversen (issue #6) ----
   Bewuste afweging, expliciet op verzoek van Joshua: het versleutelingswachtwoord werd tot nu toe
   NERGENS opgeslagen (alleen in het geheugen, weg bij verversen/uitloggen) — dat was de veiligste
   optie, maar betekende dat je het bij elke paginaverversing opnieuw moest intypen. Nu wordt het,
   ná een geslaagde ontsleuteling, ook (versleuteld noch onversleuteld — gewoon als tekst) in de
   sessionStorage van déze browser-tab gezet, met een vervaltijd van 8 uur.
   - sessionStorage (i.p.v. localStorage) is bewust gekozen: dat verdwijnt zodra dit tabblad echt
     dichtgaat, in tegenstelling tot localStorage dat voor altijd blijft staan. Het lost dus precies
     "steeds opnieuw intypen bij verversen" op, niet "voor altijd ingelogd blijven op dit apparaat".
   - Gekoppeld aan de ingelogde user_id, zodat een ander/volgend account op hetzelfde apparaat nooit
     per ongeluk het wachtwoord van een eerder account overneemt.
   - Concreet betekent dit wel een echte verandering in het dreigingsmodel: heeft iemand binnen die
     8 uur toegang tot dit browsertabblad (bijv. via de developer-tools, of fysieke toegang tot een
     ontgrendeld toestel), dan kan die het versleutelingswachtwoord uitlezen zonder het te hoeven
     weten. Dat is de bewuste prijs voor het gemak — zie ook het bijgewerkte beveiligingsdocument. */
const FINBO_ENC_PW_TTL_MS = 8 * 60 * 60 * 1000; // 8 uur
function finboEncPwStorageKey(userId){ return "finbo_enc_pw_" + userId; }
function saveEncPasswordForSession(userId, pw){
  try{
    sessionStorage.setItem(finboEncPwStorageKey(userId), JSON.stringify({ pw, expires: Date.now() + FINBO_ENC_PW_TTL_MS }));
  }catch(err){ /* sessionStorage niet beschikbaar (bijv. privénavigatie) — dan gewoon niet onthouden */ }
}
function loadEncPasswordForSession(userId){
  try{
    const raw = sessionStorage.getItem(finboEncPwStorageKey(userId));
    if(!raw) return null;
    const record = JSON.parse(raw);
    if(!record || !record.pw || !record.expires || Date.now() > record.expires){
      sessionStorage.removeItem(finboEncPwStorageKey(userId));
      return null;
    }
    return record.pw;
  }catch(err){ return null; }
}
function clearEncPasswordForSession(userId){
  try{ sessionStorage.removeItem(finboEncPwStorageKey(userId)); }catch(err){ /* niets te wissen */ }
}
/* "dirty" volgt of er wijzigingen zijn die nog niet écht naar de cloud zijn geschreven — gebruikt
   door de beforeunload-waarschuwing hieronder, zodat een aangemaakt maandbudget/jaar/maand nooit
   stilzwijgend verloren gaat doordat het tabblad dichtgaat vóórdat er daadwerkelijk geschreven is. */
let dirty = false;

async function writeStateToCloud(){
  // Sessie/wachtwoord meteen in lokale variabelen vastleggen: hieronder wordt ge-awaited
  // (versleutelen + netwerkschrijving), en in die tussentijd kan de gebruiker uitloggen
  // (signOutCloud zet cloudSession/encryptionPassword dan op null). Zonder deze snapshot
  // zou dat een crash geven op cloudSession.user.id ná een inmiddels genulde cloudSession.
  const sessionAtStart = cloudSession;
  const passwordAtStart = encryptionPassword;
  if(!cloudClient || !sessionAtStart || !passwordAtStart) return;
  try{
    const record = await finboEncryptState(state, passwordAtStart);
    // Nog steeds dezelfde gebruiker/sessie? Zo niet (bv. inmiddels uitgelogd), dan niet meer
    // wegschrijven — anders kan er een schrijving voor de verkeerde/oude sessie plaatsvinden.
    if(cloudSession !== sessionAtStart) return;
    const { error } = await cloudClient.from("finbo_state").upsert({
      user_id: sessionAtStart.user.id,
      ciphertext: record.ciphertext,
      salt: record.salt,
      iv: record.iv,
    });
    if(error) throw error;
    saveErrorFlag = false;
    dirty = false;
  }catch(err){
    console.error("Cloud-opslaan mislukt:", err);
    saveErrorFlag = true;
  }
  updateSaveStatus();
}

function scheduleAutoSave(){
  dirty = true;
  updateSaveStatus();
  if(!cloudSession) return;
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(writeStateToCloud, 500);
}

/* Waarschuw vóórdat het tabblad/venster echt dichtgaat als er nog wijzigingen zijn die niet naar
   de cloud zijn geschreven — of dat nu is omdat je nog niet ingelogd bent, of omdat de auto-save
   van de laatste wijziging nog in het korte debounce-venster zit. */
window.addEventListener("beforeunload", (e) => {
  if(dirty){
    e.preventDefault();
    e.returnValue = "";
  }
});
/* Als het tabblad naar de achtergrond gaat (tab-wissel, dichtklikken) terwijl er nog een auto-save
   gepland staat: meteen wegschrijven in plaats van op de 500ms debounce te wachten. */
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "hidden" && cloudSession && autoSaveTimer){
    clearTimeout(autoSaveTimer);
    writeStateToCloud();
  }
});

function updateSaveStatus(){
  document.querySelectorAll(".save-status").forEach(el=>{
    if(!cloudClient){
      el.textContent = "Supabase-library kon niet geladen worden — check je internetverbinding.";
      el.className = "save-status error";
      return;
    }
    if(saveErrorFlag){
      el.textContent = t("cloudSaveErrorStatus");
      el.className = "save-status error";
      return;
    }
    if(cloudSession){
      el.innerHTML = `<span class="dot"></span>${t("cloudSaveStatus")(cloudSession.user.email)}`;
      el.className = "save-status on";
      return;
    }
    el.textContent = t("cloudSaveOff");
    el.className = "save-status";
  });
}

/* Handmatige "Opslaan"-knop: schrijft meteen (zonder op de debounce te wachten) naar de cloud. */
async function saveNow(){
  if(!cloudSession) return;
  clearTimeout(autoSaveTimer);
  const btns = document.querySelectorAll("#saveNowBtn");
  btns.forEach(b=>{ b.disabled = true; b.textContent = t("saveNowSaving"); });
  await writeStateToCloud();
  btns.forEach(b=>{ b.disabled = false; b.textContent = saveErrorFlag ? t("saveNowBtn") : t("saveNowSaved"); });
  setTimeout(()=>{ document.querySelectorAll("#saveNowBtn").forEach(b=>{ b.textContent = t("saveNowBtn"); }); }, 1500);
}

async function signOutCloud(){
  // Een eventueel nog geplande auto-save (debounce-timer) annuleren vóórdat we zelf meteen
  // wegschrijven — anders kan die losse timer later alsnog afgaan, ná het uitloggen hieronder.
  clearTimeout(autoSaveTimer);
  if(dirty) await writeStateToCloud();
  if(cloudClient) await cloudClient.auth.signOut();
  // Een expliciete uitlog-actie wist het 8-uur-onthouden versleutelingswachtwoord (issue #6) ook
  // meteen weer — dat "onthouden" is puur bedoeld om verversen te overbruggen, niet om na bewust
  // uitloggen alsnog automatisch weer in te loggen.
  if(cloudSession) clearEncPasswordForSession(cloudSession.user.id);
  cloudSession = null;
  encryptionPassword = null;
  renderAuthGate();
}

function renderEncryptionPrompt(){
  const el = document.getElementById("authGate");
  // Weten we al of er cloud-data voor dit account bestaat? Dat bepaalt of dit een "kies een
  // nieuw wachtwoord"-scherm is (met bevestigveld) of een "voer je wachtwoord in"-scherm.
  el.innerHTML = authGateHTML(`<p>Bezig met controleren…</p>`);
  cloudClient.from("finbo_state").select("*").eq("user_id", cloudSession.user.id).maybeSingle().then(({ data, error }) => {
    if(error){
      el.innerHTML = authGateHTML(`<p class="auth-gate-error">${error.message}</p>`);
      return;
    }
    if(data){
      // Staat er nog een niet-vervallen versleutelingswachtwoord voor dit account uit een eerdere
      // verversing binnen de laatste 8 uur (issue #6)? Dan meteen zelf ontsleutelen en doorstarten,
      // zonder de gebruiker opnieuw te laten typen.
      const rememberedPw = loadEncPasswordForSession(cloudSession.user.id);
      if(rememberedPw){
        finboDecryptState(data, rememberedPw).then(decrypted => {
          state = decrypted;
          if(!state.activeView) state.activeView = {type:"scenario", index: state.activeScenario||0};
          if(!state.months) state.months = [];
          if(!state.lang) state.lang = "nl";
          if(!state.loonstijging) state.loonstijging = DEFAULT_LOONSTIJGING;
          migrateState();
          encryptionPassword = rememberedPw;
          renderAuthGate();
          bootApp();
        }).catch(() => {
          // Onwaarschijnlijk (zou betekenen dat het onthouden wachtwoord niet meer bij de data
          // past), maar voor de zekerheid: gewoon opnieuw laten intypen i.p.v. vastlopen.
          clearEncPasswordForSession(cloudSession.user.id);
          renderEncryptionPromptExisting(data);
        });
        return;
      }
      renderEncryptionPromptExisting(data);
    }else{
      renderEncryptionPromptNew();
    }
  });
}

/* ---------- RENDER: TABS ---------- */
// In-/uitklapstand van de Maandbudgetten- en Jaren-lijstjes in het menu. Bewust NIET in `state`
// (dus niet meegenomen in export/cloud-sync) — dit is puur een lokale schermvoorkeur, geen data.
// Standaard dichtgeklapt bij het inloggen/openen (issue #1) — de actieve maand/jaar blijft altijd
// gewoon bereikbaar via de kop van de pagina/het actieve tabblad, dus dichtgeklapt is geen
// probleem, en zo oogt het menu meteen rustiger bij het inloggen.
let collapsedGroups = { budgets: true, years: true, growth: true };

/* Maakt een hele groepskop (niet alleen het pijltje) klikbaar om in-/uit te klappen — zie issue
   #4. Klikken op het "+"-knopje (indien aanwezig) doet bewust NIET mee, die heeft al zijn eigen
   actie (nieuw jaar/maandbudget aanmaken). */
function wireGroupHeadCollapse(headEl, toggle){
  headEl.classList.add("collapsible");
  headEl.addEventListener("click", (e)=>{
    if(e.target.closest(".group-add-btn")) return;
    toggle();
  });
}

/* Herordenen van een lijstje tab-knoppen door ze ingedrukt te houden (muis) of vast te houden
   (touch) en dan te slepen — gebruikt voor de Maandbudgetten-lijst, zodat bv. een later toegevoegde
   "Juni" niet perse onderaan/bovenaan hoeft te blijven staan. Werkt via Pointer Events, zodat
   muis en touch dezelfde code delen. Een gewone korte klik/tap navigeert nog altijd normaal —
   pas na LONG_PRESS_MS stilzitten wordt het een sleep-actie; beweegt de vinger/muis te veel vóór
   die tijd is verstreken, dan wordt de sleep-poging geannuleerd en blijft het gewoon een klik/scroll.
   `container` moet de directe ouder zijn van de te herordenen knoppen, elk met de class
   "tab-draggable" en een "data-drag-id". Bij loslaten na een geslaagde sleep roept dit `onReorder`
   aan met de nieuwe volgorde van die id's, zodat de aanroeper de onderliggende array kan bijwerken. */
function enableLongPressReorder(container, onReorder){
  const LONG_PRESS_MS = 380;
  const MOVE_CANCEL_PX = 10;
  let pressTimer = null;
  let dragBtn = null;
  let suppressNextClick = false;

  const clearPressTimer = () => { if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; } };
  const draggableSiblings = () => Array.from(container.querySelectorAll(":scope > .tab-draggable"));

  // Eén click-listener op de container (capture-fase) volstaat om de synthetische klik die na een
  // sleep-actie loskomt te onderscheppen — ongeacht op welke knop die precies terechtkomt.
  container.addEventListener("click", (e) => {
    if(suppressNextClick){
      e.preventDefault();
      e.stopImmediatePropagation();
      suppressNextClick = false;
    }
  }, true);

  // Sleep-beweging en loslaten worden op `document` afgeluisterd (i.p.v. op de knop zelf met
  // setPointerCapture) — betrouwbaarder zodra de knop tijdens het slepen zelf in de DOM verplaatst
  // wordt (insertBefore/appendChild hieronder), wat bij element-gebonden pointer capture in sommige
  // browsers de capture voortijdig laat verlopen.
  const onDragMove = (e) => {
    if(!dragBtn) return;
    e.preventDefault();
    const y = e.clientY;
    const others = draggableSiblings().filter(sib => sib !== dragBtn);
    const afterEl = others.find(sib=>{
      const rect = sib.getBoundingClientRect();
      return y < rect.top + rect.height/2;
    });
    if(afterEl) container.insertBefore(dragBtn, afterEl);
    else container.appendChild(dragBtn);
  };
  const endDrag = () => {
    clearPressTimer();
    document.removeEventListener("pointermove", onDragMove);
    document.removeEventListener("pointerup", endDrag);
    document.removeEventListener("pointercancel", endDrag);
    if(dragBtn){
      dragBtn.classList.remove("tab-dragging");
      dragBtn.style.touchAction = "";
      dragBtn = null;
      suppressNextClick = true;
      onReorder(draggableSiblings().map(sib => sib.dataset.dragId));
    }
  };

  draggableSiblings().forEach(btn=>{
    btn.addEventListener("pointerdown", (e)=>{
      if(e.pointerType === "mouse" && e.button !== 0) return;
      const startX = e.clientX, startY = e.clientY;
      clearPressTimer();

      const onEarlyMove = (ev) => {
        if(Math.abs(ev.clientX-startX) > MOVE_CANCEL_PX || Math.abs(ev.clientY-startY) > MOVE_CANCEL_PX){
          cleanupEarly();
        }
      };
      const cleanupEarly = () => {
        clearPressTimer();
        document.removeEventListener("pointermove", onEarlyMove);
        document.removeEventListener("pointerup", cleanupEarly);
        document.removeEventListener("pointercancel", cleanupEarly);
      };
      document.addEventListener("pointermove", onEarlyMove);
      document.addEventListener("pointerup", cleanupEarly);
      document.addEventListener("pointercancel", cleanupEarly);

      pressTimer = setTimeout(()=>{
        document.removeEventListener("pointermove", onEarlyMove);
        document.removeEventListener("pointerup", cleanupEarly);
        document.removeEventListener("pointercancel", cleanupEarly);
        dragBtn = btn;
        btn.classList.add("tab-dragging");
        btn.style.touchAction = "none";
        document.addEventListener("pointermove", onDragMove);
        document.addEventListener("pointerup", endDrag);
        document.addEventListener("pointercancel", endDrag);
      }, LONG_PRESS_MS);
    });
  });
}

function renderTabs(){
  const el = document.getElementById("tabs");
  el.innerHTML = "";

  // Basisdata staat altijd los vooraan, als eigen groepje van één tab. Zelfde uiterlijk als de
  // kopjes van Maandbudgetten/Jaren/Groei (zie issue #5) — maar zonder pijltje/dropdown, want een
  // klik gaat meteen naar de pagina zelf in plaats van een lijstje te openen. Geen "01"-prefix meer.
  const bdGroup = document.createElement("div");
  bdGroup.className = "tab-group";
  const bd = basisdataScenario();
  const bdBtn = document.createElement("button");
  bdBtn.className = "tab-group-head tab-group-head-direct" + (state.activeView.type==="scenario" && state.activeView.index===0 ? " active":"");
  bdBtn.innerHTML = `<span class="tab-group-label">${bd.label}</span>`;
  bdBtn.onclick = ()=>{ state.activeScenario = 0; state.activeView = {type:"scenario", index:0}; renderAll(); };
  bdGroup.appendChild(bdBtn);
  el.appendChild(bdGroup);

  // Maandbudgetten + Jaren staan samen in een "pair"-wrapper: op een smal scherm staan ze
  // gewoon onder elkaar (zoals voorheen), maar vanaf voldoende paginabreedte zet de CSS
  // (`.tab-group-pair`, zie <style>) ze naast elkaar — er is toch ruime lege ruimte rechts van
  // het menu op brede schermen. Beide lijstjes zijn bovendien los van elkaar in-/uitklapbaar.
  const groupPair = document.createElement("div");
  groupPair.className = "tab-group-pair";

  // Maandbudgetten: eigen groepje direct na Basisdata, vóór de overige jaren (nieuwste bovenaan).
  // Het groepje (met "+"-knop) staat er altijd, ook zonder maandbudgetten — dat is nu meteen de
  // plek om er een aan te maken, in plaats van een kaart onderaan de Basisdata-pagina.
  const budgetGroup = document.createElement("div");
  budgetGroup.className = "tab-group";
  budgetGroup.innerHTML = `
    <div class="tab-group-head">
      <button class="group-collapse-btn${collapsedGroups.budgets ? " collapsed":""}" id="collapseBudgetsBtn" title="${t("collapseGroupBtn")}" aria-label="${t("collapseGroupBtn")}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <span class="tab-group-label">${t("maandbudgettenLabel")}</span>
      <button class="group-add-btn" id="addBudgetBtn" title="${t("nieuwBudgetBtn")}">+</button>
    </div>`;
  budgetGroup.querySelector("#addBudgetBtn").onclick = () => createBudget();
  wireGroupHeadCollapse(budgetGroup.querySelector(".tab-group-head"), () => { collapsedGroups.budgets = !collapsedGroups.budgets; renderTabs(); });
  if(!collapsedGroups.budgets){
    state.budgets.forEach(b=>{
      const btn = document.createElement("button");
      btn.className = "tab tab-draggable" + (state.activeView.type==="budget" && state.activeView.id===b.id ? " active":"");
      btn.textContent = b.title;
      btn.dataset.dragId = b.id;
      btn.onclick = ()=>{ state.activeView = {type:"budget", id:b.id}; renderAll(); };
      budgetGroup.appendChild(btn);
    });
    // Klikken en (op muis) ingedrukt houden, of (op touch) vasthouden, laat je een maandbudget
    // naar een andere plek in het lijstje slepen — handig omdat nieuwe maandbudgetten anders altijd
    // bovenaan verschijnen (zie createBudget()), ook als het bv. om een terugwerkend toegevoegde
    // "Juni" gaat die er eigenlijk qua tijdlijn middenin hoort.
    if(state.budgets.length > 1){
      enableLongPressReorder(budgetGroup, (newOrderIds)=>{
        const byId = {};
        state.budgets.forEach(b => { byId[b.id] = b; });
        const reordered = newOrderIds.map(id => byId[id]).filter(Boolean);
        // Defensief: als er ooit een id in newOrderIds ontbreekt in byId (zou niet moeten gebeuren),
        // val terug op de oude volgorde in plaats van budgetten kwijt te raken.
        state.budgets = (reordered.length === state.budgets.length) ? reordered : state.budgets;
        renderAll();
      });
    }
  }
  groupPair.appendChild(budgetGroup);

  // Overige jaren (2027, 2028, en elk zelf aangemaakt jaar erna) — "+" maakt het volgende jaar aan.
  const scenGroup = document.createElement("div");
  scenGroup.className = "tab-group";
  scenGroup.innerHTML = `
    <div class="tab-group-head">
      <button class="group-collapse-btn${collapsedGroups.years ? " collapsed":""}" id="collapseYearsBtn" title="${t("collapseGroupBtn")}" aria-label="${t("collapseGroupBtn")}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <span class="tab-group-label">${t("jarenLabel")}</span>
      <button class="group-add-btn" id="addJaarBtn" title="${t("nieuwJaarBtn")(latestScenario().jaar+1)}">+</button>
    </div>`;
  scenGroup.querySelector("#addJaarBtn").onclick = () => createNewYear();
  wireGroupHeadCollapse(scenGroup.querySelector(".tab-group-head"), () => { collapsedGroups.years = !collapsedGroups.years; renderTabs(); });
  if(!collapsedGroups.years){
    state.scenarios.slice(1).forEach((s,offset)=>{
      const i = offset + 1;
      const b = document.createElement("button");
      b.className = "tab" + (state.activeView.type==="scenario" && state.activeView.index===i ? " active":"");
      const labelText = s.label === String(s.jaar) ? s.label : `${s.label} · ${s.jaar}`;
      b.innerHTML = `<span class="tab-idx">${String(i+1).padStart(2,"0")}</span>${labelText}`;
      b.onclick = ()=>{ state.activeScenario = i; state.activeView = {type:"scenario", index:i}; renderAll(); };
      scenGroup.appendChild(b);
    });
  }
  groupPair.appendChild(scenGroup);

  el.appendChild(groupPair);

  if(state.months.length){
    const monthGroup = document.createElement("div");
    monthGroup.className = "tab-group";
    state.months.forEach(m=>{
      const row = document.createElement("div");
      row.className = "tab-row";

      const b = document.createElement("button");
      b.className = "tab" + (state.activeView.type==="month" && state.activeView.key===m.key ? " active":"");
      b.textContent = monthLabel(m);
      b.onclick = ()=>{ state.activeView = {type:"month", key:m.key}; renderAll(); };
      row.appendChild(b);

      // Rechtstreeks vanuit het menu een geïmporteerde maand kunnen verwijderen — handig zodra hij
      // (via "Toepassen op budget") al is verwerkt in het maandbudget en de ruwe importdata zelf
      // niet meer nodig is. Doet exact hetzelfde als de "Verwijder deze maand"-knop onderaan de
      // maandpagina zelf (die blijft ook gewoon bestaan), maar dan zonder eerst te hoeven navigeren.
      const delBtn = document.createElement("button");
      delBtn.className = "tab-delete-btn";
      delBtn.type = "button";
      delBtn.title = t("deleteMonthBtn");
      delBtn.setAttribute("aria-label", t("deleteMonthBtn"));
      delBtn.textContent = "×";
      delBtn.onclick = (e) => {
        e.stopPropagation();
        if(confirm(t("deleteMonthConfirm"))){
          state.months = state.months.filter(x=>x.key!==m.key);
          if(state.activeView.type==="month" && state.activeView.key===m.key){
            state.activeView = {type:"scenario", index: state.activeScenario};
          }
          renderAll();
        }
      };
      row.appendChild(delBtn);

      monthGroup.appendChild(row);
    });
    el.appendChild(monthGroup);
  }

  // "Groei"-groepje: een eigen, in-/uitklapbare menugroep (net als Maandbudgetten en Jaren, met
  // hetzelfde pijltje en standaard dichtgeklapt), met daarin (voorlopig) alleen "Salaris groei"
  // als pagina — zie issue #2 en de feedback daarop (het moest zich echt hetzelfde gedragen als
  // Maandbudgetten/Jaren, niet alleen een los kopje zijn).
  const extraGroup = document.createElement("div");
  extraGroup.className = "tab-group";
  extraGroup.innerHTML = `
    <div class="tab-group-head">
      <button class="group-collapse-btn${collapsedGroups.growth ? " collapsed":""}" id="collapseGrowthBtn" title="${t("collapseGroupBtn")}" aria-label="${t("collapseGroupBtn")}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <span class="tab-group-label">${t("groeiGroupLabel")}</span>
    </div>`;
  wireGroupHeadCollapse(extraGroup.querySelector(".tab-group-head"), () => { collapsedGroups.growth = !collapsedGroups.growth; renderTabs(); });
  if(!collapsedGroups.growth){
    const loonstijgingBtn = document.createElement("button");
    loonstijgingBtn.className = "tab" + (state.activeView.type==="loonstijging" ? " active":"");
    loonstijgingBtn.textContent = t("navLoonstijging");
    loonstijgingBtn.onclick = () => { state.activeView = {type:"loonstijging"}; renderAll(); };
    extraGroup.appendChild(loonstijgingBtn);
  }
  el.appendChild(extraGroup);

  const uploadRow = document.createElement("div");
  uploadRow.className = "upload-row";

  const uploadBtn = document.createElement("button");
  uploadBtn.className = "tab tab-upload";
  uploadBtn.textContent = t("uploadBtn");
  uploadBtn.onclick = () => document.getElementById("csvUploadInput").click();
  uploadRow.appendChild(uploadBtn);

  const uploadPdfBtn = document.createElement("button");
  uploadPdfBtn.className = "tab tab-upload";
  uploadPdfBtn.textContent = t("uploadPdfBtn");
  uploadPdfBtn.onclick = () => document.getElementById("pdfUploadInput").click();
  uploadRow.appendChild(uploadPdfBtn);

  el.appendChild(uploadRow);
}

/* ---------- RENDER: LOONSVERHOGING-BLOK PER JAAR ---------- */
/* Elk niet-Basisdata jaar (2027, 2028, en elk zelf aangemaakt jaar) heeft bovenaan zijn eigen
   loonsverhoging-blok: vast bedrag + percentage, toegepast op het loon van het jaar ervoor. Dat
   resultaat is het loon van DIT jaar (zie computedLoon) — direct zichtbaar in de Inkomsten-kaart
   eronder (daar staat Loon read-only, met een verwijzing naar dit blok). */
function renderLoonsverhogingCard(s){
  const idx = state.scenarios.indexOf(s);
  const prev = state.scenarios[idx-1];
  if(!s.loonstijging) s.loonstijging = { vast:0, pct:0 };
  const wrap = document.createElement("div");
  wrap.className = "card";
  wrap.innerHTML = `
    <div class="card-head">
      <h2>${t("loonsverhogingTitle")(s.jaar)}</h2>
    </div>
    <div class="verhogingen-info">
      <div>${t("vorigJaarLoon")(prev.jaar)}: <span class="mono">€ ${fmt(computedLoon(prev))}</span></div>
    </div>
    <div class="rows verhogingen-rows">
      <div class="row">
        <input class="label-input" value="${t("indexLabel")}" disabled />
        <div class="value-wrap">
          <span class="euro">€</span>
          <input class="value-input" id="loonstijgingVastInput" type="number" step="0.01" value="${(Number(s.loonstijging.vast)||0).toFixed(2)}" />
        </div>
      </div>
      <div class="row">
        <input class="label-input" value="${t("pctLabel")}" disabled />
        <div class="value-wrap pct-stepper">
          <div class="stepper-btns">
            <button type="button" class="step-btn" id="loonstijgingPctMinus" aria-label="${t('pctLabel')} −1">−</button>
            <button type="button" class="step-btn" id="loonstijgingPctPlus" aria-label="${t('pctLabel')} +1">+</button>
          </div>
          <input class="value-input" id="loonstijgingPctInput" type="number" step="1" value="${Number(s.loonstijging.pct)||0}" />
          <span class="euro">%</span>
        </div>
      </div>
    </div>
    <div class="verhogingen-info">
      <div>${t("nieuwLoonResultaat")(s.jaar)}: <span class="mono" id="loonstijgingResultDisplay">€ ${fmt(computedLoon(s))}</span></div>
    </div>
  `;
  const updatePreview = () => {
    const el = document.getElementById("loonstijgingResultDisplay");
    if(el) el.textContent = `€ ${fmt(computedLoon(s))}`;
  };
  /* Bij de +/- pijltjes van een number-input vuurt Chromium meteen een "change" (niet pas bij
     verlaten van het veld) — een renderAll() daarop bouwt de kaart opnieuw op, en dat nieuwe
     invoerveld heeft dan geen focus meer. Zonder deze fix moest je na élk stapje opnieuw klikken.
     Had het veld de focus vóór het herbouwen, dan krijgt het 'm er hierna dus weer bij terug, zodat
     je met de pijltjes gewoon door kunt blijven klikken (bijv. meerdere hele procenten achter elkaar). */
  const changeHandler = (id) => () => {
    const hadFocus = document.activeElement && document.activeElement.id === id;
    renderAll();
    if(hadFocus){
      const el = document.getElementById(id);
      if(el){ el.focus(); const v = el.value; el.value = ""; el.value = v; }
    }
  };
  wrap.querySelector("#loonstijgingVastInput").oninput = e => {
    s.loonstijging.vast = parseFloat(e.target.value) || 0;
    updatePreview();
  };
  wrap.querySelector("#loonstijgingVastInput").onchange = changeHandler("loonstijgingVastInput");
  wrap.querySelector("#loonstijgingPctInput").oninput = e => {
    s.loonstijging.pct = parseFloat(e.target.value) || 0;
    updatePreview();
  };
  wrap.querySelector("#loonstijgingPctInput").onchange = changeHandler("loonstijgingPctInput");
  /* +/- stapper-knoppen: zelfde effect als de (nu verborgen) pijltjes van het getalveld, maar
     altijd zichtbaar en groot genoeg om ook op een telefoon/tablet aan te tikken. Passen de
     waarde direct aan zonder de kaart opnieuw op te bouwen — geen focus-gedoe, blijft dus ook
     achter elkaar aantikbaar werken. */
  const pctInput = wrap.querySelector("#loonstijgingPctInput");
  const stepPct = (delta) => {
    s.loonstijging.pct = (Number(s.loonstijging.pct) || 0) + delta;
    pctInput.value = s.loonstijging.pct;
    updatePreview();
    // Zelfde volledige sync (incl. het samenvattingspaneel rechts) als na typen/pijltjes +
    // de focus-fix hierboven, zodat de knoppen ook meerdere keren achter elkaar aantikbaar blijven.
    changeHandler("loonstijgingPctInput")();
  };
  wrap.querySelector("#loonstijgingPctMinus").onclick = () => stepPct(-1);
  wrap.querySelector("#loonstijgingPctPlus").onclick = () => stepPct(1);
  return wrap;
}

/* Nieuw jaar aanmaken gebeurt nu vanuit het "+"-knopje bij de groep "Jaren" in het menu
   (zie renderTabs) in plaats van een kaart onderaan de pagina — altijd zichtbaar, geen scrollen. */
/* Maakt een nieuw jaar aan als volledige, onafhankelijke kopie van het meest recente jaar
   (inkomsten, vaste lasten, abonnementen, variabele lasten, incl. het loon van dat jaar als
   startpunt). Het eigen loonsverhoging-blok van het nieuwe jaar start als kopie van dat van het
   meest recente jaar en is daarna los aanpasbaar. Nieuwe jaren zijn niet "locked" en dus
   verwijderbaar. */
function createNewYear(){
  const latest = latestScenario();
  const nextJaar = latest.jaar + 1;
  const defaultLoonstijging = latest.loonstijging
    ? { vast: latest.loonstijging.vast, pct: latest.loonstijging.pct }
    : { vast: 0, pct: 0 };
  const newScenario = makeScenario(String(nextJaar), nextJaar, false,
    latest.income.items, latest.vasteLasten.items, latest.abonnementen.items, latest.variabeleLasten.items,
    defaultLoonstijging);
  state.scenarios.push(newScenario);
  state.activeScenario = state.scenarios.length - 1;
  state.activeView = { type:"scenario", index: state.activeScenario };
  renderAll();
}

/* ---------- RENDER: CATEGORY CARD (generiek, gebruikt door scenario's en maanden) ---------- */
/* Kleine lijn-iconen per categorie-kaart — puur ter herkenning, geen functie. Gebruiken
   currentColor zodat ze automatisch de --forest-kleur van de kop volgen (ook in donkere modus). */
const CARD_ICONS = {
  income: `<svg class="cat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v18M6 8l6-5 6 5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  vasteLasten: `<svg class="cat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7M5 10v9h14v-9" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  abonnementen: `<svg class="cat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 9h8M8 13h5" stroke-linecap="round"/></svg>`,
  variabeleLasten: `<svg class="cat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3v4M18 3v4M4 8h16l-1.5 12.5a1 1 0 01-1 .5H6.5a1 1 0 01-1-.5L4 8z" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
};

function renderCard(key, cat, opts={}){
  const wrap = document.createElement("div");
  wrap.className = "card";
  const total = (opts.totalOverride !== undefined) ? opts.totalOverride : sum(cat.items);
  wrap.innerHTML = `
    <div class="card-head">
      <div class="htitle">${CARD_ICONS[key] || ""}<h2>${cat.title}</h2></div>
      <div class="cat-total mono">€ ${fmt(total)}</div>
    </div>
    <div class="rows"></div>
  `;
  const rows = wrap.querySelector(".rows");
  cat.items.forEach((item, idx)=>{
    const override = opts.valueFor ? opts.valueFor(item, idx) : null;
    const displayValue = override ? override.value : item.v;
    const editable = override ? override.editable : true;
    const displayLabel = (override && override.label !== undefined) ? override.label : translateLabel(item.l);

    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <input class="label-input" value="${displayLabel}" ${editable ? "" : "disabled"} />
      <div class="value-wrap">
        <span class="euro">€</span>
        <input class="value-input" type="number" step="0.01" value="${(Number(displayValue)||0).toFixed(2)}" ${editable ? "" : "disabled"} />
      </div>
      <button class="del-btn" title="${t('delRow')}">×</button>
    `;
    const [labelInput, , delBtn] = row.children;
    const valueInput = row.querySelector(".value-input");
    if(editable){
      labelInput.oninput = e => { item.l = e.target.value; };
      valueInput.oninput = e => { item.v = parseFloat(e.target.value)||0; renderAll(true); };
    }
    delBtn.onclick = () => { cat.items.splice(idx,1); renderAll(); };
    rows.appendChild(row);

    if(item.note){
      const noteText = typeof item.note === "object" ? (item.note[state.lang] || item.note.nl) : item.note;
      if(noteText){
        const noteEl = document.createElement("div");
        noteEl.className = "row-note";
        noteEl.textContent = noteText;
        rows.appendChild(noteEl);
      }
    }
  });
  const addBtn = document.createElement("button");
  addBtn.className = "add-row-btn";
  addBtn.textContent = t("addRow");
  addBtn.onclick = () => { cat.items.push({l:t("newItem"), v:0}); renderAll(); };
  rows.appendChild(addBtn);
  return wrap;
}

/* Inkomsten-kaart: op Basisdata is Loon gewoon direct bewerkbaar. Op elk ander jaar is Loon
   read-only en komt de waarde uit het eigen loonsverhoging-blok van dat jaar (zie
   renderLoonsverhogingCard) — een toelichting onder de rij verwijst daarnaar. */
function renderIncomeCard(s){
  const isBasisdata = s === basisdataScenario();
  const loonItem = getLoonItem(s);
  let opts = {};
  if(!isBasisdata && loonItem){
    loonItem.note = { nl: i18n.nl.loonBerekendNote(s.jaar), en: i18n.en.loonBerekendNote(s.jaar) };
    opts = {
      valueFor: (item) => item === loonItem ? { value: computedLoon(s), editable: false } : null,
    };
  } else if(loonItem){
    loonItem.note = undefined;
  }
  const card = renderCard("income", { title: t("income"), items: s.income.items }, opts);
  card.id = "income-card";
  return card;
}

/* Vaste-lasten-kaart: als de Warmtefonds-schakelaar aan staat, wordt UN-Gas+elec getoond als
   (ruwe waarde − Warmtefonds) met een grijze toelichting eronder, en telt de kaart/het totaal
   ook zo mee. De schakelaar zelf verschijnt alleen op het Basisdata-tabblad, en het effect geldt
   ook alleen daar — elk jaar heeft nu zijn eigen vaste lasten, dus dit hoeft niet meer overal
   door te werken zoals toen alles gedeeld was. */
function renderVasteLastenCard(){
  const bd = basisdataScenario();
  const unItem = bd.vasteLasten.items.find(it => it.l.trim().toLowerCase() === "un-gas+elec");
  const warmtefondsItem = bd.vasteLasten.items.find(it => it.l.trim().toLowerCase() === "warmtefonds");
  const toggleActive = state.warmtefondsAftrek && unItem && warmtefondsItem;

  let opts = {};
  if(toggleActive){
    const warmtefondsVal = parseFloat(warmtefondsItem.v) || 0;
    const rawUN = parseFloat(unItem.v) || 0;
    const netUN = Math.round((rawUN - warmtefondsVal) * 100) / 100;
    unItem.note = { nl: i18n.nl.warmtefondsNote(fmt(warmtefondsVal)), en: i18n.en.warmtefondsNote(fmt(warmtefondsVal)) };
    opts = {
      totalOverride: vasteLastenTotal(),
      valueFor: (item) => {
        if(item !== unItem) return null;
        return { value: netUN, editable: false };
      }
    };
  } else if(unItem){
    unItem.note = undefined;
  }

  const card = renderCard("vasteLasten", { title: t("vasteLasten"), items: bd.vasteLasten.items }, opts);
  card.id = "vaste-lasten-card";
  return card;
}

/* Op elk jaar behalve Basisdata: één samengevatte regel i.p.v. de drie uitgesplitste kaarten
   (vaste lasten/abonnementen/variabele lasten) — die kosten zijn nu altijd gelijk aan Basisdata
   en dus niet meer los te bewerken op dit jaar zelf. Zie ontwerp-doc §3.1. */

/* Budget-versie van renderVasteLastenCard(): identieke UN-Gas+elec-min-Warmtefonds weergave, maar
   scoped op de eigen (bevroren) vaste-lasten-items en het eigen warmtefondsAftrek-vinkje van dit
   specifieke maandbudget, in plaats van Basisdata/de globale instelling. */
function renderVasteLastenCardForBudget(b){
  const unItem = b.vasteLasten.items.find(it => it.l.trim().toLowerCase() === "un-gas+elec");
  const warmtefondsItem = b.vasteLasten.items.find(it => it.l.trim().toLowerCase() === "warmtefonds");
  const toggleActive = b.warmtefondsAftrek && unItem && warmtefondsItem;

  let opts = {};
  if(toggleActive){
    const warmtefondsVal = parseFloat(warmtefondsItem.v) || 0;
    const rawUN = parseFloat(unItem.v) || 0;
    const netUN = Math.round((rawUN - warmtefondsVal) * 100) / 100;
    unItem.note = { nl: i18n.nl.warmtefondsNote(fmt(warmtefondsVal)), en: i18n.en.warmtefondsNote(fmt(warmtefondsVal)) };
    opts = {
      totalOverride: vasteLastenTotalForBudget(b),
      valueFor: (item) => {
        if(item !== unItem) return null;
        return { value: netUN, editable: false };
      }
    };
  } else if(unItem){
    unItem.note = undefined;
  }

  const card = renderCard("vasteLasten", { title: t("vasteLasten"), items: b.vasteLasten.items }, opts);
  card.id = "vaste-lasten-card";
  return card;
}

/* Budget-versie van renderWarmtefondsToggle(): schakelt b.warmtefondsAftrek i.p.v. de globale

function renderScenarioCategories(){
  const el = document.getElementById("categories");

  const s = activeScenarioObj();

/* Kiezer waarmee je bepaalt tegen welk maandbudget deze geüploade maand vergeleken wordt.
   Wijzigen verandert alleen de koppeling, niet de al herkende CSV-data. */
function renderBudgetPickerCard(m){
  const wrap = document.createElement("div");
  wrap.className = "card";
  const linkedBudget = m.budgetId ? state.budgets.find(b=>b.id===m.budgetId) : null;
  // "Toepassen" blijft altijd gewoon klikbaar (o.a. om na het indelen van meer "Nog in te
  // delen"-posten opnieuw te synchroniseren) — "Ongedaan maken" staat er als los knopje naast,
  // alleen zichtbaar zolang er voor DIT gekoppelde maandbudget nog een niet-teruggedraaide
  // momentopname klaarstaat (zie applyMonthToBudget/reverseApplyMonthToBudget).
  const canReverse = !!(linkedBudget && m.appliedToBudget && m.appliedToBudget.budgetId === linkedBudget.id);
  wrap.innerHTML = `
    <div class="card-head"><h2>${t("compareWithLabel")}</h2></div>
    <div class="compare-picker">
      <select id="budgetPickerSelect">
        <option value="" ${!m.budgetId ? "selected" : ""}>${t("noBudgetOption")}</option>
        ${state.budgets.map(b=>`<option value="${b.id}" ${m.budgetId===b.id ? "selected" : ""}>${b.title}</option>`).join("")}
      </select>
    </div>
    ${linkedBudget ? `
      <div class="apply-to-budget-row">
        <button type="button" id="applyToBudgetBtn" class="review-btn">${t("applyToBudgetBtn")(linkedBudget.title)}</button>
        ${canReverse ? `<button type="button" id="reverseApplyToBudgetBtn" class="review-btn added">${t("reverseApplyToBudgetBtn")(linkedBudget.title)}</button>` : ""}
        <div class="card-note apply-to-budget-note">${t("applyToBudgetNote")}</div>
      </div>
    ` : ""}
  `;
  wrap.querySelector("#budgetPickerSelect").onchange = e => {
    m.budgetId = e.target.value || null;
    renderAll();
  };
  const applyBtn = wrap.querySelector("#applyToBudgetBtn");
  if(applyBtn && linkedBudget){
    applyBtn.onclick = () => {
      if(confirm(t("applyToBudgetConfirm")(linkedBudget.title))){
        applyMonthToBudget(m, linkedBudget);
        renderAll();
      }
    };
  }
  const reverseBtn = wrap.querySelector("#reverseApplyToBudgetBtn");
  if(reverseBtn && linkedBudget){
    reverseBtn.onclick = () => {
      if(confirm(t("reverseApplyToBudgetConfirm")(linkedBudget.title))){
        reverseApplyMonthToBudget(m);
        renderAll();
      }
    };
  }
  return wrap;
}

/* Bouwt de vergelijkingsregels voor één blok: unie van de labels uit het maandbudget en de
   CSV-herkende posten van deze maand, met begroot/werkelijk/verschil per label. "kind" bepaalt
   de kleurbetekenis van het verschil: bij "income" is méér dan begroot goed (groen), bij "cost"
   is méér dan begroot juist slecht (rood, boven budget). */
function buildCompareRows(budgetItems, actualItems){
  const map = {};
  (budgetItems||[]).forEach(it=>{
    if(!map[it.l]) map[it.l] = { label: it.l, budget:0, actual:0 };
    map[it.l].budget = parseFloat(it.v)||0;
  });
  (actualItems||[]).forEach(it=>{
    if(!map[it.l]) map[it.l] = { label: it.l, budget:0, actual:0 };
    map[it.l].actual = parseFloat(it.v)||0;
  });
  return Object.values(map)
    .map(r=>({ ...r, diff: r.actual - r.budget }))
    .sort((a,b)=> Math.max(Math.abs(b.budget),Math.abs(b.actual)) - Math.max(Math.abs(a.budget),Math.abs(a.actual)));
}

function renderCompareCard(title, budgetItems, actualItems, kind, iconKey){
  const rows = buildCompareRows(budgetItems, actualItems);
  const totBudget = rows.reduce((a,r)=>a+r.budget,0);
  const totActual = rows.reduce((a,r)=>a+r.actual,0);
  const totDiff = totActual - totBudget;
  const diffClass = (d) => (kind==="income" ? d>=0 : d<=0) ? "good" : "bad";

  const wrap = document.createElement("div");
  wrap.className = "card";
  wrap.innerHTML = `
    <div class="card-head">
      <div class="htitle">${CARD_ICONS[iconKey] || ""}<h2>${title}</h2></div>
    </div>
    <div class="compare-head-row">
      <span class="compare-name"></span>
      <span class="compare-col">${t("compareBudgetCol")}</span>
      <span class="compare-col">${t("compareActualCol")}</span>
      <span class="compare-col">${t("compareDiffCol")}</span>
    </div>
    <div class="compare-rows">
      ${rows.map(r=>`
        <div class="compare-row">
          <span class="compare-name" title="${r.label}">${translateLabel(r.label)}</span>
          <span class="compare-col mono">€ ${fmt(r.budget)}</span>
          <span class="compare-col mono">€ ${fmt(r.actual)}</span>
          <span class="compare-col mono compare-diff ${diffClass(r.diff)}">${r.diff>=0?'+':'−'} € ${fmt(Math.abs(r.diff))}</span>
        </div>
      `).join("")}
      <div class="compare-row compare-total">
        <span class="compare-name">${t("subtotaal")}</span>
        <span class="compare-col mono">€ ${fmt(totBudget)}</span>
        <span class="compare-col mono">€ ${fmt(totActual)}</span>
        <span class="compare-col mono compare-diff ${diffClass(totDiff)}">${totDiff>=0?'+':'−'} € ${fmt(Math.abs(totDiff))}</span>
      </div>
    </div>
  `;
  return wrap;
}

function renderMonthCategories(m){

}
