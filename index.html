  : null;
let cloudSession = null;       // huidige Supabase auth-sessie (na inloggen)
let encryptionPassword = null; // in het geheugen; optioneel ook tijdelijk in sessionStorage, zie hieronder
let saveErrorFlag = false;
let autoSaveTimer = null;

/* ---- Versleutelingswachtwoord tijdelijk onthouden bij verversen (issue #6) ----
   Bewuste afweging, expliciet op verzoek van de gebruiker: het versleutelingswachtwoord werd tot nu toe
   NERGENS opgeslagen (alleen in het geheugen, weg bij verversen/uitloggen) — dat was de veiligste
   optie, maar betekende dat je het bij elke paginaverversing opnieuw moest intypen. Nu wordt het,
   ná een geslaagde ontsleuteling, ook (versleuteld noch onversleuteld — gewoon als tekst) in de
   sessionStorage van déze browser-tab gezet, met een vervaltijd van 8 uur.
   - sessionStorage (i.p.v. localStorage) is bewust gekozen: dat verdwijnt zodra dit tabblad echt
     dichtgaat, in tegenstelling tot localStorage dat voor altijd blijft staan. Het lost dus precies
     "steeds opnieuw intypen bij verversen" op, niet "voor altijd ingelogd blijven op dit apparaat".
   - Gekoppeld aan de ingelogde user_id, zodat een ander/volgend account op hetzelfde apparaat nooit
     per ongeluk het wachtwoord van een eerder account overneemt.
   - Concreet betekent dit wel een echte verandering in het dreigingsmodel: heeft iemand binnen die
     8 uur toegang tot dit browsertabblad (bijv. via de developer-tools, of fysieke toegang tot een
     ontgrendeld toestel), dan kan die het versleutelingswachtwoord uitlezen zonder het te hoeven
     weten. Dat is de bewuste prijs voor het gemak — zie ook het bijgewerkte beveiligingsdocument. */
const FINBO_ENC_PW_TTL_MS = 8 * 60 * 60 * 1000; // 8 uur
function finboEncPwStorageKey(userId){ return "finbo_enc_pw_" + userId; }
function saveEncPasswordForSession(userId, pw){
  try{
    sessionStorage.setItem(finboEncPwStorageKey(userId), JSON.stringify({ pw, expires: Date.now() + FINBO_ENC_PW_TTL_MS }));
  }catch(err){ /* sessionStorage niet beschikbaar (bijv. privénavigatie) — dan gewoon niet onthouden */ }
}
function loadEncPasswordForSession(userId){
  try{
    const raw = sessionStorage.getItem(finboEncPwStorageKey(userId));
    if(!raw) return null;
    const record = JSON.parse(raw);
    if(!record || !record.pw || !record.expires || Date.now() > record.expires){
      sessionStorage.removeItem(finboEncPwStorageKey(userId));
      return null;
    }
    return record.pw;
  }catch(err){ return null; }
}
function clearEncPasswordForSession(userId){
  try{ sessionStorage.removeItem(finboEncPwStorageKey(userId)); }catch(err){ /* niets te wissen */ }
}
/* "dirty" volgt of er wijzigingen zijn die nog niet écht naar de cloud zijn geschreven — gebruikt
   door de beforeunload-waarschuwing hieronder, zodat een aangemaakt maandbudget/jaar/maand nooit
   stilzwijgend verloren gaat doordat het tabblad dichtgaat vóórdat er daadwerkelijk geschreven is. */
let dirty = false;

/* Volgnummer van de laatste bewerking. Nodig omdat writeStateToCloud een momentopname van `state`
   versleutelt en die daarna over het netwerk stuurt: bewerkt de gebruiker in die tussentijd iets,
   dan zit die bewerking NIET in de verzonden tekst. Tot v25 zette de geslaagde schrijving
   desondanks `dirty = false`, waarmee die verse bewerking als "opgeslagen" werd afgeboekt — en
   omdat de drie afsluit-hooks allemaal op `dirty` afgaan, deed ook geen van die iets meer. Pagina
   verversen in dat venster (tot de volle 500 ms debounce) verloor de invoer geruisloos, zónder de
   browserwaarschuwing. Nu boekt een schrijving alleen af wat ze werkelijk meenam. */
let stateGeneration = 0;
let savedGeneration = 0;

/* De cloudrij die deze sessie het laatst gelezen óf geschreven heeft. Er is één rij per gebruiker,
   zonder versiekolom, en de upsert vervangt hem in z'n geheel — dus tot v25 won simpelweg de
   laatste schrijver, zonder dat iemand het merkte. De staat wordt bovendien precies één keer
   gelezen (bij het invoeren van het versleutelingswachtwoord), dus een tabblad dat sinds
   vanochtend openstaat, houdt het beeld van vanochtend vast. Eén hernoemde budgetnaam daar
   overschreef dan een hele middag werk op je telefoon.
   Voor een echte vergrendeling is een versiekolom in de database nodig. Wat hier wél kan zonder
   schemawijziging: vlak voor het schrijven de rij teruglezen en kijken of hij nog is zoals we hem
   achterlieten. Dat is geen atomair slot — twee schrijvingen binnen dezelfde milliseconden glippen
   er nog langs — maar het vangt wel het geval dat in de praktijk voorkomt: een tabblad dat uren
   achterloopt. Bij een verschil wordt er niets geschreven en krijgt de gebruiker de keuze. */
let lastSeenCiphertext = null;
let saveConflictFlag = false;
let retryTimer = null;
let retryDelay = 0;

/* Een mislukte schrijving (tunnel, slapende laptop, verlopen token) liet de gebruiker tot v25
   achter met `dirty = true` en verder niets: geen nieuwe poging, geen backoff, geen reactie op
   terugkerende verbinding. Wie klaar was met invullen en stopte met typen, verloor bij het sluiten
   alles sinds de laatste geslaagde opslag. Nu loopt er een oplopende herhaalpoging (2s, 4s, 8s …
   tot een minuut) die vanzelf stopt zodra het lukt. */
function scheduleRetry(){
  clearTimeout(retryTimer);
  retryDelay = retryDelay ? Math.min(retryDelay * 2, 60000) : 2000;
  retryTimer = setTimeout(() => { if(dirty) writeStateToCloud(); }, retryDelay);
}
function cancelRetry(){ clearTimeout(retryTimer); retryTimer = null; retryDelay = 0; }
// Komt de verbinding terug, dan niet wachten op de volgende backoff-tik.
window.addEventListener("online", () => { if(dirty && cloudSession){ cancelRetry(); writeStateToCloud(); } });

async function writeStateToCloud(forceOverwrite){
  // Sessie/wachtwoord meteen in lokale variabelen vastleggen: hieronder wordt ge-awaited
  // (versleutelen + netwerkschrijving), en in die tussentijd kan de gebruiker uitloggen
  // (signOutCloud zet cloudSession/encryptionPassword dan op null). Zonder deze snapshot
  // zou dat een crash geven op cloudSession.user.id ná een inmiddels genulde cloudSession.
  const sessionAtStart = cloudSession;
  const passwordAtStart = encryptionPassword;
  if(!cloudClient || !sessionAtStart || !passwordAtStart) return;
  try{
    // Vastleggen wélke bewerking deze schrijving meeneemt, vóór het versleutelen (dat maakt de
    // momentopname van `state`). Alles wat de gebruiker daarna typt hoort bij een hoger nummer.
    const genAtStart = stateGeneration;
    const record = await finboEncryptState(state, passwordAtStart);
    // Nog steeds dezelfde gebruiker/sessie? Zo niet (bv. inmiddels uitgelogd), dan niet meer
    // wegschrijven — anders kan er een schrijving voor de verkeerde/oude sessie plaatsvinden.
    if(cloudSession !== sessionAtStart) return;

    if(!forceOverwrite){
      const { data: huidig, error: leesFout } = await cloudClient.from("finbo_state")
        .select("ciphertext").eq("user_id", sessionAtStart.user.id).maybeSingle();
      if(leesFout) throw leesFout;
      if(huidig && lastSeenCiphertext !== null && huidig.ciphertext !== lastSeenCiphertext){
        // Elders is er sinds onze laatste lees-/schrijfbeurt iets opgeslagen. Niet overschrijven.
        saveConflictFlag = true;
        saveErrorFlag = false;
        cancelRetry();
        clearTimeout(autoSaveTimer);
        updateSaveStatus();
        return;
      }
    }

    const { error } = await cloudClient.from("finbo_state").upsert({
      user_id: sessionAtStart.user.id,
      ciphertext: record.ciphertext,
      salt: record.salt,
      iv: record.iv,
    });
    if(error) throw error;
    lastSeenCiphertext = record.ciphertext;
    saveConflictFlag = false;
    saveErrorFlag = false;
    cancelRetry();
    savedGeneration = Math.max(savedGeneration, genAtStart);
    // Alleen schoon als er sinds de momentopname niets meer bij is gekomen.
    dirty = stateGeneration !== savedGeneration;
    if(dirty){ clearTimeout(autoSaveTimer); autoSaveTimer = setTimeout(writeStateToCloud, AUTOSAVE_DEBOUNCE_MS); }
  }catch(err){
    console.error("Cloud-opslaan mislukt:", err);
    saveErrorFlag = true;
    scheduleRetry();
  }
  updateSaveStatus();
}

function scheduleAutoSave(){
  dirty = true;
  stateGeneration++;
  updateSaveStatus();
  if(!cloudSession) return;
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(writeStateToCloud, AUTOSAVE_DEBOUNCE_MS);
}

/* Vóór het tabblad/venster écht dichtgaat of ververst (klik op de ververs-knop van de browser
   telt hier ook onder): als er nog wijzigingen openstaan die niet naar de cloud zijn geschreven,
   meteen (zonder op de 500ms debounce te wachten) een schrijf-poging afvuren. beforeunload-
   handlers kunnen niet op een async operatie wachten, dus dit is "fire-and-forget" — maar omdat we
   hieronder ook e.preventDefault()/returnValue zetten, toont de browser de ingebouwde "Wijzigingen
   die je hebt aangebracht worden mogelijk niet opgeslagen"-waarschuwing, en die pauzeert de
   navigatie lang genoeg om de schrijving alsnog af te ronden voordat de pagina daadwerkelijk
   ververst/sluit. */
window.addEventListener("beforeunload", (e) => {
  if(dirty){
    clearTimeout(autoSaveTimer);
    writeStateToCloud();
    e.preventDefault();
    e.returnValue = "";
  }
});
/* Als het tabblad naar de achtergrond gaat (tab-wissel, dichtklikken, verversen) terwijl er nog
   wijzigingen openstaan: meteen wegschrijven in plaats van op de 500ms debounce te wachten.
   "visibilitychange" naar "hidden" vuurt in de meeste browsers vóór "beforeunload" af, dus dit is
   vaak al de eerste en snelste kans om de allerlaatste wijziging nog weg te schrijven. */
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "hidden" && cloudSession && dirty){
    clearTimeout(autoSaveTimer);
    writeStateToCloud();
  }
});
/* Extra vangnet: "pagehide" vuurt betrouwbaar af bij een refresh/navigatie/sluiten (o.a. Safari,
   en ook bij terug/vooruit-navigatie via de bfcache), zelfs in gevallen waar "visibilitychange" of
   "beforeunload" om wat voor reden dan ook niet (op tijd) afgaan. */
window.addEventListener("pagehide", () => {
  if(cloudSession && dirty){
    clearTimeout(autoSaveTimer);
    writeStateToCloud();
  }
});

function updateSaveStatus(){
  document.querySelectorAll(".save-status").forEach(el=>{
    if(!cloudClient){
      el.textContent = t("supabaseLibError");
      el.className = "save-status error";
      return;
    }
    if(saveConflictFlag){
      el.textContent = t("cloudSaveConflictStatus");
      el.className = "save-status error";
      return;
    }
    if(saveErrorFlag){
      el.textContent = t("cloudSaveErrorStatus");
      el.className = "save-status error";
      return;
    }
    if(cloudSession){
      el.innerHTML = `<span class="dot"></span>${t("cloudSaveStatus")(cloudSession.user.email)}`;
      el.className = "save-status on";
      return;
    }
    el.textContent = t("cloudSaveOff");
    el.className = "save-status";
  });
}

/* Handmatige "Opslaan"-knop: schrijft meteen (zonder op de debounce te wachten) naar de cloud. */
async function saveNow(){
  if(!cloudSession) return;
  clearTimeout(autoSaveTimer);
  const btns = document.querySelectorAll("#saveNowBtn");
  btns.forEach(b=>{ b.disabled = true; b.textContent = t("saveNowSaving"); });
  await writeStateToCloud();
  if(saveConflictFlag){
    // Alleen bij een bewuste klik op Opslaan de vraag stellen — nooit midden in het typen.
    if(confirm(t("cloudSaveConflictPrompt"))) await writeStateToCloud(true);
    else { btns.forEach(b=>{ b.disabled = false; b.textContent = t("saveNowBtn"); }); return; }
  }
  btns.forEach(b=>{ b.disabled = false; b.textContent = saveErrorFlag ? t("saveNowBtn") : t("saveNowSaved"); });
  setTimeout(()=>{ document.querySelectorAll("#saveNowBtn").forEach(b=>{ b.textContent = t("saveNowBtn"); }); }, SAVE_BUTTON_RESET_MS);
}

async function signOutCloud(){
  // Een eventueel nog geplande auto-save (debounce-timer) annuleren vóórdat we zelf meteen
  // wegschrijven — anders kan die losse timer later alsnog afgaan, ná het uitloggen hieronder.
  clearTimeout(autoSaveTimer);
  cancelRetry();
  if(dirty) await writeStateToCloud();
  /* writeStateToCloud vangt zijn eigen fouten af en gooit nooit, dus na het awaiten is `dirty` het
     enige dat vertelt of het gelukt is. Tot v25 werd dat niet gecontroleerd: bij een mislukte
     laatste schrijving logde de app gewoon uit en was alles sinds de vorige geslaagde opslag weg —
     zonder één signaal. Juist iemand die "opslaan mislukt" ziet en dan even opnieuw wil inloggen,
     raakte zo zijn werk kwijt. Nu is dat een expliciete keuze van de gebruiker. */
  if(dirty){
    const toch = confirm(t("signOutUnsavedWarn"));
    if(!toch){ updateSaveStatus(); return false; }
  }
  if(cloudClient) await cloudClient.auth.signOut();
  // Een expliciete uitlog-actie wist het 8-uur-onthouden versleutelingswachtwoord (issue #6) ook
  // meteen weer — dat "onthouden" is puur bedoeld om verversen te overbruggen, niet om na bewust
  // uitloggen alsnog automatisch weer in te loggen.
  if(cloudSession) clearEncPasswordForSession(cloudSession.user.id);
  cloudSession = null;
  encryptionPassword = null;
  dirty = false;
  renderAuthGate();
  return true;
}

let authGateMode = "signin"; // "signin" | "signup"
// Melding die één keer op het inlogscherm getoond wordt nadat een account is verwijderd.

/* Enter in een invoerveld = op de hoofdknop van dat blok drukken.
   Klinkt vanzelfsprekend, maar in gewone HTML werkt dat alleen binnen een <form>, en de
   inlogschermen en het profielpaneel bouwen hun velden los op. Gevolg: je typte je e-mailadres en
   wachtwoord, drukte op Enter, en er gebeurde niets — je moest met de muis naar de knop. Bij het
   aanmaken van een account tikte je dat twee keer achter elkaar mis (eerst de accountgegevens, dan
   het versleutelingswachtwoord).
   Eén luisteraar op het omhullende element is genoeg: die blijft bestaan terwijl de inhoud
   eronder telkens opnieuw wordt opgebouwd. De "hoofdknop" is de knop met class="primary" binnen
   hetzelfde blok — zo kiest Enter in het profielpaneel het juiste blok (e-mailadres bijwerken
   versus wachtwoord bijwerken) en niet zomaar de eerste knop op het scherm. */
function wireEnterSubmit(container){
  if(!container || container.dataset.enterWired) return;
  container.dataset.enterWired = "1";
  container.addEventListener("keydown", (e) => {
    if(e.key !== "Enter" || e.isComposing) return;
    const veld = e.target;
    if(!veld || veld.tagName !== "INPUT") return;
    // Een vinkje of keuzerondje heeft zijn eigen Enter/spatie-gedrag; daar blijven we vanaf.
    if(["checkbox","radio","button","submit","file"].includes(veld.type)) return;
    const blok = veld.closest("div") || container;
    const knop = blok.querySelector("button.primary:not([disabled])")
              || container.querySelector("button.primary:not([disabled])");
    if(!knop) return;
    e.preventDefault();
    knop.click();
  });
}

function renderAuthGate(){

function renderLoginForm(){
  const el = document.getElementById("authGate");
  const isSignUp = authGateMode === "signup";
  el.innerHTML = authGateHTML(`
    <p class="auth-gate-subtitle">${t("loginSubtitle")}</p>
    <div id="authGateError" class="auth-gate-error" style="display:none;"></div>
    <div id="authGateNotice" class="auth-gate-notice" style="display:none;"></div>
    <label>${t("loginEmailLabel")}<input type="email" id="authEmailInput" autocomplete="username" /></label>
    <label>${t("loginPasswordLabel")}<input type="password" id="authPasswordInput" autocomplete="${isSignUp ? "new-password" : "current-password"}" /></label>
    <button id="authSubmitBtn" class="primary">${isSignUp ? t("loginSignUpBtn") : t("loginSignInBtn")}</button>
    <button id="authToggleModeBtn" class="ghost">${isSignUp ? t("loginToggleToSignIn") : t("loginToggleToSignUp")}</button>
  `);
  /* Eenmalige melding na het verwijderen van een account. Het inlogscherm is de enige plek waar
     die nog getoond kan worden — het profielpaneel en de app zelf bestaan op dat moment niet meer
     voor deze gebruiker. Daarna wordt hij gewist, zodat hij niet bij elke verversing terugkomt. */
  if(accountDeletedNotice){
    const noticeEl = document.getElementById("authGateNotice");
    noticeEl.textContent = accountDeletedNotice;
    noticeEl.style.display = "block";
    accountDeletedNotice = null;
  }

  document.getElementById("authToggleModeBtn").onclick = () => {
    authGateMode = isSignUp ? "signin" : "signup";
    renderLoginForm();
  };
  document.getElementById("authSubmitBtn").onclick = async () => {
    const email = document.getElementById("authEmailInput").value.trim();
    const password = document.getElementById("authPasswordInput").value;
    const errEl = document.getElementById("authGateError");
    const noticeEl = document.getElementById("authGateNotice");
    errEl.style.display = "none";
    noticeEl.style.display = "none";
    const btn = document.getElementById("authSubmitBtn");
    btn.disabled = true;
    try{
      if(isSignUp){
        const { data, error } = await cloudClient.auth.signUp({ email, password });
        if(error) throw error;
        if(!data.session){
          noticeEl.textContent = t("loginConfirmEmailNotice");
          noticeEl.style.display = "block";
          btn.disabled = false;
          return;
        }
        cloudSession = data.session;
      } else {
        const { data, error } = await cloudClient.auth.signInWithPassword({ email, password });
        if(error) throw error;
        cloudSession = data.session;
      }
      renderAuthGate();
    }catch(err){
      errEl.textContent = t("loginErrorPrefix") + (err.message || String(err));
      errEl.style.display = "block";
      btn.disabled = false;
    }
  };
}

function renderEncryptionPrompt(){
  const el = document.getElementById("authGate");
  // Weten we al of er cloud-data voor dit account bestaat? Dat bepaalt of dit een "kies een
  // nieuw wachtwoord"-scherm is (met bevestigveld) of een "voer je wachtwoord in"-scherm.
  el.innerHTML = authGateHTML(`<p>Bezig met controleren…</p>`);
  cloudClient.from("finbo_state").select("*").eq("user_id", cloudSession.user.id).maybeSingle().then(({ data, error }) => {
    if(error){
      // Tot v25 was dit een doodlopend scherm: alleen de foutmelding, geen knop. De enige uitweg
      // was de pagina handmatig verversen.
      el.innerHTML = authGateHTML(`
        <p class="auth-gate-error">${escapeHtml(error.message || String(error))}</p>
        <button id="cloudRetryBtn" class="auth-gate-btn">${t("retryBtn")}</button>
        <button id="authSignOutBtn" class="ghost">${t("logoutBtn")}</button>`);
      const retry = document.getElementById("cloudRetryBtn");
      if(retry) retry.onclick = () => renderAuthGate();
      const uit = document.getElementById("authSignOutBtn");
      if(uit) uit.onclick = () => signOutCloud();
      return;
    }
    if(data){
      // Vastleggen welke versie deze sessie gezien heeft, zodat een latere schrijving kan merken
      // dat er elders iets overheen is gegaan (zie lastSeenCiphertext).
      lastSeenCiphertext = data.ciphertext;
      // Staat er nog een niet-vervallen versleutelingswachtwoord voor dit account uit een eerdere
      // verversing binnen de laatste 8 uur (issue #6)? Dan meteen zelf ontsleutelen en doorstarten,
      // zonder de gebruiker opnieuw te laten typen.
      const rememberedPw = loadEncPasswordForSession(cloudSession.user.id);
      if(rememberedPw){
        finboDecryptState(data, rememberedPw).then(decrypted => {
          state = decrypted;
          if(!state.activeView) state.activeView = {type:"scenario", index: state.activeScenario||0};
          if(!state.months) state.months = [];
          if(!state.lang) state.lang = "nl";
          if(!state.loonstijging) state.loonstijging = DEFAULT_LOONSTIJGING.slice();
          migrateState();
          encryptionPassword = rememberedPw;
          renderAuthGate();
          bootApp();
        }).catch(() => {
          // Onwaarschijnlijk (zou betekenen dat het onthouden wachtwoord niet meer bij de data
          // past), maar voor de zekerheid: gewoon opnieuw laten intypen i.p.v. vastlopen.
          clearEncPasswordForSession(cloudSession.user.id);
          renderEncryptionPromptExisting(data);
        });
        return;
      }
      renderEncryptionPromptExisting(data);
    }else{
      renderEncryptionPromptNew();
    }
  });
}

function renderEncryptionPromptExisting(record){

    <p class="auth-gate-subtitle">${t("encryptionPromptTextExisting")}</p>

    <label>${t("encryptionPasswordLabel")}<input type="password" id="encPasswordInput" autocomplete="off" /></label>
    <button id="encSubmitBtn" class="primary">${t("encryptionSubmitBtn")}</button>

  `);
  const submit = async () => {
    const pw = document.getElementById("encPasswordInput").value;
    const errEl = document.getElementById("authGateError");
    const btn = document.getElementById("encSubmitBtn");
    btn.disabled = true;
    try{
      const decrypted = await finboDecryptState(record, pw);
      state = decrypted;
      if(!state.activeView) state.activeView = {type:"scenario", index: state.activeScenario||0};
      if(!state.months) state.months = [];

      renderAuthGate();
      bootApp();
    }catch(err){

      errEl.style.display = "block";

  document.getElementById("encSubmitBtn").onclick = submit;

}

function renderEncryptionPromptNew(){
  const el = document.getElementById("authGate");
  const embeddedHasData = !!readEmbeddedData();
  el.innerHTML = authGateHTML(`
    <div class="auth-gate-title2">${t("firstTimeChoiceTitle")}</div>
    ${embeddedHasData ? `
      <p class="auth-gate-subtitle">${t("firstTimeChoiceText")}</p>
      <button id="firstTimeImportBtn" class="primary">${t("firstTimeImportBtn")}</button>
      <button id="firstTimeBlankBtn" class="ghost">${t("firstTimeBlankBtn")}</button>
    ` : `
      <button id="firstTimeBlankBtn" class="primary">${t("firstTimeBlankBtn")}</button>
    `}
  `);
  const proceedToNewPassword = (useEmbedded) => {
    if(useEmbedded){
      const data = readEmbeddedData();
      if(data){
        state = data;
        if(!state.activeView) state.activeView = {type:"scenario", index: state.activeScenario||0};
        if(!state.months) state.months = [];
        if(!state.lang) state.lang = "nl";
        if(!state.loonstijging) state.loonstijging = DEFAULT_LOONSTIJGING.slice();
        migrateState();
      }
    } else {
      // "Begin leeg" moet ook echt leeg beginnen. Tot v24 deed deze tak niets, waardoor `state`
      // bleef staan op wat er toevallig al in het geheugen zat — de in dit bestand ingebedde data
      // van de vorige gebruiker, of anders de voorbeeldposten die toen nog in de code stonden.
      // Dat werd vervolgens meteen als de data van dit nieuwe account naar de cloud geschreven
      // (zie renderEncryptionPromptNewPassword hieronder). Nu: een echte lege state, waarbij
      // alleen taal- en licht/donker-voorkeur uit het inlogscherm behouden blijven.
      const lang = state.lang;
      const darkMode = state.darkMode;
      state = makeBlankState();
      state.lang = lang;
      state.darkMode = darkMode;
    }
    renderEncryptionPromptNewPassword();
  };
  const importBtn = document.getElementById("firstTimeImportBtn");
  if(importBtn) importBtn.onclick = () => proceedToNewPassword(true);
  document.getElementById("firstTimeBlankBtn").onclick = () => proceedToNewPassword(false);
}

/* Laatste waarschuwing vóór het versleutelingswachtwoord in gebruik wordt genomen.
   De tekst op het invulscherm zegt al dat het wachtwoord nergens anders bestaat, maar dat is een
   regel die je leest terwijl je aan het typen bent — precies het moment waarop niemand stilstaat bij
   wat "onherstelbaar" betekent. Hier wordt het één keer expliciet gevraagd, mét een vinkje, zodat
   het een bewuste handeling is en geen zin die je overgeslagen hebt.
   Bewust alleen bij het AANMAKEN: bij elke volgende keer inloggen weet de gebruiker het wachtwoord
   al, en dan is dit alleen maar in de weg lopen.
   Gebruikt hetzelfde .confirm-overlay/.confirm-card als het venster bij Account verwijderen. */
function showEncryptionSavedWarning(onDoorgaan){
  const overlay = document.createElement("div");
  overlay.className = "confirm-overlay";
  overlay.setAttribute("role", "dialog");
  overlay.setAttribute("aria-modal", "true");
  overlay.innerHTML = `
    <div class="confirm-card">
      <h3 class="confirm-warn">${escapeHtml(t("encSavedTitle"))}</h3>
      <p>${escapeHtml(t("encSavedText"))}</p>
      <p class="confirm-list">${escapeHtml(t("encSavedAdvice"))}</p>
      <label class="confirm-check">
        <input type="checkbox" id="encSavedCheck">
        <span>${escapeHtml(t("encSavedCheckbox"))}</span>
      </label>
      <div class="confirm-actions">
        <button type="button" id="encSavedBackBtn">${escapeHtml(t("encSavedBackBtn"))}</button>
        <button type="button" class="primary" id="encSavedContinueBtn" disabled>${escapeHtml(t("encSavedContinueBtn"))}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const check = overlay.querySelector("#encSavedCheck");
  const doorgaan = overlay.querySelector("#encSavedContinueBtn");
  const sluit = () => { overlay.remove(); document.removeEventListener("keydown", opEscape, true); };
  // Capture + stopPropagation: zie het venster bij Account verwijderen — anders vangt een
  // Escape-handler elders op de pagina dezelfde toetsaanslag ook op.
  const opEscape = (e) => { if(e.key !== "Escape") return; e.stopPropagation(); sluit(); };

  check.onchange = () => { doorgaan.disabled = !check.checked; };
  overlay.querySelector("#encSavedBackBtn").onclick = () => {
    sluit();
    // Terug naar het formulier met de ingetypte waarden er nog in — je wilt het wachtwoord kunnen
    // overschrijven of nog even kopiëren, niet opnieuw beginnen.
    const veld = document.getElementById("encPasswordInput");
    if(veld) veld.focus();
  };
  overlay.onclick = (e) => { if(e.target === overlay) sluit(); };
  document.addEventListener("keydown", opEscape, true);
  check.focus();

  doorgaan.onclick = () => { sluit(); onDoorgaan(); };
}

/* ---------- RENDER: PROFIELPANEEL ---------- */
/* Klapt vanaf links open als overlay bovenop de huidige pagina (zie #profilePanel/.profile-backdrop
   in de CSS) — bewust GEEN onderdeel van `state` (dus niet in export/cloud-sync): dit is puur
   lokale scherm-/navigatiestand, net als collapsedGroups hierboven. "account" is de eerste en tot
   nu toe enige echt uitgewerkte subpagina; "categories" staat er als aankondiging voor een latere
   uitbreiding (eigen categorieën voor geïmporteerde PDF/CSV-transacties). */
let profilePanelOpen = false;
let profilePanelTab = "categories";
const PROFILE_TABS = ["categories","rules","account"];
let profileCategoryExpandedId = null; // welke categorie z'n "koppelingen beheren"-lijst openstaat
let profileCategoryOpenBucket = null; // welke groep (income/vasteLasten/...) is uitgeklapt

function openProfilePanel(){
  profilePanelOpen = true;
  profilePanelTab = "account";
  profileCategoryExpandedId = null;
  profileCategoryOpenBucket = null;
  renderProfilePanel();
}
function closeProfilePanel(){
  profilePanelOpen = false;
  profileCategoryExpandedId = null;
  profileCategoryOpenBucket = null;
  renderProfilePanel();
}

function renderProfilePanel(){
  const panel = document.getElementById("profilePanel");
  const backdrop = document.getElementById("profileBackdrop");
  if(!panel || !backdrop) return; // nog niet in de DOM tijdens de allereerste boot
  wireEnterSubmit(panel);
  panel.classList.toggle("open", profilePanelOpen);
  panel.setAttribute("aria-hidden", profilePanelOpen ? "false" : "true");
  // Zie de lade: aria-hidden alleen is niet genoeg, de sluitknop en de drie tabbladen bleven
  // anders tabbaar terwijl het paneel dicht is.
  if("inert" in panel) panel.inert = !profilePanelOpen;
  backdrop.classList.toggle("open", profilePanelOpen);
  document.getElementById("profileBtn").classList.toggle("active", profilePanelOpen);
  document.getElementById("profilePanelTitle").textContent = t("profilePanelTitle");

  // Volgorde: waar je het vaakst bent staat vooraan. Account is iets wat je één keer instelt en
  // daarna zelden aanraakt, dus die schuift naar achteren.
  const tabsEl = document.getElementById("profilePanelTabs");
  tabsEl.innerHTML = `
    <button class="profile-tab-btn ${profilePanelTab==="categories"?"active":""}" data-tab="categories">${t("profileTabCategories")}</button>
    <button class="profile-tab-btn ${profilePanelTab==="rules"?"active":""}" data-tab="rules">${t("profileTabRules")}</button>
    <button class="profile-tab-btn ${profilePanelTab==="account"?"active":""}" data-tab="account">${t("profileTabAccount")}</button>
  `;
  tabsEl.querySelectorAll(".profile-tab-btn").forEach(b=>{
    b.onclick = () => { profilePanelTab = b.dataset.tab; renderProfilePanel(); };
  });

  const body = document.getElementById("profilePanelBody");
  if(!profilePanelOpen){ body.innerHTML = ""; return; } // niets te renderen terwijl 'm dicht is
  if(profilePanelTab === "categories"){
    renderProfileCategoriesTab(body);
    return;
  }
  if(profilePanelTab === "rules"){
    renderProfileRulesTab(body);
    return;
  }
  renderProfileAccountTab(body);
}

/* Profiel > Importregels: de regels die FinBo heeft onthouden doordat de gebruiker tijdens een
   import zelf een rij indeelde (zie rememberUserRule). Bewust zichtbaar én verwijderbaar: een
   verkeerd geleerde regel zou anders bij elke volgende import blijven terugkomen zonder dat er
   iets aan te doen is. De meegeleverde standaardlijst (CATEGORY_RULES) staat hier niet tussen —
   die is niet van de gebruiker en wordt sowieso door een eigen regel overruled. */
function renderProfileRulesTab(body){
  const rules = state.userRules || [];
  const bucketTitle = (key) => {
    const b = PROFILE_CATEGORY_BUCKETS.find(x => x.key === key);
    return b ? t(b.titleKey) : key;
  };
  body.innerHTML = `
    <div><p class="profile-hint">${t("profileRulesHint")}</p></div>
    <div id="profileRulesList"></div>
  `;
  const list = document.getElementById("profileRulesList");
  if(!rules.length){
    list.innerHTML = `<p class="profile-cat-empty">${t("profileRulesEmpty")}</p>`;
    return;
  }
  list.innerHTML = rules.map(r => `
    <div class="profile-rule-row">
      <div class="profile-rule-text">
        <span class="profile-rule-match">${escapeHtml(r.match)}</span>
        <span class="profile-rule-arrow">→</span>
        <span class="profile-rule-dest">${escapeHtml(bucketTitle(r.bucket))}${r.label && r.label !== r.match ? " · " + escapeHtml(r.label) : ""}</span>
      </div>
      <button type="button" class="profile-rule-del" data-match="${escapeHtml(r.match)}" title="${escapeHtml(t("profileRulesDelete"))}">×</button>
    </div>
  `).join("");
  list.querySelectorAll(".profile-rule-del").forEach(btn=>{
    btn.onclick = () => { deleteUserRule(btn.dataset.match); renderAll(); };
  });
}

// Elke groep is een eigen uitklapsectie ("bucket") met zijn eigen aanmaakveld en lijst -- zie
// createCategory(name, bucket). PROFILE_CATEGORY_BUCKETS bepaalt titel/icoon per groep; de titels
// hergebruiken bewust dezelfde vertaalsleutels (t("income") etc.) als de hoofdkaarten elders in de
// app, zodat de naamgeving overal consistent is.
const PROFILE_CATEGORY_BUCKETS = [
  { key:"income", titleKey:"income" },
  { key:"vasteLasten", titleKey:"vasteLasten" },
  { key:"abonnementen", titleKey:"abonnementen" },
  { key:"variabeleLasten", titleKey:"variabeleLasten" },
];

function renderProfileCategoriesTab(body){

    </div>

function renderBucketAccordion(){
  const listEl = document.getElementById("profileBucketList");
  if(!listEl) return;
  listEl.innerHTML = PROFILE_CATEGORY_BUCKETS.map(b=>{
    const isOpen = profileCategoryOpenBucket === b.key;
    const count = state.categories.filter(c=>c.bucket===b.key).length;
    return `
      <div class="profile-bucket ${isOpen?'open':''}" style="--bucket-color:${bucketColorVar(b.key)}">
        <div class="profile-bucket-head" data-toggle-bucket="${b.key}">
          ${CARD_ICONS[b.key] || ""}
          <span class="profile-bucket-title">${t(b.titleKey)}</span>
          <span class="profile-bucket-count">${count}</span>
          <svg class="profile-bucket-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div class="profile-bucket-body">
          <div class="profile-cat-add-row">
            <div class="profile-cat-add-field">
              <input type="text" maxlength="${MAX_CATEGORY_NAME_LEN}" placeholder="${t('profileCategoryNamePlaceholder')}" data-cat-input="${b.key}">
              <div class="profile-cat-add-field-foot">
                <span class="profile-cat-inline-msg" data-cat-err="${b.key}"></span>
                <span class="profile-cat-counter" data-cat-counter="${b.key}">0 / 20</span>
              </div>
            </div>
            <button type="button" class="profile-cat-add-btn" data-cat-add="${b.key}" disabled>${t("profileCategoryAddBtn")}</button>
          </div>
          <div class="profile-cat-list" data-cat-list="${b.key}"></div>
        </div>
      </div>
    `;
  }).join("");

  listEl.querySelectorAll("[data-toggle-bucket]").forEach(el=>{
    el.onclick = () => {
      const k = el.dataset.toggleBucket;
      profileCategoryOpenBucket = (profileCategoryOpenBucket === k) ? null : k;
      profileCategoryExpandedId = null;
      renderBucketAccordion();
    };
  });
  listEl.querySelectorAll("[data-cat-input]").forEach(input=>{
    const bucket = input.dataset.catInput;
    const counter = listEl.querySelector(`[data-cat-counter="${bucket}"]`);
    const err = listEl.querySelector(`[data-cat-err="${bucket}"]`);
    const addBtn = listEl.querySelector(`[data-cat-add="${bucket}"]`);
    const validateInput = () => {
      const v = input.value;
      counter.textContent = `${v.length} / ${MAX_CATEGORY_NAME_LEN}`;
      counter.classList.toggle("warn", v.length >= 18);
      const trimmed = v.trim();
      const dup = !!trimmed && state.categories.some(c => c.bucket === bucket && c.name.toLowerCase() === trimmed.toLowerCase());
      input.classList.toggle("err", dup);
      err.textContent = dup ? t("profileCategoryDuplicateError") : "";
      addBtn.disabled = !trimmed || dup;
    };
    input.oninput = validateInput;
    input.onkeydown = (e) => { if(e.key === "Enter" && !addBtn.disabled) addBtn.click(); };
    validateInput();
    addBtn.onclick = () => {
      const result = createCategory(input.value, bucket);
      if(result.error) return; // validateInput voorkomt dit normaal al
      renderAll();
      // Ververs de accordion meteen (renderAll() raakt het profielpaneel zelf niet aan) zodat de
      // nieuwe categorie/telling direct zichtbaar is zonder het paneel te hoeven sluiten/heropenen.
      // Het invoerveld wordt daarbij opnieuw getekend (dus leeg) -- geef het meteen focus terug zodat
      // de gebruiker na Enter direct door kan typen en weer Enter kan drukken voor de volgende
      // categorie, zonder opnieuw te hoeven klikken.
      renderBucketAccordion();
      const freshInput = document.querySelector(`[data-cat-input="${bucket}"]`);
      if(freshInput) freshInput.focus();
    };
  });

  PROFILE_CATEGORY_BUCKETS.forEach(b => renderBucketCategoryList(b.key));
}

function renderBucketCategoryList(bucket){
  const listEl = document.querySelector(`[data-cat-list="${bucket}"]`);
  if(!listEl) return;
  const cats = state.categories.filter(c => c.bucket === bucket);
  if(!cats.length){
    listEl.innerHTML = `<p class="profile-cat-empty">${t("profileCategoriesEmptyState")}</p>`;
    return;
  }
  listEl.innerHTML = cats.map(cat=>{
    const usage = categoryUsageEntries(cat.id);
    const count = usage.length;
    // Voor de BADGE tellen Basisdata-regels mee, zodat "in gebruik" klopt met wat je ziet staan.
    // Voor het SLOT op de prullenbak bewust niet: een Basisdata-regel verwijst niet naar deze
    // categorie (hij draagt alleen dezelfde naam), dus verwijderen breekt daar niets — en er zou
    // ook geen manier zijn om zo'n "koppeling" op te heffen, waardoor je de categorie nooit meer
    // kwijt zou kunnen.
    const bdCount = categoryBasisdataUsage(cat);
    const totaalCount = count + bdCount;
    const isUsed = count > 0;
    const isExpanded = profileCategoryExpandedId === cat.id;
    const badge = totaalCount > 0
      ? `<span class="profile-cat-badge used">${t("profileCategoryUsedBadge")(totaalCount)}</span>`
      : `<span class="profile-cat-badge unused">${t("profileCategoryUnusedBadge")}</span>`;
    const deleteBtn = isUsed
      ? `<button type="button" class="profile-cat-icon-btn locked">
           ${LOCK_ICON}
           <span class="profile-cat-tooltip">${t("profileCategoryLockedTooltip")(count)}</span>
         </button>`
      : `<button type="button" class="profile-cat-icon-btn delete-ready" title="${t('profileCategoryDeleteIconTitle')}" data-del="${cat.id}">${TRASH_ICON}</button>`;

    let expandHtml = "";
    if(isExpanded){
      // Verplaatsen mag naar een categorie uit om het even welke groep, niet alleen dezelfde --
      // elke optie toont daarom ook de groepsnaam.
      const otherCats = state.categories.filter(c=>c.id!==cat.id);
      const linkRows = usage.map(({month, entry}) => `
        <div class="profile-cat-link-row" data-month="${month.key}" data-entry="${encodeURIComponent(entry.naam)}">
          <div class="profile-cat-link-desc">
            <span class="who">${escapeHtml(entry.naam)}</span> —
            <span class="amt ${entry.amt>=0?'credit':'debit'}">${entry.amt>=0?'+':'−'} € ${fmt(Math.abs(entry.amt))}</span>
            <span class="profile-cat-link-month mono">${month.key}</span>
          </div>
          <div class="profile-cat-link-controls">
            <select class="profile-cat-link-select">
              <option value="">${t("profileCategoryMoveToPlaceholder")}</option>
              ${otherCats.map(c=>`<option value="${c.id}">${c.name} (${t(PROFILE_CATEGORY_BUCKETS.find(pb=>pb.key===c.bucket).titleKey)})</option>`).join("")}
              <option value="__none__">${t("profileCategoryUncategorizedOption")}</option>
            </select>
            <button type="button" class="profile-cat-link-unlink" title="${t('profileCategoryUnlinkTitle')}">✕</button>
          </div>
        </div>
      `).join("");
      expandHtml = `
        <div class="profile-cat-expand">
          ${linkRows}
          <div class="profile-cat-expand-footer">
            <span class="profile-cat-expand-hint">${t("profileCategoryStillLinked")(count)}</span>
            <button type="button" class="profile-cat-delete-final-btn" ${count ? "disabled" : ""} data-del="${cat.id}">${t("profileCategoryDeleteBtn")}</button>
          </div>
        </div>`;
    }

    return `
      <div class="profile-cat-row">
        <div class="profile-cat-row-main">
          <span class="profile-cat-swatch"></span>
          <span class="profile-cat-name">${escapeHtml(cat.name)}</span>
          ${badge}
          ${isUsed ? `<button type="button" class="profile-cat-manage-link" data-toggle="${cat.id}">${isExpanded ? t("profileCategoryHideLinksBtn") : t("profileCategoryManageLinksBtn")}</button>` : ""}
          ${deleteBtn}
        </div>
        ${expandHtml}
      </div>
    `;
  }).join("");

  listEl.querySelectorAll("[data-toggle]").forEach(b=>{
    b.onclick = () => {
      profileCategoryExpandedId = (profileCategoryExpandedId === b.dataset.toggle) ? null : b.dataset.toggle;
      renderBucketCategoryList(bucket);
    };
  });
  listEl.querySelectorAll("[data-del]").forEach(b=>{
    b.onclick = () => {
      if(b.disabled) return;
      const ok = deleteCategory(b.dataset.del);
      if(ok && profileCategoryExpandedId === b.dataset.del) profileCategoryExpandedId = null;
      renderAll();
    };
  });
  listEl.querySelectorAll(".profile-cat-link-row").forEach(rowEl=>{
    const monthKey = rowEl.dataset.month;
    const entryNaam = decodeURIComponent(rowEl.dataset.entry);
    const findEntry = () => {
      const m = state.months.find(x => x.key === monthKey);
      return m ? m.review.find(e => e.naam === entryNaam) : null;
    };
    const unlinkBtn = rowEl.querySelector(".profile-cat-link-unlink");
    if(unlinkBtn) unlinkBtn.onclick = () => {
      const entry = findEntry();
      if(entry) entry.catId = null;
      renderAll();
    };
    const select = rowEl.querySelector(".profile-cat-link-select");
    if(select) select.onchange = () => {
      const entry = findEntry();
      if(!entry || !select.value) return;
      entry.catId = (select.value === "__none__") ? null : select.value;
      renderAll();
    };
  });
}

/* Download een volledige kopie van de administratie. Bewust een aparte functie: het verwijderen
   van een account (zie showDeleteAccountConfirm) biedt dezelfde download aan als laatste uitweg,
   en dat moet exact hetzelfde bestand opleveren.
   Let op: dit bestand bevat de volledige, ONVERSLEUTELDE gegevens. De naam zegt daarom "backup"
   met een datum erin; hij heette ooit "FinBo.html", wat niet te onderscheiden was van de app zelf —
   precies hoe je er per ongeluk een met je cijfers erin doorstuurt. */
function downloadBackupCopy(){
  const blob = new Blob([buildHtmlWithEmbeddedData()], {type:"text/html"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `FinBo-backup-${new Date().toISOString().slice(0,10)}.html`;
  a.click();
}

/* ---------- Account verwijderen ----------
   Twee dingen moeten weg, en ze zitten op verschillende plekken:

   1. De GEGEVENS — de rij in `finbo_state`. Die kan de gebruiker zelf verwijderen: Row Level
      Security staat precies dat toe voor de eigen rij (zie finbo_supabase_setup.sql).
   2. Het INLOGACCOUNT zelf, in auth.users. Dat kan een browser met de anon-key niet: daar is de
      service_role-sleutel voor nodig, en die hoort nooit in een pagina te staan. Het gebruikelijke
      antwoord is een database-functie met SECURITY DEFINER die alleen de eigen account opheft,
      aangeroepen via rpc(). Staat die functie in dit project, dan is het account daarna echt weg.

   Ontbreekt die functie, dan doen we NIET alsof: de gegevens zijn dan wel degelijk verwijderd —
   dat is het deel dat ertoe doet — maar de gebruiker krijgt te zien dat het inloggen zelf blijft
   bestaan en bij wie hij daarvoor moet zijn. Liever een eerlijke halve boodschap dan een
   "alles verwijderd" dat niet klopt. */
async function deleteOwnAccount(){
  if(!cloudClient || !cloudSession) throw new Error("geen sessie");
  const userId = cloudSession.user.id;

  // Eerst de gegevens. Mislukt dit, dan stoppen we hier — anders blijft er een rij achter bij een
  // account dat niet meer bestaat.
  const { error: dataFout } = await cloudClient.from("finbo_state").delete().eq("user_id", userId);
  if(dataFout) throw dataFout;

  // Dan het inlogaccount, als dit project daar een functie voor heeft.
  let accountWeg = false;
  try{
    const { error: rpcFout } = await cloudClient.rpc("delete_own_account");
    accountWeg = !rpcFout;
  }catch(e){
    accountWeg = false;
  }
  return { accountWeg };
}

/* Het bevestigingsvenster. Geen confirm() van de browser: die is met één Enter weg te klikken,
   somt niet op wat er precies verdwijnt, en heeft geen plek voor de uitweg "download eerst een
   kopie". Het vinkje dwingt bovendien een tweede, bewuste handeling af — een enkele misklik op een
   rode knop mag geen administratie kosten. */
function showDeleteAccountConfirm(onDone){
  const email = (cloudSession && cloudSession.user && cloudSession.user.email) || "—";
  const overlay = document.createElement("div");
  overlay.className = "confirm-overlay";
  overlay.setAttribute("role", "dialog");
  overlay.setAttribute("aria-modal", "true");
  overlay.innerHTML = `
    <div class="confirm-card">
      <h3>${escapeHtml(t("profileDeleteModalTitle"))}</h3>
      <p>${escapeHtml(t("profileDeleteModalText")(email))}</p>
      <p class="confirm-list">${escapeHtml(t("profileDeleteModalList"))}</p>
      <div id="deleteAccountMsg"></div>
      <label class="confirm-check">
        <input type="checkbox" id="deleteAccountCheck">
        <span>${escapeHtml(t("profileDeleteModalCheckbox"))}</span>
      </label>
      <div class="confirm-actions">
        <button type="button" class="confirm-export" id="deleteAccountExportBtn">${escapeHtml(t("profileDeleteModalExport"))}</button>
        <button type="button" id="deleteAccountCancelBtn">${escapeHtml(t("importBasisdataCancelBtn"))}</button>
        <button type="button" class="danger" id="deleteAccountConfirmBtn" disabled>${escapeHtml(t("profileDeleteConfirmBtn"))}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const check = overlay.querySelector("#deleteAccountCheck");
  const bevestig = overlay.querySelector("#deleteAccountConfirmBtn");
  const msg = overlay.querySelector("#deleteAccountMsg");
  const sluit = () => { overlay.remove(); document.removeEventListener("keydown", opEscape, true); };
  /* In de capture-fase én met stopPropagation: er luisteren elders ook Escape-handlers mee (de
     navigatielade, het profielpaneel). Zonder dit zou één druk op Escape dit venster sluiten én het
     paneel eronder dichtklappen — je verliest dan de plek waar je vandaan kwam. */
  const opEscape = (e) => {
    if(e.key !== "Escape") return;
    e.stopPropagation();
    sluit();
  };

  check.onchange = () => { bevestig.disabled = !check.checked; };
  overlay.querySelector("#deleteAccountExportBtn").onclick = () => downloadBackupCopy();
  overlay.querySelector("#deleteAccountCancelBtn").onclick = sluit;
  // Klikken naast de kaart sluit ook, maar alleen op de overlay zelf — niet op iets erbinnen.
  overlay.onclick = (e) => { if(e.target === overlay) sluit(); };
  document.addEventListener("keydown", opEscape, true);
  check.focus();

  bevestig.onclick = async () => {
    bevestig.disabled = true;
    check.disabled = true;
    bevestig.textContent = t("profileDeleteBusy");
    try{
      // Geen achtergrondschrijving meer laten afgaan terwijl we de rij juist weggooien.
      clearTimeout(autoSaveTimer);
      cancelRetry();
      dirty = false;
      const { accountWeg } = await deleteOwnAccount();
      sluit();
      onDone(null, accountWeg);
    }catch(err){
      bevestig.disabled = false;
      check.disabled = false;
      bevestig.textContent = t("profileDeleteConfirmBtn");
      msg.innerHTML = `<div class="profile-msg error">${escapeHtml(t("profileDeleteError") + (err.message || String(err)))}</div>`;
    }
  };
}

      const { error: signInError } = await cloudClient.auth.signInWithPassword({

     gebruiker komt op het inlogscherm uit, met een melding van wat er gebeurd is. `dirty` staat al

  document.getElementById("profileDeleteAccountBtn").onclick = () => {

      try{ if(cloudClient) await cloudClient.auth.signOut(); }catch(e){ /* sessie is toch al waardeloos */ }
      cloudSession = null;

      lastSeenCiphertext = null;
      saveConflictFlag = false;
      saveErrorFlag = false;
      accountDeletedNotice = accountWeg ? t("profileDeleteDone") : t("profileDeleteDataOnlyNotice");
      renderAuthGate();
    });

  document.getElementById("profileSignOutBtn").onclick = async () => {

    // pas daarna sluit het paneel — anders klapt het paneel dicht boven een vraag die nog openstaat.
    const uit = await signOutCloud();
    if(uit) closeProfilePanel();
  };
}

/* Herordenen van een lijstje tab-knoppen door ze ingedrukt te houden (muis) of vast te houden
   (touch) en dan te slepen — gebruikt voor de Maandbudgetten-lijst, zodat bv. een later toegevoegde
   "Juni" niet perse onderaan/bovenaan hoeft te blijven staan. Werkt via Pointer Events, zodat
   muis en touch dezelfde code delen. Een gewone korte klik/tap navigeert nog altijd normaal —
   pas na LONG_PRESS_MS stilzitten wordt het een sleep-actie; beweegt de vinger/muis te veel vóór
   die tijd is verstreken, dan wordt de sleep-poging geannuleerd en blijft het gewoon een klik/scroll.
   `container` moet de directe ouder zijn van de te herordenen knoppen, elk met de class
   "tab-draggable" en een "data-drag-id". Bij loslaten na een geslaagde sleep roept dit `onReorder`
   aan met de nieuwe volgorde van die id's, zodat de aanroeper de onderliggende array kan bijwerken. */
function enableLongPressReorder(container, onReorder){
  const LONG_PRESS_MS = 380;
  const MOVE_CANCEL_PX = 10;
  let pressTimer = null;
  let dragBtn = null;
  let suppressNextClick = false;

  const clearPressTimer = () => { if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; } };
  const draggableSiblings = () => Array.from(container.querySelectorAll(":scope > .tab-draggable"));

  // Eén click-listener op de container (capture-fase) volstaat om de synthetische klik die na een
  // sleep-actie loskomt te onderscheppen — ongeacht op welke knop die precies terechtkomt.
  container.addEventListener("click", (e) => {
    if(suppressNextClick){
      e.preventDefault();
      e.stopImmediatePropagation();
      suppressNextClick = false;
    }
  }, true);

  // Sleep-beweging en loslaten worden op `document` afgeluisterd (i.p.v. op de knop zelf met
  // setPointerCapture) — betrouwbaarder zodra de knop tijdens het slepen zelf in de DOM verplaatst
  // wordt (insertBefore/appendChild hieronder), wat bij element-gebonden pointer capture in sommige
  // browsers de capture voortijdig laat verlopen.
  const onDragMove = (e) => {
    if(!dragBtn) return;
    e.preventDefault();
    const y = e.clientY;
    const others = draggableSiblings().filter(sib => sib !== dragBtn);
    const afterEl = others.find(sib=>{
      const rect = sib.getBoundingClientRect();
      return y < rect.top + rect.height/2;
    });
    if(afterEl) container.insertBefore(dragBtn, afterEl);
    else container.appendChild(dragBtn);
  };
  const endDrag = () => {
    clearPressTimer();
    document.removeEventListener("pointermove", onDragMove);
    document.removeEventListener("pointerup", endDrag);
    document.removeEventListener("pointercancel", endDrag);
    if(dragBtn){
      dragBtn.classList.remove("tab-dragging");
      dragBtn.style.touchAction = "";
      dragBtn = null;
      suppressNextClick = true;
      onReorder(draggableSiblings().map(sib => sib.dataset.dragId));
    }
  };

  draggableSiblings().forEach(btn=>{
    btn.addEventListener("pointerdown", (e)=>{
      if(e.pointerType === "mouse" && e.button !== 0) return;
      const startX = e.clientX, startY = e.clientY;
      clearPressTimer();

      const onEarlyMove = (ev) => {
        if(Math.abs(ev.clientX-startX) > MOVE_CANCEL_PX || Math.abs(ev.clientY-startY) > MOVE_CANCEL_PX){
          cleanupEarly();
        }
      };
      const cleanupEarly = () => {
        clearPressTimer();
        document.removeEventListener("pointermove", onEarlyMove);
        document.removeEventListener("pointerup", cleanupEarly);
        document.removeEventListener("pointercancel", cleanupEarly);
      };
      document.addEventListener("pointermove", onEarlyMove);
      document.addEventListener("pointerup", cleanupEarly);
      document.addEventListener("pointercancel", cleanupEarly);

      pressTimer = setTimeout(()=>{
        document.removeEventListener("pointermove", onEarlyMove);
        document.removeEventListener("pointerup", cleanupEarly);
        document.removeEventListener("pointercancel", cleanupEarly);
        dragBtn = btn;
        btn.classList.add("tab-dragging");
        btn.style.touchAction = "none";
        document.addEventListener("pointermove", onDragMove);
        document.addEventListener("pointerup", endDrag);
        document.addEventListener("pointercancel", endDrag);
      }, LONG_PRESS_MS);
    });
  });
}

function renderTabs(){
  const el = document.getElementById("tabs");
  el.innerHTML = "";

  // Basisdata staat altijd los vooraan, als eigen groepje van één tab. Zelfde uiterlijk als de
  // kopjes van Maandbudgetten/Jaren/Groei (zie issue #5) — maar zonder pijltje/dropdown, want een
  // klik gaat meteen naar de pagina zelf in plaats van een lijstje te openen. Geen "01"-prefix meer.
  const bdGroup = document.createElement("div");
  bdGroup.className = "tab-group";
  const bd = basisdataScenario();
  const bdBtn = document.createElement("button");
  bdBtn.className = "tab-group-head tab-group-head-direct" + (state.activeView.type==="scenario" && state.activeView.index===0 ? " active":"");
  bdBtn.innerHTML = `<span class="tab-group-label">${escapeHtml(bd.label)}</span>`;
  bdBtn.onclick = ()=>{ state.activeScenario = 0; state.activeView = {type:"scenario", index:0}; renderAll(); };
  bdGroup.appendChild(bdBtn);

  // "Import basisdata": losstaande tab direct onder Basisdata zelf (zie renderImportBasisdataScreen).
  // Bewust in dezelfde groep als Basisdata (het VERVANGT immers Basisdata), maar met een eigen
  // gestippelde "upload"-uitstraling (zelfde `.tab-upload`-stijl als de bestaande maand-uploadknoppen
  // onderaan) zodat meteen duidelijk is dat dit een actie/import is, geen gewone navigatietab.
  const importBdBtn = document.createElement("button");
  importBdBtn.className = "tab tab-upload tab-import-bd" + (state.activeView.type==="importBasisdata" ? " active":"");
  importBdBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 19h14"/></svg><span>${t("importBasisdataTabLabel")}</span>`;
  importBdBtn.onclick = () => { resetImportBasisdataUI(); state.activeView = {type:"importBasisdata"}; renderAll(); };
  bdGroup.appendChild(importBdBtn);
  el.appendChild(bdGroup);

  // Maandbudgetten + Jaren staan samen in een "pair"-wrapper: op een smal scherm staan ze
  // gewoon onder elkaar (zoals voorheen), maar vanaf voldoende paginabreedte zet de CSS
  // (`.tab-group-pair`, zie <style>) ze naast elkaar — er is toch ruime lege ruimte rechts van
  // het menu op brede schermen. Beide lijstjes zijn bovendien los van elkaar in-/uitklapbaar.
  const groupPair = document.createElement("div");
  groupPair.className = "tab-group-pair";

  // Maandbudgetten: eigen groepje direct na Basisdata, vóór de overige jaren (nieuwste bovenaan).
  // Het groepje (met "+"-knop) staat er altijd, ook zonder maandbudgetten — dat is nu meteen de
  // plek om er een aan te maken, in plaats van een kaart onderaan de Basisdata-pagina.
  const budgetGroup = document.createElement("div");
  budgetGroup.className = "tab-group";
  budgetGroup.innerHTML = `
    <div class="tab-group-head">
      <button class="group-collapse-btn${collapsedGroups.budgets ? " collapsed":""}" id="collapseBudgetsBtn" title="${t("collapseGroupBtn")}" aria-label="${t("collapseGroupBtn")}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <span class="tab-group-label">${t("maandbudgettenLabel")}</span>
      <button class="group-add-btn" id="addBudgetBtn" title="${t("nieuwBudgetBtn")}">+</button>
    </div>`;
  budgetGroup.querySelector("#addBudgetBtn").onclick = () => createBudget();
  wireGroupHeadCollapse(budgetGroup.querySelector(".tab-group-head"), () => { collapsedGroups.budgets = !collapsedGroups.budgets; renderTabs(); });
  if(!collapsedGroups.budgets){
    state.budgets.forEach(b=>{
      // Rij-wrapper i.p.v. een kale knop, zodat er een prullenbak naast past — net als bij de
      // geïmporteerde maanden. De wrapper draagt nu de sleep-markering (was de knop zelf), zodat

          if(state.activeView.type==="budget" && state.activeView.id===b.id){
            state.activeScenario = 0;
            state.activeView = {type:"scenario", index:0};
          }
          renderAll();
        }
      };
      row.appendChild(delBtn);
      budgetGroup.appendChild(row);
    });
    // Klikken en (op muis) ingedrukt houden, of (op touch) vasthouden, laat je een maandbudget
    // naar een andere plek in het lijstje slepen — handig omdat nieuwe maandbudgetten anders altijd
    // bovenaan verschijnen (zie createBudget()), ook als het bv. om een terugwerkend toegevoegde
    // "Juni" gaat die er eigenlijk qua tijdlijn middenin hoort.
    if(state.budgets.length > 1){
      enableLongPressReorder(budgetGroup, (newOrderIds)=>{
        const byId = {};
        state.budgets.forEach(b => { byId[b.id] = b; });
        const reordered = newOrderIds.map(id => byId[id]).filter(Boolean);

        state.budgets = (reordered.length === state.budgets.length) ? reordered : state.budgets;

      });

  }
  groupPair.appendChild(budgetGroup);

  // Overige jaren (2027, 2028, en elk zelf aangemaakt jaar erna) — "+" maakt het volgende jaar aan.
  const scenGroup = document.createElement("div");

      </button>
      <span class="tab-group-label">${t("jarenLabel")}</span>
      <button class="group-add-btn" id="addJaarBtn" title="${t("nieuwJaarBtn")(latestScenario().jaar+1)}">+</button>
    </div>`;
  scenGroup.querySelector("#addJaarBtn").onclick = () => createNewYear();
  wireGroupHeadCollapse(scenGroup.querySelector(".tab-group-head"), () => { collapsedGroups.years = !collapsedGroups.years; renderTabs(); });
  if(!collapsedGroups.years){
    state.scenarios.slice(1).forEach((sc,offset)=>{
      const i = offset + 1;
      const row = document.createElement("div");
      row.className = "tab-row";

      const b = document.createElement("button");
      b.className = "tab" + (state.activeView.type==="scenario" && state.activeView.index===i ? " active":"");
      const labelText = sc.label === String(sc.jaar) ? sc.label : `${sc.label} · ${sc.jaar}`;
      b.innerHTML = `<span class="tab-idx">${String(i+1).padStart(2,"0")}</span>${escapeHtml(labelText)}`;
      b.onclick = ()=>{ state.activeScenario = i; state.activeView = {type:"scenario", index:i}; renderAll(); };
      row.appendChild(b);

      // Een jaar was tot nu toe alleen te verwijderen via een knop onderaan de jaarpagina zelf, en
      // alleen als het niet "locked" was — waardoor 2027/2028 uit een oud bestand nergens weg te
      // krijgen waren. De prullenbak staat nu in het menu, net als bij maandbudgetten en maanden.
      if(!sc.locked){
        const delBtn = document.createElement("button");
        delBtn.className = "tab-delete-btn";
        delBtn.type = "button";
        delBtn.title = t("deleteScenarioBtn");
        delBtn.setAttribute("aria-label", t("deleteScenarioBtn"));
        delBtn.innerHTML = TRASH_ICON;
        delBtn.onclick = (e) => {
          e.stopPropagation();
          if(confirm(t("deleteScenarioConfirm"))){
            /* Het jaar waar je NU op staat vasthouden, niet het jaar dat je verwijdert.
               Tot v25 werd het nieuwe actieve jaar berekend uit de index van het verwijderde jaar
               (`idx-1`), waardoor je bij het wissen van 2027 terwijl je op 2029 stond opeens op
               Basisdata belandde. Maandbudgetten en maanden deden dit al goed: alleen verspringen
               als je op het verwijderde item zelf stond.
               Scenario's worden bovendien op POSITIE geadresseerd (activeView.index), dus na het
               wegvallen van een eerder jaar moet die index meeschuiven — anders wijst hij stil naar
               een ander jaar dan je dacht. */
            const idx = state.scenarios.indexOf(sc);
            const huidig = state.scenarios[state.activeScenario] || state.scenarios[0];
            state.scenarios = state.scenarios.filter(x=>x!==sc);
            const nieuweIndex = (huidig === sc)
              ? Math.max(0, Math.min(idx - 1, state.scenarios.length - 1))
              : Math.max(0, state.scenarios.indexOf(huidig));
            state.activeScenario = nieuweIndex;
            state.activeView = {type:"scenario", index: nieuweIndex};
            renderAll();
          }
        };
        row.appendChild(delBtn);
      }
      scenGroup.appendChild(row);
    });
  }
  groupPair.appendChild(scenGroup);

  el.appendChild(groupPair);

  if(state.months.length){
    const monthGroup = document.createElement("div");
    monthGroup.className = "tab-group";
    state.months.forEach(m=>{
      const row = document.createElement("div");
      row.className = "tab-row";

      const b = document.createElement("button");
      b.className = "tab" + (state.activeView.type==="month" && state.activeView.key===m.key ? " active":"");
      b.textContent = monthLabel(m);

      // Rechtstreeks vanuit het menu een geïmporteerde maand kunnen verwijderen — handig zodra hij

      const delBtn = document.createElement("button");

      delBtn.title = t("deleteMonthBtn");
      delBtn.setAttribute("aria-label", t("deleteMonthBtn"));
      delBtn.innerHTML = TRASH_ICON;
      delBtn.onclick = (e) => {
        e.stopPropagation();
        if(confirm(t("deleteMonthConfirm"))){
          state.months = state.months.filter(x=>x.key!==m.key);
          if(state.activeView.type==="month" && state.activeView.key===m.key){
            state.activeView = {type:"scenario", index: state.activeScenario};
          }
          renderAll();
        }
      };
      row.appendChild(delBtn);

      monthGroup.appendChild(row);
    });
    el.appendChild(monthGroup);
  }

  // "Groei"-groepje: een eigen, in-/uitklapbare menugroep (net als Maandbudgetten en Jaren, met
  // hetzelfde pijltje en standaard dichtgeklapt), met daarin (voorlopig) alleen "Salaris groei"
  // als pagina — zie issue #2 en de feedback daarop (het moest zich echt hetzelfde gedragen als
  // Maandbudgetten/Jaren, niet alleen een los kopje zijn).
  const extraGroup = document.createElement("div");
  extraGroup.className = "tab-group";
  extraGroup.innerHTML = `
    <div class="tab-group-head">
      <button class="group-collapse-btn${collapsedGroups.growth ? " collapsed":""}" id="collapseGrowthBtn" title="${t("collapseGroupBtn")}" aria-label="${t("collapseGroupBtn")}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <span class="tab-group-label">${t("groeiGroupLabel")}</span>
    </div>`;
  wireGroupHeadCollapse(extraGroup.querySelector(".tab-group-head"), () => { collapsedGroups.growth = !collapsedGroups.growth; renderTabs(); });
  if(!collapsedGroups.growth){
    const loonstijgingBtn = document.createElement("button");
    loonstijgingBtn.className = "tab" + (state.activeView.type==="loonstijging" ? " active":"");
    loonstijgingBtn.textContent = t("navLoonstijging");
    loonstijgingBtn.onclick = () => { state.activeView = {type:"loonstijging"}; renderAll(); };

  el.appendChild(extraGroup);

  const uploadRow = document.createElement("div");

  const uploadBtn = document.createElement("button");

  const uploadPdfBtn = document.createElement("button");
  uploadPdfBtn.className = "tab tab-upload";
  uploadPdfBtn.textContent = t("uploadPdfBtn");

  el.appendChild(uploadRow);
