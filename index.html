<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinBo</title>
<style>
  /* Licht (standaard): witte/lichte achtergrond door de hele app, groen als belettering/accent.
     --ink/--ink-2 = achtergrond van de "chrome" (header/zijbalk/zijpaneel), --paper/--paper-2 =
     achtergrond van kaarten. --text-onink(-soft) is de tekstkleur die bij --ink hoort, --text(-soft)
     die bij --paper — dat koppel wisselt per modus mee, dus de rest van het stijlblad hoeft niet
     te weten of het licht of donker is. */
  :root{
    --ink:#fbfcfb;
    --ink-2:#f5f8f6;
    --paper:#ffffff;
    --paper-2:#f1f5f2;
    --rule:#e2e8e3;
    --gold:#1f6f4f;
    --gold-bright:#2f9d6f;
    --forest:#1a5c42;
    --credit:#1f7a52;
    --debit:#b0463c;
    --text:#182620;
    --text-soft:#5e6f65;
    --text-onink:#182620;
    --text-onink-soft:#5e6f65;
    /* Grafiekkleuren per categorie (staaf/donut/legenda + Loonstijging-lijngrafiek). Bewust NIET
       (bijna) dezelfde groentint als de rest van de UI (knoppen, positieve bedragen gebruiken al
       overal --gold/--forest/--credit) — anders vallen "Gedeelde vaste lasten" en "Over te
       spenderen" in de grafieken bijna niet uit elkaar. Alleen "Over" (bewust positief/goed) blijft
       groen en sluit zo aan bij de rest van de app; de andere categorieën krijgen elk een duidelijk
       andere kleur (blauw/oranje/paars), gevalideerd op onderling verschil (zie dataviz-methodiek). */
    --cat-vaste:#2a78d6;
    --cat-abon:#eb6834;
    --cat-variabel:#4a3aa7;
    --cat-over:#1f7a52;
    --cat-tekort:#eda100;
    --cat-income:#2a78d6;
    --cat-kosten:#eb6834;
    /* Aparte, onderling duidelijk verschillende accentkleuren voor de vier categorie-groepen in
       Profiel > Categorieën (zie renderProfileCategoriesTab) -- bewust los van --cat-income/-vaste
       hierboven (die zijn identiek aan elkaar, prima voor de grafieken maar niet onderscheidend
       genoeg voor vier naast elkaar getoonde uitklapsecties). */
    --profile-cat-income:#1f7a52;
    --profile-cat-vaste:#2a78d6;
    --profile-cat-abon:#eb6834;
    --profile-cat-variabel:#4a3aa7;
  }
  html[data-mode="dark"]{
    --ink:#111a16;
    --ink-2:#0d1512;
    --paper:#16211c;
    --paper-2:#1c2822;
    --rule:rgba(255,255,255,.09);
    --gold:#4fae86;
    --gold-bright:#6bc79c;
    --forest:#5fbf94;
    --credit:#5fbf94;
    --debit:#e2897a;
    --text:#e7f0ea;
    --text-soft:#9db0a5;
    --text-onink:#eaf1ec;
    --text-onink-soft:#9db0a5;
    --cat-vaste:#3987e5;
    --cat-abon:#d95926;
    --cat-variabel:#9085e9;
    --cat-over:#5fbf94;
    --cat-tekort:#c98500;
    --cat-income:#3987e5;
    --cat-kosten:#d95926;
    --profile-cat-income:#5fbf94;
    --profile-cat-vaste:#6fa3e0;
    --profile-cat-abon:#f0906a;
    --profile-cat-variabel:#9085e9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    color:var(--text);
    min-height:100vh;
    transition:background .2s ease, color .2s ease;
  }
  h1,h2,h3{
    font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;
    font-weight:600;
    margin:0;
  }
  .mono{
    font-family:"Courier New",Consolas,monospace;
    font-variant-numeric:tabular-nums;
  }

  /* Header */
  /* De kopbalk plakt bovenaan en is een stuk compacter dan voorheen: de navigatie die er tot v25
     onder hing zit nu in de uitklaplade, dus wat overblijft is de menuknop, de titel en het
     profiel. Blijft in beeld hoe ver je ook scrolt. */
  header{
    position:sticky;
    top:0;
    z-index:60;
    background:linear-gradient(180deg,var(--ink) 0%,var(--ink-2) 100%);
    padding:12px 22px;
    border-bottom:3px solid var(--gold);
  }
  .header-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:14px;
  }
  /* Ronde icoonknop in de kopbalk — zelfde maat en gedrag als de profielknop ernaast. */
  .icon-btn{
    width:34px;
    height:34px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    border:1px solid color-mix(in srgb, var(--text-onink) 25%, transparent);
    background:transparent;
    color:var(--text-onink-soft);
    cursor:pointer;
    transition:color .15s ease, border-color .15s ease;
  }
  .icon-btn:hover, .icon-btn:focus-visible{ color:var(--gold-bright); border-color:var(--gold-bright); }
  .icon-btn:focus-visible{ outline:2px solid var(--gold-bright); outline-offset:2px; }
  .icon-btn svg{ width:18px; height:18px; }

  /* ---- Navigatielade ---- */
  .nav-backdrop{
    position:fixed;
    inset:0;
    z-index:70;
    background:rgba(12,24,18,.42);
    opacity:0;
    pointer-events:none;
    transition:opacity .22s ease;
  }
  html[data-mode="dark"] .nav-backdrop{ background:rgba(0,0,0,.55); }
  .nav-backdrop.open{ opacity:1; pointer-events:auto; }
  .nav-drawer{
    position:fixed;
    top:0;
    left:0;
    bottom:0;
    z-index:80;
    width:290px;
    max-width:82vw;
    display:flex;
    flex-direction:column;
    background:var(--paper-2);
    border-right:1px solid var(--rule);
    box-shadow:0 18px 40px rgba(16,32,25,.18);
    transform:translateX(-100%);
    transition:transform .24s cubic-bezier(.4,0,.2,1);
  }
  html[data-mode="dark"] .nav-drawer{ box-shadow:0 18px 40px rgba(0,0,0,.5); }
  /* visibility (en `inert` op het element zelf, zie setNavDrawer) en niet alleen transform:
     met uitsluitend transform staat de lade weliswaar buiten beeld, maar blijven de tien knoppen
     erin gewoon tabbaar — terwijl hij aria-hidden="true" draagt. Twee keer Tab vanaf de menuknop
     en je focus verdween onzichtbaar in een menu dat de schermlezer juist weigert voor te lezen.
     De vertraging op visibility laat de schuifanimatie eerst aflopen. */
  .nav-drawer{ visibility:hidden; transition:transform .24s cubic-bezier(.4,0,.2,1), visibility 0s linear .24s; }
  .nav-drawer.open{ transform:translateX(0); visibility:visible; transition-delay:0s; }
  @media (prefers-reduced-motion: reduce){
    .nav-drawer, .nav-backdrop{ transition:none; }
  }
  .nav-drawer-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:12px 14px;
    border-bottom:1px solid var(--rule);
    flex-shrink:0;
  }
  .nav-drawer-title{
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--text-soft);
    font-weight:600;
  }
  .nav-drawer .nav-close-btn{
    width:28px;
    height:28px;
    border-color:var(--rule);
    color:var(--text-soft);
  }
  .nav-drawer .nav-close-btn svg{ width:15px; height:15px; }
  header .eyebrow{
    color:var(--gold);
    letter-spacing:.01em;
    font-family:"Segoe UI",sans-serif;
    font-weight:700;
    font-size:28px;
    margin-bottom:2px;
  }
  header h1{
    color:var(--text-onink-soft);
    font-size:16px;
    font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;
    font-weight:400;
    letter-spacing:.01em;
  }
  .header-controls{
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
  }
  .lang-toggle{
    display:flex;
    gap:4px;
    flex-shrink:0;
  }
  .mode-btn{
    width:34px;
    height:34px;
    border-radius:50%;
    border:1px solid color-mix(in srgb, var(--text-onink) 25%, transparent);
    background:transparent;
    color:var(--text-onink-soft);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  html[data-mode="light"] .mode-btn{ border-color:rgba(0,0,0,.15); }
  .mode-btn:hover{border-color:var(--gold); color:var(--gold-bright);}
  .mode-btn svg{width:16px; height:16px;}
  .lang-btn{
    background:transparent;
    border:1px solid color-mix(in srgb, var(--text-onink) 25%, transparent);
    color:var(--text-onink-soft);
    padding:5px 11px;
    font-size:11px;
    letter-spacing:.06em;
    border-radius:3px;
    cursor:pointer;
    font-family:"Segoe UI",sans-serif;
  }
  .lang-btn:hover{border-color:var(--gold); color:var(--gold-bright);}
  .lang-btn.active{
    border-color:var(--gold);
    color:var(--gold-bright);
    background:color-mix(in srgb, var(--gold) 12%, transparent);
  }

  .profile-btn{
    width:34px;
    height:34px;
    border-radius:50%;
    border:1px solid color-mix(in srgb, var(--text-onink) 25%, transparent);
    background:transparent;
    color:var(--text-onink-soft);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  html[data-mode="light"] .profile-btn{ border-color:rgba(0,0,0,.15); }
  .profile-btn:hover{border-color:var(--gold); color:var(--gold-bright);}
  .profile-btn.active{border-color:var(--gold); color:var(--gold-bright); background:color-mix(in srgb, var(--gold) 14%, transparent);}
  .profile-btn svg{width:17px; height:17px;}

  /* ---------- Profielpaneel: klapt van links open als overlay bovenop de huidige pagina ---------- */
  .profile-backdrop{
    position:fixed; inset:0;
    background:rgba(8,14,11,.42);
    z-index:940;
    opacity:0;
    visibility:hidden;
    transition:opacity .25s ease;
  }
  .profile-backdrop.open{ opacity:1; visibility:visible; }
  .profile-panel{
    position:fixed;
    top:0; right:0;
    height:100vh;
    /* Letterlijk 30% van de paginabreedte, met een ondergrens zodat de formuliervelden op smalle
       schermen niet onbruikbaar smal worden, en een bovengrens zodat het op erg brede schermen geen
       overdreven brede kolom wordt.
       De ondergrens is zelf ook begrensd (min(...)): op een telefoon of bij ver ingezoomd is een
       harde 300px breder dan het scherm, en dan valt de rechterhelft van het paneel buiten beeld. */
    width:30vw;
    min-width:min(300px, 92vw);
    max-width:460px;
    background:var(--paper);
    border-left:1px solid var(--rule);
    box-shadow:-2px 0 28px rgba(0,0,0,.18);
    z-index:950;
    display:flex;
    flex-direction:column;
    transform:translateX(100%);
    transition:transform .3s cubic-bezier(.4,0,.2,1);
  }
  .profile-panel{ visibility:hidden; transition:transform .3s cubic-bezier(.4,0,.2,1), visibility 0s linear .3s; }
  .profile-panel.open{ transform:translateX(0); visibility:visible; transition-delay:0s; }
  @media (prefers-reduced-motion: reduce){
    .profile-panel{ transition:none; }
    .profile-backdrop{ transition:none; }
  }
  .profile-panel-head{
    background:linear-gradient(180deg,var(--ink) 0%,var(--ink-2) 100%);
    border-bottom:3px solid var(--gold);
    padding:16px 16px 14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    flex-shrink:0;
  }
  .profile-panel-title{
    font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;
    font-weight:600;
    font-size:18px;
    color:var(--text-onink);
    flex:1 1 auto;
  }
  /* NL/EN + licht/donker + het sluitkruisje staan hier samen — hierdoor blijft in dichtgeklapte
     stand alleen de profielknop in de hoofdheader over (zie header-controls hierboven). */
  .profile-panel-head-controls{
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
  }
  .profile-close-btn{
    width:30px; height:30px;
    border-radius:50%;
    border:1px solid color-mix(in srgb, var(--text-onink) 25%, transparent);
    background:transparent;
    color:var(--text-onink-soft);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .profile-close-btn:hover{border-color:var(--debit); color:var(--debit);}
  .profile-close-btn svg{width:15px; height:15px;}
  .profile-panel-tabs{
    display:flex;
    gap:4px;
    padding:14px 20px 0;
    flex-shrink:0;
    border-bottom:1px solid var(--rule);
  }
  .profile-tab-btn{
    background:transparent;
    border:none;
    border-bottom:2px solid transparent;
    color:var(--text-soft);
    padding:8px 4px 10px;
    margin-right:18px;
    font-size:13px;
    font-family:"Segoe UI",sans-serif;
    cursor:pointer;
  }
  .profile-tab-btn:hover{ color:var(--text); }
  .profile-tab-btn.active{ color:var(--gold); border-bottom-color:var(--gold); font-weight:600; }
  .profile-tab-btn:disabled{ color:var(--text-soft); opacity:.55; cursor:default; }
  .profile-panel-body{
    flex:1 1 auto;
    overflow-y:auto;
    padding:22px 20px 28px;
    display:flex;
    flex-direction:column;
    gap:26px;
  }
  .profile-section-title{
    font-size:12px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--text-soft);
    margin:0 0 4px;
  }
  .profile-current-email{
    font-size:14px;
    color:var(--text);
    background:var(--paper-2);
    border:1px solid var(--rule);
    border-radius:5px;
    padding:9px 11px;
    word-break:break-all;
  }
  .profile-field{
    display:flex; flex-direction:column; gap:4px;
    font-size:12px;
    color:var(--text-soft);
    margin-top:10px;
  }
  .profile-field input{
    font-family:inherit; font-size:14px; padding:8px 10px;
    border:1px solid var(--rule); border-radius:4px; background:var(--paper); color:var(--text);
  }
  .profile-field input:focus{ outline:none; border-color:var(--gold); }
  .profile-panel-body button{
    font-family:"Segoe UI",sans-serif; font-size:13px; padding:8px 12px;
    border-radius:4px; border:1px solid var(--rule); background:transparent; color:var(--text);
    cursor:pointer; margin-top:12px;
  }
  .profile-panel-body button.primary{ background:var(--forest); border-color:var(--forest); color:#fff; }
  .profile-panel-body button.primary:hover{ opacity:.9; }
  .profile-panel-body button.danger-outline{ border-color:color-mix(in srgb, var(--debit) 55%, transparent); color:var(--debit); }
  .profile-panel-body button.danger-outline:hover{ background:color-mix(in srgb, var(--debit) 10%, transparent); }
  .profile-panel-body button.danger-solid{
    background:var(--debit); border-color:var(--debit); color:#fff; font-weight:600;
  }
  .profile-panel-body button.danger-solid:hover{ filter:brightness(1.08); }
  .profile-panel-body button:disabled{ opacity:.6; cursor:default; }
  /* Het verwijderblok staat bewust apart en visueel afgezonderd onderaan het accounttabblad, zodat
     je er niet per ongeluk in belandt terwijl je je e-mailadres aan het wijzigen bent. */
  .profile-danger-zone{
    border:1px solid color-mix(in srgb, var(--debit) 35%, transparent);
    border-radius:6px;
    padding:14px;
    background:color-mix(in srgb, var(--debit) 5%, transparent);
  }

  /* Bevestigingsvenster voor het verwijderen van een account. Bewust een eigen venster in de app en
     geen confirm() van de browser: die is met één Enter weg te klikken, toont geen opsomming van wat
     er precies verdwijnt, en heeft geen plek voor de "eerst een kopie downloaden"-uitweg. */
  .confirm-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .confirm-card{
    background:var(--paper); border-radius:10px; padding:24px; max-width:480px; width:100%;
    box-shadow:0 20px 50px rgba(0,0,0,.3); max-height:90vh; overflow-y:auto;
  }
  .confirm-card h3{ font-family:Georgia,serif; font-size:18px; margin:0 0 10px; color:var(--debit); }
  /* Een waarschuwing is geen verwijderactie: goudkleurig in plaats van rood, zodat de rode kop
     voorbehouden blijft aan "hier gaat iets onherroepelijk weg". */
  .confirm-card h3.confirm-warn{ color:var(--gold); }
  .confirm-actions button.primary{ background:var(--forest); border-color:var(--forest); color:#fff; }
  .confirm-card p{ font-size:13px; color:var(--text); line-height:1.6; margin:0 0 12px; }
  .confirm-card p.confirm-list{
    font-size:12.5px; color:var(--text-soft); background:var(--paper-2);
    border-radius:5px; padding:10px 12px;
  }
  .confirm-check{
    display:flex; align-items:flex-start; gap:9px; font-size:13px; margin:16px 0 18px;
    cursor:pointer; line-height:1.5;
  }
  .confirm-check input{ margin-top:2px; flex-shrink:0; width:16px; height:16px; cursor:pointer; }
  .confirm-actions{ display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap; }
  .confirm-actions button{
    font-family:"Segoe UI",sans-serif; font-size:13px; font-weight:600;
    padding:9px 16px; border-radius:5px; cursor:pointer;
    border:1px solid var(--rule); background:var(--paper); color:var(--text);
  }
  .confirm-actions button.danger{ background:var(--debit); border-color:var(--debit); color:#fff; }
  .confirm-actions button:disabled{ opacity:.45; cursor:default; }
  .confirm-actions .confirm-export{ margin-right:auto; }
  .profile-msg{
    font-size:12px;
    border-radius:4px;
    padding:8px 10px;
    margin-top:10px;
  }
  .profile-msg.error{ color:var(--debit); background:color-mix(in srgb, var(--debit) 12%, transparent); }
  .profile-msg.notice{ color:var(--forest); background:color-mix(in srgb, var(--forest) 12%, transparent); }
  .profile-divider{ border:none; border-top:1px solid var(--rule); margin:0; }
  .profile-hint{ font-size:11.5px; color:var(--text-soft); line-height:1.5; margin:2px 0 0; }
  .profile-placeholder{ font-size:13px; color:var(--text-soft); line-height:1.6; }

  /* ---- Profiel > Categorieën: eigen categorieën per budgetgroep (zie renderProfileCategoriesTab) ----
     Elke groep (Inkomsten/Vaste lasten/Abonnementen/Variabele lasten) is een eigen uitklapsectie
     ("bucket") met zijn eigen aanmaakveld en lijst; --bucket-color wordt per sectie ingesteld (zie
     bucketColorVar()) zodat knoppen/badges/swatch daarbinnen automatisch de kleur van die groep
     volgen i.p.v. altijd --gold. */
  .profile-bucket{ border:1px solid var(--rule); border-radius:8px; background:var(--paper-2); overflow:hidden; }
  .profile-bucket + .profile-bucket{ margin-top:8px; }
  .profile-bucket-head{
    display:flex; align-items:center; gap:9px; padding:11px 12px; cursor:pointer; user-select:none;
    border-left:3px solid var(--bucket-color, var(--gold)); color:var(--bucket-color, var(--gold));
  }
  .profile-bucket-head .cat-icon{ width:16px; height:16px; }
  .profile-bucket-title{ font-size:13px; font-weight:700; flex:1 1 auto; color:var(--text); }
  .profile-bucket-count{
    font-size:10px; font-weight:600; color:var(--text-soft); background:var(--rule);
    padding:2px 7px; border-radius:20px; flex-shrink:0;
  }
  .profile-bucket-chevron{ width:14px; height:14px; color:var(--text-soft); flex-shrink:0; transition:transform .18s; }
  .profile-bucket.open .profile-bucket-chevron{ transform:rotate(180deg); }
  .profile-bucket-body{ display:none; padding:0 12px 12px; flex-direction:column; gap:10px; }
  .profile-bucket.open .profile-bucket-body{ display:flex; }

  .profile-cat-add-row{ display:flex; gap:8px; align-items:flex-start; }
  .profile-cat-add-field{ flex:1 1 auto; display:flex; flex-direction:column; gap:4px; min-width:0; }
  .profile-cat-add-field input{
    font-family:inherit; font-size:13.5px; padding:7px 9px; border:1px solid var(--rule);
    border-radius:4px; background:var(--paper); color:var(--text); width:100%;
  }
  .profile-cat-add-field input:focus{ outline:none; border-color:var(--bucket-color, var(--gold)); }
  .profile-cat-add-field input.err{ border-color:var(--debit); }
  .profile-cat-add-field-foot{ display:flex; justify-content:space-between; gap:8px; }
  .profile-cat-counter{ font-size:10.5px; color:var(--text-soft); text-align:right; white-space:nowrap; }
  .profile-cat-counter.warn{ color:var(--debit); }
  .profile-cat-inline-msg{ font-size:11px; color:var(--debit); min-height:13px; }
  .profile-panel-body button.profile-cat-add-btn{
    font-size:12.5px; font-weight:600; padding:7px 12px; border-radius:4px; margin-top:0;
    border:1px solid var(--bucket-color, var(--gold)); background:var(--bucket-color, var(--gold)); color:#fff;
    white-space:nowrap; height:34px;
  }
  .profile-panel-body button.profile-cat-add-btn:hover:not(:disabled){ filter:brightness(1.08); }
  .profile-panel-body button.profile-cat-add-btn:disabled{ background:var(--text-soft); border-color:var(--text-soft); opacity:.4; }

  .profile-cat-list{ display:flex; flex-direction:column; gap:6px; }
  .profile-cat-empty{ font-size:12px; color:var(--text-soft); padding:2px 0; margin:0; }
  /* Profiel > Importregels: één regel per onthouden koppeling tegenpartij -> groep. */
  .profile-rule-row{
    display:flex; align-items:center; gap:8px;
    padding:6px 0; border-bottom:1px solid var(--rule);
  }
  .profile-rule-row:last-child{ border-bottom:none; }
  .profile-rule-text{ flex:1; min-width:0; font-size:12px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .profile-rule-match{ font-weight:600; color:var(--text); word-break:break-word; }
  .profile-rule-arrow{ color:var(--text-soft); }
  .profile-rule-dest{ color:var(--text-soft); word-break:break-word; }
  .profile-rule-del{
    background:none; border:none; color:var(--rule); cursor:pointer;
    font-size:17px; line-height:1; padding:2px 6px; flex-shrink:0;
  }
  .profile-rule-del:hover, .profile-rule-del:focus{ color:var(--debit); }
  .profile-cat-row{
    border:1px solid var(--rule); border-radius:6px; background:var(--paper); padding:8px 10px;
    display:flex; flex-direction:column; gap:6px;
  }
  .profile-cat-row-main{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .profile-cat-swatch{ width:9px; height:9px; border-radius:3px; flex-shrink:0; background:var(--bucket-color, var(--gold)); }
  .profile-cat-name{ font-size:13px; font-weight:600; flex:1 1 auto; min-width:50px; }
  .profile-cat-badge{ font-size:10px; padding:2px 7px; border-radius:20px; white-space:nowrap; font-weight:600; }
  .profile-cat-badge.unused{ color:var(--text-soft); background:var(--rule); }
  .profile-cat-badge.used{ color:var(--bucket-color, var(--gold)); background:color-mix(in srgb, var(--bucket-color, var(--gold)) 14%, transparent); }
  .profile-panel-body button.profile-cat-manage-link{
    font-size:11px; color:var(--bucket-color, var(--gold)); background:none; border:none; padding:0; margin:0;
    text-decoration:underline; text-underline-offset:2px; cursor:pointer;
  }
  .profile-panel-body button.profile-cat-icon-btn{
    width:24px; height:24px; padding:0; margin:0; border-radius:5px; border:1px solid var(--rule);
    background:var(--paper); display:flex; align-items:center; justify-content:center; flex-shrink:0;
    color:var(--text-soft); position:relative;
  }
  .profile-cat-icon-btn svg{ width:12px; height:12px; }
  .profile-panel-body button.profile-cat-icon-btn.delete-ready{ color:var(--debit); border-color:var(--debit); }
  .profile-panel-body button.profile-cat-icon-btn.delete-ready:hover{ background:color-mix(in srgb, var(--debit) 10%, transparent); }
  .profile-panel-body button.profile-cat-icon-btn.locked{ cursor:not-allowed; color:var(--text-soft); opacity:.55; }
  .profile-cat-icon-btn.locked:hover .profile-cat-tooltip{ opacity:1; transform:translateY(0); pointer-events:auto; }
  .profile-cat-tooltip{
    position:absolute; bottom:calc(100% + 8px); right:0; width:180px; text-align:left;
    background:var(--ink); color:var(--text-onink); font-size:10.5px; line-height:1.5; font-weight:400;
    padding:7px 9px; border-radius:5px; box-shadow:0 6px 18px rgba(0,0,0,.25);
    opacity:0; transform:translateY(4px); transition:.15s; pointer-events:none; z-index:5;
  }
  .profile-cat-expand{ border-top:1px dashed var(--rule); margin-top:2px; padding-top:6px; display:flex; flex-direction:column; gap:5px; }
  .profile-cat-link-row{
    display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:11.5px; background:var(--paper-2);
    border:1px solid var(--rule); border-radius:4px; padding:5px 7px;
  }
  .profile-cat-link-desc{ flex:1 1 120px; min-width:0; }
  .profile-cat-link-desc .who{ font-weight:600; }
  .profile-cat-link-desc .amt.debit{ color:var(--debit); }
  .profile-cat-link-desc .amt.credit{ color:var(--credit); }
  .profile-cat-link-month{ color:var(--text-soft); font-size:10px; margin-left:4px; }
  .profile-cat-link-controls{ display:flex; align-items:center; gap:6px; flex-shrink:0; margin-left:auto; }
  .profile-cat-link-select{
    font-family:inherit; font-size:11px; padding:3px 5px; border:1px solid var(--rule);
    border-radius:4px; background:var(--paper); color:var(--text); max-width:140px;
  }
  .profile-panel-body button.profile-cat-link-unlink{
    width:20px; height:20px; padding:0; margin:0; border-radius:4px; border:1px solid var(--rule);
    background:transparent; color:var(--text-soft); flex-shrink:0; display:flex; align-items:center; justify-content:center;
  }
  .profile-panel-body button.profile-cat-link-unlink:hover{ color:var(--debit); border-color:var(--debit); }
  .profile-cat-expand-footer{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; margin-top:2px; }
  .profile-cat-expand-hint{ font-size:10.5px; color:var(--text-soft); }
  .profile-panel-body button.profile-cat-delete-final-btn{
    font-size:11px; font-weight:600; padding:5px 10px; border-radius:4px; margin-top:0;
    border:1px solid var(--debit); background:transparent; color:var(--debit);
  }
  .profile-panel-body button.profile-cat-delete-final-btn:disabled{ opacity:.35; cursor:not-allowed; }
  .profile-panel-body button.profile-cat-delete-final-btn:not(:disabled):hover{ background:color-mix(in srgb, var(--debit) 10%, transparent); }

  /* Tabs */
  /* De ruimte tussen de losse menu-secties (Basisdata / Maandbudgetten+Jaren / Groei /
     upload-knop) komt nu volledig uit deze ene `gap` op de flex-container, in plaats van losse
     margin/padding/border-regels per sectie-combinatie — dat laatste bleek stil te breken zodra
     een sectie een ander wrapper-element werd (zoals de Maandbudgetten+Jaren-"pair", zie issue
     #8): de afstand was dan opeens veel kleiner voor die ene combinatie. Met een simpele `gap` is
     de afstand altijd en overal exact hetzelfde, hoeveel secties er ook zijn of wat voor wrapper
     ze gebruiken. */
  .tabs{
    display:flex;
    flex-direction:column;
    gap:18px;
    /* Staat nu in de lade i.p.v. in de kopbalk: vult de volle breedte, scrolt zelf als de lijst
       met maandbudgetten/jaren lang wordt, en heeft geen max-width meer nodig. */
    flex:1 1 auto;
    overflow-y:auto;
    padding:14px 12px 18px;
    margin-top:0;
  }
  .tab-group{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .tab-group-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
    margin-bottom:4px;
    padding:0 14px;
  }
  .tab-group-label{
    color:var(--text-onink-soft);
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.12em;
    font-family:"Segoe UI",sans-serif;
    flex:1;
  }
  /* De hele groepskop (niet alleen het pijltje) is klikbaar om in/uit te klappen — zie issue #4.
     Het "+"-knopje zelf blijft zijn eigen (andere) actie houden, zie wireGroupHeadCollapse(). */
  .tab-group-head.collapsible{ cursor:pointer; }
  .tab-group-head.collapsible:hover .tab-group-label{ color:var(--gold-bright); }
  /* Basisdata: zelfde kop-uiterlijk als Maandbudgetten/Jaren/Groei, maar als knop die direct naar
     de pagina navigeert — geen pijltje, geen dropdown (zie issue #5). */
  .tab-group-head-direct{
    width:100%;
    background:transparent;
    border:none;
    cursor:pointer;
    text-align:left;
    font-family:inherit;
  }
  .tab-group-head-direct:hover .tab-group-label{ color:var(--gold-bright); }
  .tab-group-head-direct.active .tab-group-label{ color:var(--gold-bright); }
  /* group-add-btn ("+") en group-collapse-btn (pijltje) zijn de twee ronde icoonknopjes in een
     groepskop — bewust exact dezelfde breedte/hoogte/vormgeving (zie issue #4), zodat ze als een
     nette, bij elkaar horende set ogen in plaats van twee net iets andere knopjes. */
  .group-add-btn,
  .group-collapse-btn{
    width:20px;
    height:20px;
    border-radius:50%;
    border:1px solid color-mix(in srgb, var(--text-onink) 25%, transparent);
    background:transparent;
    color:var(--text-onink-soft);
    font-size:13px;
    line-height:1;
    padding:0;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .group-add-btn:hover,
  .group-collapse-btn:hover{
    border-color:var(--gold);
    color:var(--gold-bright);
    background:color-mix(in srgb, var(--gold) 12%, transparent);
  }
  .group-collapse-btn svg{
    width:12px;
    height:12px;
    transition:transform .15s ease;
  }
  .group-collapse-btn.collapsed svg{ transform:rotate(-90deg); }
  /* Rij met een maandtab plus een klein verwijder-knopje ernaast (zie renderTabs) — de tab zelf
     blijft de volle breedte innemen (net als voorheen), het kruisje staat er los naast, in dezelfde
     ronde-icoonknop-stijl als group-add-btn/group-collapse-btn hierboven, alleen rood bij hover
     zodat meteen duidelijk is dat het een verwijderactie is. */
  .tab-row{
    display:flex;
    align-items:center;
    gap:2px;
  }
  .tab-row .tab{ flex:1 1 auto; min-width:0; }
  .tab-delete-btn{
    width:20px;
    height:20px;
    border-radius:50%;
    border:1px solid color-mix(in srgb, var(--text-onink) 25%, transparent);
    background:transparent;
    color:var(--text-onink-soft);
    font-size:14px;
    line-height:1;
    padding:0;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    margin-right:8px;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .tab-delete-btn:hover{
    border-color:var(--debit);
    color:var(--debit);
    background:color-mix(in srgb, var(--debit) 12%, transparent);
  }
  .tab-delete-btn svg{ width:12px; height:12px; }
  /* Maandbudgetten + Jaren staan samen in deze wrapper. Op een smal scherm (het gebruikelijke
     geval, en altijd onder de 760px-drempel hieronder) gedraagt hij zich als een gewone
     .tab-group-kolom: gestapeld onder elkaar, identiek aan hoe het er al uitzag vóór deze
     wijziging. Pas vanaf voldoende breedte (er is toch ruime lege ruimte rechts van het menu op
     een breed scherm) gaan de twee lijstjes naast elkaar staan. */
  /* Geen streepje meer tussen Maandbudgetten en Jaren (issue #7) — ze horen inhoudelijk bij
     elkaar (vandaar ook de gedeelde "pair"-wrapper), dus alleen witruimte, geen lijn. Die
     witruimte komt nu — net als bij `.tabs` hierboven — uit één simpele `gap`, zodat 'm altijd
     precies hetzelfde is, ongeacht in-/uitgeklapte staat of aantal items (issue #8). */
  .tab-group-pair{
    display:flex;
    flex-direction:column;
    gap:20px;
  }
  /* (De regel die Maandbudgetten en Jaren op een breed scherm naast elkaar zette is vervallen:
     in een lade van ~290px is er maar één kolom, dus ze staan altijd onder elkaar.) */
  .tab{
    display:flex;
    align-items:center;
    text-align:left;
    background:transparent;
    border:none;
    border-left:3px solid transparent;
    color:var(--text-onink-soft);
    font-family:Georgia,serif;
    font-size:14px;
    padding:10px 14px;
    cursor:pointer;
    transition:color .15s ease, border-color .15s ease, background .15s ease;
    white-space:nowrap;
  }
  .tab:hover{color:var(--text-onink); background:color-mix(in srgb, var(--text-onink) 4%, transparent);}
  .tab.active{
    color:var(--gold-bright);
    border-left-color:var(--gold);
    background:color-mix(in srgb, var(--gold) 8%, transparent);
  }
  .tab .tab-idx{
    opacity:.6;
    font-size:11px;
    margin-right:6px;
  }
  .tab-upload{
    border:1px dashed color-mix(in srgb, var(--text-onink) 30%, transparent);
    border-radius:3px;
    color:var(--gold-bright);
    font-family:"Segoe UI",sans-serif;
    font-size:12.5px;
    justify-content:center;
  }
  .tab-upload:hover{background:color-mix(in srgb, var(--gold) 8%, transparent); border-color:var(--gold);}
  /* Herordenbare tabs (zie enableLongPressReorder): "grab"-cursor als signaal dat ingedrukt houden
     iets doet, en een duidelijk "opgetild"-effect zodra het slepen daadwerkelijk is gestart. */
  .tab-draggable{cursor:grab;}
  .tab-dragging{
    cursor:grabbing;
    opacity:.6;
    background:color-mix(in srgb, var(--gold) 14%, transparent);
    box-shadow:0 3px 10px rgba(0,0,0,.3);
    position:relative;
    z-index:5;
  }
  /* CSV- en PDF-uploadknop samen: op smal scherm (het gebruikelijke geval) gewoon onder elkaar,
     precies zoals hiervoor. Pas vanaf dezelfde 760px-drempel als de Maandbudgetten/Jaren-pair
     hierboven gaan ze naast elkaar staan — er is dan toch ruimte over. */
  .upload-row{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  @media (min-width:760px){
    .upload-row{
      flex-direction:row;
    }
    .upload-row > .tab-upload{
      flex:1 1 0;
      min-width:0;
    }
  }

  /* Layout */
  /* minmax(0,1fr) en niet 1fr: een `1fr`-kolom weigert smaller te worden dan de min-content van
     z'n inhoud, en die min-content is hier ~420px omdat een invoerveld standaard zo'n 20 tekens
     breed wil zijn. Gevolg: inzoomen (of een smal venster) duwde de hele pagina breder dan het
     scherm en je kreeg een horizontale schuifbalk in plaats van meekrimpende kolommen. Met
     minmax(0,…) + min-width:0 mag de kolom wél onder die min-content zakken, waarna de
     flex-shrink op de labelvelden het werk doet. */
  .layout{
    display:grid;
    grid-template-columns:minmax(0,1fr) 380px;
    gap:0;
    align-items:start;
  }
  main.categories, aside.summary{ min-width:0; }
  @media (max-width:980px){
    .layout{grid-template-columns:minmax(0,1fr);}
    aside.summary{
      position:static;
      min-height:0;
      border-left:none;
      border-top:1px solid color-mix(in srgb, var(--text-onink) 8%, transparent);
    }
  }

  main.categories{
    padding:28px 24px 60px 32px;
  }
  @media (max-width:640px){
    header{padding:20px 18px 16px;}
    main.categories{padding:18px 14px 36px;}
    aside.summary{padding:20px 16px 32px;}
    .card-head{padding:9px 14px 7px;}
    .rows{padding:2px 14px 8px;}
    .row .value-input{width:78px;}
  }

  .card{
    /* Was eerder een vast om-de-30px herhalend lijnenpatroon op de achtergrond (alsof het
       geliniëerd papier was) — dat leek in eerste opzicht op een nette tabel, maar zodra ergens
       een rij een extra notitieregel had (zoals bij UN-Gas+elec) klopte de 30px-aanname niet meer
       en liepen alle lijntjes daaronder blijvend uit de pas met de échte tekst (vandaar dat
       bijvoorbeeld "Sparen kids" en "Alimentatie" niet meer netjes tussen de lijntjes stonden).
       Nu een échte rand ONDER elke rij zelf (zie .row hieronder) — die volgt altijd automatisch
       de werkelijke hoogte van de inhoud, ook als een rij een notitieregel erbij krijgt. */
    background:var(--paper);
    border:1px solid var(--rule);
    border-radius:2px;
    margin-bottom:20px;
    box-shadow:0 1px 0 rgba(0,0,0,.04);
  }
  .card-overig{
    border:1px dashed var(--debit);
  }
  .card-overig .card-head{
    background:color-mix(in srgb, var(--debit) 9%, transparent);
  }
  .card-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 18px 8px;
    border-bottom:1px solid var(--rule);
    background:var(--paper-2);
  }
  .card-head .htitle{
    display:flex;
    align-items:center;
    gap:9px;
    color:var(--forest);
    min-width:0;
  }
  /* Accentkleur per groep — dezelfde vier kleuren als in Profiel > Categorieën en op de tegels van
     het importscherm (zie bucketColorVar). Tot v25 waren alle kaartkoppen dezelfde tint groen,
     waardoor Inkomsten en Vaste lasten er op een vol scherm identiek uitzagen; nu is in één
     oogopslag te zien bij welke groep een kaart hoort, en sluit het aan op de kleuren die elders in
     de app al voor diezelfde groepen gebruikt worden.
     --bucket-color wordt per kaart gezet in renderCard(); kaarten zonder groep (review, "overig")
     krijgen 'm niet en houden dus gewoon hun eigen bestaande stijl. */
  .card-bucket .card-head{
    background:color-mix(in srgb, var(--bucket-color) 11%, var(--paper-2));
    border-bottom-color:color-mix(in srgb, var(--bucket-color) 35%, var(--rule));
  }
  .card-bucket .card-head .htitle{ color:var(--bucket-color); }
  /* Smalle kleurstreep langs de linkerkant van de kaart: die loopt door langs alle rijen, zodat de
     groep ook herkenbaar blijft als de kop uit beeld is gescrold. */
  .card-bucket{
    border-left:3px solid var(--bucket-color);
  }
  .card-head h2{
    font-size:15px;
    color:inherit;
    letter-spacing:.01em;
  }
  .cat-icon{
    width:17px;
    height:17px;
    flex-shrink:0;
    opacity:.9;
  }
  .card-head .cat-total{
    font-size:15px;
    font-weight:700;
    color:var(--text);
  }
  .card-note{
    padding:0 18px 8px;
    font-size:11.5px;
    color:var(--text-soft);
    font-style:italic;
  }
  .card-review{
    border:1px dashed var(--gold);
  }
  .card-review .card-head{
    background:color-mix(in srgb, var(--gold) 8%, transparent);
  }
  .review-bulk-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    padding:0 18px 10px;
  }
  .review-selectall-label{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    color:var(--text-soft);
    cursor:pointer;
    user-select:none;
  }
  .review-add-selected-btn{
    flex-shrink:0;
  }
  .review-add-selected-btn:disabled,
  .review-selectall-label input:disabled{
    opacity:.5;
    cursor:default;
  }
  .review-row-check{
    flex-shrink:0;
    width:15px;
    height:15px;
    cursor:pointer;
  }
  .review-row-check:disabled{cursor:default; opacity:.5;}
  .review-rows{padding:2px 18px 12px;}
  .review-row{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    padding:7px 0;
    border-bottom:1px dashed var(--rule);
  }
  .review-row:last-child{border-bottom:none;}
  .review-subtotal-row{
    border-top:1px solid var(--rule);
    border-bottom:none;
    padding-top:9px;
    margin-top:2px;
    font-weight:600;
  }
  .review-subtotal-row .review-name{flex:1 1 auto; white-space:normal; overflow:visible;}
  .review-subtotal-row .review-amt{width:auto;}
  .review-name{
    flex:1 1 140px;
    min-width:0;
    font-size:13px;
    color:var(--text);
    display:flex;
    align-items:center;
    gap:4px;
  }
  .review-name > span:last-child{
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .review-amt{
    width:88px;
    text-align:right;
    font-size:13px;
    flex-shrink:0;
  }
  .review-amt.pos{color:var(--credit);}
  .review-amt.neg{color:var(--debit);}
  .review-select, .review-cat-select{
    font-family:"Segoe UI",sans-serif;
    font-size:12px;
    padding:4px 5px;
    border:1px solid var(--rule);
    border-radius:3px;
    background:var(--paper);
    color:var(--text);
    flex-shrink:0;
  }
  .review-select:disabled{opacity:.6;}
  .review-cat-select{ border-style:dashed; max-width:120px; }
  .review-btn{
    background:transparent;
    border:1px solid var(--forest);
    color:var(--forest);
    font-size:11.5px;
    padding:5px 12px;
    border-radius:3px;
    cursor:pointer;
    font-family:"Segoe UI",sans-serif;
    flex-shrink:0;
  }
  .review-btn:hover{background:color-mix(in srgb, var(--forest) 8%, transparent);}
  .review-btn.added{border-color:var(--debit); color:var(--debit);}
  .review-btn.added:hover{background:color-mix(in srgb, var(--debit) 8%, transparent);}
  .review-btn:disabled{opacity:.5; cursor:default;}
  .review-btn:disabled:hover{background:transparent;}
  .rows{padding:2px 18px 10px;}
  .row{
    display:flex;
    align-items:center;
    gap:10px;
    min-height:30px;
    padding:0;
    border-bottom:1px solid var(--rule);
  }
  .row .label-input{
    flex:1;
    min-width:0;
    border:none;
    background:transparent;
    font-family:inherit;
    font-size:13.5px;
    color:var(--text);
    padding:4px 2px;
  }
  .row .label-input:focus{outline:none; background:color-mix(in srgb, var(--gold) 8%, transparent);}
  .row .value-wrap{
    display:flex;
    align-items:center;
    gap:2px;
    flex-shrink:0;
  }
  .row .value-wrap span.euro{color:var(--text-soft); font-size:12.5px;}
  .row .value-input{
    width:92px;
    text-align:right;
    border:none;
    border-bottom:1px solid transparent;
    background:transparent;
    font-family:"Courier New",Consolas,monospace;
    font-size:13.5px;
    padding:4px 2px;
    color:var(--text);
  }
  .row .value-input:focus{outline:none; border-bottom-color:var(--gold);}
  .row .value-input:disabled{color:var(--forest); font-weight:700; -webkit-text-fill-color:var(--forest);}

  /* Loonsverhoging-blok (jaarpagina's): apart, net "tabelletje" met duidelijke rand en een
     streepje tussen de twee regels, in plaats van los zwevende tekst. Geen onderstreepje meer
     onder de invulvelden zelf (op eigen verzoek weggehaald) — de +/- stappers en het kader om het
     hele blokje maken al voldoende duidelijk dat het om invoervelden gaat. */
  .verhogingen-rows{
    margin:0 18px 4px;
    padding:2px 14px;
    border:1px solid var(--rule);
    border-radius:6px;
    background:color-mix(in srgb, var(--paper-2) 70%, transparent);
  }
  .verhogingen-rows .row{border-bottom:1px dashed var(--rule);}
  .verhogingen-rows .row:last-child{border-bottom:none;}
  .verhogingen-rows .value-input{border-bottom-color:transparent !important;}

  /* +/- stappers vóór het percentagecijfer — vervangt de onzichtbare-op-mobiel pijltjes van
     een gewoon number-invoerveld door twee echte, goed aantikbare knoppen. */
  .stepper-btns{
    display:flex;
    align-self:stretch;
    flex-shrink:0;
    gap:1px;
    margin-right:6px;
  }
  .step-btn{
    width:30px;
    align-self:stretch;
    border:1px solid var(--rule);
    background:var(--paper);
    color:var(--text-soft);
    font-size:16px;
    line-height:1;
    cursor:pointer;
    font-family:"Segoe UI",sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
  }
  .step-btn:first-child{border-radius:4px 0 0 4px;}
  .step-btn:last-child{border-radius:0 4px 4px 0; border-left:none;}
  .step-btn:hover{background:color-mix(in srgb, var(--gold) 10%, transparent); color:var(--gold-bright); border-color:var(--gold);}
  .step-btn:active{background:color-mix(in srgb, var(--gold) 20%, transparent);}
  .pct-stepper{align-self:stretch;}
  .pct-stepper .value-input{width:56px; text-align:center;}
  /* Native op/neer-pijltjes van het getalveld verbergen — die zijn sowieso onbruikbaar op
     mobiel/touch, en nu hebben we er eigen, altijd zichtbare/aantikbare knoppen voor. */
  .value-input::-webkit-outer-spin-button,
  .value-input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  .value-input[type="number"]{-moz-appearance:textfield;}
  .row .del-btn{
    background:none;
    border:none;
    color:var(--rule);
    cursor:pointer;
    font-size:18px;
    line-height:1;
    padding:2px 6px;
    opacity:.4;
    flex-shrink:0;
  }
  .row:hover .del-btn, .row .del-btn:focus{opacity:1; color:var(--debit);}
  /* Markeerknopjes in een rij (zie renderCard/opts.salaryPicker en opts.offsetPicker): hetzelfde
     onopvallende formaat als .del-btn, maar goudkleurig zodra de markering actief is. Een actieve
     markering blijft altijd zichtbaar (ook zonder hover), want die zegt iets over de data zelf. */
  .row .role-btn{
    background:none;
    border:none;
    color:var(--rule);
    cursor:pointer;
    font-size:14px;
    line-height:1;
    padding:2px 5px;
    opacity:.35;
    flex-shrink:0;
  }
  .row:hover .role-btn, .row .role-btn:focus{opacity:.85;}
  .row .role-btn.active{opacity:1; color:var(--gold-bright);}
  /* Uitklapbaar keuzelijstje onder een rij om die rij van een andere rij af te trekken. */
  .offset-picker{
    padding:4px 0 8px 26px;
    font-size:11.5px;
    color:var(--text-soft);
  }
  .offset-picker label{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .offset-picker select{
    font:inherit;
    color:var(--text);
    background:var(--paper);
    border:1px solid var(--rule);
    border-radius:5px;
    padding:3px 6px;
    max-width:100%;
  }
  .add-row-btn{
    background:none;
    border:none;
    color:var(--forest);
    font-size:12.5px;
    cursor:pointer;
    padding:6px 2px;
    font-family:"Segoe UI",sans-serif;
  }
  .add-row-btn:hover{text-decoration:underline;}

  /* Een rij met een notitie (bijv. UN-Gas+elec, of een door "Toepassen op budget" op € 0,00 gezette
     regel, zie applyMonthToBudget) draagt zelf geen onderrand — die staat in plaats daarvan onder de
     notitie, zodat rij + notitie visueel bij elkaar blijven horen. De rij zit sinds de uitklapbare
     deellijst-functionaliteit in een .row-wrap (zie renderCard); de notitie zelf staat daar als
     sibling naast, dus de selector moet op .row-wrap letten, niet meer rechtstreeks op .row. */
  .row-wrap:has(+ .row-note) .row{border-bottom:none;}
  .row-note{
    font-size:11px;
    color:var(--text-soft);
    font-style:italic;
    padding:0 2px 8px;
    margin-top:-4px;
    border-bottom:1px solid var(--rule);
  }

  .toggle-row{
    margin:-10px 0 20px;
    padding:0 4px;
  }
  .toggle-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12.5px;
    color:var(--text-soft);
    font-family:"Segoe UI",sans-serif;
    cursor:pointer;
  }
  .toggle-label input[type="checkbox"]{
    accent-color:var(--gold);
    width:14px;
    height:14px;
    cursor:pointer;
    flex-shrink:0;
  }

  .row .label-input:disabled{color:var(--text-soft); opacity:1;}
  .verhogingen-info{
    padding:2px 18px 14px;
    font-size:12.5px;
    color:var(--text-soft);
    display:flex;
    flex-direction:column;
    gap:3px;
    border-top:1px dashed var(--rule);
    margin-top:4px;
    padding-top:8px;
  }
  .verhogingen-info .mono{color:var(--forest); font-weight:700;}

  /* Summary panel */
  aside.summary{
    position:sticky;
    top:0;
    background:var(--ink);
    color:var(--text-onink);
    padding:28px 24px 40px;
    min-height:100vh;
    border-left:1px solid color-mix(in srgb, var(--text-onink) 8%, transparent);
  }
  aside.summary h2{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.12em;
    color:var(--text-onink-soft);
    margin-bottom:16px;
    font-family:"Segoe UI",sans-serif;
  }
  .stamp{
    border:2px solid var(--gold);
    border-radius:4px;
    padding:16px 18px;
    margin-bottom:22px;
    transform:rotate(-0.4deg);
  }
  /* Twee stamps (werkelijk + begroot) samen: gewoon flex-wrap, geen harde breedte-drempel nodig —
     zo staan ze vanzelf naast elkaar zodra er ruimte is (bv. op een breed scherm, of zodra de
     sidebar op smal scherm onder de hoofdinhoud terechtkomt en zo weer breder wordt) en anders
     gewoon onder elkaar, precies zoals bij de andere responsive stukjes in deze app. */
  .stamp-row{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:22px;
  }
  .stamp-row .stamp{
    flex:1 1 150px;
    min-width:150px;
    margin-bottom:0;
  }
  .stamp.negative{border-color:var(--debit);}
  .stamp .stamp-label{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold-bright);
    margin-bottom:4px;
  }
  .stamp.negative .stamp-label{color:#e08376;}
  .stamp .stamp-value{
    font-size:clamp(24px, 7vw, 32px);
    font-family:"Courier New",Consolas,monospace;
    font-weight:700;
    color:var(--gold-bright);
  }
  .stamp.negative .stamp-value{color:#e08376;}
  .stamp .stamp-sub{
    font-size:11.5px;
    color:var(--text-onink-soft);
    margin-top:4px;
  }

  .summary-line{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:6px 0;
    border-bottom:1px solid color-mix(in srgb, var(--text-onink) 8%, transparent);
    font-size:13.5px;
  }
  .summary-line .l{color:var(--text-onink-soft);}
  .summary-line .v{font-family:"Courier New",Consolas,monospace;}
  .summary-line.credit .v{color:#7fd6ae;}
  .summary-line.debit .v{color:#ef9a8c;}
  .summary-line.total{
    border-bottom:none;
    border-top:1px solid color-mix(in srgb, var(--text-onink) 20%, transparent);
    margin-top:4px;
    padding-top:10px;
    font-size:15px;
    font-weight:700;
  }

  .source-note{
    font-size:11px;
    color:var(--text-onink-soft);
    margin:-14px 0 18px;
  }

  .chart-block{margin-top:26px;}
  .chart-block h2{margin-bottom:10px;}
  .chart-block svg{max-width:100%; height:auto; display:block;}

  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:10px;
    font-size:11px;
    color:var(--text-onink-soft);
  }
  .legend span.dot{
    display:inline-block;
    width:8px;height:8px;
    border-radius:50%;
    margin-right:5px;
  }
  .legend span.line-swatch{
    display:inline-block;
    width:14px;height:2px;
    border-radius:1px;
    margin-right:5px;
    vertical-align:middle;
  }

  /* Loonstijging: gegevenstabel */
  .table-wrap{overflow-x:auto; padding:2px 0 12px;}
  .loonstijging-table{width:100%; border-collapse:collapse; font-size:11.5px; white-space:nowrap;}
  .loonstijging-table th{
    text-align:right; padding:7px 12px 6px; color:var(--text-soft);
    font-weight:600; font-size:10.5px; letter-spacing:.01em;
    border-bottom:1px solid var(--rule);
  }
  .loonstijging-table th:first-child, .loonstijging-table td:first-child{text-align:left;}
  .loonstijging-table td{
    text-align:right; padding:6px 12px;
    border-bottom:1px solid rgba(216,205,180,.6);
  }
  .loonstijging-table td.strong{font-weight:700; color:var(--forest);}
  .loonstijging-table tbody tr:hover{background:color-mix(in srgb, var(--gold) 7%, transparent);}
  .loonstijging-table tr.synced-row{background:color-mix(in srgb, var(--credit) 8%, transparent);}
  .loonstijging-table tr.synced-row:hover{background:color-mix(in srgb, var(--credit) 14%, transparent);}
  .synced-dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--credit); vertical-align:middle; margin-left:2px;}
  /* Jaartal van een gekoppelde (groen-bolletje) rij is een echte knop geworden — springt direct
     naar dat jaar-tabblad, zonder de omweg via het menu. Oogt verder als gewone tekst totdat je
     eroverheen hovert, zodat de tabel niet ineens vol "knoppen" oogt. */
  .jaar-link{
    font: inherit;
    color: inherit;
    background: none;
    border: none;
    padding: 0;
    margin: 0;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 2px;
  }
  .jaar-link:hover{ color: var(--gold-bright); text-decoration: underline; }
  .jaar-link:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 2px; }

  /* Loonstijging: lijngrafiek met hover-crosshair + tooltip */
  .lchart-wrap{
    position:relative;
    /* Ruimte reserveren bovenaan speciaal voor het tooltipje, zodat het nooit over de bolletjes
       of hun klikbare cirkel heen kan vallen — het tooltipje (top:0, hieronder) staat altijd in
       deze strook, los van de grafiek zelf die daaronder begint. */
    padding-top:76px;
  }
  .lchart-tooltip{
    position:absolute;
    pointer-events:none;
    background:color-mix(in srgb, var(--ink) 96%, transparent);
    border:1px solid color-mix(in srgb, var(--text-onink) 15%, transparent);
    border-radius:4px;
    padding:8px 10px;
    font-family:"Segoe UI",sans-serif;
    font-size:11px;
    color:var(--text-onink-soft);
    white-space:nowrap;
    opacity:0;
    transition:opacity .1s;
    z-index:5;
  }
  .lchart-tooltip.visible{opacity:1;}
  .lchart-tooltip .tt-year{font-weight:700; color:var(--text-onink); margin-bottom:5px; font-size:12px;}
  .lchart-tooltip .tt-row{display:flex; align-items:center; gap:6px; margin-top:3px;}
  .lchart-tooltip .tt-key{width:12px; height:2px; border-radius:1px; flex-shrink:0;}
  .lchart-tooltip .tt-val{font-weight:700; color:var(--text-onink); font-family:"Courier New",monospace; font-size:11.5px;}
  .lchart-tooltip .tt-label{color:var(--text-onink-soft);}

  .actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:26px;
  }
  .actions button{
    flex:1 1 100px;
    background:transparent;
    border:1px solid color-mix(in srgb, var(--text-onink) 25%, transparent);
    color:var(--text-onink-soft);
    padding:8px 10px;
    font-size:12px;
    border-radius:3px;
    cursor:pointer;
    font-family:"Segoe UI",sans-serif;
  }
  .actions button:hover{border-color:var(--gold); color:var(--gold-bright);}
  .actions button.danger:hover{border-color:var(--debit); color:#e08376;}
  .actions button.primary{background:var(--gold); border-color:var(--gold); color:var(--ink);}
  .actions button.primary:hover{background:var(--gold-bright); border-color:var(--gold-bright); color:var(--ink);}
  .actions button:disabled{opacity:.6; cursor:default;}

  /* Login/versleutelings-overlay — staat bovenop alles totdat je bent ingelogd én je
     versleutelingswachtwoord hebt ingevoerd. */
  .auth-gate{
    position:fixed; inset:0; z-index:1000;
    display:flex; align-items:center; justify-content:center;
    background:var(--paper-2);
    padding:20px;
  }
  .auth-gate-box{
    width:100%; max-width:360px;
    background:var(--paper);
    border:1px solid var(--rule);
    border-radius:8px;
    padding:28px 26px;
    box-shadow:0 8px 30px rgba(0,0,0,.12);
    display:flex; flex-direction:column; gap:12px;
  }
  .auth-gate-title{font-size:22px; font-weight:700; color:var(--forest); margin-bottom:2px;}
  .auth-gate-title2{font-size:15px; font-weight:700; color:var(--text);}
  .auth-gate-subtitle{font-size:12.5px; color:var(--text-soft); line-height:1.5; margin:0 0 6px;}
  .auth-gate-box label{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--text-soft);}
  .auth-gate-box input{
    font-family:inherit; font-size:14px; padding:8px 10px;
    border:1px solid var(--rule); border-radius:4px; background:var(--paper); color:var(--text);
  }
  .auth-gate-box input:focus{outline:none; border-color:var(--gold);}
  .auth-gate-box button{
    font-family:"Segoe UI",sans-serif; font-size:13.5px; padding:9px 12px;
    border-radius:4px; border:1px solid var(--rule); background:transparent; color:var(--text);
    cursor:pointer;
  }
  .auth-gate-box button.primary{background:var(--forest); border-color:var(--forest); color:#fff;}
  .auth-gate-box button.primary:hover{opacity:.9;}
  .auth-gate-box button.ghost{background:transparent; color:var(--text-soft); border-color:transparent; font-size:12px;}
  .auth-gate-box button.ghost:hover{text-decoration:underline;}
  .auth-gate-box button:disabled{opacity:.6; cursor:default;}
  .auth-gate-error{font-size:12px; color:var(--debit); background:color-mix(in srgb, var(--debit) 12%, transparent); border-radius:4px; padding:8px 10px;}
  .auth-gate-notice{font-size:12px; color:var(--forest); background:color-mix(in srgb, var(--forest) 12%, transparent); border-radius:4px; padding:8px 10px;}

  .save-status{
    margin-top:10px;
    font-size:11px;
    color:var(--text-onink-soft);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .save-status .dot{
    display:inline-block;
    width:7px;height:7px;
    border-radius:50%;
    background:var(--text-onink-soft);
    flex-shrink:0;
  }
  .save-status.on .dot{background:#7fd6ae;}
  .save-status.error{color:#ef9a8c;}
  .save-status.error .dot{background:#ef9a8c;}

  /* Maandbudget-vergelijking (CSV vs. gekozen maandbudget) */
  .compare-picker{padding:2px 18px 14px;}
  .apply-to-budget-row{padding:0 18px 14px;}
  .apply-to-budget-row .review-btn{margin-right:8px;}
  .apply-to-budget-note{padding:8px 0 0; margin:0;}
  .compare-picker select{
    font-family:"Segoe UI",sans-serif;
    font-size:13px;
    padding:6px 8px;
    border:1px solid var(--rule);
    border-radius:3px;
    background:var(--paper);
    color:var(--text);
  }
  .compare-head-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:4px 18px 6px;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--text-soft);
    font-family:"Segoe UI",sans-serif;
  }
  .compare-head-row .compare-name{flex:1 1 120px;}
  .compare-head-row .compare-col{width:78px; text-align:right; flex-shrink:0;}
  .compare-rows{padding:2px 18px 10px;}
  .compare-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:6px 0;
    border-bottom:1px dashed var(--rule);
    font-size:13px;
  }
  .compare-row:last-child{border-bottom:none;}
  .compare-row .compare-name{
    flex:1 1 120px;
    min-width:0;
    display:flex;
    align-items:center;
    gap:4px;
  }
  .compare-row .compare-name > span:last-child{
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .compare-row .compare-col{width:78px; text-align:right; flex-shrink:0;}
  .compare-row.compare-total{
    font-weight:700;
    border-top:1px solid var(--rule);
    border-bottom:none;
    padding-top:8px;
    margin-top:2px;
  }
  .compare-diff.good{color:var(--credit);}
  .compare-diff.bad{color:var(--debit);}
  /* Uitklap-knopje ("Toon/verberg de losse betalingen achter dit bedrag") + de ingesprongen
     deellijst eronder — gedeeld tussen de vergelijkingskaarten (Inkomsten/Vaste lasten/
     Abonnementen/Variabele lasten) en "Nog in te delen", zie renderBreakdownRows(). */
  .compare-row-wrap, .review-row-wrap, .row-wrap{ display:block; }
  .breakdown-toggle-btn{
    width:16px;
    height:16px;
    border:none;
    background:transparent;
    color:var(--text-soft);
    padding:0;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .breakdown-toggle-btn svg{ width:11px; height:11px; transition:transform .15s ease; }
  .breakdown-toggle-btn.open svg{ transform:rotate(-180deg); }
  .breakdown-toggle-btn:hover{ color:var(--gold-bright); }
  .breakdown-rows{
    margin:0 0 6px 26px;
    padding-left:10px;
    border-left:2px solid color-mix(in srgb, var(--text) 15%, transparent);
  }
  .breakdown-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:4px 0;
    font-size:11.5px;
    color:var(--text-soft);
  }
  .breakdown-datum{ flex-shrink:0; width:44px; opacity:.8; }
  .breakdown-naam{ flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .breakdown-amt{ flex-shrink:0; width:76px; text-align:right; }
  .breakdown-amt.pos{color:var(--credit);}
  .breakdown-amt.neg{color:var(--debit);}

  /* ---- "Import basisdata" (zie renderImportBasisdataScreen): losstaande flow die een schone
     PDF/CSV-import direct classificeert tot een nieuwe Basisdata, i.p.v. 'm te vergelijken met een
     bestaand maandbudget. Hergebruikt bewust dezelfde kleurtokens als de rest van de app. ---- */
  .tab-import-bd{ gap:8px; }
  .tab-import-bd svg{ width:15px; height:15px; flex-shrink:0; }
  .import-bd-intro{ font-size:13px; color:var(--text-soft); line-height:1.6; max-width:640px; margin:2px 0 16px; }
  .import-bd-warn{
    display:flex; gap:10px; align-items:flex-start; border:1px solid color-mix(in srgb, var(--debit) 45%, transparent);
    background:color-mix(in srgb, var(--debit) 8%, var(--paper)); border-radius:8px; padding:14px 16px; margin-bottom:18px; max-width:640px;
  }
  .import-bd-warn svg{ width:18px; height:18px; color:var(--debit); flex-shrink:0; margin-top:1px; }
  .import-bd-warn-text{ font-size:12.5px; line-height:1.6; color:var(--text); }
  .import-bd-warn-text b{ color:var(--debit); }
  .import-bd-upload-card{
    border:1px dashed color-mix(in srgb, var(--text) 25%, transparent); border-radius:10px;
    padding:32px 20px; text-align:center; max-width:420px; background:var(--paper-2);
  }
  .import-bd-upload-card svg{ width:28px; height:28px; color:var(--text-soft); margin-bottom:8px; }
  .import-bd-upload-title{ font-size:14px; font-weight:700; margin:0 0 4px; }
  .import-bd-upload-hint{ font-size:11.5px; color:var(--text-soft); margin:0 0 16px; }
  .import-bd-upload-btns{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .import-bd-upload-btns button{
    font-family:"Segoe UI",sans-serif; font-size:12.5px; font-weight:600; padding:9px 14px; border-radius:5px;
    border:1px solid var(--gold); background:var(--gold); color:#fff; cursor:pointer;
  }
  .import-bd-upload-btns button:hover{ filter:brightness(1.08); }
  .import-bd-error{ font-size:12px; color:var(--debit); margin-top:10px; max-width:420px; }
  .import-bd-tiles{ display:grid; grid-template-columns:repeat(auto-fit, minmax(130px,1fr)); gap:10px; max-width:760px; margin-bottom:18px; }
  .import-bd-tile{ border:1px solid var(--rule); border-left:3px solid var(--bucket-color, var(--gold)); border-radius:7px; padding:10px 12px; background:var(--paper-2); }

  .import-bd-rows{ display:flex; flex-direction:column; gap:8px; max-width:760px; margin-bottom:18px; }
  .import-bd-row{ border:1px solid var(--rule); border-radius:7px; background:var(--paper); padding:10px 12px; }

  .import-bd-row-amt{ font-size:13px; font-weight:700; font-family:inherit; }

  .import-bd-pills{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }

  .import-bd-success-warn{

  }

  }

  .import-bd-mode-btn.active{ border-color:var(--gold-bright); background:var(--gold-bright); color:#fff; font-weight:600; }
  .import-bd-mode-btn.split{ border-style:dashed; }
  .import-bd-split-tag{
    margin-left:6px; padding:1px 6px; border-radius:999px;

  .import-bd-mode-result{ margin-left:auto; font-weight:700; font-size:12.5px; }
  .import-bd-mode-result.neg{ color:var(--debit); }
  .import-bd-mode-result.pos{ color:var(--credit); }
  /* Uitklapper met de individuele transacties achter deze tegenpartij. */
  .import-bd-expand{
    display:flex; align-items:center; gap:5px; margin-top:6px;
    background:none; border:none; padding:2px 0; cursor:pointer;
    font:inherit; font-size:11.5px; color:var(--text-soft);
  }
  .import-bd-expand:hover{ color:var(--gold-bright); }
  .import-bd-expand svg{ width:13px; height:13px; transition:transform .15s ease; }
  .import-bd-expand.open svg{ transform:rotate(180deg); }
  .import-bd-tx-list{ margin-top:4px; padding-left:12px; border-left:1px solid var(--rule); }
  .import-bd-tx{
    display:flex; align-items:baseline; gap:8px;
    padding:3px 0; font-size:11.5px; color:var(--text-soft);

  }
  /* Aanvinkbaar zodra er iets te splitsen valt (meer dan één transactie). */
  .import-bd-tx:has(.import-bd-tx-pick){ cursor:pointer; }
  .import-bd-tx:has(.import-bd-tx-pick):hover{ color:var(--text); }
  .import-bd-tx.picked{ color:var(--text); }
  .import-bd-tx-pick{ flex-shrink:0; margin:0; accent-color:var(--gold-bright); cursor:pointer; }
  .import-bd-tx-actions{ padding:6px 0 2px; }
  .import-bd-split-sel{

  .import-bd-tx-date{ flex-shrink:0; font-variant-numeric:tabular-nums; }

  @media (max-width:560px){

  .import-bd-badge{

  }

  .import-bd-preview-line-sources{ font-size:10.5px; color:var(--text-soft); margin:-2px 0 4px; }
  .import-bd-preview-empty{ font-size:11.5px; color:var(--text-soft); font-style:italic; }
  .import-bd-footer{

    font-family:"Segoe UI",sans-serif; font-size:13px; font-weight:600; padding:9px 16px; border-radius:5px; cursor:pointer;

  .import-bd-btn-danger:disabled{ background:var(--text-soft); border-color:var(--text-soft); opacity:.5; cursor:default; }
  .import-bd-success-card{
    border:1px solid color-mix(in srgb, var(--gold) 40%, transparent); background:color-mix(in srgb, var(--gold) 6%, var(--paper));
    border-radius:10px; padding:22px 24px; max-width:600px;
  }
  .import-bd-success-card h3{ font-family:Georgia,serif; font-size:18px; margin:0 0 8px; color:var(--gold); }

  .import-bd-confirm-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:80; display:flex; align-items:center; justify-content:center; padding:20px;
  }

  .import-bd-confirm-card h3{ font-family:Georgia,serif; font-size:17px; margin:0 0 10px; }
  .import-bd-confirm-card p{ font-size:13px; color:var(--text-soft); line-height:1.6; margin:0 0 18px; }
  .import-bd-confirm-actions{ display:flex; justify-content:flex-end; gap:10px; }

</head>
<body>

<!-- Overlay die bovenop alles staat totdat er is ingelogd én het versleutelingswachtwoord is
     ingevoerd — de inhoud wordt volledig door JS (renderAuthGate()) opgebouwd. -->
<div id="authGate" class="auth-gate" style="display:none;"></div>

<!-- De balk plakt bovenaan het scherm (position:sticky) zodat de menuknop en de profielknop
     altijd bereikbaar zijn, waar je ook bent op een lange pagina. De navigatie zelf zat hier tot
     v25 als een brede strook tabbladen in; die is verhuisd naar de uitklaplade hieronder, zodat
     elke pagina meteen met zijn eigen inhoud begint. -->
<header id="appHeader">
  <div class="header-top">
    <button class="icon-btn nav-toggle-btn" id="navToggleBtn" aria-label="Menu" aria-expanded="false" aria-controls="navDrawer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="header-main">
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="mainTitle"></h1>
    </div>
    <div class="header-controls">
      <!-- NL/EN en licht/donker zijn verhuisd naar binnen het profielpaneel (zie hieronder) — in
           dichtgeklapte stand blijft hier alleen de profielknop zelf over. -->
      <button class="profile-btn" id="profileBtn" title="Profiel &amp; instellingen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.2" r="3.4"/><path d="M5.3 19.4c1.2-3.3 3.7-5 6.7-5s5.5 1.7 6.7 5"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- Navigatielade: klapt vanaf LINKS open als overlay over de pagina, en staat standaard dicht.
     De inhoud (#tabs) wordt net als voorheen door renderTabs() opgebouwd — alleen de plek is
     veranderd, niet wat erin staat. -->
<div class="nav-backdrop" id="navBackdrop"></div>
<nav class="nav-drawer" id="navDrawer" aria-label="Hoofdnavigatie" aria-hidden="true">
  <div class="nav-drawer-head">
    <span class="nav-drawer-title" id="navDrawerTitle"></span>
    <button class="icon-btn nav-close-btn" id="navCloseBtn" aria-label="Menu sluiten">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="tabs" id="tabs"></div>
</nav>

<!-- Profiel-/instellingenpaneel: klapt vanaf RECHTS open als overlay (zie .profile-panel), bovenop
     de huidige pagina — die blijft er gewoon "achter" staan zodat je 'm niet kwijtraakt. Wordt
     geopend via #profileBtn hierboven. De NL/EN- en licht/donker-knoppen staan hier in de
     paneelkop, naast het sluitkruisje, zodat in dichtgeklapte stand alleen de profielknop in de
     hoofdheader overblijft. -->
<div class="profile-backdrop" id="profileBackdrop"></div>
<aside class="profile-panel" id="profilePanel" aria-hidden="true">
  <div class="profile-panel-head">
    <span class="profile-panel-title" id="profilePanelTitle"></span>
    <div class="profile-panel-head-controls">
      <div class="lang-toggle" id="langToggle">
        <button class="lang-btn" data-lang="nl">NL</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
      <button class="mode-btn" id="modeBtn" title="Donkere modus">
        <svg id="modeIconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.7 6.7 0 0 0 10.5 10.5z"/></svg>
        <svg id="modeIconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="display:none;"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg>
      </button>
      <button class="profile-close-btn" id="profileCloseBtn" title="Sluiten">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
    </div>
  </div>
  <div class="profile-panel-tabs" id="profilePanelTabs"></div>
  <div class="profile-panel-body" id="profilePanelBody"></div>
</aside>

<input type="file" id="csvUploadInput" accept=".csv" style="display:none"/>
<input type="file" id="pdfUploadInput" accept=".pdf" style="display:none"/>

<!-- Losstaand van de twee bovenstaande (die horen bij de vergelijkingsfunctie, zie handleCSVUpload/
     handlePDFUpload): deze twee horen bij de nieuwe "Import basisdata"-flow (zie
     renderImportBasisdataScreen/handleImportBasisdataCSVUpload/handleImportBasisdataPDFUpload). -->
<input type="file" id="importBdCsvInput" accept=".csv" style="display:none"/>
<input type="file" id="importBdPdfInput" accept=".pdf" style="display:none"/>

<div class="layout">
  <main class="categories" id="categories"></main>
  <aside class="summary" id="summary"></aside>
</div>

<!-- Hier wordt bij het opslaan de laatste stand van de gegevens in dit bestand zelf gezet
     (zie buildHtmlWithEmbeddedData() verderop) — zo is dit ene HTML-bestand altijd de volledige
     app mét de laatste data ineen, overal te openen, ook zonder los opslagbestand. -->
<script type="application/json" id="finbo-embedded-data">{}</script>

<!-- Supabase-client (cloud-database + inloggen) — moet vóór het hoofdscript geladen zijn. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<!-- PDF.js (voor het inlezen van rekeningafschrift-PDF's als alternatief voor de CSV-export, zie
     parsePdfTransactions()) — moet vóór het hoofdscript geladen zijn. Zonder internetverbinding
     werkt de PDF-upload niet (de CSV-upload blijft dan gewoon werken, die heeft dit niet nodig). -->
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.min.js"></script>

<script>
/* Allereerste statement: leg de pagina exact vast zoals hij statisch is geladen (nog vóórdat er
   ook maar iets door JS is gerenderd/gewijzigd). Dit is de mal die bij het opslaan wordt
   hergebruikt — steeds mal + verse data, nooit de inmiddels door JS opgebouwde/gemuteerde DOM.

   Let op: "schoon" slaat hier op de DOM, niet op de data. Dit statement staat ná het
   finbo-embedded-data-blok hierboven, dus als dít bestand al data ingebed had, zit die data ook in
   PRISTINE_HTML. Dat geeft niets — buildHtmlWithEmbeddedData() vervangt de inhoud van dat blok bij
   elke opslag via een regex — maar ga er dus niet van uit dat deze mal datavrij is. Een
   uit te leveren bestand maak je datavrij door het blok op {} te zetten, niet door hierop te
   vertrouwen. */
