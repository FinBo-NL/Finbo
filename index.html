<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinBo</title>
<style>
  /* Licht (standaard): witte/lichte achtergrond door de hele app, groen als belettering/accent.
     --ink/--ink-2 = achtergrond van de "chrome" (header/zijbalk/zijpaneel), --paper/--paper-2 =
     achtergrond van kaarten. --text-onink(-soft) is de tekstkleur die bij --ink hoort, --text(-soft)
     die bij --paper — dat koppel wisselt per modus mee, dus de rest van het stijlblad hoeft niet
     te weten of het licht of donker is. */
  :root{
    --ink:#fbfcfb;
    --ink-2:#f5f8f6;
    --paper:#ffffff;
    --paper-2:#f1f5f2;
    --rule:#e2e8e3;
    --gold:#1f6f4f;
    --gold-bright:#2f9d6f;
    --forest:#1a5c42;
    --credit:#1f7a52;
    --debit:#b0463c;
    --text:#182620;
    --text-soft:#5e6f65;
    --text-onink:#182620;
    --text-onink-soft:#5e6f65;
    /* Grafiekkleuren per categorie (staaf/donut/legenda + Loonstijging-lijngrafiek). Bewust NIET
       (bijna) dezelfde groentint als de rest van de UI (knoppen, positieve bedragen gebruiken al
       overal --gold/--forest/--credit) — anders vallen "Gedeelde vaste lasten" en "Over te
       spenderen" in de grafieken bijna niet uit elkaar. Alleen "Over" (bewust positief/goed) blijft
       groen en sluit zo aan bij de rest van de app; de andere categorieën krijgen elk een duidelijk
       andere kleur (blauw/oranje/paars), gevalideerd op onderling verschil (zie dataviz-methodiek). */
    --cat-vaste:#2a78d6;
    --cat-abon:#eb6834;
    --cat-variabel:#4a3aa7;
    --cat-over:#1f7a52;
    --cat-tekort:#eda100;
    --cat-income:#2a78d6;
    --cat-kosten:#eb6834;
  }
  html[data-mode="dark"]{
    --ink:#111a16;
    --ink-2:#0d1512;
    --paper:#16211c;
    --paper-2:#1c2822;
    --rule:rgba(255,255,255,.09);
    --gold:#4fae86;
    --gold-bright:#6bc79c;
    --forest:#5fbf94;
    --credit:#5fbf94;
    --debit:#e2897a;
    --text:#e7f0ea;
    --text-soft:#9db0a5;
    --text-onink:#eaf1ec;
    --text-onink-soft:#9db0a5;
    --cat-vaste:#3987e5;
    --cat-abon:#d95926;
    --cat-variabel:#9085e9;
    --cat-over:#5fbf94;
    --cat-tekort:#c98500;
    --cat-income:#3987e5;
    --cat-kosten:#d95926;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    color:var(--text);
    min-height:100vh;
    transition:background .2s ease, color .2s ease;
  }
  h1,h2,h3{
    font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;
    font-weight:600;
    margin:0;
  }
  .mono{
    font-family:"Courier New",Consolas,monospace;
    font-variant-numeric:tabular-nums;
  }

  /* Header */
  header{
    background:linear-gradient(180deg,var(--ink) 0%,var(--ink-2) 100%);
    padding:28px 32px 20px;
    border-bottom:3px solid var(--gold);
  }
  .header-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    flex-wrap:wrap;
  }
  header .eyebrow{
    color:var(--gold);
    letter-spacing:.01em;
    font-family:"Segoe UI",sans-serif;
    font-weight:700;
    font-size:28px;
    margin-bottom:2px;
  }
  header h1{
    color:var(--text-onink-soft);
    font-size:16px;
    font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;
    font-weight:400;
    letter-spacing:.01em;
  }
  .header-controls{
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
  }
  .lang-toggle{
    display:flex;
    gap:4px;
    flex-shrink:0;
  }
  .mode-btn{
    width:34px;
    height:34px;
    border-radius:50%;
    border:1px solid color-mix(in srgb, var(--text-onink) 25%, transparent);
    background:transparent;
    color:var(--text-onink-soft);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  html[data-mode="light"] .mode-btn{ border-color:rgba(0,0,0,.15); }
  .mode-btn:hover{border-color:var(--gold); color:var(--gold-bright);}
  .mode-btn svg{width:16px; height:16px;}
  .lang-btn{
    background:transparent;
    border:1px solid color-mix(in srgb, var(--text-onink) 25%, transparent);
    color:var(--text-onink-soft);
    padding:5px 11px;
    font-size:11px;
    letter-spacing:.06em;
    border-radius:3px;
    cursor:pointer;
    font-family:"Segoe UI",sans-serif;
  }
  .lang-btn:hover{border-color:var(--gold); color:var(--gold-bright);}
  .lang-btn.active{
    border-color:var(--gold);
    color:var(--gold-bright);
    background:color-mix(in srgb, var(--gold) 12%, transparent);
  }

  /* Tabs */
  /* De ruimte tussen de losse menu-secties (Basisdata / Maandbudgetten+Jaren / Groei /
     upload-knop) komt nu volledig uit deze ene `gap` op de flex-container, in plaats van losse
     margin/padding/border-regels per sectie-combinatie — dat laatste bleek stil te breken zodra
     een sectie een ander wrapper-element werd (zoals de Maandbudgetten+Jaren-"pair", zie issue
     #8): de afstand was dan opeens veel kleiner voor die ene combinatie. Met een simpele `gap` is
     de afstand altijd en overal exact hetzelfde, hoeveel secties er ook zijn of wat voor wrapper
     ze gebruiken. */
  .tabs{
    display:flex;
    flex-direction:column;
    gap:20px;
    margin-top:20px;
    max-width:340px;
  }
  .tab-group{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .tab-group-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
    margin-bottom:4px;
    padding:0 14px;
  }
  .tab-group-label{
    color:var(--text-onink-soft);
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.12em;
    font-family:"Segoe UI",sans-serif;
    flex:1;
  }
  /* De hele groepskop (niet alleen het pijltje) is klikbaar om in/uit te klappen — zie issue #4.
     Het "+"-knopje zelf blijft zijn eigen (andere) actie houden, zie wireGroupHeadCollapse(). */
  .tab-group-head.collapsible{ cursor:pointer; }
  .tab-group-head.collapsible:hover .tab-group-label{ color:var(--gold-bright); }
  /* Basisdata: zelfde kop-uiterlijk als Maandbudgetten/Jaren/Groei, maar als knop die direct naar
     de pagina navigeert — geen pijltje, geen dropdown (zie issue #5). */
  .tab-group-head-direct{
    width:100%;
    background:transparent;
    border:none;
    cursor:pointer;
    text-align:left;
    font-family:inherit;
  }
  .tab-group-head-direct:hover .tab-group-label{ color:var(--gold-bright); }
  .tab-group-head-direct.active .tab-group-label{ color:var(--gold-bright); }
  /* group-add-btn ("+") en group-collapse-btn (pijltje) zijn de twee ronde icoonknopjes in een
     groepskop — bewust exact dezelfde breedte/hoogte/vormgeving (zie issue #4), zodat ze als een
     nette, bij elkaar horende set ogen in plaats van twee net iets andere knopjes. */
  .group-add-btn,
  .group-collapse-btn{
    width:20px;
    height:20px;
    border-radius:50%;
    border:1px solid color-mix(in srgb, var(--text-onink) 25%, transparent);
    background:transparent;
    color:var(--text-onink-soft);
    font-size:13px;
    line-height:1;
    padding:0;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .group-add-btn:hover,
  .group-collapse-btn:hover{
    border-color:var(--gold);
    color:var(--gold-bright);
    background:color-mix(in srgb, var(--gold) 12%, transparent);
  }
  .group-collapse-btn svg{
    width:12px;
    height:12px;
    transition:transform .15s ease;
  }
  .group-collapse-btn.collapsed svg{ transform:rotate(-90deg); }
  /* Rij met een maandtab plus een klein verwijder-knopje ernaast (zie renderTabs) — de tab zelf
     blijft de volle breedte innemen (net als voorheen), het kruisje staat er los naast, in dezelfde
     ronde-icoonknop-stijl als group-add-btn/group-collapse-btn hierboven, alleen rood bij hover
     zodat meteen duidelijk is dat het een verwijderactie is. */
  .tab-row{
    display:flex;
    align-items:center;
    gap:2px;
  }
  .tab-row .tab{ flex:1 1 auto; min-width:0; }
  .tab-delete-btn{
    width:20px;
    height:20px;
    border-radius:50%;
    border:1px solid color-mix(in srgb, var(--text-onink) 25%, transparent);
    background:transparent;
    color:var(--text-onink-soft);
    font-size:14px;
    line-height:1;
    padding:0;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    margin-right:8px;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .tab-delete-btn:hover{
    border-color:var(--debit);
    color:var(--debit);
    background:color-mix(in srgb, var(--debit) 12%, transparent);
  }
  /* Maandbudgetten + Jaren staan samen in deze wrapper. Op een smal scherm (het gebruikelijke
     geval, en altijd onder de 760px-drempel hieronder) gedraagt hij zich als een gewone
     .tab-group-kolom: gestapeld onder elkaar, identiek aan hoe het er al uitzag vóór deze
     wijziging. Pas vanaf voldoende breedte (er is toch ruime lege ruimte rechts van het menu op
     een breed scherm) gaan de twee lijstjes naast elkaar staan. */
  /* Geen streepje meer tussen Maandbudgetten en Jaren (issue #7) — ze horen inhoudelijk bij
     elkaar (vandaar ook de gedeelde "pair"-wrapper), dus alleen witruimte, geen lijn. Die
     witruimte komt nu — net als bij `.tabs` hierboven — uit één simpele `gap`, zodat 'm altijd
     precies hetzelfde is, ongeacht in-/uitgeklapte staat of aantal items (issue #8). */
  .tab-group-pair{
    display:flex;
    flex-direction:column;
    gap:20px;
  }
  @media (min-width:760px){
    .tabs{ max-width:640px; }
    .tab-group-pair{
      flex-direction:row;
      align-items:flex-start;
      gap:28px;
    }
    .tab-group-pair > .tab-group{
      flex:1 1 0;
      min-width:0;
    }
  }
  .tab{
    display:flex;
    align-items:center;
    text-align:left;
    background:transparent;
    border:none;
    border-left:3px solid transparent;
    color:var(--text-onink-soft);
    font-family:Georgia,serif;
    font-size:14px;
    padding:10px 14px;
    cursor:pointer;
    transition:color .15s ease, border-color .15s ease, background .15s ease;
    white-space:nowrap;
  }
  .tab:hover{color:var(--text-onink); background:color-mix(in srgb, var(--text-onink) 4%, transparent);}
  .tab.active{
    color:var(--gold-bright);
    border-left-color:var(--gold);
    background:color-mix(in srgb, var(--gold) 8%, transparent);
  }
  .tab .tab-idx{
    opacity:.6;
    font-size:11px;
    margin-right:6px;
  }
  .tab-upload{
    border:1px dashed color-mix(in srgb, var(--text-onink) 30%, transparent);
    border-radius:3px;
    color:var(--gold-bright);
    font-family:"Segoe UI",sans-serif;
    font-size:12.5px;
    justify-content:center;
  }
  .tab-upload:hover{background:color-mix(in srgb, var(--gold) 8%, transparent); border-color:var(--gold);}
  /* Herordenbare tabs (zie enableLongPressReorder): "grab"-cursor als signaal dat ingedrukt houden
     iets doet, en een duidelijk "opgetild"-effect zodra het slepen daadwerkelijk is gestart. */
  .tab-draggable{cursor:grab;}
  .tab-dragging{
    cursor:grabbing;
    opacity:.6;
    background:color-mix(in srgb, var(--gold) 14%, transparent);
    box-shadow:0 3px 10px rgba(0,0,0,.3);
    position:relative;
    z-index:5;
  }
  /* CSV- en PDF-uploadknop samen: op smal scherm (het gebruikelijke geval) gewoon onder elkaar,
     precies zoals hiervoor. Pas vanaf dezelfde 760px-drempel als de Maandbudgetten/Jaren-pair
     hierboven gaan ze naast elkaar staan — er is dan toch ruimte over. */
  .upload-row{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  @media (min-width:760px){
    .upload-row{
      flex-direction:row;
    }
    .upload-row > .tab-upload{
      flex:1 1 0;
      min-width:0;
    }
  }

  /* Layout */
  .layout{
    display:grid;
    grid-template-columns:1fr 380px;
    gap:0;
    align-items:start;
  }
  @media (max-width:980px){
    .layout{grid-template-columns:1fr;}
    aside.summary{
      position:static;
      min-height:0;
      border-left:none;
      border-top:1px solid color-mix(in srgb, var(--text-onink) 8%, transparent);
    }
  }

  main.categories{
    padding:28px 24px 60px 32px;
  }
  @media (max-width:640px){
    header{padding:20px 18px 16px;}
    main.categories{padding:18px 14px 36px;}
    aside.summary{padding:20px 16px 32px;}
    .card-head{padding:9px 14px 7px;}
    .rows{padding:2px 14px 8px;}
    .row .value-input{width:78px;}
  }

  .card{
    /* Was eerder een vast om-de-30px herhalend lijnenpatroon op de achtergrond (alsof het
       geliniëerd papier was) — dat leek in eerste opzicht op een nette tabel, maar zodra ergens
       een rij een extra notitieregel had (zoals bij UN-Gas+elec) klopte de 30px-aanname niet meer
       en liepen alle lijntjes daaronder blijvend uit de pas met de échte tekst (vandaar dat
       bijvoorbeeld "Sparen kids" en "Alimentatie" niet meer netjes tussen de lijntjes stonden).
       Nu een échte rand ONDER elke rij zelf (zie .row hieronder) — die volgt altijd automatisch
       de werkelijke hoogte van de inhoud, ook als een rij een notitieregel erbij krijgt. */
    background:var(--paper);
    border:1px solid var(--rule);
    border-radius:2px;
    margin-bottom:20px;
    box-shadow:0 1px 0 rgba(0,0,0,.04);
  }
  .card-overig{
    border:1px dashed var(--debit);
  }
  .card-overig .card-head{
    background:color-mix(in srgb, var(--debit) 9%, transparent);
  }
  .card-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 18px 8px;
    border-bottom:1px solid var(--rule);
    background:var(--paper-2);
  }
  .card-head .htitle{
    display:flex;
    align-items:center;
    gap:9px;
    color:var(--forest);
    min-width:0;
  }
  .card-head h2{
    font-size:15px;
    color:inherit;
    letter-spacing:.01em;
  }
  .cat-icon{
    width:17px;
    height:17px;
    flex-shrink:0;
    opacity:.9;
  }
  .card-head .cat-total{
    font-size:15px;
    font-weight:700;
    color:var(--text);
  }
  .card-note{
    padding:0 18px 8px;
    font-size:11.5px;
    color:var(--text-soft);
    font-style:italic;
  }
  .card-review{
    border:1px dashed var(--gold);
  }
  .card-review .card-head{
    background:color-mix(in srgb, var(--gold) 8%, transparent);
  }
  .review-bulk-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    padding:0 18px 10px;
  }
  .review-selectall-label{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    color:var(--text-soft);
    cursor:pointer;
    user-select:none;
  }
  .review-add-selected-btn{
    flex-shrink:0;
  }
  .review-add-selected-btn:disabled,
  .review-selectall-label input:disabled{
    opacity:.5;
    cursor:default;
  }
  .review-row-check{
    flex-shrink:0;
    width:15px;
    height:15px;
    cursor:pointer;
  }
  .review-row-check:disabled{cursor:default; opacity:.5;}
  .review-rows{padding:2px 18px 12px;}
  .review-row{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    padding:7px 0;
    border-bottom:1px dashed var(--rule);
  }
  .review-row:last-child{border-bottom:none;}
  .review-subtotal-row{
    border-top:1px solid var(--rule);
    border-bottom:none;
    padding-top:9px;
    margin-top:2px;
    font-weight:600;
  }
  .review-subtotal-row .review-name{flex:1 1 auto; white-space:normal; overflow:visible;}
  .review-subtotal-row .review-amt{width:auto;}
  .review-name{
    flex:1 1 140px;
    min-width:0;
    font-size:13px;
    color:var(--text);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .review-amt{
    width:88px;
    text-align:right;
    font-size:13px;
    flex-shrink:0;
  }
  .review-amt.pos{color:var(--credit);}
  .review-amt.neg{color:var(--debit);}
  .review-select{
    font-family:"Segoe UI",sans-serif;
    font-size:12px;
    padding:4px 5px;
    border:1px solid var(--rule);
    border-radius:3px;
    background:var(--paper);
    color:var(--text);
    flex-shrink:0;
  }
  .review-select:disabled{opacity:.6;}
  .review-btn{
    background:transparent;
    border:1px solid var(--forest);
    color:var(--forest);
    font-size:11.5px;
    padding:5px 12px;
    border-radius:3px;
    cursor:pointer;
    font-family:"Segoe UI",sans-serif;
    flex-shrink:0;
  }
  .review-btn:hover{background:color-mix(in srgb, var(--forest) 8%, transparent);}
  .review-btn.added{border-color:var(--debit); color:var(--debit);}
  .review-btn.added:hover{background:color-mix(in srgb, var(--debit) 8%, transparent);}
  .review-btn:disabled{opacity:.5; cursor:default;}
  .review-btn:disabled:hover{background:transparent;}
  .rows{padding:2px 18px 10px;}
  .row{
    display:flex;
    align-items:center;
    gap:10px;
    min-height:30px;
    padding:0;
    border-bottom:1px solid var(--rule);
  }
  .row .label-input{
    flex:1;
    min-width:0;
    border:none;
    background:transparent;
    font-family:inherit;
    font-size:13.5px;
    color:var(--text);
    padding:4px 2px;
  }
  .row .label-input:focus{outline:none; background:color-mix(in srgb, var(--gold) 8%, transparent);}
  .row .value-wrap{
    display:flex;
    align-items:center;
    gap:2px;
    flex-shrink:0;
  }
  .row .value-wrap span.euro{color:var(--text-soft); font-size:12.5px;}
  .row .value-input{
    width:92px;
    text-align:right;
    border:none;
    border-bottom:1px solid transparent;
    background:transparent;
    font-family:"Courier New",Consolas,monospace;
    font-size:13.5px;
    padding:4px 2px;
    color:var(--text);
  }
  .row .value-input:focus{outline:none; border-bottom-color:var(--gold);}
  .row .value-input:disabled{color:var(--forest); font-weight:700; -webkit-text-fill-color:var(--forest);}

  /* Loonsverhoging-blok (jaarpagina's): apart, net "tabelletje" met duidelijke rand en een
     streepje tussen de twee regels, in plaats van los zwevende tekst. Geen onderstreepje meer
     onder de invulvelden zelf (op eigen verzoek weggehaald) — de +/- stappers en het kader om het
     hele blokje maken al voldoende duidelijk dat het om invoervelden gaat. */
  .verhogingen-rows{
    margin:0 18px 4px;
    padding:2px 14px;
    border:1px solid var(--rule);
    border-radius:6px;
    background:color-mix(in srgb, var(--paper-2) 70%, transparent);
  }
  .verhogingen-rows .row{border-bottom:1px dashed var(--rule);}
  .verhogingen-rows .row:last-child{border-bottom:none;}
  .verhogingen-rows .value-input{border-bottom-color:transparent !important;}

  /* +/- stappers vóór het percentagecijfer — vervangt de onzichtbare-op-mobiel pijltjes van
     een gewoon number-invoerveld door twee echte, goed aantikbare knoppen. */
  .stepper-btns{
    display:flex;
    align-self:stretch;
    flex-shrink:0;
    gap:1px;
    margin-right:6px;
  }
  .step-btn{
    width:30px;
    align-self:stretch;
    border:1px solid var(--rule);
    background:var(--paper);
    color:var(--text-soft);
    font-size:16px;
    line-height:1;
    cursor:pointer;
    font-family:"Segoe UI",sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
  }
  .step-btn:first-child{border-radius:4px 0 0 4px;}
  .step-btn:last-child{border-radius:0 4px 4px 0; border-left:none;}
  .step-btn:hover{background:color-mix(in srgb, var(--gold) 10%, transparent); color:var(--gold-bright); border-color:var(--gold);}
  .step-btn:active{background:color-mix(in srgb, var(--gold) 20%, transparent);}
  .pct-stepper{align-self:stretch;}
  .pct-stepper .value-input{width:56px; text-align:center;}
  /* Native op/neer-pijltjes van het getalveld verbergen — die zijn sowieso onbruikbaar op
     mobiel/touch, en nu hebben we er eigen, altijd zichtbare/aantikbare knoppen voor. */
  .value-input::-webkit-outer-spin-button,
  .value-input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  .value-input[type="number"]{-moz-appearance:textfield;}
  .row .del-btn{
    background:none;
    border:none;
    color:var(--rule);
    cursor:pointer;
    font-size:18px;
    line-height:1;
    padding:2px 6px;
    opacity:.4;
    flex-shrink:0;
  }
  .row:hover .del-btn, .row .del-btn:focus{opacity:1; color:var(--debit);}
  .add-row-btn{
    background:none;
    border:none;
    color:var(--forest);
    font-size:12.5px;
    cursor:pointer;
    padding:6px 2px;
    font-family:"Segoe UI",sans-serif;
  }
  .add-row-btn:hover{text-decoration:underline;}

  /* Een rij met een notitie (bijv. UN-Gas+elec) draagt zelf geen onderrand — die staat in plaats
     daarvan onder de notitie, zodat rij + notitie visueel bij elkaar blijven horen. */
  .row:has(+ .row-note){border-bottom:none;}
  .row-note{
    font-size:11px;
    color:var(--text-soft);
    font-style:italic;
    padding:0 2px 8px;
    margin-top:-4px;
    border-bottom:1px solid var(--rule);
  }

  .toggle-row{
    margin:-10px 0 20px;
    padding:0 4px;
  }
  .toggle-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12.5px;
    color:var(--text-soft);
    font-family:"Segoe UI",sans-serif;
    cursor:pointer;
  }
  .toggle-label input[type="checkbox"]{
    accent-color:var(--gold);
    width:14px;
    height:14px;
    cursor:pointer;
    flex-shrink:0;
  }

  .row .label-input:disabled{color:var(--text-soft); opacity:1;}
  .verhogingen-info{
    padding:2px 18px 14px;
    font-size:12.5px;
    color:var(--text-soft);
    display:flex;
    flex-direction:column;
    gap:3px;
    border-top:1px dashed var(--rule);
    margin-top:4px;
    padding-top:8px;
  }
  .verhogingen-info .mono{color:var(--forest); font-weight:700;}

  /* Summary panel */
  aside.summary{
    position:sticky;
    top:0;
    background:var(--ink);
    color:var(--text-onink);
    padding:28px 24px 40px;
    min-height:100vh;
    border-left:1px solid color-mix(in srgb, var(--text-onink) 8%, transparent);
  }
  aside.summary h2{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.12em;
    color:var(--text-onink-soft);
    margin-bottom:16px;
    font-family:"Segoe UI",sans-serif;
  }
  .stamp{
    border:2px solid var(--gold);
    border-radius:4px;
    padding:16px 18px;
    margin-bottom:22px;
    transform:rotate(-0.4deg);
  }
  /* Twee stamps (werkelijk + begroot) samen: gewoon flex-wrap, geen harde breedte-drempel nodig —
     zo staan ze vanzelf naast elkaar zodra er ruimte is (bv. op een breed scherm, of zodra de
     sidebar op smal scherm onder de hoofdinhoud terechtkomt en zo weer breder wordt) en anders
     gewoon onder elkaar, precies zoals bij de andere responsive stukjes in deze app. */
  .stamp-row{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:22px;
  }
  .stamp-row .stamp{
    flex:1 1 150px;
    min-width:150px;
    margin-bottom:0;
  }
  .stamp.negative{border-color:var(--debit);}
  .stamp .stamp-label{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold-bright);
    margin-bottom:4px;
  }
  .stamp.negative .stamp-label{color:#e08376;}
  .stamp .stamp-value{
    font-size:clamp(24px, 7vw, 32px);
    font-family:"Courier New",Consolas,monospace;
    font-weight:700;
    color:var(--gold-bright);
  }
  .stamp.negative .stamp-value{color:#e08376;}
  .stamp .stamp-sub{
    font-size:11.5px;
    color:var(--text-onink-soft);
    margin-top:4px;
  }

  .summary-line{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:6px 0;
    border-bottom:1px solid color-mix(in srgb, var(--text-onink) 8%, transparent);
    font-size:13.5px;
  }
  .summary-line .l{color:var(--text-onink-soft);}
  .summary-line .v{font-family:"Courier New",Consolas,monospace;}
  .summary-line.credit .v{color:#7fd6ae;}
  .summary-line.debit .v{color:#ef9a8c;}
  .summary-line.total{
    border-bottom:none;
    border-top:1px solid color-mix(in srgb, var(--text-onink) 20%, transparent);
    margin-top:4px;
    padding-top:10px;
    font-size:15px;
    font-weight:700;
  }

  .source-note{
    font-size:11px;
    color:var(--text-onink-soft);
    margin:-14px 0 18px;
  }

  .chart-block{margin-top:26px;}
  .chart-block h2{margin-bottom:10px;}
  .chart-block svg{max-width:100%; height:auto; display:block;}

  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:10px;
    font-size:11px;
    color:var(--text-onink-soft);
  }
  .legend span.dot{
    display:inline-block;
    width:8px;height:8px;
    border-radius:50%;
    margin-right:5px;
  }
  .legend span.line-swatch{
    display:inline-block;
    width:14px;height:2px;
    border-radius:1px;
    margin-right:5px;
    vertical-align:middle;
  }

  /* Loonstijging: gegevenstabel */
  .table-wrap{overflow-x:auto; padding:2px 0 12px;}
  .loonstijging-table{width:100%; border-collapse:collapse; font-size:11.5px; white-space:nowrap;}
  .loonstijging-table th{
    text-align:right; padding:7px 12px 6px; color:var(--text-soft);
    font-weight:600; font-size:10.5px; letter-spacing:.01em;
    border-bottom:1px solid var(--rule);
  }
  .loonstijging-table th:first-child, .loonstijging-table td:first-child{text-align:left;}
  .loonstijging-table td{
    text-align:right; padding:6px 12px;
    border-bottom:1px solid rgba(216,205,180,.6);
  }
  .loonstijging-table td.strong{font-weight:700; color:var(--forest);}
  .loonstijging-table tbody tr:hover{background:color-mix(in srgb, var(--gold) 7%, transparent);}
  .loonstijging-table tr.synced-row{background:color-mix(in srgb, var(--credit) 8%, transparent);}
  .loonstijging-table tr.synced-row:hover{background:color-mix(in srgb, var(--credit) 14%, transparent);}
  .synced-dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--credit); vertical-align:middle; margin-left:2px;}
  /* Jaartal van een gekoppelde (groen-bolletje) rij is een echte knop geworden — springt direct
     naar dat jaar-tabblad, zonder de omweg via het menu. Oogt verder als gewone tekst totdat je
     eroverheen hovert, zodat de tabel niet ineens vol "knoppen" oogt. */
  .jaar-link{
    font: inherit;
    color: inherit;
    background: none;
    border: none;
    padding: 0;
    margin: 0;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 2px;
  }
  .jaar-link:hover{ color: var(--gold-bright); text-decoration: underline; }
  .jaar-link:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 2px; }

  /* Loonstijging: lijngrafiek met hover-crosshair + tooltip */
  .lchart-wrap{
    position:relative;
    /* Ruimte reserveren bovenaan speciaal voor het tooltipje, zodat het nooit over de bolletjes
       of hun klikbare cirkel heen kan vallen — het tooltipje (top:0, hieronder) staat altijd in
       deze strook, los van de grafiek zelf die daaronder begint. */
    padding-top:76px;
  }
  .lchart-tooltip{
    position:absolute;
    pointer-events:none;
    background:color-mix(in srgb, var(--ink) 96%, transparent);
    border:1px solid color-mix(in srgb, var(--text-onink) 15%, transparent);
    border-radius:4px;
    padding:8px 10px;
    font-family:"Segoe UI",sans-serif;
    font-size:11px;
    color:var(--text-onink-soft);
    white-space:nowrap;
    opacity:0;
    transition:opacity .1s;
    z-index:5;
  }
  .lchart-tooltip.visible{opacity:1;}
  .lchart-tooltip .tt-year{font-weight:700; color:var(--text-onink); margin-bottom:5px; font-size:12px;}
  .lchart-tooltip .tt-row{display:flex; align-items:center; gap:6px; margin-top:3px;}
  .lchart-tooltip .tt-key{width:12px; height:2px; border-radius:1px; flex-shrink:0;}
  .lchart-tooltip .tt-val{font-weight:700; color:var(--text-onink); font-family:"Courier New",monospace; font-size:11.5px;}
  .lchart-tooltip .tt-label{color:var(--text-onink-soft);}

  .actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:26px;
  }
  .actions button{
    flex:1 1 100px;
    background:transparent;
    border:1px solid color-mix(in srgb, var(--text-onink) 25%, transparent);
    color:var(--text-onink-soft);
    padding:8px 10px;
    font-size:12px;
    border-radius:3px;
    cursor:pointer;
    font-family:"Segoe UI",sans-serif;
  }
  .actions button:hover{border-color:var(--gold); color:var(--gold-bright);}
  .actions button.danger:hover{border-color:var(--debit); color:#e08376;}
  .actions button.primary{background:var(--gold); border-color:var(--gold); color:var(--ink);}
  .actions button.primary:hover{background:var(--gold-bright); border-color:var(--gold-bright); color:var(--ink);}
  .actions button:disabled{opacity:.6; cursor:default;}

  /* Login/versleutelings-overlay — staat bovenop alles totdat je bent ingelogd én je
     versleutelingswachtwoord hebt ingevoerd. */
  .auth-gate{
    position:fixed; inset:0; z-index:1000;
    display:flex; align-items:center; justify-content:center;
    background:var(--paper-2);
    padding:20px;
  }
  .auth-gate-box{
    width:100%; max-width:360px;
    background:var(--paper);
    border:1px solid var(--rule);
    border-radius:8px;
    padding:28px 26px;
    box-shadow:0 8px 30px rgba(0,0,0,.12);
    display:flex; flex-direction:column; gap:12px;
  }
  .auth-gate-title{font-size:22px; font-weight:700; color:var(--forest); margin-bottom:2px;}
  .auth-gate-title2{font-size:15px; font-weight:700; color:var(--text);}
  .auth-gate-subtitle{font-size:12.5px; color:var(--text-soft); line-height:1.5; margin:0 0 6px;}
  .auth-gate-box label{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--text-soft);}
  .auth-gate-box input{
    font-family:inherit; font-size:14px; padding:8px 10px;
    border:1px solid var(--rule); border-radius:4px; background:var(--paper); color:var(--text);
  }
  .auth-gate-box input:focus{outline:none; border-color:var(--gold);}
  .auth-gate-box button{
    font-family:"Segoe UI",sans-serif; font-size:13.5px; padding:9px 12px;
    border-radius:4px; border:1px solid var(--rule); background:transparent; color:var(--text);
    cursor:pointer;
  }
  .auth-gate-box button.primary{background:var(--forest); border-color:var(--forest); color:#fff;}
  .auth-gate-box button.primary:hover{opacity:.9;}
  .auth-gate-box button.ghost{background:transparent; color:var(--text-soft); border-color:transparent; font-size:12px;}
  .auth-gate-box button.ghost:hover{text-decoration:underline;}
  .auth-gate-box button:disabled{opacity:.6; cursor:default;}
  .auth-gate-error{font-size:12px; color:var(--debit); background:color-mix(in srgb, var(--debit) 12%, transparent); border-radius:4px; padding:8px 10px;}
  .auth-gate-notice{font-size:12px; color:var(--forest); background:color-mix(in srgb, var(--forest) 12%, transparent); border-radius:4px; padding:8px 10px;}

  .save-status{
    margin-top:10px;
    font-size:11px;
    color:var(--text-onink-soft);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .save-status .dot{
    display:inline-block;
    width:7px;height:7px;
    border-radius:50%;
    background:var(--text-onink-soft);
    flex-shrink:0;
  }
  .save-status.on .dot{background:#7fd6ae;}
  .save-status.error{color:#ef9a8c;}
  .save-status.error .dot{background:#ef9a8c;}

  /* Maandbudget-vergelijking (CSV vs. gekozen maandbudget) */
  .compare-picker{padding:2px 18px 14px;}
  .apply-to-budget-row{padding:0 18px 14px;}
  .apply-to-budget-row .review-btn{margin-right:8px;}
  .apply-to-budget-note{padding:8px 0 0; margin:0;}
  .compare-picker select{
    font-family:"Segoe UI",sans-serif;
    font-size:13px;
    padding:6px 8px;
    border:1px solid var(--rule);
    border-radius:3px;
    background:var(--paper);
    color:var(--text);
  }
  .compare-head-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:4px 18px 6px;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--text-soft);
    font-family:"Segoe UI",sans-serif;
  }
  .compare-head-row .compare-name{flex:1 1 120px;}
  .compare-head-row .compare-col{width:78px; text-align:right; flex-shrink:0;}
  .compare-rows{padding:2px 18px 10px;}
  .compare-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:6px 0;
    border-bottom:1px dashed var(--rule);
    font-size:13px;
  }
  .compare-row:last-child{border-bottom:none;}
  .compare-row .compare-name{
    flex:1 1 120px;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .compare-row .compare-col{width:78px; text-align:right; flex-shrink:0;}
  .compare-row.compare-total{
    font-weight:700;
    border-top:1px solid var(--rule);
    border-bottom:none;
    padding-top:8px;
    margin-top:2px;
  }
  .compare-diff.good{color:var(--credit);}
  .compare-diff.bad{color:var(--debit);}

</style>
</head>

/* Elk scenario/jaar heeft z'n eigen volledig onafhankelijke inkomsten/vaste lasten/abonnementen/
   variabele lasten (geen gedeelde data meer tussen scenario's). Basisdata (2026), 2027 en 2028
   zijn "locked" (niet verwijderbaar); alles wat via de knop
   "+ Nieuw jaar" wordt aangemaakt komt erachter en is wel verwijderbaar. */
function cloneItems(items){
  return items.map(it => ({ l: it.l, v: it.v }));
}
function makeScenario(label, jaar, locked, incomeItems, vasteLastenItems, abonnementenItems, variabeleLastenItems, loonstijging){
  return {
    label, jaar, locked,
    income: { items: cloneItems(incomeItems) },
    vasteLasten: { items: cloneItems(vasteLastenItems) },
    abonnementen: { items: cloneItems(abonnementenItems) },
    variabeleLasten: { items: cloneItems(variabeleLastenItems) },
    // Alleen voor niet-Basisdata jaren: eigen loonsverhoging-blok van dát jaar
    // (vast bedrag + percentage), werkt door op het loon van dát jaar t.o.v. het jaar ervoor.
    loonstijging: loonstijging ? { vast: loonstijging.vast, pct: loonstijging.pct } : null,
  };
}

/* ---------- MAANDBUDGET ---------- */
/* Een "maandbudget" is een losse, bevroren momentopname van de op dat moment actuele
   Basisdata-waarden (inkomsten + alle kosten, per regel). Eenmaal aangemaakt verandert hij niet
   meer mee met latere wijzigingen in Basisdata — een volgende momentopname pakt wél weer de dan
   actuele waarden. Wordt gebruikt om een geüploade maand-CSV tegen te vergelijken (zie 3.3). */
function makeBudget(title, source){
  return {
    id: "b" + Date.now() + "_" + Math.floor(Math.random()*10000),
    title,
    createdAt: Date.now(),
    income: { items: cloneItems(source.income.items) },
    vasteLasten: { items: cloneItems(source.vasteLasten.items) },
    abonnementen: { items: cloneItems(source.abonnementen.items) },
    variabeleLasten: { items: cloneItems(source.variabeleLasten.items) },
    // Eigen, los instelbaar vinkje (zie renderWarmtefondsToggleForBudget) — neemt bij aanmaken de
    // huidige Basisdata-stand over, maar wijzigt daarna niet meer mee met Basisdata (bevroren snapshot).
    warmtefondsAftrek: state.warmtefondsAftrek,
    // Terugboekingen die de gebruiker via "Openstaande terugboekingen" bewust aan dit specifieke
    // maandbudget toevoegt (zie renderStornoReviewCard) — een los blok, niet vermengd met de
    // "normale" vaste-lasten-post, zodat altijd zichtbaar blijft dát het om een terugboeking gaat.
    outstanding: { items: [] },
  };
}
function createBudget(){
  const bd = basisdataScenario();
  const now = new Date();
  const defaultTitle = `${t("months")[now.getMonth()]} ${now.getFullYear()}`;
  const budget = makeBudget(defaultTitle, bd);
  state.budgets.unshift(budget); // nieuwste bovenaan
  state.activeView = { type:"budget", id: budget.id };
  renderAll();
}
function budgetObjFromView(){
  if(state.activeView.type !== "budget") return null;
  return state.budgets.find(b=>b.id===state.activeView.id) || null;
}

/* "Deze maand toepassen op het gekoppelde maandbudget" — kopieert de werkelijke, herkende
   (en via "Nog in te delen" ingedeelde) bedragen van een geïmporteerde maand naar de line-items
   van het gekoppelde maandbudget: bestaande regels (zelfde label) worden overschreven met het
   echte bedrag, nieuwe labels die nog niet in het budget stonden worden er als nieuwe regel aan
   toegevoegd. Zo kan een maandbudget van "gepland" naar "wat er werkelijk gebeurd is" gebracht
   worden, in plaats van dat de vergelijking alleen ernaast blijft staan. Raakt bewust niet aan
   "outstanding" (dat loopt al rechtstreeks via renderStornoReviewCard) en is idempotent: opnieuw
   toepassen na het indelen van meer "Nog in te delen"-posten werkt gewoon opnieuw bij. */
function applyMonthToBudget(m, budget){
  // Bewaar een momentopname van het budget van vóór het overschrijven, op de MAAND zelf — zodat
  // "Toepassen" met één druk op de knop ongedaan gemaakt kan worden (zie
  // reverseApplyMonthToBudget/renderBudgetPickerCard). Bewust maar één stap terug, net als de
  // Toevoegen/Ongedaan-maken-toggle elders in de app: een nieuwe keer "Toepassen" overschrijft deze
  // momentopname gewoon weer met de daaraan voorafgaande stand.
  m.appliedToBudget = {
    budgetId: budget.id,
    snapshot: {
      income: cloneItems(budget.income.items),
      vasteLasten: cloneItems(budget.vasteLasten.items),
      abonnementen: cloneItems(budget.abonnementen.items),
      variabeleLasten: cloneItems(budget.variabeleLasten.items),
    },
  };
  const cats = ["income","vasteLasten","abonnementen","variabeleLasten"];
  cats.forEach(cat=>{
    m[cat].items.forEach(item=>{
      const key = item.l.trim().toLowerCase();
      const existing = budget[cat].items.find(it => it.l.trim().toLowerCase() === key);
      if(existing){
        existing.v = item.v;
      } else {
        budget[cat].items.push({ l: item.l, v: item.v });
      }
    });
  });
}

/* Zet een eerdere applyMonthToBudget() terug via de op de maand bewaarde momentopname — vervangt
   de vier categorieën van het budget één-op-één door de stand van vóór het toepassen (dus ook
   nieuw-toegevoegde regels verdwijnen weer, niet alleen overschreven waarden worden hersteld). */
function reverseApplyMonthToBudget(m){
  if(!m.appliedToBudget) return;
  const budget = state.budgets.find(b => b.id === m.appliedToBudget.budgetId);
  if(budget){
    const snap = m.appliedToBudget.snapshot;
    budget.income.items = cloneItems(snap.income);
    budget.vasteLasten.items = cloneItems(snap.vasteLasten);
    budget.abonnementen.items = cloneItems(snap.abonnementen);
    budget.variabeleLasten.items = cloneItems(snap.variabeleLasten);
  }
  m.appliedToBudget = null;
}

/* Migratie voor oudere opgeslagen bestanden (vóór de onafhankelijke jaren): als het geladen bestand
   nog de oude platte state.income/vasteLasten/abonnementen/variabeleLasten heeft, zet dat om naar
   het nieuwe model zodat oude opslagbestanden/exports bruikbaar blijven. */
function migrateState(){
  if(!state.scenarios || !state.scenarios.length) return;
  const legacy = state.income && state.vasteLasten && state.abonnementen && state.variabeleLasten;
  if(legacy && !state.scenarios[0].income){
    state.scenarios = state.scenarios.map((s,i) => makeScenario(
      s.label, s.jaar || (2026+i), s.locked !== undefined ? s.locked : i < 3,
      state.income.items, state.vasteLasten.items, state.abonnementen.items, state.variabeleLasten.items
    ));
    delete state.income; delete state.vasteLasten; delete state.abonnementen; delete state.variabeleLasten;
  }
  state.scenarios.forEach((s,i) => {
    if(s.jaar === undefined) s.jaar = 2026 + i;
    if(s.locked === undefined) s.locked = i < 3;
  });
  // Migratie naar per-jaar loonsverhoging-blokken: oudere opslagbestanden kennen dit veld nog niet.
  // Voor elk niet-Basisdata jaar zonder "loonstijging" wordt een blok afgeleid dat het al opgeslagen
  // loon exact reproduceert (vast bedrag = loon − loon vorig jaar, 0%), zodat bestaande cijfers bij
  // het laden niet stilzwijgend veranderen. Vanaf dat moment is het blok gewoon los aanpasbaar.
  state.scenarios.forEach((s,i) => {
    if(i === 0){ s.loonstijging = null; return; }
    if(s.loonstijging) return;
    const prev = state.scenarios[i-1];
    const huidigLoon = baseLoonRaw(s);
    const vorigLoon = baseLoonRaw(prev);
    s.loonstijging = { vast: Math.round((huidigLoon - vorigLoon) * 100) / 100, pct: 0 };
  });
  if(!state.verhogingen) state.verhogingen = undefined; // oud globaal blok wordt niet meer gebruikt
  if(!state.budgets) state.budgets = [];
  if(state.darkMode === undefined) state.darkMode = false;
  // Oudere opslagbestanden kennen "budgetId" op een maand nog niet, of hadden nog geen maandbudget
  // toen de maand werd geüpload. Koppel in dat geval automatisch aan het nieuwste maandbudget (als
  // die er inmiddels is) zodat de vergelijking meteen iets zinvols toont; de gebruiker kan dit
  // altijd nog wijzigen via de kiezer boven de vergelijking.
  state.months.forEach(m=>{
    if(m.budgetId === undefined) m.budgetId = state.budgets.length ? state.budgets[0].id : null;
    if(!m.openTerugboekingen) m.openTerugboekingen = [];
    // Oudere opslagbestanden kennen "selected" op een nog-in-te-delen post nog niet. Issue #11:
    // standaard NIET aangevinkt, zodat er nooit stilzwijgend iets wordt meegenomen door de
    // "Selecteer alles/Toevoegen geselecteerde"-bulk-actie zonder dat de gebruiker dat zelf koos.
    if(m.review) m.review.forEach(entry=>{ if(entry.selected === undefined) entry.selected = false; });
    // Idem voor openstaande terugboekingen: "budgetId" (het maandbudget waarnaar deze specifieke
    // rij toegevoegd moet worden) verving de oude categorie-keuze — bestaande, nog niet toegevoegde
    // rijen krijgen standaard geen koppeling (de gebruiker kiest 'm zelf via de nieuwe dropdown).
    if(m.openTerugboekingen) m.openTerugboekingen.forEach(entry=>{ if(entry.budgetId === undefined) entry.budgetId = null; });
    // Issue #10: FinBo's eigen naamgevingsconventie voor imports ("JJJJ-CSV-MM"/"JJJJ-PDF-MM")
    // i.p.v. de rauwe bankbestandsnaam — met terugwerkende kracht ook toegepast op maanden die al
    // vóór deze wijziging waren geïmporteerd en dus nog de oude naam als sourceFile hebben staan.
    const IMPORT_NAME_RE = /^\d{4}-(CSV|PDF)-\d{2}$/;
    if(m.sourceFile && !IMPORT_NAME_RE.test(m.sourceFile)){
      const type = inferLegacyImportType(m.sourceFile);
      m.sourceType = type;
      m.sourceFile = formatImportName(m.year, m.monthIndex, type);
    } else if(m.sourceFile && !m.sourceType){
      m.sourceType = IMPORT_NAME_RE.exec(m.sourceFile)[1];
    }
  });
  // Oudere maandbudgetten kennen het eigen warmtefonds-vinkje nog niet. Standaard uit, zodat
  // hun al opgeslagen/getoonde totalen niet stilzwijgend veranderen bij het laden.
  state.budgets.forEach(b=>{
    if(b.warmtefondsAftrek === undefined) b.warmtefondsAftrek = false;
    // Nieuw blok voor terugboekingen die de gebruiker bewust als kostenpost aan dít maandbudget
    // toevoegt (zie renderStornoReviewCard) — oudere maandbudgetten krijgen 'm hier alsnog bij.
    if(!b.outstanding) b.outstanding = { items: [] };
  });
  // De maandelijkse Rabobank-rekeningkosten (Rabo Standaard, ~€3,60) ontbraken tot nu toe als
  // los abonnement — met terugwerkende kracht toegevoegd aan Basisdata én aan alle al bestaande
  // maandbudgetten (die zijn bevroren snapshots en krijgen 'm dus niet automatisch mee vanuit
  // Basisdata). Idempotent: slaat over als er al een "Rabobank"-post staat.
  const ensureRabobankAbonnement = (abonnementen) => {
    if(!abonnementen.items.some(it => it.l.trim().toLowerCase() === "rabobank")){
      abonnementen.items.push({ l:"Rabobank", v:3.60 });
    }
  };
  if(state.scenarios && state.scenarios[0]) ensureRabobankAbonnement(basisdataScenario().abonnementen);
  state.budgets.forEach(b => ensureRabobankAbonnement(b.abonnementen));
  syncComputedLoons();
}

const fmt = n => (isNaN(n) ? 0 : n).toLocaleString("nl-NL", {minimumFractionDigits:2, maximumFractionDigits:2});
const sum = items => items.reduce((a,b)=>a+(parseFloat(b.v)||0),0);

function activeScenarioObj(){
  return state.scenarios[state.activeScenario] || state.scenarios[0];
}
function basisdataScenario(){
  return state.scenarios[0];
}
function latestScenario(){
  return state.scenarios[state.scenarios.length-1];
}

/* Loon wordt herkend aan het label "Loon" binnen Inkomsten van een scenario; overige
   inkomstenposten (zoals hypotheekrenteaftrek) tellen ongewijzigd mee. */
function getLoonItem(s){
  return s.income.items.find(it => it.l.trim().toLowerCase() === "loon");
}

/* Ruwe, opgeslagen loonwaarde van een scenario (zonder de loonsverhoging-formule toe te passen).
   Voor Basisdata is dit de daadwerkelijke, direct bewerkbare waarde. Voor andere jaren wordt dit
   veld door syncComputedLoons() overschreven met computedLoon(s) — baseLoonRaw dient alleen als
   ruwe lees-functie (o.a. bij migratie, vóórdat er een loonstijging-blok bestaat). */
function baseLoonRaw(s){
  const loonItem = getLoonItem(s);
  return loonItem ? (parseFloat(loonItem.v)||0) : 0;
}

/* Het daadwerkelijke loon van een scenario. Basisdata (2026): direct bewerkbare waarde. Elk ander
   jaar: loon van het jaar ervoor + het eigen loonsverhoging-blok van dát jaar (vast bedrag, dan
   percentage) — cascadeert dus automatisch door: wijzig je 2027, dan werkt dat door in 2028, 2029, ... */
function computedLoon(s){
  const idx = state.scenarios.indexOf(s);
  if(idx <= 0) return baseLoonRaw(s);
  const prev = state.scenarios[idx-1];
  const prevLoon = computedLoon(prev);
  const vast = s.loonstijging ? (parseFloat(s.loonstijging.vast) || 0) : 0;
  const pct = s.loonstijging ? (parseFloat(s.loonstijging.pct) || 0) : 0;
  return Math.round((prevLoon + vast) * (1 + pct/100) * 100) / 100;
}

/* Zet voor elk niet-Basisdata jaar de opgeslagen Loon-waarde gelijk aan computedLoon(s), zodat
   sum(items)/totalen/grafieken/Loonstijging-pagina overal automatisch de juiste, actuele waarde
   zien zonder dat elke plek zelf de cascade hoeft te kennen. Wordt aan het begin van renderAll()
   aangeroepen, dus altijd in sync na elke wijziging. */
function syncComputedLoons(){
  state.scenarios.forEach(s => {
    if(s === basisdataScenario()) return;
    const loonItem = getLoonItem(s);
    if(loonItem) loonItem.v = computedLoon(s);
  });
}

/* Alle kosten (vaste lasten, abonnementen, variabele lasten) komen altijd live van Basisdata —
   ongeacht welk jaar er bekeken wordt. Elk jaar heeft dus identieke kosten; alleen het (eigen,
   los aanpasbare) inkomen per jaar verschilt. Zie ontwerp-doc §3.1. */
function vasteLastenTotal(){
  const bd = basisdataScenario();
  const warmtefondsItem = bd.vasteLasten.items.find(it => it.l.trim().toLowerCase() === "warmtefonds");
  const warmtefondsVal = (state.warmtefondsAftrek && warmtefondsItem) ? (parseFloat(warmtefondsItem.v)||0) : 0;
  return sum(bd.vasteLasten.items) - warmtefondsVal;
}
/* Zelfde logica als vasteLastenTotal(), maar voor een bevroren maandbudget: gebruikt de eigen
   (gekopieerde) vaste-lasten-items en het eigen warmtefondsAftrek-vinkje van dat budget, niet de
   globale Basisdata-instelling. */
function vasteLastenTotalForBudget(b){
  const warmtefondsItem = b.vasteLasten.items.find(it => it.l.trim().toLowerCase() === "warmtefonds");
  const warmtefondsVal = (b.warmtefondsAftrek && warmtefondsItem) ? (parseFloat(warmtefondsItem.v)||0) : 0;
  return sum(b.vasteLasten.items) - warmtefondsVal;
}
function basisdataCostTotals(){
  const bd = basisdataScenario();
  const vasteLasten = vasteLastenTotal();
  const abonnementen = sum(bd.abonnementen.items);
  const variabeleLasten = sum(bd.variabeleLasten.items);
  return { vasteLasten, abonnementen, variabeleLasten, totaalUitgaven: vasteLasten + abonnementen + variabeleLasten };
}

function scenarioTotals(s){
  const costs = basisdataCostTotals();
  const netIncome = sum(s.income.items);
  const overTeSpenderen = netIncome - costs.totaalUitgaven;
  return { vasteLasten: costs.vasteLasten, abonnementen: costs.abonnementen, variabeleLasten: costs.variabeleLasten,
    totaalUitgaven: costs.totaalUitgaven, netIncome, overTeSpenderen };
}

/* computeTotals() geeft de cijfers van het ACTIEVE scenario terug (zoals voorheen), plus arrays
   met de waarden van alle scenario's samen (nodig voor de staafgrafiek die alle jaren toont). */
function computeTotals(){
  const perScenario = state.scenarios.map(scenarioTotals);
  const active = perScenario[state.activeScenario] || perScenario[0];
  return {
    ...active,
    netIncome: perScenario.map(p=>p.netIncome),
    overTeSpenderen: perScenario.map(p=>p.overTeSpenderen),
    vasteLastenPerScenario: perScenario.map(p=>p.vasteLasten),
    abonnementenPerScenario: perScenario.map(p=>p.abonnementen),
    variabeleLastenPerScenario: perScenario.map(p=>p.variabeleLasten),
    totaalUitgavenPerScenario: perScenario.map(p=>p.totaalUitgaven),
  };
}

/* Actuele totale vaste kosten van Basisdata (2026) — ongeacht welk tabblad actief is. Basisdata
   staat altijd op index 0. Gebruikt door de Loonstijging-pagina in plaats van de vaste Excel-aanname. */
function huidigKosten(){
  return basisdataCostTotals().totaalUitgaven;
}

/* Loonstijging 2018-2030, waarbij elk jaar dat een scenario heeft (Basisdata 2026, 2027, 2028,
   en elk zelf aangemaakt jaar erna) "Gemiddeld per maand" en "Totaal
   inkomsten per maand" live overneemt uit dat scenario's inkomsten, i.p.v. de vaste Excel-waarde.
   "Totaal per jaar" is steeds gemiddelde × 12 (netto-naar-jaar-omrekening — bevestigd te kloppen
   met de originele Excel-cijfers, bijv. 2025: 3.918,67 × 12 = 47.024,04 ≈ 47.024). "Groei %" wordt
   voor elk jaar herberekend t.o.v. het vorige jaar in deze reeks, zodat een gekoppeld jaar ook de
   groei van het jaar erna correct laat zien (i.p.v. de nu mogelijk achterhaalde vaste Excel-waarde). */
function effectiveLoonstijgingRows(){
  // Unie van de statische Excel-jaren (2018-2030) en alle jaren die een scenario hebben — zo
  // krijgt bijv. een zelf aangemaakt jaar 2031 (buiten de oorspronkelijke Excel-reeks) ook
  // automatisch een rij, puur op basis van dat scenario, zonder statische Excel-data nodig te hebben.
  const staticByYear = {};
  state.loonstijging.forEach(r => { staticByYear[r.jaar] = r; });
  const years = new Set(state.loonstijging.map(r => r.jaar));
  state.scenarios.forEach(s => years.add(s.jaar));
  const sortedYears = Array.from(years).sort((a,b) => a - b);

  let prevGem = null;
  return sortedYears.map(jaar => {
    const row = staticByYear[jaar];
    const matchedScenario = state.scenarios.find(s => s.jaar === jaar);
    let gemPerMaand, extraInkomsten, totaalPerMaand, synced, kosten;
    if(matchedScenario){
      gemPerMaand = sum(matchedScenario.income.items);
      extraInkomsten = 0;
      totaalPerMaand = gemPerMaand;
      synced = true;
      kosten = row ? row.kosten : huidigKosten();
    } else {
      gemPerMaand = row.gemPerMaand;
      extraInkomsten = row.extraInkomsten;
      totaalPerMaand = row.totaalPerMaand;
      synced = false;
      kosten = row.kosten;
    }
    const totaal = Math.round(gemPerMaand * 12 * 100) / 100;
    const groeiPct = prevGem !== null ? Math.round(((gemPerMaand/prevGem - 1) * 100) * 100) / 100 : (row ? row.groeiPct : 0);
    prevGem = gemPerMaand;
    return { jaar, totaal, gemPerMaand, groeiPct, kosten, extraInkomsten, totaalPerMaand, synced };
  });
}

function computeMonthTotals(m){
  const income = sum(m.income.items);
  const vasteLasten = sum(m.vasteLasten.items);
  const abonnementen = sum(m.abonnementen.items);
  const variabeleLasten = sum(m.variabeleLasten.items);
  // Issue #12: een toegevoegde "Openstaande terugboeking" (zie renderStornoReviewCard) belandt
  // sinds de maandbudget-dropdown niet meer in een categorie van DEZE maand zelf, maar in het
  // "Openstaand"-blok van het gekozen maandbudget — daardoor telde hij nergens meer mee in het
  // eigen "Over te spenderen"-bedrag van deze maand, ook al is de terugboeking wél echt in deze
  // maand gebeurd. Voor de eigen totalen van de maand telt een toegevoegde terugboeking daarom
  // hier gewoon mee als extra kostenpost, los van welk maandbudget de gebruiker 'm later koos voor
  // de planning. Oudere, nog-op-de-oude-manier toegevoegde rijen (entry.target, al in een categorie
  // van deze maand zelf verwerkt) worden bewust NIET nogmaals meegeteld — die zaten al in
  // vasteLasten/abonnementen/variabeleLasten hierboven.
  const openstaandToegevoegd = (m.openTerugboekingen || [])
    .filter(entry => entry.addedBudgetId)
    .reduce((a,entry) => a + Math.abs(parseFloat(entry.amt)||0), 0);
  const totaalUitgaven = vasteLasten + abonnementen + variabeleLasten + openstaandToegevoegd;
  return { income, vasteLasten, abonnementen, variabeleLasten, openstaandToegevoegd, totaalUitgaven };
}

/* ---------- CSV IMPORT: parsing & vertaallijst (translation list) ---------- */
function parseCSV(text){
  const rows = [];
  let row = [];
  let field = "";
  let inQuotes = false;
  const s = text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  for(let i=0;i<s.length;i++){
    const c = s[i];
    if(inQuotes){
      if(c === '"'){
        if(s[i+1] === '"'){ field += '"'; i++; }
        else { inQuotes = false; }
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ","){ row.push(field); field=""; }
      else if(c === "\n"){ row.push(field); rows.push(row); row=[]; field=""; }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  const cleanRows = rows.filter(r => r.length>1 || (r.length===1 && r[0]!==""));
  if(!cleanRows.length) return [];
  const header = cleanRows[0];
  return cleanRows.slice(1).map(r=>{
    const obj = {};
    header.forEach((h,idx)=>{ obj[h] = r[idx] !== undefined ? r[idx] : ""; });
    return obj;
  });
}

function parseNLAmount(s){
  if(!s) return 0;
  const cleaned = String(s).trim().replace(/\./g,"").replace(",", ".");
  const v = parseFloat(cleaned);
  return isNaN(v) ? 0 : v;
}

function detectMonthFromFilename(name){
  const base = name.replace(/\.(csv|pdf)$/i,"");
  const m = base.match(/(\d{4})(\d{2})$/);
  if(m){
    const year = parseInt(m[1],10);
    const month = parseInt(m[2],10);
    if(month>=1 && month<=12) return {year, month};
  }
  return null;
}

/* FinBo's eigen naamgeving voor een geïmporteerde maand ("JJJJ-CSV-MM" / "JJJJ-PDF-MM"), gebruikt
   i.p.v. de kale bankbestandsnaam (die zelf nietszeggende dingen als "RA_A_NL47RABO..." bevat) —
   zie renderReviewCard()/sourceNote en migrateState() voor de retroactieve toepassing op al eerder
   geïmporteerde maanden. */
function formatImportName(year, month, type){
  return `${year}-${type}-${String(month).padStart(2,"0")}`;
}

/* Alleen gebruikt door de migratie in migrateState(): een al opgeslagen maand van vóór deze
   naamgevingsconventie kent alleen nog de oude, rauwe bankbestandsnaam — daaruit wordt CSV/PDF
   afgeleid via de extensie, met "RA_"/"CSV_"-prefixen (de Rabobank-exportnamen die tot nu toe
   gebruikt werden) als extra vangnet, en CSV als veiligste fallback als geen van beide matcht. */
function inferLegacyImportType(oldName){
  if(/\.pdf$/i.test(oldName)) return "PDF";
  if(/\.csv$/i.test(oldName)) return "CSV";
  if(/^ra[_-]/i.test(oldName)) return "PDF";
  if(/^csv[_-]/i.test(oldName)) return "CSV";
  return "CSV";
}

function detectMonthFromRows(rows){
  const counts = {};
  rows.forEach(r=>{
    const d = r["Datum"];
    if(d && /^\d{4}-\d{2}-\d{2}/.test(d)){
      const key = d.slice(0,7);
      counts[key] = (counts[key]||0)+1;
    }
  });
  let best=null, bestCount=0;
  Object.entries(counts).forEach(([k,c])=>{ if(c>bestCount){best=k;bestCount=c;} });
  if(!best) return null;
  const [y,mo] = best.split("-").map(Number);
  return {year:y, month:mo};
}

function classifyTransaction(tx){
  const partij = (tx["Naam tegenpartij"]||"").trim();
  const initieel = (tx["Naam initiërende partij"]||"").trim();
  const omschr = ((tx["Omschrijving-1"]||"") + " " + (tx["Omschrijving-2"]||"")).trim();
  const naam = partij || initieel || (omschr ? omschr.slice(0,40) : "Onbekend");
  const blobNaam = naam.toLowerCase();
  const blobOmschr = omschr.toLowerCase();
  const blob = blobNaam + " " + blobOmschr;
  const amt = parseNLAmount(tx["Bedrag"]);
  const redenRetour = (tx["Reden retour"]||"").trim();

  // Herincasso/terugboeking: de bank markeert dit expliciet in "Reden retour"
  // (bv. "MD06-Oneens met incasso"). Dit is technische ruis, geen echte kostenpost.
  if(redenRetour){
    return {cat:"ignore", naam, amt};
  }

  // Speciale gevallen die op bedrag/tekst binnen dezelfde tegenpartij splitsen
  if(blobNaam.includes("belastingdienst")){
    if(blobOmschr.includes("nj-dg-53")) return {cat:"vasteLasten", label:"Wegenbelasting", naam, amt};
    if(blobOmschr.includes("ib/pvv") && amt>0) return {cat:"income", label:"Hypotheekrenteaftrek", naam, amt};
    if(blobOmschr.includes("zorgtoeslag")) return {cat: amt>0 ? "income":"review", label:"Zorgtoeslag", naam, amt};
    return {cat: amt<0 ? "vasteLasten":"review", label:"Belasting Afbet", naam, amt};
  }
  // Specifiek op "C. Blochberger"/"Carina Blochberger" i.p.v. een kale "blochberger"-match: er is
  // ook een S. Blochberger (bv. een Rabo Betaalverzoek voor een taartje) die niets met de
  // alimentatieregeling met Carina te maken heeft en anders per ongeluk werd meegeteld.
  if(blobNaam.includes("c. blochberger") || blobNaam.includes("carina blochberger")){
    return amt<0 ? {cat:"vasteLasten", label:"Alimentatie", naam, amt} : {cat:"income", label:"Carina Blochberger", naam, amt};
  }
  // Geldmaat-geldopnames hebben een locatiesuffix in de naam (bv. "Geldmaat Ganzeweide 74" vs
  // "Geldmaat Bautscherw 43") — dat zou anders los in "Nog in te delen" komen te staan. Samenvoegen
  // tot één post zodra 'm die kant op gaat (via review), zodat je 'm in één keer kunt toevoegen.
  if(blobNaam.includes("geldmaat")){
    return {cat:"review", label:"Geldmaat", naam:"Geldmaat", amt};
  }
  // Idem voor de maandelijkse Rabobank-rekeningkosten ("Rabobank" incl. het losse "NL47 RABO..."
  // tegenrekeningnummer bij de vaste Rabo Standaard-afschrijving): als abonnement herkend i.p.v. in
  // de reviewlijst te belanden.
  if(blobNaam.includes("rabobank") && blobOmschr.includes("rabo standaard")){
    return {cat:"abonnementen", label:"Rabobank", naam, amt};
  }
  if(blobNaam.includes("tulip assist")){
    const isSmall = Math.abs(amt) < 12;
    return {cat:"abonnementen", label: isSmall ? "Tulip Assist 2" : "Tulip Assist", naam, amt};
  }
  if(blobNaam.includes("xedule") || blobOmschr.includes("salaris")){
    return {cat:"income", label:"Loon", naam, amt};
  }
  // Warmtefonds komt binnen via "Entrust Netherlands B.V." met de herkenning in de omschrijving,
  // dus deze regel kijkt (als enige) ook naar de omschrijving i.p.v. alleen de tegenpartijnaam.
  if(blob.includes("nationaalwarmtef") || blob.includes("warmtefonds")){
    return {cat:"vasteLasten", label:"Warmtefonds", naam, amt};
  }

  // De algemene regels matchen bewust alleen op de tegenpartijnaam (niet de vrije omschrijving),
  // zodat een toevallig woord in een omschrijving (bv. een voornaam) geen andere tegenpartij kaapt.
  for(const [keys,cat,label] of CATEGORY_RULES){
    if(keys.some(k=>blobNaam.includes(k))) return {cat,label,naam,amt};
  }

  return {cat:"review", label:naam, naam, amt};
}

/* Herkent teruggeboekte incasso's ("Reden retour" ingevuld, bv. "MD06-Oneens met incasso") en
   voorkomt dat ze verkeerd meetellen:
   1) De mislukte oorspronkelijke afschrijving hoort onlosmakelijk bij zijn eigen terugboeking —
      te herkennen aan exact dezelfde Transactiereferentie. Dat paar wordt samen genegeerd (netto
      nul), zodat een mislukte poging nooit alsnog als kostenpost meetelt.
   2) Is er, voor dezelfde tegenpartij + hetzelfde bedrag + dezelfde omschrijving (bv. "Termijnbedrag
      mei 2026"), later in dezelfde aanlevering wél een geslaagde afschrijving te vinden, dan is de
      terugboeking impliciet alsnog voldaan — die geslaagde regel telt gewoon normaal mee, er is
      verder niets nodig.
   3) Is die er niet, dan verdwijnt de terugboeking niet stilzwijgend: hij komt in een eigen lijst
      (zie renderStornoReviewCard) waar zelf gekozen kan worden of en in welk blok 'm alsnog als
      kostenpost meetelt — in plaats van de aanname dat "genegeerd" hetzelfde is als "voldaan". */
function resolveStornos(rows){
  const isStorno = r => !!(r["Reden retour"] && String(r["Reden retour"]).trim());
  const stornoRows = rows.filter(isStorno);
  const excluded = new Set();
  stornoRows.forEach(r => excluded.add(r));

  const identityKey = r => {
    const naam = (r["Naam tegenpartij"]||r["Naam initiërende partij"]||"").trim().toLowerCase();
    const omschr = ((r["Omschrijving-1"]||"") + " " + (r["Omschrijving-2"]||"")).trim().toLowerCase();
    return naam + "|" + omschr;
  };

  const openTerugboekingen = [];
  stornoRows.forEach(storno => {
    const amt = Math.abs(parseNLAmount(storno["Bedrag"]));
    const naam = (storno["Naam tegenpartij"]||storno["Naam initiërende partij"]||"Onbekend").trim();
    const ref = storno["Transactiereferentie"];

    // De rechtstreeks gekoppelde, mislukte oorspronkelijke afschrijving (zelfde Transactiereferentie)
    // telt sowieso nooit mee als kostenpost — ongeacht of de terugboeking verderop alsnog voldaan is.
    if(ref){
      rows.forEach(r => {
        if(r === storno) return;
        if(r["Transactiereferentie"] === ref && !isStorno(r)) excluded.add(r);
      });
    }

    const key = identityKey(storno);
    const resolved = rows.some(r => {
      if(isStorno(r) || excluded.has(r)) return false;
      const rAmt = parseNLAmount(r["Bedrag"]);
      if(rAmt >= 0) return false; // moet zelf ook een afschrijving zijn
      if(Math.abs(Math.abs(rAmt) - amt) > 0.005) return false;
      return identityKey(r) === key;
    });

    if(!resolved){
      openTerugboekingen.push({
        naam,
        amt: Math.round(amt*100)/100,
        datum: storno["Datum"] || "",
        target: null,
        addedItem: null,
      });
    }
  });

  return { rows: rows.filter(r => !excluded.has(r)), openTerugboekingen };
}

function buildMonthFromCSV(rows, filename){
  const ym = detectMonthFromFilename(filename) || detectMonthFromRows(rows);
  if(!ym) throw new Error("Kon geen maand herkennen uit de bestandsnaam of de datums in het bestand.");
  const key = `${ym.year}-${String(ym.month).padStart(2,"0")}`;

  const { rows: filteredRows, openTerugboekingen } = resolveStornos(rows);

  const cats = ["income","vasteLasten","abonnementen","variabeleLasten"];
  const buckets = {}; cats.forEach(c=>buckets[c]={});
  const reviewBucket = {};

  let rowCount = 0;
  filteredRows.forEach(r=>{
    if(r["Bedrag"] === undefined || r["Bedrag"] === "") return;
    rowCount++;
    const result = classifyTransaction(r);
    const {cat,label,amt} = result;

    if(cat === "ignore") return; // terugboeking/herincasso: bewust genegeerd

    if(cat === "review"){
      reviewBucket[label] = (reviewBucket[label]||0) + amt;
      return;
    }

    // Een creditbedrag op een tegenpartij die normaal alleen kosten afschrijft, is zo goed als
    // altijd een terugbetaling/correctie van een eerdere afschrijving — geen echte kostenpost.
    // Alleen de "originele" afschrijvingen (en echte inkomsten) tellen dus mee.
    if(cat !== "income" && amt > 0) return;

    const isIncome = (cat === "income");
    const contribution = isIncome ? amt : -amt; // kostenposten worden als positief bedrag opgeslagen
    buckets[cat][label] = (buckets[cat][label]||0) + contribution;
  });

  const toItems = bucket => Object.entries(bucket)
    .map(([l,v])=>({l, v: Math.round(v*100)/100}))
    .filter(it=>Math.abs(it.v) > 0.001)
    .sort((a,b)=> b.v - a.v);

  // Issue #11: nieuw geïmporteerde "nog in te delen"-posten staan standaard NIET aangevinkt — de
  // gebruiker moet ze bewust selecteren (of "Alles selecteren" gebruiken) vóór de bulk-toevoegknop
  // ze meeneemt, in plaats van dat per ongeluk alles in één klap wordt toegevoegd.
  const review = Object.entries(reviewBucket)
    .map(([naam,amt])=>({ naam, amt: Math.round(amt*100)/100, target:null, addedItem:null, selected:false }))
    .filter(it=>Math.abs(it.amt) > 0.001)
    .sort((a,b)=> Math.abs(b.amt) - Math.abs(a.amt));

  // Issue #10: FinBo's eigen naamgevingsconventie voor imports ("JJJJ-CSV-MM"/"JJJJ-PDF-MM")
  // i.p.v. de rauwe, nietszeggende bankbestandsnaam (bv. "RA_A_NL47RABO...202607.pdf").
  const importType = /\.pdf$/i.test(filename) ? "PDF" : "CSV";

  return {
    key,
    year: ym.year,
    monthIndex: ym.month,
    sourceFile: formatImportName(ym.year, ym.month, importType),
    sourceType: importType,
    rowCount,
    income: { items: toItems(buckets.income) },
    vasteLasten: { items: toItems(buckets.vasteLasten) },
    abonnementen: { items: toItems(buckets.abonnementen) },
    variabeleLasten: { items: toItems(buckets.variabeleLasten) },
    review,
    openTerugboekingen,
  };
}

function upsertMonth(monthObj){
  const idx = state.months.findIndex(m=>m.key===monthObj.key);
  // Bij een hernieuwde upload van dezelfde maand: koppeling met een eerder gekozen maandbudget
  // blijft behouden. Anders: standaard het nieuwste maandbudget (of geen, als er nog geen is).
  monthObj.budgetId = (idx>=0 && state.months[idx].budgetId) ? state.months[idx].budgetId
    : (state.budgets.length ? state.budgets[0].id : null);
  if(idx>=0) state.months[idx] = monthObj; else state.months.push(monthObj);
  state.months.sort((a,b)=> a.key.localeCompare(b.key));
}

function handleCSVUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try{
      const bytes = new Uint8Array(ev.target.result);
      const text = new TextDecoder("windows-1252").decode(bytes);
      const rows = parseCSV(text);
      const monthObj = buildMonthFromCSV(rows, file.name);
      upsertMonth(monthObj);
      state.activeView = { type:"month", key: monthObj.key };
      renderAll();
    }catch(err){
      alert(t("csvParseError") + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = "";
}

/* ---------- PDF IMPORT: alternatief voor de CSV-export ----------
   Rabobank-rekeningafschriften als PDF hebben, anders dan de CSV-export, geen apart veld met het
   bedrag + teken: dat is alleen te herkennen aan óf het bedrag in de linkerkolom (debet, "Bedrag af")
   óf de rechterkolom (credit, "Bedrag bij") staat afgedrukt. Deze parser leest de tekst + positie van
   elk stukje tekst uit de PDF (via PDF.js), zet ze terug om in regels or "regels" (tekst met (bijna)
   dezelfde y-positie), herkent daarin per transactie de datum/type/naam/bedrag, en levert per
   transactie een object op in exact dezelfde vorm als een rij uit de CSV-export — zodat de rest van
   de import (classifyTransaction, resolveStornos, buildMonthFromCSV) ongewijzigd hergebruikt kan
   worden voor zowel CSV als PDF.
   Kanttekening: dit is beduidend fragieler dan de CSV-import (die gestructureerde velden heeft). Bij
   afwijkingen in de lay-out (bv. een andere banksoort-afschrift) kan dit missen of fouten geven —
   controleer de eerste keer altijd het resultaat. */
function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

async function parsePdfTransactions(arrayBuffer){
  if(!window.pdfjsLib){
    throw new Error("PDF-bibliotheek kon niet geladen worden (controleer je internetverbinding).");
  }
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

  const AMOUNT_RE = /^\d{1,3}(?:\.\d{3})*,\d{2}$/;
  const BLOCK_START_RE = /^(\d{2}-\d{2})\s+([a-z]{2,3})\s+(.*)$/i;
  const Y_TOL = 2.5;

  const transactions = [];
  let debetCreditThreshold = null; // x-grens tussen de "Bedrag af"- en "Bedrag bij"-kolom
  let naamColumnX = null; // linker x-grens van de "Naam/omschrijving"-kolom
  // Bewust BUITEN de pagina-loop: een enkele transactie kan met zijn vervolgregels over een
  // pagina-einde heen lopen (dat gebeurt echt — bv. een terugboeking waarvan de laatste regels
  // "Transactiereferentie: ..." en "Verwerkingsdatum: ..." toevallig net op de volgende pagina
  // staan). Zonder dit zou zo'n transactie stilzwijgend wegvallen (geen Verwerkingsdatum
  // gevonden), inclusief zijn eventuele koppeling aan een terugboeking.
  let block = null;

  for(let pageNum=1; pageNum<=pdf.numPages; pageNum++){
    const page = await pdf.getPage(pageNum);
    const content = await page.getTextContent();
    const items = content.items
      .map(it => ({ str: it.str, x: it.transform[4], y: it.transform[5] }))
      .filter(it => it.str.trim() !== "");

    const sorted = items.slice().sort((a,b)=> b.y - a.y || a.x - b.x);
    const lines = [];
    let currentLine = null;
    sorted.forEach(it=>{
      if(!currentLine || Math.abs(currentLine.y - it.y) > Y_TOL){
        currentLine = { y: it.y, items: [] };
        lines.push(currentLine);
      }
      currentLine.items.push(it);
    });
    lines.forEach(l => l.items.sort((a,b)=>a.x-b.x));

    // Kolomgrenzen herberekenen op basis van de kopregel ("Tegenrekening  Naam/omschrijving
    // Bedrag af (debet)  Bedrag bij (credit)") — via een tekst-naar-item-index-map i.p.v. één los
    // tekstitem, zodat het ook werkt als PDF.js de koplabels in meerdere kleinere stukjes tekst
    // opsplitst i.p.v. als één geheel. De Naam-kolomgrens laat toe de naam op de eerste regel altijd
    // positioneel te bepalen i.p.v. te gokken aan de hand van hoe de tekst eruitziet (zie hieronder
    // waarom dat laatste bij een korte, in hoofdletters geschreven naam als "TAF BV" fout gaat: die
    // is qua vorm niet te onderscheiden van een stukje Tegenrekening-IBAN).
    let headerLineIdx = -1;
    lines.forEach((line, idx) => {
      let text = "", map = [];
      line.items.forEach((it, i)=>{
        if(i>0){ text += " "; map.push(null); }
        for(let c=0;c<it.str.length;c++) map.push(it);
        text += it.str;
      });
      const iNaam = text.indexOf("Naam/omschrijving");
      const iDebet = text.indexOf("Bedrag af");
      const iCredit = text.indexOf("Bedrag bij");
      if(iNaam>=0){
        const naamItem = map[iNaam];
        if(naamItem) naamColumnX = naamItem.x;
        headerLineIdx = idx;
      }
      if(iDebet>=0 && iCredit>=0){
        const debetItem = map[iDebet], creditItem = map[iCredit];
        if(debetItem && creditItem) debetCreditThreshold = (debetItem.x + creditItem.x) / 2;
      }
    });

    // Alles tot en met de tabelkop ("Rente Type Tegenrekening Naam/omschrijving ... / datum")
    // overslaan: dat is altijd kop-/adresgegevens (adressant, IBAN, bladnummer, periode) die nooit
    // bij een transactie hoort. Nodig omdat een transactie soms met zijn vervolgregels over een
    // pagina-einde loopt (block blijft dan expres open, zie hieronder) — zonder dit zou die kop-
    // /adresruis er middenin belanden.
    const bodyLines = headerLineIdx >= 0 ? lines.slice(headerLineIdx + 2) : lines;

    bodyLines.forEach(line => {
      const text = line.items.map(it=>it.str).join(" ").replace(/\s+/g," ").trim();
      if(!text) return;

      const startMatch = text.match(BLOCK_START_RE);
      if(startMatch){
        const amtItem = [...line.items].reverse().find(it => AMOUNT_RE.test(it.str.trim()));
        // Naam positioneel bepalen: alle items die (ruim) binnen de Naam/omschrijving-kolom vallen,
        // met het bedrag-item er zelf weer uitgefilterd. Robuuster dan tekstpatronen gokken, want
        // een korte naam als "TAF BV" ziet er qua vorm identiek uit aan een IBAN-groepje.
        let naamFromPosition = "";
        if(naamColumnX !== null){
          const naamItems = line.items.filter(it => it.x >= naamColumnX - 3 && it !== amtItem);
          naamFromPosition = naamItems.map(it=>it.str).join(" ").replace(/\s+/g," ").trim();
        }
        block = {
          firstLineRest: startMatch[3],
          naamFromPosition,
          amountStr: null,
          amountX: null,
          extraLines: [],
          verwerkingsdatum: null,
        };
        if(amtItem){ block.amountStr = amtItem.str.trim(); block.amountX = amtItem.x; }
        transactions.push(block);
        return;
      }

      if(!block) return; // ruis vóór de eerste transactie: kopregels, adres, footer, legenda

      const vwMatch = text.match(/Verwerkingsdatum:\s*(\d{2}-\d{2}-\d{4})/);
      if(vwMatch){
        block.verwerkingsdatum = vwMatch[1];
        block = null; // blok compleet — eventuele ruis erna (volgende kop/footer) wordt genegeerd
        return;
      }
      // Kop-/voettekst die per pagina terugkeert (bv. "Blad 7 van 14", "vervolg Rekeningafschrift",
      // de tabelkop zelf) mag nooit in de omschrijving van een nog openstaand blok terechtkomen —
      // dat kan gebeuren omdat een transactie soms met zijn vervolgregels over een pagina-einde
      // loopt (zie hierboven, block blijft dan expres open), waardoor deze ruis er middenin valt.
      // Let op: "Rabo Standaard" hoort hier NIET bij — dat is niet alleen kop-boilerplate, het is ook
      // de letterlijke vervolgregel van de maandelijkse rekeningkosten-transactie zelf ("Kosten" /
      // "Rabo Standaard" / "Periode ..."). Die regel per ongeluk wegfilteren brak de Rabobank-
      // herkenning (zie classifyTransaction). Alleen tekst die uitsluitend als paginakop voorkomt.
      const PAGE_NOISE_RE = /^(Blad\b|\d+ van \d+$|vervolg Rekeningafschrift|Rekeningafschrift$|Ten name van|IBAN\s*\/\s*Rekeningnummer|Datum vanaf|Datum tot en met|Rente\s*$|datum\s*$|Type Tegenrekening|CR\s*=|D\s*=\s*tekort)/i;
      if(PAGE_NOISE_RE.test(text)) return;
      block.extraLines.push(text);
    });
  }

  // Blokken zonder herkend bedrag of Verwerkingsdatum passen niet in de aannames hierboven en
  // worden overgeslagen i.p.v. met gokwerk verwerkt (liever een gemiste regel dan een foute).
  return transactions
    .filter(b => b.amountStr && b.verwerkingsdatum)
    .map(b => {
      const isCredit = debetCreditThreshold !== null && b.amountX > debetCreditThreshold;
      const amt = parseNLAmount(b.amountStr) * (isCredit ? 1 : -1);

      // Naam bij voorkeur positioneel bepaald (zie b.naamFromPosition hierboven) — robuuster dan
      // op basis van hoe de tekst eruitziet, want een korte naam als "TAF BV" is qua vorm niet te
      // onderscheiden van een stukje Tegenrekening-IBAN. Alleen als de Naam-kolomgrens deze pagina
      // niet gevonden kon worden (geen kopregel herkend) valt dit terug op tekstpatronen gokken.
      let naam;
      if(b.naamFromPosition !== undefined){
        naam = b.naamFromPosition;
      } else {
        const rest = b.firstLineRest.replace(new RegExp(escapeRegExp(b.amountStr) + "\\s*$"), "").trim();
        const ibanOnlyMatch = rest.match(/^[A-Z]{2}\d{2}(?:\s+[A-Z0-9]{2,6}){0,6}$/);
        if(ibanOnlyMatch){
          naam = ""; // Tegenrekening-IBAN vult de hele eerste regel al
        } else {
          const ibanWithNaamMatch = rest.match(/^([A-Z]{2}\d{2}(?:\s+[A-Z0-9]{2,6}){1,6})\s+(.+)$/);
          naam = (ibanWithNaamMatch ? ibanWithNaamMatch[2] : rest).trim();
        }
      }

      // Een "naam" die er zelf nog als een stukje IBAN uitziet (kort, alleen hoofdletters/cijfers,
      // geen spatie) is vrijwel zeker een restje Tegenrekening dat toch nog binnen de Naam-kolom
      // viel (bv. bij een ongebruikelijk lange IBAN) — behandel die net als "geen naam gevonden".
      if(naam && /^[A-Z0-9]{1,6}$/.test(naam)) naam = "";

      // Bij een (te) lange Tegenrekening-IBAN past de naam soms niet meer op de eerste regel en
      // staat 'm als allereerste vervolgregel (bv. de PayPal- en Amazon-incasso's in dit afschrift)
      // i.p.v. ernaast. Zonder naam op de eerste regel: als de eerste vervolgregel geen van de
      // vaste detail-labels is, is dat de naam.
      let extraLines = b.extraLines.slice();
      if(!naam && extraLines.length){
        const first = extraLines[0].trim();
        const isLabelLine = /^(Kenmerk|Transactiereferentie|Terugboeking|\.\s*Pas|Appr Cd|[A-Z]{2}\d{2}ZZZ)/i.test(first) || /^[A-Z]{2}\d{2}(\s|$)/.test(first);
        if(first && !isLabelLine){
          naam = first;
          extraLines = extraLines.slice(1);
        }
      }
      naam = naam || "Onbekend";

      const omschrijving = extraLines.join(" ").replace(/\s+/g," ").trim();
      const isStorno = /terugboeking\s*:/i.test(omschrijving);
      const refMatch = omschrijving.match(/Transactiereferentie:\s*([A-Za-z0-9]+)/i);
      const [dd,mm,yyyy] = b.verwerkingsdatum.split("-");

      return {
        "Datum": `${yyyy}-${mm}-${dd}`,
        "Bedrag": String(amt).replace(".", ","),
        "Naam tegenpartij": naam,
        "Naam initiërende partij": "",
        "Omschrijving-1": omschrijving,
        "Omschrijving-2": "",
        "Reden retour": isStorno ? "Terugboeking (PDF)" : "",
        "Transactiereferentie": refMatch ? refMatch[1] : "",
      };
    });
}

function handlePDFUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    try{
      const rows = await parsePdfTransactions(ev.target.result);
      const monthObj = buildMonthFromCSV(rows, file.name);
      upsertMonth(monthObj);
      state.activeView = { type:"month", key: monthObj.key };
      renderAll();
    }catch(err){
      alert(t("pdfParseError") + err.message);

  };
