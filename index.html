/* Bouwt de vergelijkingsregels voor één blok: unie van de labels uit het maandbudget en de
   CSV-herkende posten van deze maand, met begroot/werkelijk/verschil per label. "kind" bepaalt
   de kleurbetekenis van het verschil: bij "income" is méér dan begroot goed (groen), bij "cost"
   is méér dan begroot juist slecht (rood, boven budget). */
function buildCompareRows(budgetItems, actualItems){
  /* Een Map en niet `{}`: bij een gewoon object botsen labels met namen uit Object.prototype.
     Een regel die letterlijk "toString" of "__proto__" heet werd door `if(!map[it.l])` als "bestaat
     al" gezien en verdween daarna volledig uit Object.values() — inclusief zijn bedrag, óók uit het
     subtotaal. Met __proto__ werd er bovendien op de prototype-keten geschreven.

     En de sleutel is trim().toLowerCase(), niet het label zoals het er staat. applyMonthToBudget
     koppelt namelijk wél zo, dus de twee helften van dezelfde functie waren het oneens over wat
     "dezelfde regel" is: met "Energie" in het budget en "energie" in de maand voegde Toepassen ze
     samen, waarna deze kaart ze weer als twee regels toonde — waarvan één rood als "deze maand niet
     betaald", voor een rekening die juist wél betaald was. Een spatie achteraan was al genoeg. */
  const map = new Map();
  const sleutel = l => (l||"").trim().toLowerCase();
  const pak = (it) => {
    const k = sleutel(it.l);
    if(!map.has(k)) map.set(k, { label: it.l, budget:0, actual:0 });
    return map.get(k);
  };
  (budgetItems||[]).forEach(it=>{ pak(it).budget = parseFloat(it.v)||0; });
  (actualItems||[]).forEach(it=>{
    const r = pak(it);
    r.actual = parseFloat(it.v)||0;
    // "entries": de individuele transacties achter dit werkelijke bedrag (zie buildMonthFromCSV) —
    // een begroot/budget-item heeft dit nooit, dat is een los ingevoerde plancijfer.
    if(it.entries && it.entries.length) r.entries = it.entries;
  });
  return [...map.values()]
    .map(r=>({ ...r, diff: r.actual - r.budget }))
    .sort((a,b)=> Math.max(Math.abs(b.budget),Math.abs(b.actual)) - Math.max(Math.abs(a.budget),Math.abs(a.actual)));
}

function renderCompareCard(title, budgetItems, actualItems, kind, iconKey){
  const rows = buildCompareRows(budgetItems, actualItems);
  const totBudget = rows.reduce((a,r)=>a+r.budget,0);
  const totActual = rows.reduce((a,r)=>a+r.actual,0);
  const totDiff = totActual - totBudget;
  // Voor kostenposten telt "minder uitgegeven dan begroot" normaal als goed (groen) — bv. een
  // energierekening die deze maand toevallig lager uitviel. Maar € 0,00 werkelijk tegenover een
  // begroot bedrag > 0 betekent meestal niet "bespaard", maar "helemaal niet betaald/gevonden deze
  // maand" (bv. een afbetalingstermijn die is overgeslagen) — dat is geen goed nieuws en hoort dus
  // rood te zijn, niet groen. Bij inkomsten was dit al automatisch goed: € 0,00 werkelijk tegenover
  // een begroot inkomen geeft sowieso al een negatief verschil, dus al "bad" onder de bestaande regel.
  const diffClass = (d, actual, budget) => {
    if(actual === 0 && budget !== 0) return "bad";
    return (kind==="income" ? d>=0 : d<=0) ? "good" : "bad";
  };
  // Scope voor de uitklap-status: los per kaart (income/vasteLasten/abonnementen/variabeleLasten)
  // zodat toevallig gelijke labels in verschillende kaarten elkaar niet beïnvloeden.
  const scope = `compare:${iconKey}`;

  const wrap = document.createElement("div");
  wrap.className = "card";
  wrap.innerHTML = `
    <div class="card-head">
      <div class="htitle">${CARD_ICONS[iconKey] || ""}<h2>${escapeHtml(title)}</h2></div>
    </div>
    <div class="compare-head-row">
      <span class="compare-name"></span>
      <span class="compare-col">${t("compareBudgetCol")}</span>
      <span class="compare-col">${t("compareActualCol")}</span>
      <span class="compare-col">${t("compareDiffCol")}</span>
    </div>
    <div class="compare-rows">
      ${rows.map(r=>{
        const hasBreakdown = r.entries && r.entries.length > 1;
        const key = `${scope}::${r.label}`;
        const isOpen = hasBreakdown && expandedBreakdowns.has(key);
        return `
        <div class="compare-row-wrap">
          <div class="compare-row">
            <span class="compare-name" title="${escapeHtml(r.label)}">
              ${hasBreakdown ? `<button type="button" class="breakdown-toggle-btn ${isOpen?'open':''}" data-key="${key}" title="${t('breakdownToggleBtn')}" aria-label="${t('breakdownToggleBtn')}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>` : ""}
              <span>${escapeHtml(r.label)}</span>
            </span>
            <span class="compare-col mono">€ ${fmt(r.budget)}</span>
            <span class="compare-col mono">€ ${fmt(r.actual)}</span>
            <span class="compare-col mono compare-diff ${diffClass(r.diff, r.actual, r.budget)}">${r.diff>=0?'+':'−'} € ${fmt(Math.abs(r.diff))}</span>
          </div>
          ${(hasBreakdown && isOpen) ? renderBreakdownRows(r.entries) : ""}
        </div>
      `;}).join("")}
      <div class="compare-row compare-total">
        <span class="compare-name">${t("subtotaal")}</span>
        <span class="compare-col mono">€ ${fmt(totBudget)}</span>
        <span class="compare-col mono">€ ${fmt(totActual)}</span>
        <span class="compare-col mono compare-diff ${diffClass(totDiff, totActual, totBudget)}">${totDiff>=0?'+':'−'} € ${fmt(Math.abs(totDiff))}</span>
      </div>
    </div>
  `;
  wrap.querySelectorAll(".breakdown-toggle-btn").forEach(btn=>{
    btn.onclick = () => {
      toggleBreakdown(btn.dataset.key);
      renderCategories();
    };
  });
  return wrap;
}

/* Extra blok: niet-herkende posten die de gebruiker handmatig aan een blok toewijst.
   Telt bewust niet mee in de berekening totdat een post met "Toevoegen" is ingedeeld. */
function renderReviewCard(m){
  const wrap = document.createElement("div");
  wrap.className = "card card-review";
  // "Alles selecteren" bepaalt of nog-niet-toegevoegde rijen standaard aangevinkt zijn; al
  // toegevoegde rijen doen niet mee (die hebben toch al hun eigen "Ongedaan maken"-knop) en
  // blijven dus ook buiten de select-all-berekening.
  const selectableEntries = m.review.filter(entry => !entry.target);
  const allSelected = selectableEntries.length > 0 && selectableEntries.every(entry => entry.selected);
  wrap.innerHTML = `
    <div class="card-head">
      <h2>${t("reviewTitle")}</h2>
    </div>
    <div class="card-note">${t("reviewNote")}</div>
    <div class="review-bulk-row">
      <label class="review-selectall-label">
        <input type="checkbox" id="reviewSelectAll" ${allSelected ? "checked" : ""} ${selectableEntries.length ? "" : "disabled"} />
        ${t("selectAllLabel")}
      </label>
      <button type="button" class="review-btn review-add-selected-btn" id="reviewAddSelectedBtn" ${selectableEntries.length ? "" : "disabled"}>${t("addSelectedBtn")}</button>
    </div>
    <div class="rows review-rows"></div>
  `;
  const rows = wrap.querySelector(".review-rows");
  const targets = [
    { key:"income", label: t("income") },
    { key:"vasteLasten", label: t("vasteLasten") },
    { key:"abonnementen", label: t("abonnementen") },
    { key:"variabeleLasten", label: t("variabeleLasten") },
  ];

  const addEntry = (entry, chosen) => {
    const contribution = chosen === "income" ? entry.amt : -entry.amt;
    // Als de gekozen categorie al een regel met exact hetzelfde label heeft (bv. een PayPal-
    // terugbetaling die je nu alsnog bij "Online" indeelt, terwijl er al een echte "Online"-post met
    // de gewone aankopen staat, zie inferredCat hierboven), wordt dit bedrag daar bovenop opgeteld
    // i.p.v. een tweede, botsende regel met dezelfde naam aan te maken — anders zou de vergelijking
    // straks alleen de laatst-toegevoegde van de twee gelijknamige regels zien en de rest stilzwijgend
    // negeren. "addedWasNew" onthoudt of dit een gloednieuwe regel was of een samenvoeging, zodat het
    // ongedaan maken hieronder de juiste kant op werkt: een nieuwe regel helemaal weghalen, een
    // samenvoeging alleen met dit bedrag weer verlagen (in plaats van de hele bestaande regel te
    // wissen, inclusief wat er al in zat vóór deze toevoeging).
    const key = entry.naam.trim().toLowerCase();
    const existing = m[chosen].items.find(it => it.l.trim().toLowerCase() === key);
    let item, wasNew;
    if(existing){
      existing.v = Math.round((existing.v + contribution)*100)/100;
      item = existing;
      wasNew = false;
    } else {
      item = { l: entry.naam, v: Math.round(contribution*100)/100 };
      m[chosen].items.push(item);
      wasNew = true;
    }
    entry.target = chosen;
    entry.addedItem = item;
    entry.addedContribution = Math.round(contribution*100)/100;
    entry.addedWasNew = wasNew;
  };

  m.review.forEach(entry=>{
    const wrapRow = document.createElement("div");
    wrapRow.className = "review-row-wrap";

    const row = document.createElement("div");
    row.className = "row review-row";
    const isAdded = !!entry.target;
    const sign = entry.amt >= 0 ? "+" : "−";
    // Een losse creditering die is afgeleid van een bekende kostenregel (bv. een PayPal-terugbetaling
    // die normaal bij "Online" zou zijn opgeteld, zie buildMonthFromCSV) krijgt die kostencategorie
    // alvast als voorgeselecteerde standaardwaarde — véél waarschijnlijker de juiste keuze dan zomaar
    // "Inkomen" alleen omdat het bedrag toevallig positief is. Alleen als er geen betere gok bekend is
    // (echt ongeclassificeerde posten, of Geldmaat) valt dit terug op de oude teken-gebaseerde regel.
    const defaultTarget = entry.target || entry.inferredCat || (entry.amt > 0 ? "income" : "vasteLasten");
    // Combinatieregels (bv. meerdere Geldmaat-opnames onder één post) krijgen een uitklapknopje
    // met daaronder de individuele betalingen — zie renderBreakdownRows().
    const hasBreakdown = entry.entries && entry.entries.length > 1;
    const breakdownKey = `review::${entry.naam}`;
    const isOpen = hasBreakdown && expandedBreakdowns.has(breakdownKey);
    // Eigen categorie (zie Profiel > Categorieën) -- elke categorie hoort bij één van de vier
    // groepen, gegroepeerd hier via <optgroup> zodat duidelijk is uit welke groep een gelijknamige
    // categorie komt. Pas zichtbaar zodra er tenminste één categorie bestaat (zie createCategory).
    const catSelectHtml = state.categories.length ? `
      <select class="review-cat-select" title="${t('reviewCategoryTitle')}">
        <option value="" ${!entry.catId ? "selected" : ""}>${t("reviewNoCategoryOption")}</option>
        ${PROFILE_CATEGORY_BUCKETS.map(b=>{
          const catsInBucket = state.categories.filter(c=>c.bucket===b.key);
          if(!catsInBucket.length) return "";
          return `<optgroup label="${t(b.titleKey)}">
            ${catsInBucket.map(c=>`<option value="${escapeHtml(c.id)}" ${entry.catId===c.id ? "selected" : ""}>${escapeHtml(c.name)}</option>`).join("")}
          </optgroup>`;
        }).join("")}
      </select>` : "";

    row.innerHTML = `
      <input type="checkbox" class="review-row-check" ${entry.selected ? "checked" : ""} ${isAdded ? "disabled" : ""} />
      <span class="review-name" title="${escapeHtml(entry.naam)}">
        ${hasBreakdown ? `<button type="button" class="breakdown-toggle-btn ${isOpen?'open':''}" data-key="${escapeHtml(breakdownKey)}" title="${t('breakdownToggleBtn')}" aria-label="${t('breakdownToggleBtn')}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>` : ""}
        <span>${escapeHtml(entry.naam)}</span>
      </span>
      <span class="review-amt mono ${entry.amt>=0?'pos':'neg'}">${sign} € ${fmt(Math.abs(entry.amt))}</span>
      <select class="review-select" ${isAdded ? "disabled" : ""}>
        ${targets.map(o=>`<option value="${escapeHtml(o.key)}" ${defaultTarget===o.key ? "selected" : ""}>${escapeHtml(o.label)}</option>`).join("")}
      </select>
      ${catSelectHtml}
      <button class="review-btn ${isAdded ? "added" : ""}">${isAdded ? t("reverseBtn") : t("addBtn")}</button>
    `;
    const check = row.querySelector(".review-row-check");
    const select = row.querySelector(".review-select");
    const catSelect = row.querySelector(".review-cat-select");
    const btn = row.querySelector(".review-btn");
    const breakdownBtn = row.querySelector(".breakdown-toggle-btn");

    check.onchange = () => { entry.selected = check.checked; renderAll(); };
    if(breakdownBtn){
      breakdownBtn.onclick = () => { toggleBreakdown(breakdownKey); renderCategories(); };
    }
    if(catSelect){
      catSelect.onchange = () => { entry.catId = catSelect.value || null; renderAll(); };
    }

    btn.onclick = () => {
      if(entry.target){
        const bucket = m[entry.target];
        if(entry.addedWasNew){
          // Deze toevoeging heeft indertijd een gloednieuwe regel aangemaakt -- die kan gewoon
          // helemaal weg.
          const idx = bucket.items.indexOf(entry.addedItem);
          if(idx>=0) bucket.items.splice(idx,1);
        } else if(entry.addedItem){
          // Deze toevoeging is samengevoegd met een regel die al bestond (zie addEntry hierboven) --
          // alleen dit bedrag er weer vanaf halen, niet de hele regel wissen (die had immers al een
          // eigen waarde vóórdat dit erbij kwam).
          entry.addedItem.v = Math.round((entry.addedItem.v - (entry.addedContribution||0))*100)/100;
        }
        entry.target = null;
        entry.addedItem = null;
        entry.addedContribution = null;
        entry.addedWasNew = null;
      } else {
        addEntry(entry, select.value);
      }
      renderAll();
    };
    wrapRow.appendChild(row);
    if(hasBreakdown && isOpen){
      wrapRow.insertAdjacentHTML("beforeend", renderBreakdownRows(entry.entries));
    }
    rows.appendChild(wrapRow);
  });

  // Issue #12: een subtotaal onder de lijst — nadrukkelijk "Subtotaal" genoemd (niet "Totaal"),
  // want dit is de som van de POSTEN IN DEZE LIJST, niet het saldo van de maand zelf; posten tellen
  // pas mee in dat saldo zodra ze via "Toevoegen" zijn ingedeeld.
  if(m.review.length){
    const subtotal = m.review.reduce((a,entry)=>a+entry.amt, 0);
    const subtotalRow = document.createElement("div");
    subtotalRow.className = "row review-row review-subtotal-row";
    subtotalRow.innerHTML = `
      <span class="review-name">${t("subtotaal")}</span>
      <span class="review-amt mono ${subtotal>=0?'pos':'neg'}">${subtotal>=0?'+':'−'} € ${fmt(Math.abs(subtotal))}</span>
    `;
    rows.appendChild(subtotalRow);
  }

  const selectAllCheck = wrap.querySelector("#reviewSelectAll");
  if(selectAllCheck){
    selectAllCheck.onchange = () => {
      const checked = selectAllCheck.checked;
      selectableEntries.forEach(entry => { entry.selected = checked; });
      renderAll();
    };
  }
  const addSelectedBtn = wrap.querySelector("#reviewAddSelectedBtn");
  if(addSelectedBtn){
    addSelectedBtn.onclick = () => {
      rows.querySelectorAll(".review-row").forEach((row, idx) => {
        const entry = m.review[idx];
        if(!entry || entry.target || !entry.selected) return;
        const select = row.querySelector(".review-select");
        addEntry(entry, select.value);
      });
      renderAll();
    };
  }
  return wrap;
}

/* Zelfde toevoegen-met-categorie-keuze UX als renderReviewCard(), maar voor teruggeboekte incasso's
   die niet binnen dezelfde maand alsnog geslaagd lijken (zie resolveStornos()) — bewust een eigen
   lijst i.p.v. meegeschoven in "Nog in te delen", zodat direct duidelijk is dát het om een
   terugboeking gaat en niet om een simpelweg onherkende tegenpartij. */
/* Zoekt of een maandbudget al een "Openstaand"-regel heeft die exact overeenkomt met deze
   terugboeking-entry (zelfde naam + zelfde bedrag) — gebruikt om te voorkomen dat dezelfde
   terugboeking twee keer wordt toegevoegd. Dit gebeurde bv. wanneer een maand wordt verwijderd en
   daarna hetzelfde bestand opnieuw wordt geïmporteerd: het budget zelf (en daarmee zijn
   "outstanding"-regels) blijft gewoon bestaan, maar de nieuw aangemaakte maand heeft een verse
   `openTerugboekingen`-lijst waarin niets meer als "toegevoegd" gemarkeerd staat — zonder deze
   check zou "Toevoegen" dan een tweede, dubbele regel met dezelfde naam aanmaken. */
function findMatchingOutstandingItem(budget, entry){
  if(!budget || !budget.outstanding) return null;
  const amt = Math.round(Math.abs(entry.amt)*100)/100;
  const key = entry.naam.trim().toLowerCase();
  return budget.outstanding.items.find(it => it.l.trim().toLowerCase() === key && Math.abs((parseFloat(it.v)||0) - amt) < AMOUNT_MATCH_EPSILON) || null;
}

function renderStornoReviewCard(m){
  const wrap = document.createElement("div");
  wrap.className = "card card-review";
  wrap.innerHTML = `
    <div class="card-head">
      <h2>${t("stornoReviewTitle")}</h2>
    </div>
    <div class="card-note">${t("stornoReviewNote")}</div>
    <div class="rows review-rows"></div>
  `;
  const rows = wrap.querySelector(".review-rows");

  // Zelfherstellend: als een regel volgens haar EIGEN state nog niet is toegevoegd, wordt gekeken
  // of ÉÉN VAN AL DE MAANDBUDGETTEN al precies zo'n regel bevat (zelfde naam + zelfde bedrag) — zie
  // findMatchingOutstandingItem hierboven. Deze check gebruikt bewust NIET meer m.budgetId (de
  // "vergelijk met maandbudget"-keuze bovenaan de maandpagina): die koppeling staat nu standaard op
  // "Geen maandbudget" bij een nieuwe import (zie upsertMonth) en heeft an sich niets te maken met
  // welk budget een terugboeking al eerder heeft ontvangen. In plaats daarvan wordt eerst de eigen,
  // al eerder in DEZE tabel gekozen keuze geprobeerd (entry.budgetId), en anders over alle
  // maandbudgetten gezocht. Vanaf hier gedraagt de rij zich verder gewoon als een normale
  // al-toegevoegde rij (inclusief de bestaande "ongedaan maken"-knop, die de geadopteerde regel dan
  // gewoon weer verwijdert).
  m.openTerugboekingen.forEach(entry=>{
    if(!entry.addedBudgetId && !entry.target){
      let candidateBudget = entry.budgetId ? (state.budgets.find(b=>b.id===entry.budgetId) || null) : null;
      let match = findMatchingOutstandingItem(candidateBudget, entry);
      if(!match){
        candidateBudget = null;
        for(const b of state.budgets){
          const found = findMatchingOutstandingItem(b, entry);
          if(found){ candidateBudget = b; match = found; break; }
        }
      }
      if(match){
        entry.addedBudgetId = candidateBudget.id;
        entry.addedItem = match;
        entry.budgetId = candidateBudget.id;
      }
    }
  });

  m.openTerugboekingen.forEach(entry=>{
    const row = document.createElement("div");
    row.className = "row review-row";
    // "entry.target" is het oude veld van vóór deze functie een maandbudget-dropdown kreeg (toen
    // koos je hier nog een categorie, net als bij "Nog in te delen") — al toegevoegde rijen uit
    // opslagbestanden van vóór deze wijziging blijven zo als toegevoegd/vergrendeld getoond, zonder
    // dat hun al bestaande post ergens stilzwijgend verdwijnt.
    const isLegacyAdded = !!entry.target && !entry.addedBudgetId;
    const isAdded = !!entry.addedBudgetId || isLegacyAdded;
    // Standaard: alleen de keuze die voor DEZE regel zelf al is gemaakt (via de zelfherstellende
    // stap hierboven, of een eerdere handmatige keuze in deze tabel) — niet langer de "vergelijk met
    // maandbudget"-keuze bovenaan de maandpagina (m.budgetId), want die twee dingen staan los van
    // elkaar. Zonder een reeds bekende keuze moet de gebruiker zelf kiezen (vandaar de lege "Kies
    // een maandbudget…"-optie).
    const defaultBudgetId = entry.budgetId || entry.addedBudgetId || "";

    row.innerHTML = `
      <span class="review-name" title="${escapeHtml(entry.naam)}">${escapeHtml(entry.naam)}</span>
      <span class="review-amt mono neg">− € ${fmt(Math.abs(entry.amt))}</span>
      <select class="review-select" ${isAdded ? "disabled" : ""}>
        <option value="" ${!defaultBudgetId ? "selected" : ""}>${t("noBudgetOptionShort")}</option>
        ${state.budgets.map(b=>`<option value="${escapeHtml(b.id)}" ${defaultBudgetId===b.id ? "selected" : ""}>${escapeHtml(b.title)}</option>`).join("")}
      </select>
      <button class="review-btn ${isAdded ? "added" : ""}" ${(!isAdded && !defaultBudgetId) ? "disabled" : ""}>${isAdded ? t("reverseBtn") : t("addBtn")}</button>
    `;
    const select = row.querySelector(".review-select");
    const btn = row.querySelector(".review-btn");

    select.onchange = () => {
      entry.budgetId = select.value || null;
      btn.disabled = !entry.budgetId;
    };

    btn.onclick = () => {
      if(entry.addedBudgetId){
        const targetBudget = state.budgets.find(b => b.id === entry.addedBudgetId);
        if(targetBudget && targetBudget.outstanding){
          const idx = targetBudget.outstanding.items.indexOf(entry.addedItem);
          if(idx>=0) targetBudget.outstanding.items.splice(idx,1);
        }
        entry.addedBudgetId = null;
        entry.addedItem = null;
      } else if(isLegacyAdded){
        // Oude schema: addedItem staat in m[entry.target].items (een categorie van deze maand,
        // niet een maandbudget) — ongedaan maken volgens dat oude pad.
        const bucket = m[entry.target];
        if(bucket){
          const idx = bucket.items.indexOf(entry.addedItem);
          if(idx>=0) bucket.items.splice(idx,1);
        }
        entry.target = null;
        entry.addedItem = null;
      } else {
        const chosenId = select.value;
        if(!chosenId) return;
        const targetBudget = state.budgets.find(b => b.id === chosenId);
        if(!targetBudget) return;
        if(!targetBudget.outstanding) targetBudget.outstanding = { items: [] };
        // Nogmaals checken op een bestaande match voor het GEKOZEN budget (niet per se het budget
        // waarop de zelfherstellende stap hierboven al testte) — de gebruiker kan immers een ander
        // budget hebben geselecteerd dan de standaardwaarde. Is de regel er al, dan wordt die
        // geadopteerd i.p.v. een dubbele regel aan te maken; de knop wordt hierna gewoon een normale
        // "ongedaan maken"-knop voor die bestaande regel.
        const existingMatch = findMatchingOutstandingItem(targetBudget, entry);
        const item = existingMatch || { l: entry.naam, v: Math.round(Math.abs(entry.amt)*100)/100 };
        if(!existingMatch) targetBudget.outstanding.items.push(item);
        entry.budgetId = chosenId;
        entry.addedBudgetId = chosenId;
        entry.addedItem = item;
      }
      renderAll();
    };
    rows.appendChild(row);
  });

  // Issue #12: subtotaal van deze lijst (altijd een kostenpost, dus altijd negatief getoond) —
  // helpt meteen zien hoeveel er nog "open" staat, los van welk maandbudget er straks bij gekozen wordt.
  if(m.openTerugboekingen.length){
    const subtotal = m.openTerugboekingen.reduce((a,entry)=>a+Math.abs(parseFloat(entry.amt)||0), 0);
    const subtotalRow = document.createElement("div");
    subtotalRow.className = "row review-row review-subtotal-row";
    subtotalRow.innerHTML = `
      <span class="review-name">${t("subtotaal")}</span>
      <span class="review-amt mono neg">− € ${fmt(subtotal)}</span>
    `;
    rows.appendChild(subtotalRow);
  }
  return wrap;
}

/* ---------- CHARTS (inline SVG, no deps) ---------- */
/* Kleuren per categorie, gedeeld tussen staafdiagram, cirkeldiagram en legenda's. Verwijzen naar
   CSS custom properties (zie :root / html[data-mode="dark"]) zodat de grafieken automatisch mee
   wisselen tussen licht en donker, zonder dat deze JS zelf de modus hoeft te kennen. */
const CAT_COLORS = { vasteLasten:"var(--cat-vaste)", abonnementen:"var(--cat-abon)", variabeleLasten:"var(--cat-variabel)",
  over:"var(--cat-over)", tekort:"var(--cat-tekort)", income:"var(--cat-income)", kosten:"var(--cat-kosten)" };

/* Bouwt de gesorteerde categorie-segmenten (grootste eerst) plus, indien er geld over is,
   een extra "over"-segment (groen) zodat duidelijk is dat er geld over zou moeten zijn. Is er
   juist een tekort, dan komt er een "tekort"-segment (geel, zelfde kleur als in de staafgrafiek)
   bij — die krijgt bewust `noSlice:true`: de drie lastencategorieën samen zijn namelijk al gelijk
   aan de totale uitgaven, dus het tekort erbovenop als extra taartpunt meetellen zou het totaal
   (en daarmee alle verhoudingen) vertekenen. In plaats daarvan telt donutChart() 'm niet mee voor
   de taart zelf, maar toont 'm wél als extra regel in de legenda eronder, zodat het tekort ook in
   het cirkeldiagram zichtbaar is in plaats van stilzwijgend weggelaten te worden. */
function categorySegments(vasteLasten, abonnementen, variabeleLasten, over){
  const segs = [
    { key:"vasteLasten", l:t("vasteLasten"), v: vasteLasten, c: CAT_COLORS.vasteLasten },
    { key:"abonnementen", l:t("abonnementen"), v: abonnementen, c: CAT_COLORS.abonnementen },
    { key:"variabeleLasten", l:t("variabeleLasten"), v: variabeleLasten, c: CAT_COLORS.variabeleLasten },
  ].sort((a,b)=> b.v - a.v);
  if(over >= 0){
    segs.push({ key:"over", l:t("overTeSpenderen"), v: over, c: CAT_COLORS.over });
  } else {
    segs.push({ key:"tekort", l:t("legendTekort"), v: -over, c: CAT_COLORS.tekort, noSlice:true });
  }
  return segs;
}

/* Legenda die altijd alle categorieën toont, plus zowel "over" als "tekort" (ook als de
   actieve balk net geen tekort toont) zodat de rode stippellijn in andere balken duidelijk blijft. */
function categoryLegendHTML(){
  return `
    <span><span class="dot" style="background:${CAT_COLORS.vasteLasten}"></span>${t("vasteLasten")}</span>
    <span><span class="dot" style="background:${CAT_COLORS.abonnementen}"></span>${t("abonnementen")}</span>
    <span><span class="dot" style="background:${CAT_COLORS.variabeleLasten}"></span>${t("variabeleLasten")}</span>
    <span><span class="dot" style="background:${CAT_COLORS.over}"></span>${t("legendOver")}</span>
    <span><span class="dot" style="background:${CAT_COLORS.tekort}"></span>${t("legendTekort")}</span>
  `;
}

/* Eén gestapelde staaf per scenario: de vaste/abonnement/variabele lasten (gelijk voor elk
   scenario) staan onderin gesorteerd van groot (onder) naar klein (boven), met daarboven — als
   er geld over is — een groen "over"-segment. Is er een tekort, dan blijft de staaf tot de
   uitgaven doorlopen en toont een rode stippellijn ter hoogte van het netto inkomen. */
function barChart(totals){
  const w=332, h=170, pad=28;
  const n = state.scenarios.length;
  const max = Math.max(...totals.netIncome, ...totals.totaalUitgavenPerScenario) * 1.15 || 1;
  const scaleY = (h-pad-16) / max;
  const groupW = (w - pad) / n;
  const barW = Math.max(4, Math.min(groupW - 16, 56));
  let bars = "";
  state.scenarios.forEach((s,i)=>{
    const x0 = pad + i*groupW + (groupW-barW)/2;
    let y = h-pad;
    const baseCats = [
      { v: totals.vasteLastenPerScenario[i], c: CAT_COLORS.vasteLasten },
      { v: totals.abonnementenPerScenario[i], c: CAT_COLORS.abonnementen },
      { v: totals.variabeleLastenPerScenario[i], c: CAT_COLORS.variabeleLasten },
    ].sort((a,b)=> b.v - a.v);
    baseCats.forEach(c=>{
      const segH = c.v*scaleY;
      y -= segH;
      bars += `<rect x="${x0}" y="${y}" width="${barW}" height="${segH}" fill="${c.c}" rx="1.5"/>`;
    });
    const over = totals.overTeSpenderen[i];
    if(over >= 0){
      const segH = over*scaleY;
      y -= segH;
      bars += `<rect x="${x0}" y="${y}" width="${barW}" height="${segH}" fill="${CAT_COLORS.over}" rx="1.5"/>`;
    } else {
      // Tekort: was eerst alleen een dun lijntje op de hoogte van het netto inkomen — bijna
      // onzichtbaar tussen de andere kleuren. Kleurt nu, net als een positief "over"-stukje, het
      // bovenste deel van de staaf (het stuk boven het netto inkomen) duidelijk in de tekort-kleur.
      const incomeY = h-pad-(totals.netIncome[i]*scaleY);
      const tekortH = Math.max(0, incomeY - y);
      if(tekortH > 0.5){
        bars += `<rect x="${x0}" y="${y}" width="${barW}" height="${tekortH}" fill="${CAT_COLORS.tekort}" rx="1.5"/>`;
      }
      bars += `<line x1="${x0-3}" y1="${incomeY}" x2="${x0+barW+3}" y2="${incomeY}" stroke="var(--text-onink)" stroke-width="1" stroke-dasharray="3,2"/>`;
    }
    bars += `<text x="${x0+barW/2}" y="${h-8}" fill="var(--text-onink-soft)" font-size="9" text-anchor="middle" font-family="Segoe UI,sans-serif">${s.jaar}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
    <line x1="${pad}" y1="${h-pad}" x2="${w-4}" y2="${h-pad}" stroke="color-mix(in srgb, var(--text-onink) 15%, transparent)"/>
    ${bars}
  </svg>`;
}

/* Zelfde opbouw als barChart, maar voor één maand: één gestapelde staaf, categorieën gesorteerd
   van groot (onder) naar klein (boven), met "over" erboven of een rode stippellijn bij een tekort. */
function monthBarChart(totals){
  const w=332, h=170, pad=28;
  const over = totals.income - totals.totaalUitgaven;
  const baseCats = [
    { v: totals.vasteLasten, c: CAT_COLORS.vasteLasten },
    { v: totals.abonnementen, c: CAT_COLORS.abonnementen },
    { v: totals.variabeleLasten, c: CAT_COLORS.variabeleLasten },
  ].sort((a,b)=> b.v - a.v);
  const max = Math.max(totals.income, totals.totaalUitgaven, 1) * 1.15;
  const scaleY = (h-pad-16) / max;
  const barW = 74;
  const x0 = w/2 - barW/2;
  let y = h-pad;
  let bars = "";
  baseCats.forEach(c=>{
    const segH = c.v*scaleY;
    y -= segH;
    bars += `<rect x="${x0}" y="${y}" width="${barW}" height="${segH}" fill="${c.c}" rx="1.5"/>`;
  });
  if(over >= 0){
    const segH = over*scaleY;
    y -= segH;
    bars += `<rect x="${x0}" y="${y}" width="${barW}" height="${segH}" fill="${CAT_COLORS.over}" rx="1.5"/>`;
  } else {
    const incomeY = h-pad-(totals.income*scaleY);
    const tekortH = Math.max(0, incomeY - y);
    if(tekortH > 0.5){
      bars += `<rect x="${x0}" y="${y}" width="${barW}" height="${tekortH}" fill="${CAT_COLORS.tekort}" rx="1.5"/>`;
    }
    bars += `<line x1="${x0-3}" y1="${incomeY}" x2="${x0+barW+3}" y2="${incomeY}" stroke="var(--text-onink)" stroke-width="1" stroke-dasharray="3,2"/>`;
  }
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
    <line x1="${pad}" y1="${h-pad}" x2="${w-4}" y2="${h-pad}" stroke="color-mix(in srgb, var(--text-onink) 15%, transparent)"/>
    ${bars}
  </svg>`;
}

/* Legenda voor de Loonstijging-lijngrafiek: lijnvormige swatches (mirrort de lijn-mark),
   in plaats van de ronde "dot" die de staaf-/donutgrafieken gebruiken. */
function loonstijgingLegendHTML(){
  return `
    <span><span class="line-swatch" style="background:${CAT_COLORS.income}"></span>${t("legendNettoInkomen")}</span>
    <span><span class="line-swatch" style="background:${CAT_COLORS.kosten}"></span>${t("legendKosten")}</span>
  `;
}

/* Lijngrafiek "Netto inkomen vs kosten per maand".
   X-as = jaren, twee lijnen (netto inkomen per maand / vaste kosten per maand). Inclusief
   hover-crosshair die naar het dichtstbijzijnde jaar snapt en één tooltip met beide waarden,
   zoals de interactie-richtlijn voor lijn-/vlakgrafieken voorschrijft. */
function loonstijgingLineChart(data, selectedYear, onSelect){
  const wrap = document.createElement("div");
  wrap.className = "lchart-wrap";

  const w = 480, h = 220, padL = 46, padR = 12, padT = 14, padB = 28;
  const n = data.length;
  const incomeVals = data.map(d=>d.totaalPerMaand);
  const liveKosten = huidigKosten();
  const kostenVals = data.map(()=>liveKosten);
  const maxRaw = Math.max(...incomeVals, ...kostenVals);
  const chartMax = Math.ceil((maxRaw*1.08)/1000)*1000 || 1000;
  const ticks = 5;
  const xStep = n>1 ? (w-padL-padR)/(n-1) : 0;
  const xScale = i => padL + i*xStep;
  const yScale = v => h-padB - (v/chartMax)*(h-padT-padB);
  let selectedIdx = Math.max(0, data.findIndex(d=>d.jaar===selectedYear));
  if(selectedIdx < 0) selectedIdx = n-1;

  const pathFor = vals => vals.map((v,i)=> `${i===0?'M':'L'}${xScale(i).toFixed(1)},${yScale(v).toFixed(1)}`).join(" ");

  let gridSvg = "";
  for(let i=0;i<=ticks;i++){
    const v = chartMax*i/ticks;
    const y = yScale(v);
    gridSvg += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="color-mix(in srgb, var(--text-onink) 8%, transparent)" stroke-width="1"/>`;
    gridSvg += `<text x="${(padL-8).toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="8.5" fill="var(--text-onink-soft)" font-family="Segoe UI,sans-serif">€${Math.round(v).toLocaleString(fmtLocale())}</text>`;
  }

  const labelEvery = n > 9 ? 2 : 1;
  let xLabels = "";
  let xGridSvg = "";
  data.forEach((d,i)=>{
    const x = xScale(i);
    // Verticale lijntjes bij ELK jaar, ook de tussenliggende jaren zonder zichtbaar cijfer
    // eronder — net zoals de horizontale lijntjes er ook bij elk cijfer staan.
    xGridSvg += `<line x1="${x.toFixed(1)}" y1="${padT}" x2="${x.toFixed(1)}" y2="${h-padB}" stroke="color-mix(in srgb, var(--text-onink) 8%, transparent)" stroke-width="1"/>`;
    if(i % labelEvery !== 0 && i !== n-1) return;
    xLabels += `<text x="${x.toFixed(1)}" y="${h-8}" text-anchor="middle" font-size="8.5" fill="var(--text-onink-soft)" font-family="Segoe UI,sans-serif">${d.jaar}</text>`;
  });

  /* Zichtbare bolletjes + een grotere, onzichtbare hit-cirkel per jaar (klik- én tik-doel van
     minstens 24px) zodat je niet precies op het kleine bolletje hoeft te mikken. */
  const kostenDots = kostenVals.map((v,i)=> `<circle class="lchart-dot" data-idx="${i}" cx="${xScale(i).toFixed(1)}" cy="${yScale(v).toFixed(1)}" r="3" fill="${CAT_COLORS.kosten}"/>`).join("");
  const incomeDots = incomeVals.map((v,i)=> `<circle class="lchart-dot" data-idx="${i}" cx="${xScale(i).toFixed(1)}" cy="${yScale(v).toFixed(1)}" r="3" fill="${CAT_COLORS.income}"/>`).join("");
  const hitDots = data.map((d,i)=> `<circle class="lchart-hit" data-idx="${i}" cx="${xScale(i).toFixed(1)}" cy="${(padT + (h-padT-padB)/2).toFixed(1)}" r="${Math.max(12, xStep/2).toFixed(1)}" fill="transparent" style="cursor:pointer;"/>`).join("");

  wrap.innerHTML = `
    <svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" id="lchartSvg">
      ${gridSvg}
      ${xGridSvg}
      ${xLabels}
      <path d="${pathFor(kostenVals)}" fill="none" stroke="${CAT_COLORS.kosten}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="${pathFor(incomeVals)}" fill="none" stroke="${CAT_COLORS.income}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${kostenDots}
      ${incomeDots}
      <circle id="lchartSelectedIncome" r="6" fill="none" stroke="${CAT_COLORS.income}" stroke-width="2"/>
      <circle id="lchartSelectedKosten" r="6" fill="none" stroke="${CAT_COLORS.kosten}" stroke-width="2"/>
      <line id="lchartCrosshair" x1="0" y1="${padT}" x2="0" y2="${h-padB}" stroke="color-mix(in srgb, var(--text-onink) 35%, transparent)" stroke-width="1" stroke-dasharray="2,2" style="display:none;"/>
      <circle id="lchartHoverIncome" r="4.5" fill="${CAT_COLORS.income}" stroke="var(--ink)" stroke-width="1.5" style="display:none;"/>
      <circle id="lchartHoverKosten" r="4.5" fill="${CAT_COLORS.kosten}" stroke="var(--ink)" stroke-width="1.5" style="display:none;"/>
      <rect id="lchartOverlay" x="${padL}" y="${padT}" width="${w-padL-padR}" height="${h-padT-padB}" fill="transparent" style="cursor:pointer;"/>
      ${hitDots}
    </svg>
    <div class="lchart-tooltip" id="lchartTooltip">
      <div class="tt-year"></div>
      <div class="tt-row"><span class="tt-key" style="background:${CAT_COLORS.income}"></span><span class="tt-val"></span><span class="tt-label">${t("legendNettoInkomen")}</span></div>
      <div class="tt-row"><span class="tt-key" style="background:${CAT_COLORS.kosten}"></span><span class="tt-val"></span><span class="tt-label">${t("legendKosten")}</span></div>
    </div>
  `;

  const svg = wrap.querySelector("#lchartSvg");
  const overlay = wrap.querySelector("#lchartOverlay");
  const crosshair = wrap.querySelector("#lchartCrosshair");
  const hoverIncome = wrap.querySelector("#lchartHoverIncome");
  const hoverKosten = wrap.querySelector("#lchartHoverKosten");
  const selectedIncome = wrap.querySelector("#lchartSelectedIncome");
  const selectedKosten = wrap.querySelector("#lchartSelectedKosten");
  const tooltip = wrap.querySelector("#lchartTooltip");
  const ttYear = tooltip.querySelector(".tt-year");
  const ttVals = tooltip.querySelectorAll(".tt-val");

  function placeSelectedRing(idx){
    const d = data[idx];
    const x = xScale(idx);
    selectedIncome.setAttribute("cx", x); selectedIncome.setAttribute("cy", yScale(d.totaalPerMaand));
    selectedKosten.setAttribute("cx", x); selectedKosten.setAttribute("cy", yScale(liveKosten));
  }
  placeSelectedRing(selectedIdx);

  function pointerToIndex(evt){
    const rect = svg.getBoundingClientRect();
    const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
    const xInSvg = (clientX - rect.left) * (w / rect.width);
    let idx = Math.round((xInSvg - padL) / (xStep || 1));
    return Math.max(0, Math.min(n-1, idx));
  }

  function showAt(idx){
    const d = data[idx];
    const x = xScale(idx);
    crosshair.setAttribute("x1", x); crosshair.setAttribute("x2", x);
    crosshair.style.display = "";
    hoverIncome.setAttribute("cx", x); hoverIncome.setAttribute("cy", yScale(d.totaalPerMaand));
    hoverKosten.setAttribute("cx", x); hoverKosten.setAttribute("cy", yScale(liveKosten));
    hoverIncome.style.display = "";
    hoverKosten.style.display = "";
    ttYear.textContent = d.jaar;
    ttVals[0].textContent = `€ ${fmt(d.totaalPerMaand)}`;
    ttVals[1].textContent = `€ ${fmt(liveKosten)}`;
    tooltip.classList.add("visible");
    const svgRect = svg.getBoundingClientRect();
    const wrapRect = wrap.getBoundingClientRect();
    const px = svgRect.left - wrapRect.left + (x/w)*svgRect.width;
    let left = px + 12;
    const maxLeft = wrapRect.width - 150;
    if(left > maxLeft) left = px - 150;
    tooltip.style.left = `${Math.max(4,left)}px`;
    // Altijd bovenaan de grafiek plaatsen (los van waar het bolletje voor dit jaar precies staat)
    // zodat het tooltipje nooit over een bolletje of de klikbare cirkel eromheen heen valt — die
    // blijven zo altijd goed te zien en aan te klikken, ook bij het rondbewegen met de muis.
    tooltip.style.top = "0px";
  }

  function hide(){
    crosshair.style.display = "none";
    hoverIncome.style.display = "none";
    hoverKosten.style.display = "none";
    tooltip.classList.remove("visible");
  }

  function selectIdx(idx){
    if(typeof onSelect === "function") onSelect(data[idx].jaar);
  }

  overlay.addEventListener("pointermove", e => showAt(pointerToIndex(e)));
  overlay.addEventListener("pointerleave", hide);
  overlay.addEventListener("touchstart", e => showAt(pointerToIndex(e)), {passive:true});
  overlay.addEventListener("click", e => selectIdx(pointerToIndex(e)));

  wrap.querySelectorAll(".lchart-hit").forEach(hit=>{
    const idx = parseInt(hit.dataset.idx, 10);
    hit.addEventListener("pointermove", () => showAt(idx));
    hit.addEventListener("click", () => selectIdx(idx));
  });
  wrap.querySelectorAll(".lchart-dot").forEach(dot=>{
    dot.style.cursor = "pointer";
    const idx = parseInt(dot.dataset.idx, 10);
    dot.addEventListener("click", () => selectIdx(idx));
  });

  return wrap;
}

function donutChart(segs){
  /* Segmenten met noSlice (het tekort-segment, zie categorySegments) tellen niet mee voor de
     taart zelf — die zouden het totaal en daarmee alle verhoudingen van de drie lastencategorieën
     vertekenen (die samen al gelijk zijn aan de totale uitgaven). Het tekort krijgt in plaats
     daarvan een eigen dun ringetje net BUITEN de taart (zie tekortRing hieronder) — zo staat het
     wél zichtbaar in het cirkeldiagram zelf, in plaats van alleen als tekst in de legenda. De
     grootte van dat ringetje (hoeveel graden het beslaat) is de verhouding tekort/totale-uitgaven,
     dezelfde noemer als de taart, dus ook dat blijft eerlijk schaalbaar. */
  const sliceSegs = segs.filter(s=>!s.noSlice);
  const tekortSeg = segs.find(s=>s.noSlice && s.key==="tekort");
  const total = sliceSegs.reduce((a,s)=>a+s.v,0) || 1;
  const cx=90, cy=90, r=70, rInner=42;
  let angle = -Math.PI/2;
  let paths = "";
  sliceSegs.forEach(s=>{
    const frac = s.v/total;
    const a0 = angle;
    const a1 = angle + frac*Math.PI*2;
    angle = a1;
    const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0);
    const x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    const xi1=cx+rInner*Math.cos(a1), yi1=cy+rInner*Math.sin(a1);
    const xi0=cx+rInner*Math.cos(a0), yi0=cy+rInner*Math.sin(a0);
    const large = (a1-a0) > Math.PI ? 1 : 0;
    if(frac>0){
      paths += `<path d="M${x0},${y0} A${r},${r} 0 ${large} 1 ${x1},${y1} L${xi1},${yi1} A${rInner},${rInner} 0 ${large} 0 ${xi0},${yi0} Z" fill="${s.c}"/>`;
    }
  });
  let tekortRing = "";
  if(tekortSeg && tekortSeg.v > 0){
    const rO = r + 7, rOi = r + 2;
    const fracTekort = Math.min(1, tekortSeg.v / total);
    if(fracTekort >= 0.995){
      tekortRing = `<circle cx="${cx}" cy="${cy}" r="${(rO+rOi)/2}" fill="none" stroke="${CAT_COLORS.tekort}" stroke-width="${rO-rOi}"/>`;
    } else {
      const a0 = -Math.PI/2, a1 = a0 + fracTekort*Math.PI*2;
      const x0=cx+rO*Math.cos(a0), y0=cy+rO*Math.sin(a0);
      const x1=cx+rO*Math.cos(a1), y1=cy+rO*Math.sin(a1);
      const xi1=cx+rOi*Math.cos(a1), yi1=cy+rOi*Math.sin(a1);
      const xi0=cx+rOi*Math.cos(a0), yi0=cy+rOi*Math.sin(a0);
      const large = fracTekort > 0.5 ? 1 : 0;
      tekortRing = `<path d="M${x0},${y0} A${rO},${rO} 0 ${large} 1 ${x1},${y1} L${xi1},${yi1} A${rOi},${rOi} 0 ${large} 0 ${xi0},${yi0} Z" fill="${CAT_COLORS.tekort}"/>`;
    }
  }
  const legend = segs.map(s=>`<span><span class="dot" style="background:${s.c}"></span>${s.l}: € ${fmt(s.v)}</span>`).join("");
  return `<svg viewBox="0 0 180 180" width="180" height="180">${paths}${tekortRing}
    <text x="90" y="86" text-anchor="middle" fill="var(--text-onink)" font-size="11" font-family="Segoe UI,sans-serif">${t("totaal")}</text>
    <text x="90" y="102" text-anchor="middle" fill="var(--text-onink)" font-size="13" font-weight="700" font-family='Courier New,monospace'>€ ${fmt(total)}</text>
  </svg><div class="legend">${legend}</div>`;
}

/* ---------- RENDER: SHARED ACTIONS BLOCK ---------- */
function renderActionsHTML(showDeleteMonth, showDeleteScenario, showDeleteBudget){
  return `
    <div class="actions">
      <button id="saveNowBtn" class="primary">${t("saveNowBtn")}</button>
      <button id="logoutBtn">${t("logoutBtn")}</button>
      <button id="exportBtn">${t("exportBtn")}</button>
      <button id="importBtn">${t("importBtn")}</button>
      <button id="resetBtn">${t("resetBtn")}</button>
      ${showDeleteMonth ? `<button id="deleteMonthBtn" class="danger">${t("deleteMonthBtn")}</button>` : ""}
      ${showDeleteScenario ? `<button id="deleteScenarioBtn" class="danger">${t("deleteScenarioBtn")}</button>` : ""}
      ${showDeleteBudget ? `<button id="deleteBudgetBtn" class="danger">${t("deleteBudgetBtn")}</button>` : ""}
    </div>
    <div class="save-status"></div>
    <input type="file" id="importFile" accept=".json,.html,.htm" style="display:none"/>
  `;
}

function wireActions(monthObj, scenarioObj, budgetObj){
  document.getElementById("saveNowBtn").onclick = saveNow;
  document.getElementById("logoutBtn").onclick = signOutCloud;
  updateSaveStatus();
  document.getElementById("exportBtn").onclick = downloadBackupCopy;
  document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();
  document.getElementById("importFile").onchange = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try{
        const text = ev.target.result;
        // Aanvaardt zowel een los JSON-exportbestand (oudere back-up) als een HTML-kopie van
        // deze app mét ingebedde data — wordt automatisch herkend.
        const trimmed = text.trim();
        const data = trimmed.startsWith("<") ? extractEmbeddedDataFromHtml(text) : JSON.parse(text);
        if(!data) throw new Error(t("importError"));

        /* Het bestand wordt eerst volledig op een KOPIE beproefd: vorm controleren, aanvullen,
           migreren en zelfs proefdraaien met renderAll(). Pas als dat allemaal lukt, wordt de echte
           `state` vervangen.
           Tot v25 gebeurde het omgekeerde — `state = data` stond bovenaan, en als de migratie of het
           tekenen daarna struikelde ving de catch dat af met een melding terwijl de administratie al
           weg was. Er is één cloudrij zonder versiegeschiedenis, en de eerstvolgende automatische
           opslag (500 ms na de eerstvolgende klik) schreef de rommel eroverheen. Eén keer het
           verkeerde bestand aanklikken in de bestandskiezer was genoeg. */
        if(typeof data !== "object" || Array.isArray(data)) throw new Error(t("importShapeError"));
        if(!Array.isArray(data.scenarios) || !data.scenarios.length) throw new Error(t("importShapeError"));
        const heeftGroepen = data.scenarios.every(s => s && s.income && Array.isArray(s.income.items)
          && s.vasteLasten && s.abonnementen && s.variabeleLasten);
        const legacyVorm = data.income && data.vasteLasten && data.abonnementen && data.variabeleLasten;
        if(!heeftGroepen && !legacyVorm) throw new Error(t("importShapeError"));

        const vorigeState = state;
        const kandidaat = data;
        if(!kandidaat.activeView) kandidaat.activeView = {type:"scenario", index: kandidaat.activeScenario||0};
        if(!kandidaat.months) kandidaat.months = [];
        if(!kandidaat.lang) kandidaat.lang = "nl";
        if(!kandidaat.loonstijging) kandidaat.loonstijging = DEFAULT_LOONSTIJGING.slice();
        try{
          state = kandidaat;
          migrateState();
          renderAll();
        }catch(binnenErr){
          // Terug naar precies waar de gebruiker was; er is niets verloren gegaan.
          state = vorigeState;
          renderAll();
          throw binnenErr;
        }
      }catch(err){ alert(t("importError") + err.message); }
    };
    reader.readAsText(file);
  };
  /* "Herladen" en niet "Reset". Deze knop kán geen wijzigingen ongedaan maken: hij deed
     location.reload(), en juist het verversen laat de beforeunload-hook de openstaande wijzigingen
     nog snel opslaan — waarna ze meteen weer worden ingeladen. De knop beloofde dus het
     tegenovergestelde van wat hij deed. Wat hij wél kan: de laatst opgeslagen versie uit de cloud
     opnieuw ophalen, bijvoorbeeld nadat er elders iets is opgeslagen. Openstaande wijzigingen gaan
     daarbij verloren, en dat wordt nu eerlijk gevraagd. */
  document.getElementById("resetBtn").onclick = () => {
    if(!confirm(t("reloadConfirm"))) return;
    clearTimeout(autoSaveTimer);
    cancelRetry();
    dirty = false; // zodat de beforeunload-hook niets meer wegschrijft
    location.reload();
  };
  const delBtn = document.getElementById("deleteMonthBtn");
  if(delBtn && monthObj){
    delBtn.onclick = () => {
      if(confirm(t("deleteMonthConfirm"))){
        state.months = state.months.filter(m=>m.key!==monthObj.key);
        state.activeView = {type:"scenario", index: state.activeScenario};
        renderAll();
      }
    };
  }
  const delScenarioBtn = document.getElementById("deleteScenarioBtn");
  if(delScenarioBtn && scenarioObj && !scenarioObj.locked){
    delScenarioBtn.onclick = () => {
      if(confirm(t("deleteScenarioConfirm"))){
        const idx = state.scenarios.indexOf(scenarioObj);
        state.scenarios = state.scenarios.filter(s=>s!==scenarioObj);
        state.activeScenario = Math.max(0, idx-1);
        state.activeView = {type:"scenario", index: state.activeScenario};
        renderAll();
      }
    };
  }
  const delBudgetBtn = document.getElementById("deleteBudgetBtn");
  if(delBudgetBtn && budgetObj){
    delBudgetBtn.onclick = () => {
      if(confirm(t("deleteBudgetConfirm"))){
        detachMonthsFromBudget(budgetObj.id);
        state.budgets = state.budgets.filter(b=>b!==budgetObj);
        state.activeView = {type:"scenario", index: 0};
        renderAll();
      }
    };
  }
}

/* ---------- RENDER: SUMMARY ---------- */
function renderSummary(){
  if(state.activeView.type === "month"){
    renderMonthSummary();
    return;
  }
  if(state.activeView.type === "budget"){
    renderBudgetSummary();
    return;
  }
  if(state.activeView.type === "loonstijging"){
    renderLoonstijgingSummary();
    return;
  }
  if(state.activeView.type === "importBasisdata"){
    // Dit scherm gebruikt de volle breedte van #categories zelf; de rechterkolom blijft leeg
    // (net als bij een net-verwijderd maandbudget/scenario elders in de app).
    document.getElementById("summary").innerHTML = "";
    return;
  }
  renderScenarioSummary();
}

function renderBudgetSummary(){
  const b = budgetObjFromView();
  const el = document.getElementById("summary");
  if(!b){ el.innerHTML = ""; return; }
  const income = sum(b.income.items);
  const vasteLasten = vasteLastenTotalForBudget(b);
  const abonnementen = sum(b.abonnementen.items);
  const variabeleLasten = sum(b.variabeleLasten.items);
  const outstanding = b.outstanding ? sum(b.outstanding.items) : 0;
  const totaalUitgaven = vasteLasten + abonnementen + variabeleLasten + outstanding;
  const over = income - totaalUitgaven;
  el.innerHTML = `
    <h2>${escapeHtml(b.title)}</h2>
    <div class="stamp ${over<0?'negative':''}">
      <div class="stamp-label">${over<0? t("tekort") : t("overTeSpenderen")}</div>
      <div class="stamp-value">€ ${fmt(Math.abs(over))}</div>
      <div class="stamp-sub">${t("stampSub")}</div>
    </div>

    <div class="summary-line credit"><span class="l">${t("nettoInkomsten")}</span><span class="v">€ ${fmt(income)}</span></div>
    <div class="summary-line debit"><span class="l">${t("vasteLasten")}</span><span class="v">− € ${fmt(vasteLasten)}</span></div>
    <div class="summary-line debit"><span class="l">${t("abonnementen")}</span><span class="v">− € ${fmt(abonnementen)}</span></div>
    <div class="summary-line debit"><span class="l">${t("variabeleLasten")}</span><span class="v">− € ${fmt(variabeleLasten)}</span></div>
    ${outstanding > 0 ? `<div class="summary-line debit"><span class="l">${t("outstandingTitle")}</span><span class="v">− € ${fmt(outstanding)}</span></div>` : ""}
    <div class="summary-line total"><span class="l">${t("saldo")}</span><span class="v">€ ${fmt(over)}</span></div>

    <div class="chart-block">
      <h2>${t("chartTitle2")}</h2>
      ${donutChart(categorySegments(vasteLasten, abonnementen, variabeleLasten, over))}
    </div>

    ${renderActionsHTML(false, false, true)}
  `;
  wireActions(null, null, b);
}

  const totals = computeTotals();
  const i = state.activeScenario;
  const s = state.scenarios[i];
  const net = totals.netIncome[i];
  const over = totals.overTeSpenderen[i];

  el.innerHTML = `
    <h2>${escapeHtml(s.label)} (${escapeHtml(s.jaar)})</h2>
    <div class="stamp ${over<0?'negative':''}">
      <div class="stamp-label">${over<0? t("tekort") : t("overTeSpenderen")}</div>
      <div class="stamp-value">€ ${fmt(Math.abs(over))}</div>
      <div class="stamp-sub">${t("stampSub")}</div>
    </div>

    <div class="summary-line credit"><span class="l">${t("nettoInkomsten")}</span><span class="v">€ ${fmt(net)}</span></div>
    <div class="summary-line debit"><span class="l">${t("vasteLasten")}</span><span class="v">− € ${fmt(totals.vasteLasten)}</span></div>
    <div class="summary-line debit"><span class="l">${t("abonnementen")}</span><span class="v">− € ${fmt(totals.abonnementen)}</span></div>
    <div class="summary-line debit"><span class="l">${t("variabeleLasten")}</span><span class="v">− € ${fmt(totals.variabeleLasten)}</span></div>

    <div class="chart-block">

function renderMonthSummary(){
  const m = state.months.find(x=>x.key===state.activeView.key);
  const el = document.getElementById("summary");
  if(!m){ el.innerHTML = ""; return; }
  const totals = computeMonthTotals(m);
  const over = totals.income - totals.totaalUitgaven;

  const budget = m.budgetId ? state.budgets.find(b=>b.id===m.budgetId) : null;
  let secondStamp = "";
  let budgetLine = "";
  if(budget){
    const bIncome = sum(budget.income.items);
    // vasteLastenTotalForBudget en niet sum(): een regel die via een aftrekkoppeling van een andere
    // regel wordt afgetrokken, telt in de kale som twee keer mee (los én verwerkt in zijn doelregel).
    // Dit was de enige plek die dat nog met sum() deed, waardoor de budgetpagina en de maandpagina
    // over hetzelfde budget verschillende bedragen lieten zien.
    const bTotaalUitgaven = vasteLastenTotalForBudget(budget) + sum(budget.abonnementen.items) + sum(budget.variabeleLasten.items) + (budget.outstanding ? sum(budget.outstanding.items) : 0);
    const bOver = bIncome - bTotaalUitgaven;
    const diff = over - bOver;
    secondStamp = `
      <div class="stamp ${bOver<0?'negative':''}">
        <div class="stamp-label">${bOver<0? t("tekort") : t("overTeSpenderen")}</div>
        <div class="stamp-value">€ ${fmt(Math.abs(bOver))}</div>
        <div class="stamp-sub">${escapeHtml(t("begrootSaldo")(budget.title))}</div>
      </div>
    `;
    budgetLine = `
      <div class="summary-line ${diff<0?'debit':'credit'}"><span class="l">${t("verschilMetBudget")}</span><span class="v">${diff>=0?'+':'−'} € ${fmt(Math.abs(diff))}</span></div>
    `;
  }

  el.innerHTML = `
    <h2>${monthLabel(m)}</h2>
    <div class="stamp-row">
      <div class="stamp ${over<0?'negative':''}">
        <div class="stamp-label">${over<0? t("tekort") : t("overTeSpenderen")}</div>
        <div class="stamp-value">€ ${fmt(Math.abs(over))}</div>
        <div class="stamp-sub">${budget ? t("werkelijkStampSub") : t("stampSub")}</div>
      </div>
      ${secondStamp}
    </div>

    <div class="summary-line credit"><span class="l">${t("nettoInkomsten")}</span><span class="v">€ ${fmt(totals.income)}</span></div>
    <div class="summary-line debit"><span class="l">${t("vasteLasten")}</span><span class="v">− € ${fmt(totals.vasteLasten)}</span></div>
    <div class="summary-line debit"><span class="l">${t("abonnementen")}</span><span class="v">− € ${fmt(totals.abonnementen)}</span></div>
    <div class="summary-line debit"><span class="l">${t("variabeleLasten")}</span><span class="v">− € ${fmt(totals.variabeleLasten)}</span></div>
    <div class="summary-line total"><span class="l">${t("saldo")}</span><span class="v">€ ${fmt(over)}</span></div>
    ${budgetLine}

    <div class="chart-block">
      <h2>${t("chartTitle1Month")}</h2>
      ${monthBarChart(totals)}
      <div class="legend">${categoryLegendHTML()}</div>
    </div>

    <div class="chart-block">
      <h2>${t("chartTitle2")}</h2>
      ${donutChart(categorySegments(totals.vasteLasten, totals.abonnementen, totals.variabeleLasten, over))}
    </div>

    ${renderActionsHTML(true, false, false)}
  `;
  wireActions(m);
}

function renderLoonstijgingSummary(){
  const el = document.getElementById("summary");
  const data = effectiveLoonstijgingRows();
  const nowYear = new Date().getFullYear();
  const fallbackYear = data.find(d=>d.jaar===nowYear) ? nowYear : data[data.length-1].jaar;
  const selectedYear = state.loonstijgingSelectedYear || fallbackYear;
  const row = data.find(d=>d.jaar===selectedYear) || data[data.length-1];
  const kosten = huidigKosten();
  const over = row.totaalPerMaand - kosten;
  el.innerHTML = `
    <h2>${t("loonstijgingEyebrow")}</h2>

    <div class="summary-line credit"><span class="l">${t("legendNettoInkomen")} (${row.jaar})</span><span class="v">€ ${fmt(row.totaalPerMaand)}</span></div>
    <div class="summary-line debit"><span class="l">${t("legendKosten")}</span><span class="v">− € ${fmt(kosten)}</span></div>
    <div class="summary-line total"><span class="l">${t("saldo")}</span><span class="v">€ ${fmt(over)}</span></div>

    <div class="chart-block" id="loonstijgingChartBlock">
      <h2>${t("loonstijgingTitle")}</h2>
      <div class="card-note" style="padding:0 0 8px;">${t("loonstijgingClickHint")}</div>
    </div>

    ${renderActionsHTML(false)}
  `;
  const chartBlock = document.getElementById("loonstijgingChartBlock");
  chartBlock.appendChild(loonstijgingLineChart(data, row.jaar, (jaar) => {
    state.loonstijgingSelectedYear = jaar;
    renderSummary();
  }));
  const legendDiv = document.createElement("div");
  legendDiv.className = "legend";
  legendDiv.innerHTML = loonstijgingLegendHTML();
  chartBlock.appendChild(legendDiv);
  wireActions();
}

/* ---------- NAVIGATIELADE ---------- */
/* Standaard dicht. Gaat dicht na het kiezen van een bestemming (dat is renderTabs' taak niet, dus
   dat gebeurt hier via een klik-listener op de lade zelf), bij Escape, en bij een klik naast de
   lade. Bewust géén onderdeel van `state`: of het menu openstaat is een moment-opname van dit
   scherm, niet iets om te bewaren of te syncen. */
let navDrawerOpen = false;

function setNavDrawer(open){
  const stondOpen = navDrawerOpen;
  navDrawerOpen = open;
  const drawer = document.getElementById("navDrawer");
  const backdrop = document.getElementById("navBackdrop");
  const toggle = document.getElementById("navToggleBtn");
  if(!drawer || !backdrop || !toggle) return;
  // Elke keer dat de lade opengaat begint hij weer in z'n uitgangsstand: alles dichtgeklapt.
  // Het menu is er om ergens naartoe te springen, niet om open te laten staan — en na een week
  // met drie uitgeklapte groepen scroll je bij elke opening langs een lijst die je niet zocht.
  // Bewust vóór het openschuiven, zodat je de groepen niet ziet dichtklappen.
  if(open && !stondOpen){
    collapsedGroups = defaultCollapsedGroups();
    renderTabs();
  }
  drawer.classList.toggle("open", open);
  drawer.setAttribute("aria-hidden", open ? "false" : "true");
  // inert waar de browser het kent: haalt de inhoud uit de tabvolgorde én uit de toegankelijkheids-
  // boom, zodat aria-hidden en de werkelijke focusvolgorde niet langer tegenstrijdig zijn.
  if("inert" in drawer) drawer.inert = !open;
  backdrop.classList.toggle("open", open);
  toggle.setAttribute("aria-expanded", open ? "true" : "false");
  if(open){
    // Focus naar de lade, zodat toetsenbordnavigatie meteen binnen het menu zit.
    const eerste = drawer.querySelector(".tab-group-head-direct, .tab, button");
    if(eerste) eerste.focus({ preventScroll:true });
  }
}

document.getElementById("navToggleBtn").addEventListener("click", () => setNavDrawer(!navDrawerOpen));
document.getElementById("navCloseBtn").addEventListener("click", () => setNavDrawer(false));
document.getElementById("navBackdrop").addEventListener("click", () => setNavDrawer(false));

/* Een klik op iets wat naar een andere pagina navigeert sluit de lade. De knoppen die juist in het
   menu thuishoren — in-/uitklappen, "+", de prullenbak en de twee maand-uploadknoppen — laten 'm
   open, anders moet je 'm na elke handeling opnieuw openen.
   "Import basisdata" deelt de .tab-upload-stijl met die uploadknoppen, maar is wél een pagina —
   vandaar de uitzondering op de uitzondering. */
document.getElementById("navDrawer").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if(!btn) return;
  if(btn.closest(".nav-drawer-head")) return;
  if(btn.classList.contains("group-collapse-btn")
    || btn.classList.contains("group-add-btn")
    || btn.classList.contains("tab-delete-btn")
    || (btn.classList.contains("tab-upload") && !btn.classList.contains("tab-import-bd"))
    || btn.closest(".tab-group-head:not(.tab-group-head-direct)")) return;
  setNavDrawer(false);
});

document.addEventListener("keydown", (e) => {
  if(e.key === "Escape" && navDrawerOpen) setNavDrawer(false);
});

document.getElementById("profileBtn").addEventListener("click", () => {
  if(profilePanelOpen) closeProfilePanel(); else openProfilePanel();
});
document.getElementById("profileBackdrop").addEventListener("click", closeProfilePanel);
document.getElementById("profileCloseBtn").addEventListener("click", closeProfilePanel);
document.addEventListener("keydown", (e) => {
  if(e.key === "Escape" && profilePanelOpen) closeProfilePanel();
});

/* Bootstrap: de rest van de app wordt pas getekend NADAT er is ingelogd én het
   versleutelingswachtwoord is ingevoerd/gekozen (zie bootApp(), die vanuit de auth-gate hierboven
   wordt aangeroepen zodra `state` daadwerkelijk (ontsleuteld) bekend is). Tot die tijd staat alleen
   de login-overlay er. Is er al eerder data ingebed in dít bestand (een eerder geëxporteerde
   kopie), dan biedt de auth-gate die aan als startpunt bij een gloednieuw account — zie
   renderEncryptionPromptNew() / readEmbeddedData() hierboven. */
function bootApp(){
  // Start altijd op Basisdata bij het inloggen (issue #5) — ongeacht welke pagina het laatst
  // actief was toen er voor het laatst opgeslagen is. bootApp() wordt uitsluitend aangeroepen
  // vanuit de twee inlog-momenten hierboven (na het invoeren van het versleutelingswachtwoord),
  // dus dit raakt nooit gewoon navigeren binnen een al ingelogde sessie.
  state.activeScenario = 0;
  state.activeView = { type:"scenario", index:0 };
  syncComputedLoons();
  renderHeader();
  renderTabs();
  renderCategories();
  renderSummary();
  updateSaveStatus();
}

document.documentElement.dataset.mode = state.darkMode ? "dark" : "light";
renderAuthGate();

/* Was je al ingelogd (Supabase onthoudt de sessie zelf, in localStorage van déze browser) — dan
   hoef je niet opnieuw je e-mail/wachtwoord in te typen, alleen nog je versleutelingswachtwoord. */
if(cloudClient){
  cloudClient.auth.getSession().then(({ data }) => {
    if(data && data.session){
      cloudSession = data.session;
      renderAuthGate();
    }
  });
}
