/* ---------- RENDER: LOONSVERHOGING-BLOK PER JAAR ---------- */
/* Elk niet-Basisdata jaar (2027, 2028, en elk zelf aangemaakt jaar) heeft bovenaan zijn eigen
   loonsverhoging-blok: vast bedrag + percentage, toegepast op het loon van het jaar ervoor. Dat
   resultaat is het loon van DIT jaar (zie computedLoon) — direct zichtbaar in de Inkomsten-kaart
   eronder (daar staat Loon read-only, met een verwijzing naar dit blok). */
function renderLoonsverhogingCard(s){
  const idx = state.scenarios.indexOf(s);
  const prev = state.scenarios[idx-1];
  if(!s.loonstijging) s.loonstijging = { vast:0, pct:0 };
  const wrap = document.createElement("div");
  wrap.className = "card";
  wrap.innerHTML = `
    <div class="card-head">
      <h2>${t("loonsverhogingTitle")(s.jaar)}</h2>
    </div>
    <div class="verhogingen-info">
      <div>${t("vorigJaarLoon")(prev.jaar)}: <span class="mono">€ ${fmt(computedLoon(prev))}</span></div>
    </div>
    <div class="rows verhogingen-rows">
      <div class="row">
        <input class="label-input" value="${t("indexLabel")}" disabled />
        <div class="value-wrap">
          <span class="euro">€</span>
          <input class="value-input" id="loonstijgingVastInput" type="number" step="0.01" value="${(Number(s.loonstijging.vast)||0).toFixed(2)}" />
        </div>
      </div>
      <div class="row">
        <input class="label-input" value="${t("pctLabel")}" disabled />
        <div class="value-wrap pct-stepper">
          <div class="stepper-btns">
            <button type="button" class="step-btn" id="loonstijgingPctMinus" aria-label="${t('pctLabel')} −1">−</button>
            <button type="button" class="step-btn" id="loonstijgingPctPlus" aria-label="${t('pctLabel')} +1">+</button>
          </div>
          <input class="value-input" id="loonstijgingPctInput" type="number" step="1" value="${Number(s.loonstijging.pct)||0}" />
          <span class="euro">%</span>
        </div>
      </div>
    </div>
    <div class="verhogingen-info">
      <div>${t("nieuwLoonResultaat")(s.jaar)}: <span class="mono" id="loonstijgingResultDisplay">€ ${fmt(computedLoon(s))}</span></div>
    </div>
    ${getLoonItem(basisdataScenario()) ? "" : `<div class="card-note">${escapeHtml(t("noSalaryRowNote"))}</div>`}
  `;
  const updatePreview = () => {
    const el = document.getElementById("loonstijgingResultDisplay");
    if(el) el.textContent = `€ ${fmt(computedLoon(s))}`;
  };
  /* Bij de +/- pijltjes van een number-input vuurt Chromium meteen een "change" (niet pas bij
     verlaten van het veld) — een renderAll() daarop bouwt de kaart opnieuw op, en dat nieuwe
     invoerveld heeft dan geen focus meer. Zonder deze fix moest je na élk stapje opnieuw klikken.
     Had het veld de focus vóór het herbouwen, dan krijgt het 'm er hierna dus weer bij terug, zodat
     je met de pijltjes gewoon door kunt blijven klikken (bijv. meerdere hele procenten achter elkaar). */
  const changeHandler = (id) => () => {
    const hadFocus = document.activeElement && document.activeElement.id === id;
    renderAll();
    if(hadFocus){
      const el = document.getElementById(id);
      if(el){ el.focus(); const v = el.value; el.value = ""; el.value = v; }
    }
  };
  wrap.querySelector("#loonstijgingVastInput").oninput = e => {
    s.loonstijging.vast = parseFloat(e.target.value) || 0;
    updatePreview();
  };
  wrap.querySelector("#loonstijgingVastInput").onchange = changeHandler("loonstijgingVastInput");
  wrap.querySelector("#loonstijgingPctInput").oninput = e => {
    s.loonstijging.pct = parseFloat(e.target.value) || 0;
    updatePreview();
  };
  wrap.querySelector("#loonstijgingPctInput").onchange = changeHandler("loonstijgingPctInput");
  /* +/- stapper-knoppen: zelfde effect als de (nu verborgen) pijltjes van het getalveld, maar
     altijd zichtbaar en groot genoeg om ook op een telefoon/tablet aan te tikken. Passen de
     waarde direct aan zonder de kaart opnieuw op te bouwen — geen focus-gedoe, blijft dus ook
     achter elkaar aantikbaar werken. */
  const pctInput = wrap.querySelector("#loonstijgingPctInput");
  const stepPct = (delta) => {
    s.loonstijging.pct = (Number(s.loonstijging.pct) || 0) + delta;
    pctInput.value = s.loonstijging.pct;
    updatePreview();
    // Zelfde volledige sync (incl. het samenvattingspaneel rechts) als na typen/pijltjes +
    // de focus-fix hierboven, zodat de knoppen ook meerdere keren achter elkaar aantikbaar blijven.
    changeHandler("loonstijgingPctInput")();
  };
  wrap.querySelector("#loonstijgingPctMinus").onclick = () => stepPct(-1);
  wrap.querySelector("#loonstijgingPctPlus").onclick = () => stepPct(1);
  return wrap;
}

/* Nieuw jaar aanmaken gebeurt nu vanuit het "+"-knopje bij de groep "Jaren" in het menu
   (zie renderTabs) in plaats van een kaart onderaan de pagina — altijd zichtbaar, geen scrollen. */
/* Maakt een nieuw jaar aan als volledige, onafhankelijke kopie van het meest recente jaar
   (inkomsten, vaste lasten, abonnementen, variabele lasten, incl. het loon van dat jaar als
   startpunt). Het eigen loonsverhoging-blok van het nieuwe jaar start als kopie van dat van het
   meest recente jaar en is daarna los aanpasbaar. Nieuwe jaren zijn niet "locked" en dus
   verwijderbaar. */
function createNewYear(){
  const latest = latestScenario();
  const nextJaar = latest.jaar + 1;
  const defaultLoonstijging = latest.loonstijging
    ? { vast: latest.loonstijging.vast, pct: latest.loonstijging.pct }
    : { vast: 0, pct: 0 };
  const newScenario = makeScenario(String(nextJaar), nextJaar, false,
    latest.income.items, latest.vasteLasten.items, latest.abonnementen.items, latest.variabeleLasten.items,
    defaultLoonstijging);
  state.scenarios.push(newScenario);
  state.activeScenario = state.scenarios.length - 1;
  state.activeView = { type:"scenario", index: state.activeScenario };
  renderAll();
}

/* Vuilnisbak-icoontje voor verwijder-knopjes (bv. .tab-delete-btn) — vervangt een kaal "×" zodat in
   één oogopslag duidelijk is dat het om verwijderen gaat, in dezelfde lijn-icoonstijl (currentColor,
   dunne stroke) als CARD_ICONS/group-collapse-btn hieronder. */
const TRASH_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2"/><path d="M6 7l1 13a1 1 0 001 1h8a1 1 0 001-1l1-13"/><path d="M10 11v6M14 11v6"/></svg>`;

/* Slotje voor de "verwijderen geblokkeerd"-knop op een categorie die nog aan rijen gekoppeld is
   (zie renderCategoryList) -- zelfde lijn-icoonstijl als TRASH_ICON. */
const LOCK_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>`;

/* ---------- CATEGORIEËN (Profiel > Categorieën) ----------
   Eigen, door de gebruiker aangemaakte categorieën om "Nog in te delen"-rijen (m.review, zie
   buildMonthFromCSV) mee te labelen. Elke categorie hoort nu bij precies één van de vier vaste
   hoofdgroepen (income/vasteLasten/abonnementen/variabeleLasten, zie CATEGORY_BUCKET_KEYS) --
   dezelfde naam mag dus prima in twee verschillende groepen bestaan (uniek-check is per groep, zie
   createCategory). Een categorie die aan minstens één rij gekoppeld is ("in gebruik") kan niet
   verwijderd worden vóórdat al die koppelingen zijn opgeheven of verplaatst naar een andere
   categorie (uit om het even welke groep) -- zie deleteCategory()/categoryUsageEntries(). */
const CATEGORY_BUCKET_KEYS = ["income","vasteLasten","abonnementen","variabeleLasten"];

// Accentkleur (CSS custom property) per groep -- zie --profile-cat-* in :root/html[data-mode="dark"].
function bucketColorVar(bucket){
  const map = { income:"--profile-cat-income", vasteLasten:"--profile-cat-vaste", abonnementen:"--profile-cat-abon", variabeleLasten:"--profile-cat-variabel" };
  return `var(${map[bucket] || "--gold"})`;
}

function findCategory(catId){
  return state.categories.find(c => c.id === catId) || null;
}

// Elke "Nog in te delen"-rij (m.review[i]) die deze categorie draagt, over alle maanden heen --
// dit is precies de koppeling die verwijderen blokkeert (zie deleteCategory hieronder).
function categoryUsageEntries(catId){
  const out = [];
  state.months.forEach(m=>{
    (m.review||[]).forEach(entry=>{
      if(entry.catId === catId) out.push({ month: m, entry });
    });
  });
  return out;
}

/* Hoeveel regels in Basisdata op dit moment onder de naam van deze categorie staan.

   Categorie-gebruik werd tot nu toe alleen geteld in de maand-vergelijkingsflow (m.review[].catId).
   Een categorie die je bij "Import basisdata" gebruikt om rijen samen te voegen, bleef daardoor
   "Ongebruikt" heten terwijl er gewoon een Basisdata-regel met die naam stond — verwarrend, want
   dat is precies waar je 'm voor gebruikt hebt.

   Er wordt op naam gematcht en niet op een id: applyImportBasisdata() schrijft regels weg als
   {label, bedrag}, zonder verwijzing naar de categorie. Dat is bewust — de gebruiker mag een
   regelnaam daarna vrij aanpassen — en past bij hoe FinBo elders ook op naam koppelt (aftrek-
   koppelingen, maand tegen budget). Hernoem je de regel, dan telt hij niet meer mee, en dat klopt. */
function categoryBasisdataUsage(cat){
  const bd = basisdataScenario();
  const groep = bd && bd[cat.bucket];
  if(!groep || !groep.items) return 0;
  const naam = (cat.name||"").trim().toLowerCase();
  return groep.items.filter(it => (it.l||"").trim().toLowerCase() === naam).length;
}

// Naam hoeft maar uniek te zijn BINNEN dezelfde groep -- "Boodschappen" onder Variabele lasten en
// een heel andere "Boodschappen" onder Vaste lasten mogen prima naast elkaar bestaan.
function createCategory(name, bucket){
  const trimmed = (name||"").trim();
  if(!trimmed) return { error:"empty" };
  if(trimmed.length > MAX_CATEGORY_NAME_LEN) return { error:"toolong" };
  if(!CATEGORY_BUCKET_KEYS.includes(bucket)) return { error:"invalidbucket" };
  if(state.categories.some(c => c.bucket === bucket && c.name.toLowerCase() === trimmed.toLowerCase())) return { error:"duplicate" };
  const category = { id:"cat-"+Date.now()+"-"+Math.random().toString(36).slice(2,7), name:trimmed, bucket };
  state.categories.push(category);
  return { category };
}

// Verwijdert alleen als er nul koppelingen meer over zijn -- roep dit dus pas aan nadat de
// gebruiker (via renderCategoryList) alle gekoppelde rijen heeft ontkoppeld of verplaatst.
function deleteCategory(catId){
  if(categoryUsageEntries(catId).length) return false;
  state.categories = state.categories.filter(c => c.id !== catId);
  return true;
}

/* ---------- RENDER: CATEGORY CARD (generiek, gebruikt door scenario's en maanden) ---------- */
/* Kleine lijn-iconen per categorie-kaart — puur ter herkenning, geen functie. Gebruiken
   currentColor zodat ze automatisch de --forest-kleur van de kop volgen (ook in donkere modus). */
const CARD_ICONS = {
  income: `<svg class="cat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v18M6 8l6-5 6 5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  vasteLasten: `<svg class="cat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7M5 10v9h14v-9" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  abonnementen: `<svg class="cat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 9h8M8 13h5" stroke-linecap="round"/></svg>`,
  variabeleLasten: `<svg class="cat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3v4M18 3v4M4 8h16l-1.5 12.5a1 1 0 01-1 .5H6.5a1 1 0 01-1-.5L4 8z" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
};

function renderCard(key, cat, opts={}){
  const wrap = document.createElement("div");
  wrap.className = "card";
  // Groepskleur meegeven aan de CSS (zie .card-bucket hierboven). Alleen voor de vier echte
  // groepen; een kaart met een andere sleutel (bv. een reviewkaart) blijft ongekleurd.
  if(CATEGORY_BUCKET_KEYS.includes(key)){
    wrap.classList.add("card-bucket");
    wrap.style.setProperty("--bucket-color", bucketColorVar(key));
  }
  const total = (opts.totalOverride !== undefined) ? opts.totalOverride : sum(cat.items);
  wrap.innerHTML = `
    <div class="card-head">
      <div class="htitle">${CARD_ICONS[key] || ""}<h2>${cat.title}</h2></div>
      <div class="cat-total mono">€ ${fmt(total)}</div>
    </div>
    <div class="rows"></div>
  `;
  const rows = wrap.querySelector(".rows");
  cat.items.forEach((item, idx)=>{
    const override = opts.valueFor ? opts.valueFor(item, idx) : null;
    const displayValue = override ? override.value : item.v;
    const editable = override ? override.editable : true;
    // Een berekend BEDRAG read-only maken betekent niet dat de NAAM op slot moet. Bij de
    // doelregel van een aftrekkoppeling is het bedrag afgeleid (en dus niet te typen), maar de
    // naam moet gewoon te wijzigen blijven — anders kun je een regel na het koppelen nooit meer
    // hernoemen, en zou de code die verwijzingen bij hernoemen meeverzet (zie labelInput.oninput
    // hieronder) nooit kunnen draaien. valueFor mag dit per regel aangeven met labelEditable.
    const labelEditable = override ? (override.labelEditable === true ? true : override.editable) : true;
    // Postnamen zijn gebruikersdata en worden onvertaald getoond (zie de notitie bij i18n).
    // escapeHtml is hier nodig omdat het label zo meteen in een value="..."-attribuut belandt:
    // een apostrof of aanhalingsteken in een zelfbedachte naam brak anders de hele rij.
    const displayLabel = escapeHtml((override && override.label !== undefined) ? override.label : item.l);

    // Een via "Toepassen op budget" overgenomen combinatieregel (bv. Geldmaat/Bouwmarkt/Online,
    // zie applyMonthToBudget) draagt zijn per-transactie-detail nu mee het budget in, dus krijgt
    // hier dezelfde uitklapbare, ingesprongen deellijst als de maand zelf al toonde.
    const hasBreakdown = item.entries && item.entries.length > 1;
    const breakdownKey = `budgetcard:${key}::${item.l}`;
    const isOpen = hasBreakdown && expandedBreakdowns.has(breakdownKey);

    const rowWrap = document.createElement("div");
    rowWrap.className = "row-wrap";

    // Markeerknopjes. salaryPicker: welke inkomstenregel het salaris is (zie getLoonItem).
    // offsetPicker: van welke andere regel deze regel wordt afgetrokken (zie findOffsetPairs).
    // Allebei alleen daar waar de kaart erom vraagt, zodat gewone kaarten onveranderd blijven.
    const isSalary = item.role === "salary";
    const pickerKey = `${typeof opts.offsetPicker === "string" ? opts.offsetPicker : "?"}::${key}::${idx}`;
    const pickerOpen = offsetPickerOpenFor === pickerKey;
    const hasOffset = !!(item.offsetTarget||"").trim();

    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      ${hasBreakdown ? `<button type="button" class="breakdown-toggle-btn ${isOpen?'open':''}" data-key="${escapeHtml(breakdownKey)}" title="${t('breakdownToggleBtn')}" aria-label="${t('breakdownToggleBtn')}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>` : ""}
      ${opts.salaryPicker ? `<button type="button" class="role-btn salary-btn ${isSalary?'active':''}" title="${escapeHtml(isSalary ? t('salaryRoleBtnUnset') : t('salaryRoleBtnSet'))}" aria-pressed="${isSalary}">${isSalary ? "★" : "☆"}</button>` : ""}
      <input class="label-input" value="${displayLabel}" ${labelEditable ? "" : "disabled"} />
      <div class="value-wrap">
        <span class="euro">€</span>
        <input class="value-input" type="number" step="0.01" value="${(Number(displayValue)||0).toFixed(2)}" ${editable ? "" : "disabled"} />
      </div>
      ${opts.offsetPicker ? `<button type="button" class="role-btn offset-btn ${hasOffset?'active':''}" title="${escapeHtml(t('offsetBtnTitle'))}" aria-expanded="${pickerOpen}">⇥</button>` : ""}
      <button class="del-btn" title="${t('delRow')}">×</button>
    `;
    const labelInput = row.querySelector(".label-input");
    const valueInput = row.querySelector(".value-input");
    const delBtn = row.querySelector(".del-btn");
    const breakdownBtn = row.querySelector(".breakdown-toggle-btn");
    const salaryBtn = row.querySelector(".salary-btn");
    const offsetBtn = row.querySelector(".offset-btn");
    if(labelEditable){
      // Anker voor het meeverzetten van verwijzingen hieronder: de laatste niet-lege naam van deze
      // regel. Nodig omdat je bij het hernoemen bijna altijd even door een lege waarde gaat (alles
      // selecteren en overtypen); zonder anker was de koppeling precies op dat moment kwijt.
      if((item.l||"").trim()) labelInput.dataset.laatsteNaam = item.l;
      labelInput.oninput = e => {
        // Aftrekkoppelingen verwijzen naar een LABEL (zie findOffsetPairs). Hernoemen zou die
        // verwijzing dus stilzwijgend breken — daarom verzetten we 'm mee. Bij een (tijdelijk)
        // lege naam verzetten we bewust NIETS: een verwijzing naar "" is geen verwijzing meer,
        // en de volgende toetsaanslag zet 'm alsnog goed via het anker.
        const anker = ((item.l||"").trim() ? item.l : (labelInput.dataset.laatsteNaam || "")).trim().toLowerCase();
        const nieuweNaam = e.target.value;
        item.l = nieuweNaam;
        if(!(nieuweNaam||"").trim()) return;
        labelInput.dataset.laatsteNaam = nieuweNaam;
        if(!anker) return;
        cat.items.forEach(other => {
          if(other !== item && (other.offsetTarget||"").trim().toLowerCase() === anker) other.offsetTarget = nieuweNaam;
        });
      };
    }
    if(editable){
      valueInput.oninput = e => { item.v = parseFloat(e.target.value)||0; renderAll(true); };
    }
    delBtn.onclick = () => {
      // Een verwijderde regel mag geen verweesde koppeling achterlaten.
      const weg = (item.l||"").trim().toLowerCase();
      cat.items.splice(idx,1);
      cat.items.forEach(other => {
        if((other.offsetTarget||"").trim().toLowerCase() === weg) delete other.offsetTarget;
      });
      renderAll();
    };
    if(breakdownBtn){
      breakdownBtn.onclick = () => { toggleBreakdown(breakdownKey); renderCategories(); };
    }
    if(salaryBtn){
      salaryBtn.onclick = () => {
        setSalaryRole(opts.salaryScenario, isSalary ? null : item);
        renderAll();
      };
    }
    if(offsetBtn){
      offsetBtn.onclick = () => {
        offsetPickerOpenFor = pickerOpen ? null : pickerKey;
        renderAll();
      };
    }
    rowWrap.appendChild(row);
    if(offsetBtn && pickerOpen){
      // Keuzelijst met alle ANDERE regels in dezelfde groep. Een regel die zelf al doelwit is van
      // een koppeling laten we staan: ketens zijn toegestaan zolang ze niet in zichzelf teruglopen.
      const picker = document.createElement("div");
      picker.className = "offset-picker";
      const opties = cat.items
        .filter(other => mayOffsetTarget(cat.items, item, other))
        .map(other => `<option value="${escapeHtml(other.l)}" ${(item.offsetTarget||"").trim().toLowerCase() === (other.l||"").trim().toLowerCase() ? "selected" : ""}>${escapeHtml(other.l)}</option>`)
        .join("");
      picker.innerHTML = `
        <label>${escapeHtml(t("offsetPickLabel"))}
          <select class="offset-select">
            <option value="">${escapeHtml(t("offsetPickNone"))}</option>
            ${opties}
          </select>
        </label>
      `;
      picker.querySelector(".offset-select").onchange = (e) => {
        if(e.target.value) item.offsetTarget = e.target.value; else delete item.offsetTarget;
        offsetPickerOpenFor = null;
        renderAll();
      };
      rowWrap.appendChild(picker);
    }
    if(hasBreakdown && isOpen){
      rowWrap.insertAdjacentHTML("beforeend", renderBreakdownRows(item.entries));
    }
    rows.appendChild(rowWrap);

    if(item.note){
      const noteText = typeof item.note === "object" ? (item.note[state.lang] || item.note.nl) : item.note;
      if(noteText){
        const noteEl = document.createElement("div");
        noteEl.className = "row-note";
        noteEl.textContent = noteText;
        rows.appendChild(noteEl);
      }
    }
  });
  const addBtn = document.createElement("button");
  addBtn.className = "add-row-btn";
  addBtn.textContent = t("addRow");
  addBtn.onclick = () => { cat.items.push({l:t("newItem"), v:0}); renderAll(); };
  rows.appendChild(addBtn);
  return wrap;
}

/* Inkomsten-kaart: op Basisdata is Loon gewoon direct bewerkbaar. Op elk ander jaar is Loon
   read-only en komt de waarde uit het eigen loonsverhoging-blok van dat jaar (zie
   renderLoonsverhogingCard) — een toelichting onder de rij verwijst daarnaar. */
function renderIncomeCard(s){
  const isBasisdata = s === basisdataScenario();
  const loonItem = getLoonItem(s);
  let opts = {};
  if(!isBasisdata && loonItem){
    loonItem.note = { nl: i18n.nl.loonBerekendNote(s.jaar), en: i18n.en.loonBerekendNote(s.jaar) };
    opts = {
      valueFor: (item) => item === loonItem ? { value: computedLoon(s), editable: false } : null,
    };
  } else if(loonItem){
    loonItem.note = undefined;
  }
  // Het sterretje waarmee de gebruiker aanwijst wélke inkomstenregel z'n salaris is. Alleen op
  // Basisdata: daar staat de bron-regel, op de andere jaren wordt de waarde berekend en zou het
  // sterretje suggereren dat je er daar iets aan kunt veranderen.
  opts.salaryPicker = isBasisdata;
  opts.salaryScenario = s;
  const card = renderCard("income", { title: t("income"), items: s.income.items }, opts);
  card.id = "income-card";
  return card;
}

/* Bouwt de renderCard-opties voor een groep met aftrekkoppelingen: elke doelregel wordt netto
   getoond (read-only, met een grijze toelichting eronder welke regel eraf is gehaald) en het
   kaarttotaal komt van de bijbehorende totals-functie. Gedeeld door de Basisdata- en de
   budgetversie, zodat die twee niet uit elkaar kunnen lopen. */
function offsetCardOpts(items, enabled, totalOverride){
  /* Toelichtingen van een vorige render eerst weghalen — over ALLE regels, niet alleen over de
     regels die nu nog doelwit zijn. Dat laatste stond hier tot v25, en dan bleef precies het geval
     staan dat je wilt opruimen: haal je de koppeling weg (of verwijder je de bronregel), dan is er
     geen paar meer, dus werd er niets gewist en hield de doelregel eeuwig de grijze tekst
     "Warmtefonds (€ 50,00) is hier al van afgetrokken" — naast een bedrag waar niets meer van
     afgetrokken wordt. `note` zit in `state`, dus die onzin werd ook opgeslagen, gesynct en
     meegeëxporteerd.
     Alleen áfrek-toelichtingen wissen: `note` wordt ook gebruikt voor "€ 0,00 — geen transactie
     gevonden" bij het toepassen van een maand op een budget. Onderscheiden gebeurt aan de zinsnede
     zelf, en bewust niet via een extra veld in `state`: notities zijn volledig afgeleid, en een
     opgeslagen soort-veld zou bij "toepassen ongedaan maken" een verschil opleveren tussen de
     momentopname en de herstelde toestand. */
  const isOffsetNote = (it) => {
    if(!it || !it.note) return false;
    const nl = String(it.note.nl || ""), en = String(it.note.en || "");
    return nl.includes("is hier al van afgetrokken") || en.includes("already subtracted here");
  };
  items.forEach(it => { if(isOffsetNote(it)) it.note = undefined; });
  const pairs = enabled ? findOffsetPairs(items) : [];
  if(!pairs.length) return {};

  // Meerdere regels mogen naar dezelfde doelregel wijzen; die tellen dan allemaal mee en worden
  // samen in één toelichting genoemd.
  const netByTarget = new Map();
  const sourcesByTarget = new Map();
  pairs.forEach(p => {
    const base = netByTarget.has(p.tgt) ? netByTarget.get(p.tgt) : (parseFloat(p.tgt.v)||0);
    netByTarget.set(p.tgt, Math.round((base - (parseFloat(p.src.v)||0)) * 100) / 100);
    if(!sourcesByTarget.has(p.tgt)) sourcesByTarget.set(p.tgt, []);
    sourcesByTarget.get(p.tgt).push(p.src);
  });
  sourcesByTarget.forEach((srcs, tgt) => {
    const namen = srcs.map(s => `${s.l} (€ ${fmt(parseFloat(s.v)||0)})`).join(", ");
    tgt.note = { nl: i18n.nl.offsetNote(namen), en: i18n.en.offsetNote(namen) };
  });

  return {
    totalOverride,
    // labelEditable: het bedrag van een doelregel is afgeleid en dus niet te typen, maar de naam
    // moet gewoon te wijzigen blijven (zie de toelichting in renderCard).
    valueFor: (item) => netByTarget.has(item) ? { value: netByTarget.get(item), editable: false, labelEditable: true } : null,
  };
}

/* Vaste-lasten-kaart. Staat de aftrek-schakelaar aan, dan wordt elke doelregel van een
   aftrekkoppeling netto getoond met een grijze toelichting eronder, en telt de kaart/het totaal
   ook zo mee. De schakelaar zelf verschijnt alleen op het Basisdata-tabblad, en het effect geldt
   ook alleen daar — elk jaar heeft nu zijn eigen vaste lasten, dus dit hoeft niet meer overal
   door te werken zoals toen alles gedeeld was. */
function renderVasteLastenCard(){
  const bd = basisdataScenario();
  const opts = offsetCardOpts(bd.vasteLasten.items, state.offsetsEnabled, vasteLastenTotal());
  opts.offsetPicker = "basisdata";
  const card = renderCard("vasteLasten", { title: t("vasteLasten"), items: bd.vasteLasten.items }, opts);
  card.id = "vaste-lasten-card";
  return card;
}

/* Op elk jaar behalve Basisdata: één samengevatte regel i.p.v. de drie uitgesplitste kaarten
   (vaste lasten/abonnementen/variabele lasten) — die kosten zijn nu altijd gelijk aan Basisdata
   en dus niet meer los te bewerken op dit jaar zelf. Zie ontwerp-doc §3.1. */
function renderKostenUitBasisdataCard(){
  const wrap = document.createElement("div");
  // Bouwt zijn eigen markup i.p.v. via renderCard, dus de groepskleur hier ook zelf zetten —
  // anders was dit de enige kostenkaart zonder accent.
  wrap.className = "card card-bucket";
  wrap.style.setProperty("--bucket-color", bucketColorVar("vasteLasten"));
  const costs = basisdataCostTotals();
  wrap.innerHTML = `
    <div class="card-head">
      <div class="htitle">${CARD_ICONS.vasteLasten}<h2>${t("kostenUitBasisdata")}</h2></div>
      <div class="cat-total mono">€ ${fmt(costs.totaalUitgaven)}</div>
    </div>
    <div class="card-note">${t("kostenUitBasisdataNote")}</div>
  `;
  return wrap;
}

/* Schakelaar voor de aftrekkoppelingen — bewust alleen zichtbaar op het Basisdata-tabblad.
   Verschijnt alleen als er daadwerkelijk een koppeling bestaat: zonder koppelingen doet hij niets
   en zou hij alleen maar een raadsel zijn op een leeg scherm. */
function renderOffsetToggle(){
  const bd = basisdataScenario();
  if(!findOffsetPairs(bd.vasteLasten.items).length) return document.createComment("geen aftrekkoppelingen");
  const wrap = document.createElement("div");
  wrap.className = "toggle-row";
  wrap.innerHTML = `
    <label class="toggle-label">
      <input type="checkbox" id="offsetToggle" ${state.offsetsEnabled ? "checked" : ""} />
      ${t("offsetToggleLabel")}
    </label>
  `;
  wrap.querySelector("#offsetToggle").onchange = (e) => {
    state.offsetsEnabled = e.target.checked;
    renderAll();
  };
  return wrap;
}

/* Budget-versie van renderVasteLastenCard(): identieke netto-weergave, maar scoped op de eigen
   (bevroren) vaste-lasten-items en het eigen offsetsEnabled-vinkje van dit specifieke
   maandbudget, in plaats van Basisdata/de globale instelling. */
function renderVasteLastenCardForBudget(b){
  const opts = offsetCardOpts(b.vasteLasten.items, b.offsetsEnabled, vasteLastenTotalForBudget(b));
  opts.offsetPicker = "budget:" + b.id;
  const card = renderCard("vasteLasten", { title: t("vasteLasten"), items: b.vasteLasten.items }, opts);
  card.id = "vaste-lasten-card";
  return card;
}

/* Budget-versie van renderOffsetToggle(): schakelt b.offsetsEnabled i.p.v. de globale
   state.offsetsEnabled, zodat elk maandbudget zijn eigen, onafhankelijke instelling houdt. */
function renderOffsetToggleForBudget(b){
  if(!findOffsetPairs(b.vasteLasten.items).length) return document.createComment("geen aftrekkoppelingen");
  const wrap = document.createElement("div");
  wrap.className = "toggle-row";
  wrap.innerHTML = `
    <label class="toggle-label">
      <input type="checkbox" id="offsetToggleBudget" ${b.offsetsEnabled ? "checked" : ""} />
      ${t("offsetToggleLabel")}
    </label>
  `;
  wrap.querySelector("#offsetToggleBudget").onchange = (e) => {
    b.offsetsEnabled = e.target.checked;
    renderAll();
  };
  return wrap;
}

/* Nieuw maandbudget aanmaken gebeurt nu vanuit het "+"-knopje bij de groep "Maandbudgetten"
   in het menu (zie renderTabs) in plaats van een kaart onderaan de Basisdata-pagina. */

/* ---------- IMPORT BASISDATA (nieuwe, losstaande flow) ----------
   Zet een schone PDF/CSV-import direct om in een nieuwe Basisdata, i.p.v. 'm te vergelijken met een
   bestaand maandbudget zoals de bestaande upload-maand-flow doet (zie handleCSVUpload/
   handlePDFUpload/buildMonthFromCSV/upsertMonth hierboven, die door deze flow bewust ongemoeid
   blijven -- state.months wordt hier nergens aangeraakt). Hergebruikt wel dezelfde onderliggende
   transactie-classificatie (resolveStornos/classifyTransaction), zodat exact dezelfde
   herkenningsregels gelden als bij een normale maand-import.
   De schermstand hieronder is bewust transiënt (net als profilePanelOpen hierboven): hoort niet bij
   `state` en wordt bij het verlaten/heropenen van dit tabblad gewoon gereset -- pas na bevestigen in
   de confirm-dialoog wordt er daadwerkelijk in `state` geschreven (zie applyImportBasisdata). */
let importBasisdataStep = "upload"; // "upload" | "review" | "success"
let importBasisdataRows = [];       // [{id, name, amt (signed: - = kosten, + = inkomen), bucket, catId, entries}]
let importBasisdataSourceLabel = "";
let importBasisdataSuccessInfo = null; // pas gevuld ná bevestigen, voor het succes-scherm
/* Kladlijst van herkenregels die tijdens het indelen zijn "geleerd", gesleuteld op de
   tegenpartijnaam in kleine letters. Blijft buiten `state` tot de gebruiker de import bevestigt —
   annuleren gooit hem simpelweg weg (zie resetImportBasisdataUI). */
const importBasisdataPendingRules = new Map();

function resetImportBasisdataUI(){
  importBasisdataStep = "upload";
  importBasisdataRows = [];
  importSplitSelection.clear();
  importBasisdataPendingRules.clear();
  importBasisdataSourceLabel = "";
  importBasisdataSuccessInfo = null;
}

/* Levert een platte rijenlijst op i.p.v. het "maand"-object van buildMonthFromCSV.
   Eén rij = één TEGENPARTIJ, precies zoals die op het afschrift staat.

   Tot v24 groepeerde dit scherm op het LABEL dat de herkenregels eraan hingen. Je zag dus
   "Boodschappen" of "Hypotheek" staan — namen die uit de regeltabel kwamen, niet uit je afschrift —
   en alle supermarkten zaten al op één hoop voordat je iets had kunnen zeggen. Bovendien werd de
   echte tegenpartijnaam wél berekend en daarna weggegooid. Nu is die naam de titel van de rij, en is
   de herkenning nog maar een VOORSTEL (zie `suggestion`) dat je overneemt of negeert. Samenvoegen is
   daarmee een keuze van de gebruiker geworden: geef twee rijen dezelfde categorie en ze worden één
   regel (zie computeImportBasisdataResultingLines).

   Elke rij houdt debet en credit apart bij. Een tegenpartij waar zowel afschrijvingen als
   bijschrijvingen op staan (een terugbetaling, een correctie) hoeft dus niet meer óf-óf te zijn:
   per rij kies je debet, credit of het saldo (zie importRowAmount). Dat verving de v24-aanpak die
   een losse creditering stilletjes naar de "nog in te delen"-lijst schoof. Echte terugboekingen
   worden nog steeds vóór dit punt afgevangen door resolveStornos().

   Bedragconventie van dit scherm: negatief = kosten, positief = inkomen. */
/* Sleutel waarmee transacties bij dezelfde tegenpartij worden samengenomen.

   De bank schrijft dezelfde partij niet altijd hetzelfde op: een incasso komt binnen als
   "Vodafone Libertel B.V." en een pinbetaling als "VODAFONE LIBERTEL BV". Op de kale naam
   gegroepeerd leverde dat twee rijen voor één bedrijf op. Voor het VERGELIJKEN wordt daarom
   genormaliseerd — kleine letters, leestekens eruit, dubbele spaties weg en de rechtsvorm aan het
   eind eraf. De naam die je op het scherm ziet blijft gewoon die van het afschrift.

   Bewust niet agressiever dan dit: twee namen die echt van elkaar verschillen blijven aparte rijen.
   En zit er onder één tegenpartij tóch meer dan één kostenpost (twee abonnementen bij dezelfde
   provider), dan haal je ze uit elkaar met splitsen per transactie. */
function counterpartyKey(naam){
  const basis = (naam||"")
    .toLowerCase()
    .replace(/[.,'`\u00b4"()]/g, "")
    .replace(/\s+/g, " ")
    .trim();
  const zonderRechtsvorm = basis.replace(/\s+(bv|nv|sa|sarl|ltd|gmbh|inc|plc|vof|cv)$/, "").trim();
  // Een tegenpartij die alleen maar uit een rechtsvorm bestaat zou anders met alle andere
  // samenvallen; dan liever de niet-gestripte vorm.
  return zonderRechtsvorm || basis;
}

function buildImportBasisdataRows(rows){
  const { rows: filteredRows } = resolveStornos(rows);
  const perTegenpartij = new Map();

  filteredRows.forEach(r=>{
    if(r["Bedrag"] === undefined || r["Bedrag"] === "") return;
    const result = classifyTransaction(r);
    if(result.cat === "ignore") return; // terugboeking/herincasso, zie classifyTransaction

    const rawNaam = (result.naam || result.label || t("unknownCounterparty")).trim();
    const sleutel = counterpartyKey(rawNaam);
    const amt = result.amt;                    // rauw en getekend: - = af, + = bij
    const datum = r["Datum"] || "";
    const omschrijving = ((r["Omschrijving-1"]||"") + " " + (r["Omschrijving-2"]||"")).trim();

    if(!perTegenpartij.has(sleutel)){
      perTegenpartij.set(sleutel, {
        naam: rawNaam,
        debet: 0,      // som van de afschrijvingen, als positief bedrag
        credit: 0,     // som van de bijschrijvingen, als positief bedrag
        entries: [],
        // Het voorstel van de herkenning: welke groep, en onder welke naam het anders zou gaan.
        // "review" betekent: niets herkend, de gebruiker moet het zelf zeggen.
        suggestion: (result.cat && result.cat !== "review")
          ? { bucket: result.cat, label: result.label || rawNaam, role: result.role || null }
          : null,
      });
    }
    const rij = perTegenpartij.get(sleutel);
    if(amt < 0) rij.debet += -amt; else rij.credit += amt;
    rij.entries.push({ naam: rawNaam, amt: Math.round(amt*100)/100, datum, omschrijving });
    // Eén tegenpartij kan in theorie verschillend uitvallen per transactie (een regel die op de
    // omschrijving kijkt). Het eerste voorstel wint; een leeg voorstel mag nog aangevuld worden.
    if(!rij.suggestion && result.cat && result.cat !== "review"){
      rij.suggestion = { bucket: result.cat, label: result.label || rawNaam, role: result.role || null };
    }
  });

  let seq = 0;
  const rowsOut = [];
  perTegenpartij.forEach(rij=>{
    const debet = Math.round(rij.debet*100)/100;
    const credit = Math.round(rij.credit*100)/100;
    if(debet <= CENT_EPSILON && credit <= CENT_EPSILON) return;
    // Bestaat er al een eigen categorie met precies deze naam in dezelfde groep, koppel 'm dan
    // meteen. Zonder dit bleven zelfgemaakte categorieën bij elke import ongebruikt staan en moest
    // je ze rij voor rij opnieuw aanwijzen. Werkt vooral samen met geleerde regels: die geven een
    // rij het nette label ("Water"), en dat label vindt hier zijn categorie terug.
    const bucketVoorstel = rij.suggestion ? rij.suggestion.bucket : null;
    const naamVoorstel = rij.suggestion ? rij.suggestion.label : rij.naam;
    const passendeCat = bucketVoorstel
      ? state.categories.find(c => c.bucket === bucketVoorstel
          && c.name.trim().toLowerCase() === (naamVoorstel||"").trim().toLowerCase())
      : null;
    rowsOut.push({
      id: "ibd"+(seq++),
      name: rij.naam,          // de tegenpartijnaam van het afschrift — de titel van de rij
      matchName: rij.naam,     // sleutel voor een eigen herkenregel (zie rememberUserRule)
      suggestion: rij.suggestion,
      debet, credit,
      // Standaardkeuze: staat er maar één kant op, dan die; staan er beide, dan het saldo.
      mode: (debet > CENT_EPSILON && credit > CENT_EPSILON) ? "net" : (credit > CENT_EPSILON ? "credit" : "debet"),
      entries: rij.entries.sort((a,b)=> String(a.datum).localeCompare(String(b.datum))),
      bucket: bucketVoorstel,
      catId: passendeCat ? passendeCat.id : null,
    });
  });
  rowsOut.sort((a,b)=> Math.abs(importRowAmount(b)) - Math.abs(importRowAmount(a)));
  return rowsOut;
}

/* Het bedrag waarmee deze rij meetelt, volgens de debet/credit-keuze van de rij.
   Negatief = kosten, positief = inkomen. */
function importRowAmount(r){
  if(!r) return 0;
  if(r.mode === "debet")  return -(r.debet || 0);
  if(r.mode === "credit") return (r.credit || 0);
  return Math.round(((r.credit||0) - (r.debet||0)) * 100) / 100;
}

/* De transacties die daadwerkelijk meetellen in importRowAmount(r) hierboven, in de kale/getekende
   vorm van het afschrift (negatief = af, positief = bij) — dus precies de deelverzameling waarvan
   de som dat bedrag oplevert. Bij "net" is dat gewoon alles; bij "debet"/"credit" alleen de kant
   die gekozen is. Nodig zodat de betaaldatums die straks in een samengevoegde Basisdata-regel te
   zien zijn (zie computeImportBasisdataResultingLines/applyImportBasisdata) nooit een transactie
   tonen die niet in het bedrag van die regel zit — anders klopt de uitgeklapte deellijst niet met
   het totaal erboven. */
function importRowContributingEntries(r){
  if(!r || !r.entries) return [];
  if(r.mode === "debet")  return r.entries.filter(e => e.amt < 0);
  if(r.mode === "credit") return r.entries.filter(e => e.amt > 0);
  return r.entries.slice();
}

/* Splitst één tegenpartij-rij in twee losse rijen: de afschrijvingen en de bijschrijvingen.
   Nodig omdat die twee kanten soms echt iets anders zijn. Een belastingdienst-rij kan tegelijk een
   wegenbelasting-afschrijving (vaste last) en een teruggave (inkomen) bevatten; met alleen
   af/bij/saldo moet je dan kiezen welke helft je weggooit. Na het splitsen krijgt elke helft zijn
   eigen groep en categorie.

   Allebei de helften verliezen hun matchName: er valt voor deze tegenpartij geen enkelvoudige
   herkenregel meer te leren (dezelfde naam zou dan naar twee verschillende groepen moeten wijzen),
   en één regel die de andere overschrijft is erger dan geen regel. Zie rememberUserRule. */
/* Bouwt een nieuwe importrij uit een deelverzameling transacties van een bestaande rij.
   Debet/credit/bedrag worden opnieuw uit die transacties afgeleid, zodat een afgesplitste rij
   altijd klopt met wat erin zit. */
function makeImportRowFromEntries(basis, entries, tag){
  let debet = 0, credit = 0;
  entries.forEach(e => { if(e.amt < 0) debet += -e.amt; else credit += e.amt; });
  debet = Math.round(debet*100)/100;
  credit = Math.round(credit*100)/100;
  // Alleen het voorstel van de herkenning meenemen als het nog ergens op slaat: bij een
  // afgesplitste bijschrijvingen-rij zegt "Boodschappen" niets meer.
  const houdVoorstel = basis.suggestion && debet > CENT_EPSILON;
  return {
    id: basis.id + ":" + tag,
    name: basis.name,
    // Geen matchName: voor een tegenpartij die je zelf uit elkaar trekt valt geen enkelvoudige
    // herkenregel te leren — dezelfde naam zou dan naar twee groepen moeten wijzen, en één regel
    // die de andere overschrijft is erger dan geen regel. Zie rememberUserRule.
    matchName: null,
    splitFrom: basis.splitFrom || basis.name,
    splitKind: tag,
    suggestion: houdVoorstel ? basis.suggestion : null,
    debet, credit,
    mode: (debet > CENT_EPSILON && credit > CENT_EPSILON) ? "net" : (credit > CENT_EPSILON ? "credit" : "debet"),
    entries: entries.slice(),
    bucket: houdVoorstel ? basis.suggestion.bucket : null,
    catId: null,
  };
}

/* Splitst een rij in een afschrijvingen- en een bijschrijvingen-helft. Snelknop voor het meest
   voorkomende geval: één tegenpartij waar twee verschillende dingen doorheen lopen (wegenbelasting
   eraf, belastingteruggave erbij). */
function splitImportBasisdataRow(rowId){
  const idx = importBasisdataRows.findIndex(r => r.id === rowId);
  if(idx === -1) return false;
  const r = importBasisdataRows[idx];
  if(!(r.debet > CENT_EPSILON && r.credit > CENT_EPSILON)) return false;
  const af = r.entries.filter(e => e.amt < 0);
  const bij = r.entries.filter(e => e.amt > 0);
  if(!af.length || !bij.length) return false;
  importBasisdataRows.splice(idx, 1,
    makeImportRowFromEntries(r, af, "debet"),
    makeImportRowFromEntries(r, bij, "credit"));
  return true;
}

/* Splitst de aangevinkte transacties van een rij af naar een eigen rij, zodat ze in een andere
   groep kunnen. Nodig omdat één tegenpartij lang niet altijd één kostenpost is: bij een tankstation
   staan brandstof en sigaretten door elkaar, en bij een bouwmarkt een keukenverbouwing tussen het
   klusgoed. De debet/credit-knop hierboven dekt maar één vorm daarvan; hiermee bepaal je het per
   transactie.

   Vereist minstens één aangevinkte transactie en minstens één die blijft staan — anders verplaats
   je de hele rij naar een nieuwe rij en is er niets gesplitst. */
function splitImportBasisdataEntries(rowId, entryIndexes){
  const idx = importBasisdataRows.findIndex(r => r.id === rowId);
  if(idx === -1) return false;
  const r = importBasisdataRows[idx];
  const gekozen = new Set(entryIndexes);
  const af = r.entries.filter((_, i) => gekozen.has(i));
  const blijft = r.entries.filter((_, i) => !gekozen.has(i));
  if(!af.length || !blijft.length) return false;

  // Oplopend nummer, zodat herhaald splitsen unieke ids en herkenbare labels blijft opleveren.
  const volgnr = (r.splitSeq || 0) + 1;
  const rest = makeImportRowFromEntries(r, blijft, "rest" + volgnr);
  const deel = makeImportRowFromEntries(r, af, "deel" + volgnr);
  rest.id = r.id;                 // de oorspronkelijke rij houdt zijn id en plek
  rest.splitKind = r.splitKind;   // en zijn eventuele eerdere markering
  rest.splitSeq = volgnr;
  rest.suggestion = r.suggestion;
  rest.bucket = r.bucket;
  rest.catId = r.catId;
  deel.splitSeq = volgnr;

  importBasisdataRows.splice(idx, 1, rest, deel);
  return true;
}

/* Onder welke naam deze rij straks in Basisdata belandt: de gekozen categorie als die er is,
   anders het voorstel van de herkenning, anders de kale tegenpartijnaam. Ook de naam die als label
   in een geleerde herkenregel gaat (zie wireImportBasisdataRowHandlers) — daarom hier op één plek,
   en niet de rauwe naam: je wilt "Boodschappen" in je budget zien staan, niet "PLUS TIM JANSSEN BV". */
function importRowDisplayLabel(r){
  if(r.catId){
    const cat = findCategory(r.catId);
    if(cat) return cat.name;
  }
  const basis = (r.suggestion && r.suggestion.label) ? r.suggestion.label : r.name;
  /* Een afgesplitste rij krijgt er een woordje bij ("(af)", "(deel 1)"). Zonder dat zouden de
     helften van dezelfde tegenpartij dezelfde naam houden, en dan voegt
     computeImportBasisdataResultingLines ze in dezelfde groep gewoon weer samen — precies wat je
     met splitsen probeerde te voorkomen. Kies je een categorie, dan is die naam leidend en
     verdwijnt het woordje weer.
     Ook de TEGENPARTIJ hoort in dat woordje. Splits je Hornbach én Praxis, en stellen die allebei
     "Bouwmarkt" voor, dan heetten beide helften tot v25 "Bouwmarkt (deel 1)" en plakten ze alsnog
     aan elkaar — met als extra gevolg dat applyImportBasisdata er een categorie van maakte die
     letterlijk "Bouwmarkt (deel 1)" heette. De naam van de tegenpartij houdt ze uit elkaar; het
     voorstel zelf blijft voorop staan, zodat de regel leesbaar blijft. */
  const tag = importRowSplitTag(r);
  if(!tag) return basis;
  const herkomst = (r.name||"").trim();
  const anders = herkomst && herkomst.trim().toLowerCase() !== (basis||"").trim().toLowerCase();
  return anders ? `${basis} (${herkomst} — ${tag})` : `${basis} (${tag})`;
}

/* Kort, leesbaar woord voor de herkomst van een afgesplitste rij. Leeg voor een gewone rij. */
function importRowSplitTag(r){
  if(!r || !r.splitKind) return "";
  if(r.splitKind === "debet") return t("importBasisdataSplitTagDebet");
  if(r.splitKind === "credit") return t("importBasisdataSplitTagCredit");
  const m = /^deel(\d+)$/.exec(r.splitKind);
  if(m) return t("importBasisdataSplitTagPart")(m[1]);
  return r.splitKind;
}

/* Groepeert de rijen van één groep (bucket) op catId tot de uiteindelijke Basisdata-regels: rijen met
   dezelfde categorie tellen op tot één regel (genoemd naar de categorie); een rij zonder categorie
   blijft een eigen regel onder zijn geïmporteerde naam. Eén rij met een unieke categorie is
   functioneel hetzelfde geval (merged===1) en leest dan als een hernoeming i.p.v. een samenvoeging --
   zie renderImportBasisdataRowHtml voor het bijbehorende badge-onderscheid. */
function computeImportBasisdataResultingLines(bucketKey){
  const bucketRows = importBasisdataRows.filter(r => r.bucket === bucketKey);
  const byCat = {};
  const solo = [];
  const byLabel = {};
  bucketRows.forEach(r=>{
    const amt = importRowAmount(r);
    // De betaaldatums van deze rij, beperkt tot wat ook echt in `amt` meetelt (zie
    // importRowContributingEntries) — zodat een uitgeklapte Basisdata-regel straks alleen
    // transacties toont die ook echt in het bedrag erboven zitten.
    const bijdragendeEntries = importRowContributingEntries(r);
    if(r.catId){
      if(!byCat[r.catId]) byCat[r.catId] = { catId:r.catId, sum:0, sources:[], entries:[], role:null };
      byCat[r.catId].sum += amt;
      byCat[r.catId].sources.push(r.name);
      byCat[r.catId].entries.push(...bijdragendeEntries);
      if(r.suggestion && r.suggestion.role) byCat[r.catId].role = r.suggestion.role;
    } else {
      // Zonder categorie is de regelnaam het voorstel van de herkenning, en pas als dat er niet is
      // de kale tegenpartijnaam. Je wilt "Netflix" in je Basisdata zien, niet
      // "NETFLIX INTERNATIONAL B.V." — maar wél iets herkenbaars als er niets herkend is.
      //
      // Rijen die op dezelfde naam uitkomen worden één regel. Dat gebeurt vanzelf zodra meerdere
      // tegenpartijen hetzelfde voorstel krijgen (drie supermarkten -> drie keer "Boodschappen").
      // Zonder deze samenvoeging kreeg je drie regels met exact dezelfde naam in Basisdata — en
      // omdat het vergelijken van een maand met een budget op naam matcht, is dat niet alleen
      // rommelig maar ook stuk.
      const label = importRowDisplayLabel(r);
      const sleutel = label.trim().toLowerCase();
      if(!byLabel[sleutel]) byLabel[sleutel] = { label, sum:0, sources:[], entries:[], role:null };
      byLabel[sleutel].sum += amt;
      byLabel[sleutel].sources.push(r.name);
      byLabel[sleutel].entries.push(...bijdragendeEntries);
      if(r.suggestion && r.suggestion.role) byLabel[sleutel].role = r.suggestion.role;
    }
  });
  Object.values(byLabel).forEach(g=>{
    solo.push({ label: g.label, amt: g.sum, merged: g.sources.length, sources: g.sources, entries: g.entries, role: g.role });
  });
  const merged = Object.values(byCat).map(g=>{
    const cat = findCategory(g.catId);
    return { label: cat ? cat.name : "?", amt: g.sum, merged: g.sources.length, sources: g.sources, entries: g.entries, role: g.role };
  });

  /* Laatste samenvoeging over de twee groeperingen heen.
     Hierboven worden gecategoriseerde rijen op categorie gegroepeerd en ongecategoriseerde op hun
     voorstelnaam — in twee gescheiden verzamelingen die elkaar niet zien. Zet je bij een import
     twee van de vier "Boodschappen"-rijen op "Geen categorie", dan leverde dat twee Basisdata-regels
     met exact dezelfde naam in dezelfde groep op. Alles in de app (maand-versus-budget, de
     aftrekkoppelingen, het categoriegebruik) koppelt op naam, dus dat is precies de kapotte
     toestand waar het commentaar hierboven zelf voor waarschuwt. */
  const perNaam = new Map();
  [...merged, ...solo].forEach(r => {
    const k = (r.label||"").trim().toLowerCase();
    const best = perNaam.get(k);
    if(!best){ perNaam.set(k, { ...r, sources: r.sources.slice(), entries: r.entries.slice() }); return; }
    best.amt += r.amt;
    best.sources = best.sources.concat(r.sources);
    best.entries = best.entries.concat(r.entries);
    best.merged = best.sources.length;
    best.role = best.role || r.role;
  });
  // Op datum, zodat de uitgeklapte deellijst chronologisch leest i.p.v. in de willekeurige volgorde
  // waarin de tegenpartij-rijen hierboven zijn samengevoegd.
  const byDatum = (a,b) => String(a.datum||"").localeCompare(String(b.datum||""));
  perNaam.forEach(r => r.entries.sort(byDatum));
  return [...perNaam.values()];
}

function importBasisdataProgress(){
  const total = importBasisdataRows.length;
  const done = importBasisdataRows.filter(r => r.bucket).length;
  return { done, total };
}

function handleImportBasisdataCSVUpload(e){
  const file = e.target.files[0];
  e.target.value = "";
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try{
      const bytes = new Uint8Array(ev.target.result);
      const text = decodeBankBytes(bytes);
      const rows = parseCSV(text);
      importBasisdataRows = buildImportBasisdataRows(rows);
      if(!importBasisdataRows.length){ alert(t("importBasisdataNoRowsError")); return; }
      importBasisdataSourceLabel = file.name;
      importBasisdataStep = "review";
      renderAll();
    }catch(err){ alert(t("csvParseError") + err.message); }
  };
  reader.readAsArrayBuffer(file);
}

function handleImportBasisdataPDFUpload(e){
  const file = e.target.files[0];
  e.target.value = "";
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    try{
      const rows = await parsePdfTransactions(ev.target.result);
      importBasisdataRows = buildImportBasisdataRows(rows);
      if(!importBasisdataRows.length){ alert(t("importBasisdataNoRowsError")); return; }
      importBasisdataSourceLabel = file.name;
      importBasisdataStep = "review";
      renderAll();
    }catch(err){ alert(t("pdfParseError") + err.message); }
  };
  reader.readAsArrayBuffer(file);
}

function renderImportBasisdataRowHtml(r){
  const bedrag = importRowAmount(r);
  const heeftBeide = (r.debet > CENT_EPSILON) && (r.credit > CENT_EPSILON);
  const expandKey = `importbd::${r.id}`;
  const isOpen = expandedBreakdowns.has(expandKey);

  // Het voorstel van de herkenning. Bewust een badge en geen titel: de titel is wat er op je
  // afschrift staat, dit is wat FinBo ervan denkt. Verdwijnt zodra je zelf een categorie kiest,
  // want dan is die keuze leidend.
  let suggestieBadge = "";
  if(r.suggestion && !r.catId){
    const bucketObj = PROFILE_CATEGORY_BUCKETS.find(b=>b.key===r.suggestion.bucket);
    suggestieBadge = `<div class="import-bd-badge suggestion">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0-3.6 10.8c.4.3.6.8.6 1.2v.5h6v-.5c0-.4.2-.9.6-1.2A6 6 0 0 0 12 3Z"/><path d="M10 19h4"/></svg>
      ${escapeHtml(t("importBasisdataSuggestionBadge")(r.suggestion.label, bucketObj ? t(bucketObj.titleKey) : r.suggestion.bucket))}
    </div>`;
  }

  // Samenvoeg-/hernoem-badge: ongewijzigd gedrag, maar nu op basis van de eigen keuze van de
  // gebruiker (categorie) i.p.v. van de herkenregels.
  const siblings = r.catId ? importBasisdataRows.filter(o=>o.id!==r.id && o.bucket===r.bucket && o.catId===r.catId) : [];
  let badge = "";
  if(siblings.length){
    const cat = findCategory(r.catId);
    const total = siblings.reduce((a,s2)=>a+importRowAmount(s2),0) + bedrag;
    badge = `<div class="import-bd-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 7h10M7 12h10M7 17h6"/></svg>
      ${/* Het bedrag ONgeformatteerd doorgeven: importBasisdataMergeBadge draait er zelf al fmt()
            overheen. Stond hier fmt(...) omheen, dan kreeg fmt() een string ("372,20") binnen,
            werd isNaN() waar en toonde de badge "samen € 0,00" — precies bij de regels waar het
            totaal het interessantst is. */ ""}
      ${escapeHtml(t("importBasisdataMergeBadge")(siblings.map(s2=>s2.name).join(", "), cat?cat.name:"", Math.abs(total)))}
    </div>`;
  } else if(r.catId){
    const cat = findCategory(r.catId);
    badge = `<div class="import-bd-badge rename">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V5a1 1 0 0 1 1-1h4M4 7v4M20 7V5a1 1 0 0 0-1-1h-4M20 7v4M4 17v2a1 1 0 0 0 1 1h4M20 17v2a1 1 0 0 0 1 1h4"/></svg>
      ${escapeHtml(t("importBasisdataRenameBadge")(cat?cat.name:""))}
    </div>`;
  }

  const pills = CATEGORY_BUCKET_KEYS.map(bk=>{
    const label = PROFILE_CATEGORY_BUCKETS.find(b=>b.key===bk);
    return `<button type="button" class="import-bd-pill${r.bucket===bk?" active":""}" data-row="${r.id}" data-bucket="${bk}" style="--pill-color:${bucketColorVar(bk)}">${t(label.titleKey)}</button>`;
  }).join("");

  let catControl = "";
  if(r.bucket){
    const catsInBucket = state.categories.filter(c=>c.bucket===r.bucket);
    if(catsInBucket.length){
      const options = [`<option value="">${t("importBasisdataCatNone")}</option>`]
        .concat(catsInBucket.map(c=>`<option value="${c.id}" ${r.catId===c.id?"selected":""}>${escapeHtml(c.name)}</option>`));
      catControl = `
        <div class="import-bd-cat-row">
          <span class="import-bd-cat-label">${t("importBasisdataCatLabel")}</span>
          <select class="import-bd-cat-select" data-row="${r.id}">${options.join("")}</select>
        </div>`;
    }
    // (Geen "je hebt nog geen categorieën"-hint per rij meer: sinds de rijen per tegenpartij gaan
    // zijn het er vaak enkele tientallen, en dan stond diezelfde zin tientallen keren onder elkaar.
    // Hij staat nu één keer boven de lijst, zie renderImportBasisdataReviewStep.)
  }

  // Debet en credit staan naast elkaar, zoals op het afschrift zelf (twee kolommen). Alleen als er
  // aan beide kanten iets staat is er iets te kiezen; anders zou een keuzeknop alleen maar ruis zijn.
  const bedragen = `
    <span class="import-bd-amt-pair">
      ${r.debet > CENT_EPSILON ? `<span class="import-bd-amt neg" title="${escapeHtml(t("importBasisdataDebetLabel"))}">−€ ${fmt(r.debet)}</span>` : ""}
      ${r.credit > CENT_EPSILON ? `<span class="import-bd-amt pos" title="${escapeHtml(t("importBasisdataCreditLabel"))}">+€ ${fmt(r.credit)}</span>` : ""}
    </span>`;

  const modeKeuze = heeftBeide ? `
    <div class="import-bd-mode">
      <span class="import-bd-mode-label">${escapeHtml(t("importBasisdataModeLabel"))}</span>
      ${[["debet","importBasisdataModeDebet"],["credit","importBasisdataModeCredit"],["net","importBasisdataModeNet"]].map(([m,key])=>
        `<button type="button" class="import-bd-mode-btn${r.mode===m?" active":""}" data-row="${r.id}" data-mode="${m}">${escapeHtml(t(key))}</button>`
      ).join("")}
      <button type="button" class="import-bd-mode-btn split" data-split="${r.id}" title="${escapeHtml(t("importBasisdataSplitHint"))}">${escapeHtml(t("importBasisdataSplitBtn"))}</button>
      <span class="import-bd-mode-result ${bedrag<0?'neg':'pos'}">${bedrag<0?'−':'+'}€ ${fmt(Math.abs(bedrag))}</span>
    </div>` : "";

  const aantal = r.entries ? r.entries.length : 0;
  const expander = aantal > 0 ? `
    <button type="button" class="import-bd-expand${isOpen?" open":""}" data-expand="${expandKey}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      ${escapeHtml(t("importBasisdataTxCount")(aantal))}
    </button>` : "";

  // Uitgeklapt zijn de losse transacties niet alleen te lezen maar ook aan te vinken: wat je
  // aanvinkt kun je afsplitsen naar een eigen rij, en die rij kan een andere groep krijgen. Eén
  // tegenpartij is namelijk lang niet altijd één kostenpost (tankstation: brandstof én sigaretten).
  const kanSplitsen = aantal > 1;
  const gekozen = r.entries.map((_, i) => importSplitSelection.has(`${r.id}::${i}`));
  const aantalGekozen = gekozen.filter(Boolean).length;
  const splitsbaar = kanSplitsen && aantalGekozen > 0 && aantalGekozen < aantal;

  const txHtml = (isOpen && aantal) ? `
    <div class="import-bd-tx-list">
      ${r.entries.map((e,i)=>`
        <label class="import-bd-tx${gekozen[i]?" picked":""}">
          ${kanSplitsen ? `<input type="checkbox" class="import-bd-tx-pick" data-row="${r.id}" data-entry="${i}" ${gekozen[i]?"checked":""} />` : ""}
          <span class="import-bd-tx-date">${escapeHtml(e.datum || "")}</span>
          <span class="import-bd-tx-desc" title="${escapeHtml(e.omschrijving || "")}">${escapeHtml(e.omschrijving || "—")}</span>
          <span class="import-bd-tx-amt ${e.amt<0?'neg':'pos'}">${e.amt<0?'−':'+'}€ ${fmt(Math.abs(e.amt))}</span>
        </label>`).join("")}
      ${kanSplitsen ? `
        <div class="import-bd-tx-actions">
          <button type="button" class="import-bd-split-sel" data-split-sel="${r.id}" ${splitsbaar?"":"disabled"}>
            ${escapeHtml(aantalGekozen ? t("importBasisdataSplitSelBtn")(aantalGekozen) : t("importBasisdataSplitSelHint"))}
          </button>
        </div>` : ""}
    </div>` : "";

  return `
    <div class="import-bd-row${r.bucket?"":" needs-group"}">
      <div class="import-bd-row-main">
        <span class="import-bd-row-name" title="${escapeHtml(r.name)}">${escapeHtml(r.name)}${r.splitKind ? `<span class="import-bd-split-tag">${escapeHtml(importRowSplitTag(r))}</span>` : ""}</span>
        ${bedragen}
      </div>
      ${suggestieBadge}
      <div class="import-bd-pills">${pills}</div>
      ${modeKeuze}
      ${catControl}
      ${badge}
      ${expander}
      ${txHtml}
    </div>
  `;
}

function wireImportBasisdataRowHandlers(container){
  /* Onthoudt de indeling van deze rij als eigen herkenregel. Twee dingen die in fase 1 nog niet
     klopten en hier goed staan:
     - de SLEUTEL is de tegenpartijnaam van het afschrift (r.matchName), want daar moet de volgende
       import op matchen;
     - het LABEL is de weergavenaam (categorie > voorstel > tegenpartijnaam), niet de rauwe naam.
       Anders kreeg je "NETFLIX INTERNATIONAL B.V." als postnaam in je budget.
     Er wordt ook geleerd als je een al voorgestelde groep BEVESTIGT: dat is net zo goed een
     uitspraak van de gebruiker, en zonder dat zou een voorstel nooit een eigen regel worden. */
  /* Belangrijk: dit schrijft NIET meteen in state.userRules, maar in een kladlijst die pas bij het
     bevestigen wordt vastgelegd (zie applyImportBasisdata). Tot v25 ging elke pilklik rechtstreeks
     naar `state`, waarna renderAll() → scheduleAutoSave() het binnen 500 ms naar de cloud schreef.
     Veertig rijen indelen en dan op Annuleren drukken liet dus veertig regels achter die elke
     volgende import stilletjes stuurden — terwijl de annuleerknop om bevestiging vraagt alsof hij
     weggooit, en het commentaar bovenaan dit scherm het omgekeerde belooft. */
  const leer = (row) => {
    if(!row || !row.bucket || !row.matchName) return;
    importBasisdataPendingRules.set((row.matchName||"").trim().toLowerCase(), {
      match: row.matchName, bucket: row.bucket, label: importRowDisplayLabel(row),
    });
  };

  container.querySelectorAll(".import-bd-pill").forEach(btn=>{
    btn.onclick = () => {
      const row = importBasisdataRows.find(r=>r.id===btn.dataset.row);
      if(!row) return;
      const newBucket = btn.dataset.bucket;
      if(row.bucket !== newBucket){
        row.bucket = newBucket;
        row.catId = null; // een categorie hoort bij de vorige groep -- niet automatisch overnemen
      }
      leer(row);
      renderImportBasisdataScreen();
    };
  });

  container.querySelectorAll(".import-bd-cat-select").forEach(sel=>{
    sel.onchange = () => {
      const row = importBasisdataRows.find(r=>r.id===sel.dataset.row);
      if(!row) return;
      row.catId = sel.value || null;
      leer(row); // de categorie bepaalt de naam, dus de geleerde regel moet mee veranderen
      renderImportBasisdataScreen();
    };
  });

  container.querySelectorAll(".import-bd-mode-btn").forEach(btn=>{
    btn.onclick = () => {
      const row = importBasisdataRows.find(r=>r.id===btn.dataset.row);
      if(!row) return;
      row.mode = btn.dataset.mode;
      renderImportBasisdataScreen();
    };
  });

  container.querySelectorAll(".import-bd-mode-btn.split").forEach(btn=>{
    btn.onclick = () => {
      if(splitImportBasisdataRow(btn.dataset.split)){
        importSplitSelection.clear();
        renderImportBasisdataScreen();
      }
    };
  });

  container.querySelectorAll(".import-bd-tx-pick").forEach(box=>{
    box.onchange = () => {
      const sleutel = `${box.dataset.row}::${box.dataset.entry}`;
      if(box.checked) importSplitSelection.add(sleutel); else importSplitSelection.delete(sleutel);
      renderImportBasisdataScreen();
    };
  });

  container.querySelectorAll(".import-bd-split-sel").forEach(btn=>{
    btn.onclick = () => {
      const rowId = btn.dataset.splitSel;
      const row = importBasisdataRows.find(r => r.id === rowId);
      if(!row) return;
      const indexen = row.entries
        .map((_, i) => i)
        .filter(i => importSplitSelection.has(`${rowId}::${i}`));
      if(splitImportBasisdataEntries(rowId, indexen)){
        // Indexen verschuiven door het splitsen, dus de selectie is daarna betekenisloos.
        importSplitSelection.clear();
        // De nieuwe rij meteen uitgeklapt laten: je wilt zien wat erin terecht is gekomen.
        expandedBreakdowns.add(`importbd::${rowId}`);
        renderImportBasisdataScreen();
      }
    };
  });

  container.querySelectorAll(".import-bd-expand").forEach(btn=>{
    btn.onclick = () => {
      toggleBreakdown(btn.dataset.expand);
      renderImportBasisdataScreen();
    };
  });
}

function renderImportBasisdataReviewStep(container){
  const tilesHtml = CATEGORY_BUCKET_KEYS.map(bucket=>{
    const bucketRows = importBasisdataRows.filter(r=>r.bucket===bucket);
    const lines = computeImportBasisdataResultingLines(bucket);
    const total = bucketRows.reduce((a,r)=>a+importRowAmount(r),0);
    const labelObj = PROFILE_CATEGORY_BUCKETS.find(b=>b.key===bucket);
    const rowsWord = state.lang === "nl" ? (bucketRows.length===1?"rij":"rijen") : (bucketRows.length===1?"row":"rows");
    const sub = (lines.length !== bucketRows.length && bucketRows.length>0)
      ? t("importBasisdataRowsToLines")(bucketRows.length, lines.length)
      : `${bucketRows.length} ${rowsWord}`;
    return `
      <div class="import-bd-tile" style="--bucket-color:${bucketColorVar(bucket)}">
        <div class="import-bd-tile-label">${t(labelObj.titleKey)}</div>
        <div class="import-bd-tile-amt">€ ${fmt(Math.abs(total))}</div>
        <div class="import-bd-tile-sub">${sub}</div>
      </div>
    `;
  }).join("");
  const unclassifiedCount = importBasisdataRows.filter(r=>!r.bucket).length;
  const unclassifiedTile = unclassifiedCount > 0 ? `
    <div class="import-bd-tile unclassified">
      <div class="import-bd-tile-label">⚠ ${t("importBasisdataUnclassifiedTile")}</div>
      <div class="import-bd-tile-amt">${unclassifiedCount}</div>
      <div class="import-bd-tile-sub">${t("importBasisdataRowsNeedGroup")(unclassifiedCount)}</div>
    </div>
  ` : "";

  const rowsHtml = importBasisdataRows.map(r=>renderImportBasisdataRowHtml(r)).join("");

  const previewBucketsHtml = CATEGORY_BUCKET_KEYS.map(bucket=>{
    const lines = computeImportBasisdataResultingLines(bucket);
    if(!lines.length) return "";
    const labelObj = PROFILE_CATEGORY_BUCKETS.find(b=>b.key===bucket);
    const linesHtml = lines.map(l=>`
      <div class="import-bd-preview-line"><span>${escapeHtml(l.label)}</span><span>€ ${fmt(Math.abs(l.amt))}</span></div>
      ${l.merged > 1 ? `<div class="import-bd-preview-line-sources">${escapeHtml(t("importBasisdataPreviewMergedFrom")(l.merged))}: ${l.sources.map(escapeHtml).join(", ")}</div>` : ""}
    `).join("");
    return `<div class="import-bd-preview-bucket"><div class="import-bd-preview-bucket-title" style="--bucket-color:${bucketColorVar(bucket)}">${t(labelObj.titleKey)}</div>${linesHtml}</div>`;
  }).join("");

  const { done, total } = importBasisdataProgress();
  const pct = total ? Math.round((done/total)*100) : 0;

  // Eén gezamenlijke tip i.p.v. dezelfde zin onder elke rij (zie renderImportBasisdataRowHtml).
  const geenCategorieen = state.categories.length === 0;
  const catTip = geenCategorieen
    ? `<p class="import-bd-cat-tip">${escapeHtml(t("importBasisdataCatEmptyTip"))}</p>`
    : "";

  container.innerHTML = `
    <div class="import-bd-tiles">${tilesHtml}${unclassifiedTile}</div>
    ${catTip}
    <div class="import-bd-rows">${rowsHtml}</div>
    <div class="import-bd-preview">
      <h3>${t("importBasisdataPreviewTitle")}</h3>
      <p class="import-bd-preview-hint">${t("importBasisdataPreviewHint")}</p>
      ${previewBucketsHtml || `<p class="import-bd-preview-empty">—</p>`}
    </div>
    <div class="import-bd-footer" id="importBdFooter">
      <div class="import-bd-progress">
        <span>${t("importBasisdataProgressLabel")(done, total)}</span>
        <div class="import-bd-progress-bar"><div class="import-bd-progress-bar-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="import-bd-footer-actions">
        <button type="button" class="import-bd-btn-secondary" id="importBdCancelBtn">${t("importBasisdataCancelBtn")}</button>
        <button type="button" class="import-bd-btn-danger" id="importBdCreateBtn" ${done<total ? "disabled":""}>${t("importBasisdataCreateBtn")}</button>
      </div>
    </div>
  `;

  wireImportBasisdataRowHandlers(container);

  container.querySelector("#importBdCancelBtn").onclick = () => {
    if(confirm(t("importBasisdataCancelConfirm"))){
      resetImportBasisdataUI();
      renderAll();
    }
  };
  const createBtn = container.querySelector("#importBdCreateBtn");
  createBtn.onclick = () => {
    const p = importBasisdataProgress();
    if(p.done < p.total) return;
    showImportBasisdataConfirm();
  };
}

/* Vervangt Inkomsten/Vaste lasten/Abonnementen/Variabele lasten van Basisdata door de samengestelde
   regels uit deze import (zie computeImportBasisdataResultingLines). Werkt rechtstreeks op
   basisdataScenario() (state.scenarios[0]) -- dus meteen zichtbaar/doorwerkend in elk jaar (zie
   vasteLastenTotal/basisdataCostTotals/computedLoon), precies zoals de waarschuwing op dit scherm al
   aankondigt. Raakt state.months/state.budgets bewust totaal niet aan. */
function applyImportBasisdata(){
  const bd = basisdataScenario();
  const linesByBucket = {};
  CATEGORY_BUCKET_KEYS.forEach(bucket=>{ linesByBucket[bucket] = computeImportBasisdataResultingLines(bucket); });

  // De salarisregel moet de vervanging van Basisdata overleven. Doet hij dat niet, dan vindt
  // getLoonItem() niets meer, valt baseLoonRaw() terug op 0 en cascadeert elk volgend jaar vanaf
  // nul — precies wat er gebeurde: een jaar kwam uit op € 100 + de overige inkomsten, en de
  // Loonstijgingstabel liet een "groei" van -84% zien zonder dat er iets van waarschuwde.
  //
  // Drie manieren om 'm terug te vinden, in deze volgorde:
  //   1. de import herkende zelf een salarisbetaling (zie classifyTransaction, role:"salary");
  //   2. er staat een regel onder precies dezelfde naam als de vorige salarisregel;
  //   3. er is maar één inkomstenregel — dan kan het niets anders zijn.
  // Lukt geen van drieën, dan blijft de markering leeg en zegt het succesbericht dat je 'm zelf
  // even moet aanwijzen. Liever dat dan stilzwijgend verkeerde jaren.
  const vorigeSalarisNaam = (() => {
    const vorige = getLoonItem(bd);
    return vorige ? (vorige.l||"").trim().toLowerCase() : null;
  })();

  /* Van bankbedrag naar postbedrag. In het afschrift is een afschrijving negatief en een
     bijschrijving positief; in FinBo staat een kostenpost als positief getal in een kostengroep.
     De omrekening is dus een TEKENOMKERING voor de drie kostengroepen, niet Math.abs.
     Tot v25 stond hier wél Math.abs (en Math.max(0,…) voor inkomsten), met drie stille fouten:
      - een belastingteruggave van € 1.200 die je bij Vaste lasten zette werd € 1.200 kósten: een
        verschil van € 2.400 op jaarbasis;
      - een samengevoegde groep van −100 en +400 werd € 300 kosten in plaats van € 300 terug;
      - een inkomstenregel die netto negatief uitkwam werd stil 0, mét role:"salary" — precies de
        salariscascade die we eerder hebben gerepareerd, via een andere deur.
     Een bedrag dat tegen zijn groep in gaat (een teruggave bij de kosten, een negatieve
     inkomstenregel) blijft nu gewoon zichtbaar als negatief getal, en wordt hieronder ook expliciet
     gemeld op het successcherm in plaats van weggepoetst. */
  // Nu pas de tijdens het indelen geleerde herkenregels vastleggen (zie `leer`).
  importBasisdataPendingRules.forEach(r => rememberUserRule(r.match, r.bucket, r.label));

  const rond = n => Math.round(n*100)/100;
  const tegendraads = [];
  const naarPost = (l, bucket) => {
    const v = bucket === "income" ? rond(l.amt) : rond(-l.amt);
    if(v < 0) tegendraads.push({ label: l.label, bucket, v });
    const post = { l: l.label, v };
    // De losse betaaldatums overleven de samenvoeging tot Basisdata-regel: renderCard toont vanaf
    // hier automatisch dezelfde uitklapbare deellijst als bij "Toepassen op budget"
    // (applyMonthToBudget) — precies wat een samengevoegde regel na het indelen via categorieën
    // nog steeds per-transactie inzichtelijk maakt. Net als daar: pas vanaf 2 transacties een
    // eigen uitklapknopje, anders is er niets om uit te klappen.
    if(l.entries && l.entries.length > 1) post.entries = l.entries.map(e => ({...e}));
    return post;
  };
  bd.income.items = linesByBucket.income.map(l=>naarPost(l, "income"));
  bd.vasteLasten.items = linesByBucket.vasteLasten.map(l=>naarPost(l, "vasteLasten"));
  bd.abonnementen.items = linesByBucket.abonnementen.map(l=>naarPost(l, "abonnementen"));
  bd.variabeleLasten.items = linesByBucket.variabeleLasten.map(l=>naarPost(l, "variabeleLasten"));

  // Voegde deze import meerdere tegenpartijen samen onder één naam (drie supermarkten die allemaal
  // "Boodschappen" voorstelden), dan is die naam functioneel precies wat een categorie is. Hem niet
  // aanmaken leverde een vreemde tussenstand op: in Basisdata stond een verzamelregel "Boodschappen",
  // maar onder Profiel > Categorieën bestond die niet, en je kon hem dus ook nergens beheren.
  // Alleen bij een échte samenvoeging (2 of meer rijen) — één rij onder zijn eigen naam is geen
  // categorie. Bestaat de naam al in die groep, of past hij niet binnen de regels van
  // createCategory (bv. langer dan 20 tekens), dan gebeurt er simpelweg niets.
  const nieuweCategorieen = [];
  CATEGORY_BUCKET_KEYS.forEach(bucket=>{
    linesByBucket[bucket].forEach(l=>{
      if(l.merged < 2) return;
      // Een naam die alleen door het splitsen ontstaan is ("Bouwmarkt (Praxis — deel 1)") is geen
      // categorie maar een gelegenheidslabel; die hoort niet permanent onder Profiel > Categorieën
      // te belanden.
      if(/\(.*\)\s*$/.test(l.label||"")) return;
      const bestaat = state.categories.some(c => c.bucket === bucket
        && c.name.trim().toLowerCase() === (l.label||"").trim().toLowerCase());
      if(bestaat) return;
      const res = createCategory(l.label, bucket);
      if(res && res.category) nieuweCategorieen.push(res.category);
    });
  });

  // Salarisregel aanwijzen volgens de drie stappen hierboven.
  let salarisItem = null;
  const herkendIndex = linesByBucket.income.findIndex(l => l.role === "salary");
  if(herkendIndex !== -1) salarisItem = bd.income.items[herkendIndex];
  if(!salarisItem && vorigeSalarisNaam){
    salarisItem = bd.income.items.find(it => (it.l||"").trim().toLowerCase() === vorigeSalarisNaam) || null;
  }
  if(!salarisItem && bd.income.items.length === 1) salarisItem = bd.income.items[0];
  if(salarisItem) setSalaryRole(bd, salarisItem);

  importBasisdataSuccessInfo = {
    sourceLabel: importBasisdataSourceLabel, linesByBucket, nieuweCategorieen,

function renderImportBasisdataSuccessStep(container){
  const info = importBasisdataSuccessInfo;
  if(!info){ container.innerHTML = ""; return; }
  const summaryHtml = CATEGORY_BUCKET_KEYS.map(bucket=>{
    const lines = info.linesByBucket[bucket];
    if(!lines.length) return "";
    const labelObj = PROFILE_CATEGORY_BUCKETS.find(b=>b.key===bucket);
    const items = lines.map(l=> l.merged>1 ? `${escapeHtml(l.label)} (${escapeHtml(t("importBasisdataPreviewMergedFrom")(l.merged))})` : escapeHtml(l.label)).join(", ");
    return `<li><b>${t(labelObj.titleKey)}:</b> ${items}</li>`;
  }).join("");

  // Aangemaakte categorieën expliciet noemen: ze verschijnen anders zonder aankondiging in
  // Profiel > Categorieën, en dan lijkt het alsof de app iets achter je rug om heeft gedaan.
  const salarisHtml = info.salarisNaam
    ? `<p class="import-bd-success-cats">${escapeHtml(t("importBasisdataSuccessSalary")(info.salarisNaam))}</p>`
    : `<p class="import-bd-success-warn">${escapeHtml(t("importBasisdataSuccessNoSalary"))}</p>`;

  /* Regels die tegen hun groep in gaan (een teruggave tussen de kosten, een negatieve
     inkomstenregel) worden bewust benoemd. Ze zijn niet fout — een teruggave die de energiekosten
     verlaagt is precies goed — maar ze staan als negatief getal in de groep, en dat wil je gezien
     hebben in plaats van ontdekken. */
  const tegenHtml = (info.tegendraads && info.tegendraads.length)
    ? `<p class="import-bd-success-warn">${escapeHtml(t("importBasisdataSuccessOpposite")(
        info.tegendraads.map(x=>`${x.label} (€ ${fmt(x.v)})`).join(", ")))}</p>`
    : "";

  const catsHtml = (info.nieuweCategorieen && info.nieuweCategorieen.length)
    ? `<p class="import-bd-success-cats">${escapeHtml(t("importBasisdataSuccessNewCats")(info.nieuweCategorieen.map(c=>c.name).join(", ")))}</p>`
    : "";

  container.innerHTML = `
    <div class="import-bd-success-card">
      <h3>${t("importBasisdataSuccessTitle")}</h3>
      <p>${t("importBasisdataSuccessNote")(escapeHtml(info.sourceLabel))}</p>
      <ul>${summaryHtml}</ul>
      ${salarisHtml}
      ${tegenHtml}
      ${catsHtml}
      <button type="button" id="importBdDoneBtn" style="font-family:'Segoe UI',sans-serif; font-size:13px; font-weight:600; padding:9px 16px; border-radius:5px; cursor:pointer; background:var(--gold); border:1px solid var(--gold); color:#fff;">${t("importBasisdataDoneBtn")}</button>
    </div>
  `;
  container.querySelector("#importBdDoneBtn").onclick = () => {
    resetImportBasisdataUI();
    state.activeScenario = 0;
    state.activeView = { type:"scenario", index:0 };
    renderAll();
  };
}
