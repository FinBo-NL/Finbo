/* (v24 had hier ITEM_LABEL_TRANSLATIONS: een vaste NL→EN woordenlijst voor een handvol
   postnamen, "Loon" → "Income" enzovoort. Verwijderd in v25: de naam van een post is
   gebruikersdata, geen tekst van de app. Een vaste lijst kon per definitie alleen de posten van
   de oorspronkelijke gebruiker vertalen — bij iedereen anders bleef alles onvertaald staan, wat
   in EN-modus een half-vertaald scherm opleverde. Postnamen worden nu altijd getoond precies
   zoals ze zijn ingevoerd; alleen de vaste teksten van de app zelf (zie i18n/t()) vertalen mee. */

/* Historische loonreeks. Bewust LEEG bij een schone start: dit zijn per definitie persoonlijke
   cijfers, er valt niets zinnigs voor te verzinnen voor iemand anders. effectiveLoonstijgingRows()
   vult de reeks sowieso aan met een rij per bestaand scenario/jaar (gesynct uit de inkomsten van
   dat jaar), dus met een leeg startpunt toont de Loonstijging-pagina gewoon het basisjaar en groeit
   de reeks mee zodra er jaren bij komen. Eigen historische jaren kan de gebruiker zelf toevoegen. */
const DEFAULT_LOONSTIJGING = [];

/* ---------- STATE ---------- */
/* Elk scenario/jaar heeft z'n eigen volledig onafhankelijke inkomsten/vaste lasten/abonnementen/
   variabele lasten (geen gedeelde data meer tussen scenario's). Basisdata (2026), 2027 en 2028
   zijn "locked" (niet verwijderbaar); alles wat via de knop
   "+ Nieuw jaar" wordt aangemaakt komt erachter en is wel verwijderbaar. */
function cloneItems(items){
  // Kopieert ook "entries" (de per-transactie-details achter een samengevoegde regel, zie
  // buildMonthFromCSV/applyMonthToBudget) en "note" (bv. de grijze "geen transactie gevonden"-
  // toelichting die applyMonthToBudget op een leeggebleven regel zet) wanneer aanwezig, zodat een
  // undo-snapshot (bv. bij reverseApplyMonthToBudget) niets stilzwijgend kwijtraakt.
  return items.map(it => {
    const clone = { l: it.l, v: it.v };
    if(it.entries && it.entries.length) clone.entries = it.entries.map(e => ({...e}));
    if(it.note) clone.note = (typeof it.note === "object") ? {...it.note} : it.note;
    // Markeringen op een regel horen bij die regel en moeten een kopie dus overleven: "role"
    // (welke inkomstenregel het salaris is, zie getLoonItem) en "offsetTarget" (van welke andere
    // regel deze wordt afgetrokken, zie findOffsetPairs). Werden ze hier niet meegenomen, dan
    // verloor elk nieuw maandbudget/jaar die instellingen stilzwijgend.
    if(it.role) clone.role = it.role;
    if(it.offsetTarget) clone.offsetTarget = it.offsetTarget;
    return clone;
  });
}
function makeScenario(label, jaar, locked, incomeItems, vasteLastenItems, abonnementenItems, variabeleLastenItems, loonstijging){
  return {
    label, jaar, locked,
    income: { items: cloneItems(incomeItems) },
    vasteLasten: { items: cloneItems(vasteLastenItems) },
    abonnementen: { items: cloneItems(abonnementenItems) },
    variabeleLasten: { items: cloneItems(variabeleLastenItems) },
    // Alleen voor niet-Basisdata jaren: eigen loonsverhoging-blok van dát jaar
    // (vast bedrag + percentage), werkt door op het loon van dát jaar t.o.v. het jaar ervoor.
    loonstijging: loonstijging ? { vast: loonstijging.vast, pct: loonstijging.pct } : null,
  };
}

/* ---------- MAANDBUDGET ---------- */
/* Een "maandbudget" is een losse, bevroren momentopname van de op dat moment actuele
   Basisdata-waarden (inkomsten + alle kosten, per regel). Eenmaal aangemaakt verandert hij niet
   meer mee met latere wijzigingen in Basisdata — een volgende momentopname pakt wél weer de dan
   actuele waarden. Wordt gebruikt om een geüploade maand-CSV tegen te vergelijken (zie 3.3). */
function makeBudget(title, source){
  return {
    id: "b" + Date.now() + "_" + Math.floor(Math.random()*10000),
    title,
    createdAt: Date.now(),
    income: { items: cloneItems(source.income.items) },
    vasteLasten: { items: cloneItems(source.vasteLasten.items) },
    abonnementen: { items: cloneItems(source.abonnementen.items) },
    variabeleLasten: { items: cloneItems(source.variabeleLasten.items) },
    // Eigen, los instelbaar vinkje (zie renderOffsetToggleForBudget) — neemt bij aanmaken de
    // huidige Basisdata-stand over, maar wijzigt daarna niet meer mee met Basisdata (bevroren snapshot).
    offsetsEnabled: state.offsetsEnabled,
    // Terugboekingen die de gebruiker via "Openstaande terugboekingen" bewust aan dit specifieke
    // maandbudget toevoegt (zie renderStornoReviewCard) — een los blok, niet vermengd met de
    // "normale" vaste-lasten-post, zodat altijd zichtbaar blijft dát het om een terugboeking gaat.
    outstanding: { items: [] },
  };
}
function createBudget(){
  const bd = basisdataScenario();
  const now = new Date();
  const defaultTitle = `${t("months")[now.getMonth()]} ${now.getFullYear()}`;
  const budget = makeBudget(defaultTitle, bd);
  state.budgets.unshift(budget); // nieuwste bovenaan
  state.activeView = { type:"budget", id: budget.id };
  renderAll();
}
function budgetObjFromView(){
  if(state.activeView.type !== "budget") return null;
  return state.budgets.find(b=>b.id===state.activeView.id) || null;
}

/* "Deze maand toepassen op het gekoppelde maandbudget" — kopieert de werkelijke, herkende
   (en via "Nog in te delen" ingedeelde) bedragen van een geïmporteerde maand naar de line-items
   van het gekoppelde maandbudget: bestaande regels (zelfde label) worden overschreven met het
   echte bedrag, nieuwe labels die nog niet in het budget stonden worden er als nieuwe regel aan
   toegevoegd. Zo kan een maandbudget van "gepland" naar "wat er werkelijk gebeurd is" gebracht
   worden, in plaats van dat de vergelijking alleen ernaast blijft staan. Raakt bewust niet aan
   "outstanding" (dat loopt al rechtstreeks via renderStornoReviewCard) en is idempotent: opnieuw
   toepassen na het indelen van meer "Nog in te delen"-posten werkt gewoon opnieuw bij. */
function applyMonthToBudget(m, budget){
  // Bewaar een momentopname van het budget van vóór het overschrijven, op de MAAND zelf — zodat
  // "Toepassen" met één druk op de knop ongedaan gemaakt kan worden (zie
  // reverseApplyMonthToBudget/renderBudgetPickerCard). Bewust maar één stap terug, net als de
  // Toevoegen/Ongedaan-maken-toggle elders in de app: een nieuwe keer "Toepassen" overschrijft deze
  // momentopname gewoon weer met de daaraan voorafgaande stand.
  m.appliedToBudget = {
    budgetId: budget.id,
    snapshot: {
      income: cloneItems(budget.income.items),
      vasteLasten: cloneItems(budget.vasteLasten.items),
      abonnementen: cloneItems(budget.abonnementen.items),
      variabeleLasten: cloneItems(budget.variabeleLasten.items),
    },
  };
  const cats = ["income","vasteLasten","abonnementen","variabeleLasten"];
  const monthNote = { nl: i18n.nl.applyZeroedNote(monthLabelIn(m,"nl")), en: i18n.en.applyZeroedNote(monthLabelIn(m,"en")) };
  cats.forEach(cat=>{
    // Bijhouden welke bestaande budgetregels deze keer een echte (mogelijk nul-)overeenkomst in de
    // maand hebben gehad, zodat de rest hieronder herkend kan worden als "geen transactie gevonden".
    const matchedKeys = new Set();
    m[cat].items.forEach(item=>{
      const key = item.l.trim().toLowerCase();
      matchedKeys.add(key);
      const existing = budget[cat].items.find(it => it.l.trim().toLowerCase() === key);
      // Combinatieregels (meerdere onderliggende betalingen, bv. Geldmaat/Bouwmarkt/Online) dragen
      // hun per-transactie-detail nu ook over naar het budget, zodat de budgetkaart na "Toepassen"
      // dezelfde uitklapbare deellijst kan tonen als de maand zelf al deed — zie renderCard. Een
      // enkele-transactie-post krijgt bewust geen "entries" (net als in buildMonthFromCSV: alleen
      // > 1 entry verdient een uitklapknopje).
      const entries = (item.entries && item.entries.length > 1) ? item.entries.map(e => ({...e})) : null;
      if(existing){
        existing.v = item.v;
        if(entries) existing.entries = entries; else delete existing.entries;
        // Heeft weer een echt bedrag deze maand — een eerdere "geen transactie gevonden"-toelichting
        // (zie hieronder) is dan niet meer van toepassing.
        delete existing.note;
      } else {
        const newItem = { l: item.l, v: item.v };
        if(entries) newItem.entries = entries;
        budget[cat].items.push(newItem);
      }
    });

    // Een bestaande budgetregel zonder overeenkomende transactie deze maand blijft NIET zomaar op
    // zijn oude bedrag staan (dat zou net doen alsof er evenveel aan is besteed als gepland) en
    // wordt ook niet verwijderd (dan verdwijnt een onregelmatige post als bv. hondenvoer voorgoed
    // uit het budget na één rustige maand): hij gaat naar € 0,00 met een grijze toelichting erbij
    // (zie .row-note/renderCard) waarom hij leeg is, zodat meteen duidelijk is dat er niets voor
    // gevonden is i.p.v. dat het een bewust ingevoerde nul lijkt.
    budget[cat].items.forEach(it=>{
      const key = it.l.trim().toLowerCase();
      if(matchedKeys.has(key)) return;
      it.v = 0;
      delete it.entries;
      it.note = { ...monthNote };
    });
  });
}

/* Zet een eerdere applyMonthToBudget() terug via de op de maand bewaarde momentopname — vervangt
   de vier categorieën van het budget één-op-één door de stand van vóór het toepassen (dus ook
   nieuw-toegevoegde regels verdwijnen weer, niet alleen overschreven waarden worden hersteld). */
function reverseApplyMonthToBudget(m){
  if(!m.appliedToBudget) return;
  const budget = state.budgets.find(b => b.id === m.appliedToBudget.budgetId);
  if(budget){
    const snap = m.appliedToBudget.snapshot;
    budget.income.items = cloneItems(snap.income);
    budget.vasteLasten.items = cloneItems(snap.vasteLasten);
    budget.abonnementen.items = cloneItems(snap.abonnementen);
    budget.variabeleLasten.items = cloneItems(snap.variabeleLasten);
  }
  m.appliedToBudget = null;
}

/* Startpunt voor een schone installatie: alle vier de groepen leeg. FinBo levert bewust GEEN
   voorbeeldposten mee — de gebruiker vult Basisdata zelf, of laat "Import basisdata" hem in één
   keer opbouwen uit een bankafschrift. (Tot v24 stonden hier de persoonlijke posten van de
   oorspronkelijke gebruiker; die kwamen daardoor bij iedere nieuwe gebruiker terecht.) */
const BASISDATA_INCOME = [];
const BASISDATA_VASTELASTEN = [];
const BASISDATA_ABONNEMENTEN = [];
const BASISDATA_VARIABELELASTEN = [];
/* De enige plek waar een "lege" FinBo wordt gedefinieerd. Wordt gebruikt als opstartwaarde van
   `state` én door de auth-gate wanneer een nieuw account voor "Begin leeg" kiest — die twee liepen
   tot v24 uiteen, waardoor "Begin leeg" in de praktijk de voorbeelddata van de oorspronkelijke
   gebruiker overnam. Eén scenario (Basisdata, op het huidige kalenderjaar), vier lege groepen,
   geen loonhistorie, geen categorieën, geen eigen importregels. */
function makeBlankState(){
  return {
    lang: "nl",
    darkMode: false, // licht/donker-modus (hele UI, niet alleen de kaarten) — knop naast NL/EN in de header
    activeView: { type: "scenario", index: 0 },
    activeScenario: 0,
    // Zet de "trek gekoppelde regels af van hun doelregel"-berekening aan (zie findOffsetPairs).
    // Zonder koppelingen verandert dit niets; het staat aan zodat een nieuwe koppeling meteen werkt.
    offsetsEnabled: true,
    loonstijgingSelectedYear: null, // jaar dat is aangeklikt op de Loonstijging-grafiek; null = huidig kalenderjaar (of laatste jaar als dat buiten bereik valt)
    months: [],
    budgets: [], // maandbudgetten: losse momentopnames van Basisdata (nieuwste eerst), zie makeBudget()
    categories: [], // eigen categorieën voor het indelen van "Nog in te delen"-rijen, zie createCategory()
    userRules: [], // eigen herken-regels voor imports ({match, bucket, label}), zie matchUserRule()
    loonstijging: DEFAULT_LOONSTIJGING.slice(),
    scenarios: [
      // Basisdata = het basisjaar; inkomen is hier altijd direct bewerkbaar (geen eigen
      // loonsverhoging-blok). Verdere jaren maakt de gebruiker zelf aan met "+ Nieuw jaar".
      makeScenario("Basisdata", new Date().getFullYear(), true,
        BASISDATA_INCOME, BASISDATA_VASTELASTEN, BASISDATA_ABONNEMENTEN, BASISDATA_VARIABELELASTEN),
    ],
  };
}
let state = makeBlankState();

/* Migratie voor oudere opgeslagen bestanden (vóór de onafhankelijke jaren): als het geladen bestand
   nog de oude platte state.income/vasteLasten/abonnementen/variabeleLasten heeft, zet dat om naar
   het nieuwe model zodat oude opslagbestanden/exports bruikbaar blijven. */
/* Een verwijderd maandbudget laat verwijzingen achter in de maanden die eraan gekoppeld waren.
   Tot v25 werden die niet opgeruimd: migrateState repareert een `budgetId` alleen als hij
   ONTBREEKT, dus een maand die naar een verdwenen budget wees bleef voorgoed kapot. Het zichtbare
   gevolg zat bij "toepassen ongedaan maken": reverseApplyMonthToBudget zoekt het budget op, vindt
   niets, doet stilletjes niets — en wist daarna wél `appliedToBudget`, zodat de knop meldde dat het
   gelukt was terwijl er niets hersteld werd. */
function detachMonthsFromBudget(budgetId){
  (state.months||[]).forEach(m => {
    if(m.budgetId === budgetId) m.budgetId = null;
    if(m.appliedToBudget && m.appliedToBudget.budgetId === budgetId) m.appliedToBudget = null;
  });
}

function migrateState(){
  if(!state.scenarios || !state.scenarios.length) return;
  const legacy = state.income && state.vasteLasten && state.abonnementen && state.variabeleLasten;
  if(legacy && !state.scenarios[0].income){
    state.scenarios = state.scenarios.map((s,i) => makeScenario(
      s.label, s.jaar || (2026+i), s.locked !== undefined ? s.locked : i < 3,
      state.income.items, state.vasteLasten.items, state.abonnementen.items, state.variabeleLasten.items
    ));
    delete state.income; delete state.vasteLasten; delete state.abonnementen; delete state.variabeleLasten;
  }
  state.scenarios.forEach((s,i) => {
    if(s.jaar === undefined) s.jaar = 2026 + i;
    // Alleen Basisdata (het basisjaar) staat op slot. In v24 waren ook 2027 en 2028 "ingebouwd"
    // en dus onverwijderbaar; die jaren zijn nu gewoon zelf aangemaakte jaren, en een bestand uit
    // die tijd hield ze anders voorgoed vast.
    s.locked = (i === 0);
  });
  /* Welke inkomstenregel het salaris is, wordt gemarkeerd met role:"salary". Oudere opslagbestanden
     kennen die markering niet; daar heette de regel simpelweg "Loon".
     Deze migratie MOET vóór het loonstijging-blok hieronder staan: dat blok leidt zijn cijfers af uit
     baseLoonRaw(), en die zoekt de loonregel juist op role:"salary". Stond de markering nog niet,
     dan gaf baseLoonRaw voor élk jaar 0, werd elk blok {vast:0, pct:0}, en herschreef de
     syncComputedLoons() aan het eind van deze functie ieder jaar naar het Basisdata-loon — precies
     het stilzwijgend veranderen van bestaande cijfers dat het blok hoort te voorkomen. */
  state.scenarios.forEach(s => {
    if(!s.income || !s.income.items) return;
    if(s.income.items.some(it => it.role === "salary")) return;
    const legacy = s.income.items.find(it => (it.l||"").trim().toLowerCase() === "loon");
    if(legacy) legacy.role = "salary";
  });
  // Migratie naar per-jaar loonsverhoging-blokken: oudere opslagbestanden kennen dit veld nog niet.
  // Voor elk niet-Basisdata jaar zonder "loonstijging" wordt een blok afgeleid dat het al opgeslagen
  // loon exact reproduceert (vast bedrag = loon − loon vorig jaar, 0%), zodat bestaande cijfers bij
  // het laden niet stilzwijgend veranderen. Vanaf dat moment is het blok gewoon los aanpasbaar.
  state.scenarios.forEach((s,i) => {
    if(i === 0){ s.loonstijging = null; return; }
    if(s.loonstijging) return;
    const prev = state.scenarios[i-1];
    const huidigLoon = baseLoonRaw(s);
    const vorigLoon = baseLoonRaw(prev);
    s.loonstijging = { vast: Math.round((huidigLoon - vorigLoon) * 100) / 100, pct: 0 };
  });
  if(!state.verhogingen) state.verhogingen = undefined; // oud globaal blok wordt niet meer gebruikt
  if(!state.budgets) state.budgets = [];
  if(!state.categories) state.categories = []; // oudere opslagbestanden kennen eigen categorieën nog niet
  // Categorieën uit vóór de opsplitsing per budgetgroep (Inkomsten/Vaste lasten/Abonnementen/
  // Variabele lasten) kennen "bucket" nog niet -- val terug op Vaste lasten zodat ze niet
  // stilzwijgend verdwijnen; de gebruiker kan ze zelf verwijderen en opnieuw aanmaken in de juiste
  // groep als dat niet klopt.
  state.categories.forEach(c => { if(!CATEGORY_BUCKET_KEYS.includes(c.bucket)) c.bucket = "vasteLasten"; });
  if(state.darkMode === undefined) state.darkMode = false;
  // Oudere opslagbestanden kennen "budgetId" op een maand nog niet, of hadden nog geen maandbudget
  // toen de maand werd geüpload. Koppel in dat geval automatisch aan het nieuwste maandbudget (als
  // die er inmiddels is) zodat de vergelijking meteen iets zinvols toont; de gebruiker kan dit
  // altijd nog wijzigen via de kiezer boven de vergelijking.
  state.months.forEach(m=>{
    if(m.budgetId === undefined) m.budgetId = state.budgets.length ? state.budgets[0].id : null;
    if(!m.openTerugboekingen) m.openTerugboekingen = [];
    // Oudere opslagbestanden kennen "selected" op een nog-in-te-delen post nog niet. Issue #11:
    // standaard NIET aangevinkt, zodat er nooit stilzwijgend iets wordt meegenomen door de
    // "Selecteer alles/Toevoegen geselecteerde"-bulk-actie zonder dat de gebruiker dat zelf koos.
    if(m.review) m.review.forEach(entry=>{ if(entry.selected === undefined) entry.selected = false; });
    // Idem voor openstaande terugboekingen: "budgetId" (het maandbudget waarnaar deze specifieke
    // rij toegevoegd moet worden) verving de oude categorie-keuze — bestaande, nog niet toegevoegde
    // rijen krijgen standaard geen koppeling (de gebruiker kiest 'm zelf via de nieuwe dropdown).
    if(m.openTerugboekingen) m.openTerugboekingen.forEach(entry=>{ if(entry.budgetId === undefined) entry.budgetId = null; });
    // Issue #10: FinBo's eigen naamgevingsconventie voor imports ("JJJJ-CSV-MM"/"JJJJ-PDF-MM")
    // i.p.v. de rauwe bankbestandsnaam — met terugwerkende kracht ook toegepast op maanden die al
    // vóór deze wijziging waren geïmporteerd en dus nog de oude naam als sourceFile hebben staan.
    const IMPORT_NAME_RE = /^\d{4}-(CSV|PDF)-\d{2}$/;
    if(m.sourceFile && !IMPORT_NAME_RE.test(m.sourceFile)){
      const type = inferLegacyImportType(m.sourceFile);
      m.sourceType = type;
      m.sourceFile = formatImportName(m.year, m.monthIndex, type);
    } else if(m.sourceFile && !m.sourceType){
      m.sourceType = IMPORT_NAME_RE.exec(m.sourceFile)[1];
    }
  });
  // Oudere maandbudgetten kennen het eigen aftrek-vinkje nog niet. Standaard uit, zodat
  // hun al opgeslagen/getoonde totalen niet stilzwijgend veranderen bij het laden.
  state.budgets.forEach(b=>{
    if(b.offsetsEnabled === undefined) b.offsetsEnabled = (b.warmtefondsAftrek === undefined) ? false : b.warmtefondsAftrek;
    delete b.warmtefondsAftrek;
    // Nieuw blok voor terugboekingen die de gebruiker bewust als kostenpost aan dít maandbudget
    // toevoegt (zie renderStornoReviewCard) — oudere maandbudgetten krijgen 'm hier alsnog bij.
    if(!b.outstanding) b.outstanding = { items: [] };
  });

  /* ---- v24 → v25: van vaste namen naar markeringen in de data ---- */
  // Tot v24 zaten twee functies vast aan letterlijke postnamen: de loonsverhoging zocht een regel
  // met het label "Loon", en de aftrek zocht "Warmtefonds" en "UN-Gas+elec". Beide zijn nu vrije
  // markeringen op de regel zelf (role / offsetTarget). Deze eenmalige migratie zet ze om, zodat
  // een bestaand bestand precies blijft werken zoals het werkte — bij wie die namen niet gebruikte
  // verandert er niets, want dan was de functie sowieso al niet actief.
  if(!state.userRules) state.userRules = [];
  if(state.offsetsEnabled === undefined) state.offsetsEnabled = (state.warmtefondsAftrek === undefined) ? true : state.warmtefondsAftrek;
  delete state.warmtefondsAftrek;
  /* Deze koppeling bestaat alleen om twee regelnamen uit de tijd vóór de generieke
     aftrekkoppeling alsnog aan elkaar te knopen. Het zijn letterlijke namen van de oorspronkelijke
     gebruiker; voor iedereen die ná v25 begint is dit dode code. Hij draait daarom nog maar één
     keer: zodra de staat als v25 gemarkeerd is (zie onderaan deze functie) wordt hij overgeslagen,
     en bij een volgende opruimronde kan het hele blok weg. */
  const linkLegacyOffset = (container) => {
    if(state.schemaVersion >= 25) return;
    if(!container || !container.vasteLasten || !container.vasteLasten.items) return;
    const items = container.vasteLasten.items;
    if(items.some(it => it.offsetTarget)) return;
    const src = items.find(it => (it.l||"").trim().toLowerCase() === "warmtefonds");
    const tgt = items.find(it => (it.l||"").trim().toLowerCase() === "un-gas+elec");
    if(src && tgt) src.offsetTarget = tgt.l;
  };
  state.scenarios.forEach(linkLegacyOffset);
  state.budgets.forEach(linkLegacyOffset);
  // Verweesde budgetverwijzingen opruimen: bestanden van vóór deze reparatie kunnen maanden bevatten
  // die naar een allang verwijderd maandbudget wijzen (zie detachMonthsFromBudget).
  (state.months||[]).forEach(m => {
    if(m.budgetId && !state.budgets.some(b => b.id === m.budgetId)) m.budgetId = null;
    if(m.appliedToBudget && !state.budgets.some(b => b.id === m.appliedToBudget.budgetId)) m.appliedToBudget = null;
  });
  // (v24 had hier een migratie die een vaste "Rabobank"-post van € 3,60 aan Basisdata én aan elk
  // bestaand maandbudget toevoegde. Die was gebaseerd op de bankkosten van één specifieke
  // gebruiker en werd bij ELKE keer laden opnieuw uitgevoerd, dus ook in het bestand van iemand
  // anders. Verwijderd in v25 — een eigen bankkostenpost voegt de gebruiker zelf toe.)
  syncComputedLoons();
  // Vanaf hier is de staat naar v25-vorm gebracht. Migraties die alleen over oudere bestanden gaan,
  // kunnen hierop afgaan en zichzelf overslaan.
  state.schemaVersion = 25;
}

/* De taal bepaalt de opmaak, niet een vaste "nl-NL". Stond dat er wél, dan schreef de Engelse
   versie in haar eigen teksten "€0.00" terwijl fmt() er "0,00" van maakte — twee schrijfwijzen door
   elkaar op hetzelfde scherm. */
const fmtLocale = () => (state && state.lang === "en") ? "en-GB" : "nl-NL";
const fmt = n => (isNaN(n) ? 0 : n).toLocaleString(fmtLocale(), {minimumFractionDigits:2, maximumFractionDigits:2});
const sum = items => items.reduce((a,b)=>a+(parseFloat(b.v)||0),0);
/* Elke tekst die van de gebruiker of uit een bankbestand komt en in een HTML-sjabloon terechtkomt,
   gaat hier doorheen — ook een budgettitel of categorienaam die de gebruiker zelf typte.
   Dat is niet alleen een veiligheidsmaatregel. Tot v25 stond een budgettitel rechtstreeks in
   value="${b.title}": typte je `Mijn "extra" budget`, dan las de parser de rest als twee losse
   attributen, toonde het veld alleen nog `Mijn `, en schreef de volgende toetsaanslag díe afgeknotte
   tekst terug over de titel. Een gewoon aanhalingsteken kostte je dus je titel.
   Daarbovenop draait de hele app in één paginacontext waarin ook het versleutelingswachtwoord, de
   Supabase-sessie en de volledige gegevens in platte tekst leven: een <img onerror=...> in een
   geïmporteerde back-up of een afschriftregel zou daar bij kunnen. */
const escapeHtml = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function activeScenarioObj(){
  return state.scenarios[state.activeScenario] || state.scenarios[0];
}
function basisdataScenario(){
  return state.scenarios[0];
}
function latestScenario(){
  return state.scenarios[state.scenarios.length-1];
}

/* De salarisregel van een scenario: de inkomstenregel die de gebruiker zelf heeft aangewezen met
   het sterretje in de Inkomsten-kaart (role: "salary"). Dat is de regel waarop de loonsverhoging
   per jaar wordt toegepast; alle andere inkomstenposten tellen ongewijzigd mee.

   Tot v24 werd deze regel herkend aan het letterlijke label "Loon". Dat werkte alleen voor wie
   z'n salarisregel toevallig precies zo noemde: bij elke andere naam (of taal) viel de hele
   loonsverhoging-functie stilzwijgend uit — geen melding, alleen een jaar dat z'n loon niet
   overnam. De markering staat nu in de data i.p.v. in de code, dus de naam is vrij.

   Er is er hoogstens één: setSalaryRole() haalt de markering eerst overal weg. */
function getLoonItem(s){
  return s.income.items.find(it => it.role === "salary");
}

/* Wijst één inkomstenregel aan als salarisregel (of haalt de markering weg met item = null).
   Hoogstens één per scenario.

   De markering wordt op ALLE jaren gezet, niet alleen op het scenario waar geklikt is: elk jaar
   heeft z'n eigen kopie van de inkomstenregels, en het is conceptueel dezelfde regel. Zonder deze
   doorwerking zou een jaar dat al bestond vóór het aanwijzen geen salarisregel hebben en dus z'n
   loonsverhoging niet meer krijgen. Jaren worden op label gematcht (net als elders in FinBo).
   Maandbudgetten blijven bewust ongemoeid: dat zijn bevroren momentopnamen. */
function setSalaryRole(s, item){
  const wisIn = (sc) => {
    if(sc.income && sc.income.items) sc.income.items.forEach(it => { if(it.role === "salary") delete it.role; });
  };
  // Markering helemaal weghalen: dan overal.
  if(!item){ state.scenarios.forEach(wisIn); return; }

  const doel = (item.l||"").trim().toLowerCase();
  state.scenarios.forEach(sc => {
    if(!sc.income || !sc.income.items) return;
    const match = (sc === s) ? item : sc.income.items.find(it => (it.l||"").trim().toLowerCase() === doel);
    // Vindt dit jaar geen regel met die naam, dan blijft zijn eigen markering staan. Dat gebeurt
    // zodra de salarisregel op Basisdata een andere naam krijgt — bijvoorbeeld doordat een import
    // hem "Salaris" noemt terwijl een bestaand jaar nog "Loon" heet. Ze hier tóch wissen zou dat
    // jaar z'n loonsverhoging afnemen zonder dat iemand daarom vroeg.
    if(!match) return;
    wisIn(sc);
    match.role = "salary";
  });
}

/* Ruwe, opgeslagen loonwaarde van een scenario (zonder de loonsverhoging-formule toe te passen).
   Voor Basisdata is dit de daadwerkelijke, direct bewerkbare waarde. Voor andere jaren wordt dit
   veld door syncComputedLoons() overschreven met computedLoon(s) — baseLoonRaw dient alleen als
   ruwe lees-functie (o.a. bij migratie, vóórdat er een loonstijging-blok bestaat). */
function baseLoonRaw(s){
  const loonItem = getLoonItem(s);
  return loonItem ? (parseFloat(loonItem.v)||0) : 0;
}

/* Het daadwerkelijke loon van een scenario. Basisdata (2026): direct bewerkbare waarde. Elk ander
   jaar: loon van het jaar ervoor + het eigen loonsverhoging-blok van dát jaar (vast bedrag, dan
   percentage) — cascadeert dus automatisch door: wijzig je 2027, dan werkt dat door in 2028, 2029, ... */
function computedLoon(s){
  const idx = state.scenarios.indexOf(s);
  if(idx <= 0) return baseLoonRaw(s);
  const prev = state.scenarios[idx-1];
  const prevLoon = computedLoon(prev);
  const vast = s.loonstijging ? (parseFloat(s.loonstijging.vast) || 0) : 0;
  const pct = s.loonstijging ? (parseFloat(s.loonstijging.pct) || 0) : 0;
  return Math.round((prevLoon + vast) * (1 + pct/100) * 100) / 100;
}

/* Zet voor elk niet-Basisdata jaar de opgeslagen Loon-waarde gelijk aan computedLoon(s), zodat
   sum(items)/totalen/grafieken/Loonstijging-pagina overal automatisch de juiste, actuele waarde
   zien zonder dat elke plek zelf de cascade hoeft te kennen. Wordt aan het begin van renderAll()
   aangeroepen, dus altijd in sync na elke wijziging. */
function syncComputedLoons(){
  // Zonder salarisregel op Basisdata is er niets om vanaf te rekenen: computedLoon() zou dan vanaf
  // 0 cascaderen en elk jaar overschrijven met een onzinbedrag. Dan liever niets aanraken — de
  // jaren houden hun laatste goede waarde, en de Inkomsten-kaart van een jaar legt uit dat er nog
  // een salarisregel aangewezen moet worden (zie noSalaryRowNote).
  if(!getLoonItem(basisdataScenario())) return;
  state.scenarios.forEach(s => {
    if(s === basisdataScenario()) return;
    const loonItem = getLoonItem(s);
    if(loonItem) loonItem.v = computedLoon(s);
  });
}

/* Alle kosten (vaste lasten, abonnementen, variabele lasten) komen altijd live van Basisdata —
   ongeacht welk jaar er bekeken wordt. Elk jaar heeft dus identieke kosten; alleen het (eigen,
   los aanpasbare) inkomen per jaar verschilt. Zie ontwerp-doc §3.1. */
/* ---------- AFTREKKOPPELINGEN TUSSEN REGELS ---------- */
/* Een regel kan met offsetTarget naar het LABEL van een andere regel in dezelfde groep verwijzen:
   "trek mij af van die regel". De doelregel wordt dan netto getoond (eigen bedrag minus de
   gekoppelde regel) en het groepstotaal telt de gekoppelde regel dus niet dubbel mee.

   Dit verving in v25 de vaste "Warmtefonds van UN-Gas+elec"-aftrek, die met die twee namen in de
   code zat en daardoor bij niemand anders werkte. Er wordt bewust op label gematcht en niet op een
   id: alle andere koppelingen in FinBo (bv. het vergelijken van een maand met een budget) werken
   ook op label, en regels hebben geen id. Hernoemen van een doelregel verbreekt de koppeling —
   daarom wordt de verwijzing meteen bijgewerkt als het label verandert, zie renderCard. */
function findOffsetPairs(items){
  const zoekDoel = (van) => {
    const target = (van.offsetTarget||"").trim().toLowerCase();
    if(!target) return null;
    return items.find(it => it !== van && (it.l||"").trim().toLowerCase() === target) || null;
  };
  const pairs = [];
  items.forEach(src => {
    const tgt = zoekDoel(src);
    if(!tgt) return;
    // Kringetje weren: als je vanaf het doel de koppelingen blijft volgen en weer bij de bron
    // uitkomt (A trekt af van B en B van A), trekken beide regels elkaar weg en zou het
    // groepstotaal naar nul lopen. Zo'n koppeling wordt genegeerd i.p.v. doorgerekend. De
    // keuzelijst in renderCard biedt zulke doelen ook niet meer aan; dit is het vangnet voor
    // bestaande data en voor koppelingen die door hernoemen alsnog rond gaan lopen.
    let loper = tgt, stappen = 0;
    while(loper && stappen++ < items.length){
      if(loper === src) return; // rondje — sla deze koppeling over
      loper = zoekDoel(loper);
    }
    pairs.push({ src, tgt });
  });
  return pairs;
}

/* Mag `src` naar `kandidaat` wijzen zonder een kringetje te maken? Gebruikt door de keuzelijst in
   renderCard, zodat een onmogelijke keuze niet eens aangeboden wordt. */
function mayOffsetTarget(items, src, kandidaat){
  if(src === kandidaat) return false;
  let loper = kandidaat, stappen = 0;
  while(loper && stappen++ < items.length){
    if(loper === src) return false;
    const t = (loper.offsetTarget||"").trim().toLowerCase();
    if(!t) return true;
    loper = items.find(it => it !== loper && (it.l||"").trim().toLowerCase() === t) || null;
  }
  return true;
}
/* Het totaalbedrag dat door koppelingen van een groepstotaal af moet. 0 als de aftrek uit staat. */
function offsetTotal(items, enabled){
  if(!enabled) return 0;
  return findOffsetPairs(items).reduce((acc, p) => acc + (parseFloat(p.src.v)||0), 0);
}

function vasteLastenTotal(){
  const bd = basisdataScenario();
  return sum(bd.vasteLasten.items) - offsetTotal(bd.vasteLasten.items, state.offsetsEnabled);
}
/* Zelfde logica als vasteLastenTotal(), maar voor een bevroren maandbudget: gebruikt de eigen
   (gekopieerde) vaste-lasten-items en het eigen offsetsEnabled-vinkje van dat budget, niet de
   globale Basisdata-instelling. */
function vasteLastenTotalForBudget(b){
  return sum(b.vasteLasten.items) - offsetTotal(b.vasteLasten.items, b.offsetsEnabled);
}
function basisdataCostTotals(){
  const bd = basisdataScenario();
  const vasteLasten = vasteLastenTotal();
  const abonnementen = sum(bd.abonnementen.items);
  const variabeleLasten = sum(bd.variabeleLasten.items);
  return { vasteLasten, abonnementen, variabeleLasten, totaalUitgaven: vasteLasten + abonnementen + variabeleLasten };
}

function scenarioTotals(s){
  const costs = basisdataCostTotals();
  const netIncome = sum(s.income.items);
  const overTeSpenderen = netIncome - costs.totaalUitgaven;
  return { vasteLasten: costs.vasteLasten, abonnementen: costs.abonnementen, variabeleLasten: costs.variabeleLasten,
    totaalUitgaven: costs.totaalUitgaven, netIncome, overTeSpenderen };
}

/* computeTotals() geeft de cijfers van het ACTIEVE scenario terug (zoals voorheen), plus arrays
   met de waarden van alle scenario's samen (nodig voor de staafgrafiek die alle jaren toont). */
function computeTotals(){
  const perScenario = state.scenarios.map(scenarioTotals);
  const active = perScenario[state.activeScenario] || perScenario[0];
  return {
    ...active,
    netIncome: perScenario.map(p=>p.netIncome),
    overTeSpenderen: perScenario.map(p=>p.overTeSpenderen),
    vasteLastenPerScenario: perScenario.map(p=>p.vasteLasten),
    abonnementenPerScenario: perScenario.map(p=>p.abonnementen),
    variabeleLastenPerScenario: perScenario.map(p=>p.variabeleLasten),
    totaalUitgavenPerScenario: perScenario.map(p=>p.totaalUitgaven),
  };
}

/* Actuele totale vaste kosten van Basisdata (2026) — ongeacht welk tabblad actief is. Basisdata
   staat altijd op index 0. Gebruikt door de Loonstijging-pagina in plaats van de vaste Excel-aanname. */
function huidigKosten(){
  return basisdataCostTotals().totaalUitgaven;
}

/* Loonstijging 2018-2030, waarbij elk jaar dat een scenario heeft (Basisdata 2026, 2027, 2028,
   en elk zelf aangemaakt jaar erna) "Gemiddeld per maand" en "Totaal
   inkomsten per maand" live overneemt uit dat scenario's inkomsten, i.p.v. de vaste Excel-waarde.
   "Totaal per jaar" is steeds gemiddelde × 12 (netto-naar-jaar-omrekening — bevestigd te kloppen
   met de oorspronkelijke jaarcijfers, bijv. een maandbedrag × 12 dat tot op de euro gelijk uitkomt). "Groei %" wordt
   voor elk jaar herberekend t.o.v. het vorige jaar in deze reeks, zodat een gekoppeld jaar ook de
   groei van het jaar erna correct laat zien (i.p.v. de nu mogelijk achterhaalde vaste Excel-waarde). */
function effectiveLoonstijgingRows(){
  // Unie van de statische Excel-jaren (2018-2030) en alle jaren die een scenario hebben — zo
  // krijgt bijv. een zelf aangemaakt jaar 2031 (buiten de oorspronkelijke Excel-reeks) ook
  // automatisch een rij, puur op basis van dat scenario, zonder statische Excel-data nodig te hebben.
  const staticByYear = {};
  state.loonstijging.forEach(r => { staticByYear[r.jaar] = r; });
  const years = new Set(state.loonstijging.map(r => r.jaar));
  state.scenarios.forEach(s => years.add(s.jaar));
  const sortedYears = Array.from(years).sort((a,b) => a - b);

  let prevGem = null;
  return sortedYears.map(jaar => {
    const row = staticByYear[jaar];
    const matchedScenario = state.scenarios.find(s => s.jaar === jaar);
    let gemPerMaand, extraInkomsten, totaalPerMaand, synced, kosten;
    if(matchedScenario){
      gemPerMaand = sum(matchedScenario.income.items);
      extraInkomsten = 0;
      totaalPerMaand = gemPerMaand;
      synced = true;
      kosten = row ? row.kosten : huidigKosten();
    } else {
      gemPerMaand = row.gemPerMaand;
      extraInkomsten = row.extraInkomsten;
      totaalPerMaand = row.totaalPerMaand;
      synced = false;
      kosten = row.kosten;
    }
    const totaal = Math.round(gemPerMaand * 12 * 100) / 100;
    const groeiPct = prevGem !== null ? Math.round(((gemPerMaand/prevGem - 1) * 100) * 100) / 100 : (row ? row.groeiPct : 0);
    prevGem = gemPerMaand;
    return { jaar, totaal, gemPerMaand, groeiPct, kosten, extraInkomsten, totaalPerMaand, synced };
  });
}

function computeMonthTotals(m){
  const income = sum(m.income.items);
  const vasteLasten = sum(m.vasteLasten.items);
  const abonnementen = sum(m.abonnementen.items);
  const variabeleLasten = sum(m.variabeleLasten.items);
  // Een "Openstaande terugboeking" die je bij een maandbudget indeelt (zie renderStornoReviewCard)
  // telt bewust NIET mee in de eigen totalen van DEZE maand — hij telt alleen mee bij het
  // maandbudget waar je 'm zelf aan toewijst (via budget.outstanding, zie renderMonthSummary's
  // "begroot"-stempel/bTotaalUitgaven). Dat voorkomt dat hetzelfde bedrag dubbel meetelt: één keer
  // hier in de eigen "Over te spenderen" van de maand van herkomst, én nog een keer bij het
  // gekozen budget. (Vóór deze wijziging telde 'm op BEIDE plekken mee — dat bleek verwarrend
  // zodra een terugboeking bij een ánder maandbudget werd ingedeeld dan het budget van de maand
  // zelf, want dan veranderde het "Tekort per maand"-stempel van deze maand mee terwijl de
  // gebruiker 'm juist bij dat andere budget had willen boeken.)
  const totaalUitgaven = vasteLasten + abonnementen + variabeleLasten;
  return { income, vasteLasten, abonnementen, variabeleLasten, totaalUitgaven };
}

function monthLabel(m){
  return monthLabelIn(m, state.lang);
}
/* Zelfde als monthLabel(), maar in een expliciet opgegeven taal i.p.v. de actief ingestelde
   interfacetaal — nodig voor tweetalige toelichtingen die op een item worden opgeslagen (bv.
   applyZeroedNote, zie applyMonthToBudget) en dus zowel de nl- als en-tekst tegelijk moeten
   kunnen opbouwen, ongeacht wat de gebruiker net aan het bekijken is. */
function monthLabelIn(m, lang){
  const name = i18n[lang].months[m.monthIndex-1];
  return `${m.year} ${name.charAt(0).toUpperCase()}${name.slice(1)}`;
}

/* ---------- CSV IMPORT: parsing & vertaallijst (translation list) ---------- */
/* Bankexports komen in verschillende coderingen binnen. De export van de bank zelf is
   windows-1252; haal je datzelfde bestand door Excel of LibreOffice, dan komt er UTF-8 uit — vaak
   mét byte-order-mark. Tot v25 werd er onvoorwaardelijk als windows-1252 gedecodeerd, met twee
   gevolgen: mét BOM werd de eerste kolomnaam "ï»¿Datum", waardoor r["Datum"] voor élke rij
   undefined was en geen enkele datum overkwam; zónder BOM werd "Café René" tot "CafÃ© RenÃ©",
   waarna dezelfde winkel in twee rijen uiteenviel en de geleerde regels niet meer matchten.
   Daarom eerst kijken wat het is: een BOM is beslissend, en anders wordt UTF-8 geprobeerd met
   `fatal` aan — mislukt dat, dan is het geen geldige UTF-8 en valt hij terug op windows-1252. */
/* Losse getallen die eerder verspreid in de code stonden, hier één keer benoemd. */
const MAX_CATEGORY_NAME_LEN = 20;   // lengte van een categorienaam (invoerveld, teller én controle)
const NAME_FALLBACK_MAXLEN = 40;    // hoeveel omschrijving er als naam dient als de tegenpartij ontbreekt
const AUTOSAVE_DEBOUNCE_MS = 500;   // wachttijd na de laatste bewerking voor er wordt opgeslagen
const SAVE_BUTTON_RESET_MS = 1500;  // hoe lang "Opgeslagen" op de knop blijft staan
/* Toleranties voor geldbedragen. CENT_EPSILON is "kleiner dan een halve cent" — daarmee is een
   verschil dat alleen uit drijvende-komma-afronding komt geen verschil. AMOUNT_MATCH_EPSILON is
   ruimer: die vergelijkt twee bedragen uit het afschrift met elkaar, waar een cent verschil door
   afronding bij de bank zelf kan ontstaan. Eerder stonden hier drie losse waarden (0,001 / 0,005 /
   0,01) zonder dat het verschil ergens uitgelegd werd. */
const CENT_EPSILON = 0.001;
const AMOUNT_MATCH_EPSILON = 0.005;

function decodeBankBytes(bytes){
  if(bytes.length >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF){
    return new TextDecoder("utf-8").decode(bytes.subarray(3));
  }
  try{
    return new TextDecoder("utf-8", { fatal: true }).decode(bytes);
  }catch(e){
    return new TextDecoder("windows-1252").decode(bytes);
  }
}

function parseCSV(text){
  const rows = [];
  let row = [];
  let field = "";
  let inQuotes = false;
  const s = text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  for(let i=0;i<s.length;i++){
    const c = s[i];
    if(inQuotes){
      if(c === '"'){
        if(s[i+1] === '"'){ field += '"'; i++; }
        else { inQuotes = false; }
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ","){ row.push(field); field=""; }
      else if(c === "\n"){ row.push(field); rows.push(row); row=[]; field=""; }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  const cleanRows = rows.filter(r => r.length>1 || (r.length===1 && r[0]!==""));
  if(!cleanRows.length) return [];
  const header = cleanRows[0];
  return cleanRows.slice(1).map(r=>{
    const obj = {};
    header.forEach((h,idx)=>{ obj[h] = r[idx] !== undefined ? r[idx] : ""; });
    return obj;
  });
}

function parseNLAmount(s){
  if(!s) return 0;
  const cleaned = String(s).trim().replace(/\./g,"").replace(",", ".");
  const v = parseFloat(cleaned);
  return isNaN(v) ? 0 : v;
}

function detectMonthFromFilename(name){
  const base = name.replace(/\.(csv|pdf)$/i,"");
  const m = base.match(/(\d{4})(\d{2})$/);
  if(m){
    const year = parseInt(m[1],10);
    const month = parseInt(m[2],10);
    if(month>=1 && month<=12) return {year, month};
  }
  return null;
}

/* FinBo's eigen naamgeving voor een geïmporteerde maand ("JJJJ-CSV-MM" / "JJJJ-PDF-MM"), gebruikt
   i.p.v. de kale bankbestandsnaam (die zelf nietszeggende dingen bevat: een voorvoegsel, je eigen
   IBAN en een reeks datums) —
   zie renderReviewCard()/sourceNote en migrateState() voor de retroactieve toepassing op al eerder
   geïmporteerde maanden. */
function formatImportName(year, month, type){
  return `${year}-${type}-${String(month).padStart(2,"0")}`;
}

/* Alleen gebruikt door de migratie in migrateState(): een al opgeslagen maand van vóór deze
   naamgevingsconventie kent alleen nog de oude, rauwe bankbestandsnaam — daaruit wordt CSV/PDF
   afgeleid via de extensie, met "RA_"/"CSV_"-prefixen (de Rabobank-exportnamen die tot nu toe
   gebruikt werden) als extra vangnet, en CSV als veiligste fallback als geen van beide matcht. */
function inferLegacyImportType(oldName){
  if(/\.pdf$/i.test(oldName)) return "PDF";
  if(/\.csv$/i.test(oldName)) return "CSV";
  if(/^ra[_-]/i.test(oldName)) return "PDF";
  if(/^csv[_-]/i.test(oldName)) return "CSV";
  return "CSV";
}

function detectMonthFromRows(rows){
  const counts = {};
  rows.forEach(r=>{
    const d = r["Datum"];
    if(d && /^\d{4}-\d{2}-\d{2}/.test(d)){
      const key = d.slice(0,7);
      counts[key] = (counts[key]||0)+1;
    }
  });
  let best=null, bestCount=0;
  Object.entries(counts).forEach(([k,c])=>{ if(c>bestCount){best=k;bestCount=c;} });
  if(!best) return null;
  const [y,mo] = best.split("-").map(Number);
  return {year:y, month:mo};
}

/* ---------- HERKENNING VAN TRANSACTIES ---------- */
/* Een binnenkomende transactie wordt in twee lagen herkend, in deze volgorde:
   1. state.userRules — de eigen regels van de gebruiker (zie matchUserRule/rememberUserRule).
      Die winnen altijd: wat je zelf hebt ingedeeld weet FinBo beter dan welke standaardlijst ook.
   2. CATEGORY_RULES — een kleine, bewust neutrale startlijst met alleen breed bekende ketens.

   Tot v24 stond hier één lange lijst die rechtstreeks was overgenomen uit de bankafschriften van
   de oorspronkelijke gebruiker: diens hypotheekverstrekker, energieleverancier en verzekeraars,
   en zelfs namen van familieleden — die werden automatisch als "Alimentatie" of "Sparen kids"
   ingedeeld. Bij iedere andere gebruiker deed die lijst óf niets, óf iets verkeerds, en het was
   niet te zien waaróm een rij ergens belandde. Wat hier nu staat is bewust generiek: ketens die
   groot genoeg zijn dat de regel voor veel mensen klopt. Al het persoonlijke leert FinBo zelf,
   van wat de gebruiker tijdens een import indeelt.

   Een label uit deze lijst is een startvoorstel, geen waarheid: elke rij is in het importscherm te
   overschrijven, en die keuze wordt onthouden als eigen regel. */

/* Generieke labels (met "@" ervoor in de regels hieronder) worden op het moment van indelen
   omgezet naar de taal die dan actief staat. Daarna zijn het gewone postnamen: gebruikersdata,
   vrij te hernoemen. Merknamen (Netflix, Spotify) blijven uiteraard onvertaald. */
const IMPORT_LABELS = {
  nl: { groceries:"Boodschappen", eatingOut:"Uit eten/bezorgd", online:"Online aankopen",
        fuel:"Benzine", diy:"Bouwmarkt", pets:"Huisdier", cash:"Geldopname",
        bankCosts:"Bankkosten", salary:"Salaris" },
  en: { groceries:"Groceries", eatingOut:"Eating out/delivery", online:"Online purchases",
        fuel:"Fuel", diy:"DIY store", pets:"Pet supplies", cash:"Cash withdrawal",
        bankCosts:"Bank charges", salary:"Salary" },
};
function resolveRuleLabel(label){
  if(typeof label !== "string" || label[0] !== "@") return label;
  const set = IMPORT_LABELS[state.lang] || IMPORT_LABELS.nl;
  return set[label.slice(1)] || label.slice(1);
}

const CATEGORY_RULES = [

  [["netflix"], "abonnementen", "Netflix"],

/* De eigen regels van de gebruiker: [{match, bucket, label}], opgebouwd doordat de gebruiker een
   rij in het importscherm zelf indeelt (zie rememberUserRule). Matcht — net als CATEGORY_RULES —
   bewust alleen op de tegenpartijnaam en niet op de vrije omschrijving, zodat een toevallig woord
   in een omschrijving geen andere tegenpartij kaapt. */
function matchUserRule(blobNaam){
  if(!state.userRules || !state.userRules.length) return null;
  // Bij meerdere passende regels wint de LANGSTE match, niet de eerst toegevoegde. Anders zou een
  // korte regel ("Albert Heijn" -> Boodschappen) een specifiekere regel die je later maakt
  // ("Albert Heijn Tankstation" -> Benzine) permanent overschaduwen, zonder dat te zien is waarom.
  let beste = null, besteLengte = -1;
  for(const r of state.userRules){
    const k = (r.match||"").trim().toLowerCase();
    if(k && blobNaam.includes(k) && k.length > besteLengte){ beste = r; besteLengte = k.length; }
  }
  return beste;
}

/* Onthoudt de indeling die de gebruiker zelf aan een tegenpartij gaf, zodat een volgende import
   'm meteen goed zet. Bestaat er al een regel voor dezelfde tegenpartij, dan wordt die bijgewerkt
   in plaats van dat er een tweede bijkomt — anders zou de lijst vollopen met tegenstrijdige regels
   en zou de oudste (die als eerste matcht) de nieuwe keuze blijven overrulen. */
function rememberUserRule(match, bucket, label){
  const k = (match||"").trim();
  if(!k || !CATEGORY_BUCKET_KEYS.includes(bucket)) return null;
  if(!state.userRules) state.userRules = [];
  const key = k.toLowerCase();
  const bestaand = state.userRules.find(r => (r.match||"").trim().toLowerCase() === key);
  if(bestaand){
    bestaand.bucket = bucket;
    if(label) bestaand.label = label;
    return bestaand;
  }
  const rule = { match: k, bucket, label: label || k };
  state.userRules.push(rule);
  return rule;
}

function deleteUserRule(match){
  if(!state.userRules) return;
  const key = (match||"").trim().toLowerCase();
  state.userRules = state.userRules.filter(r => (r.match||"").trim().toLowerCase() !== key);
}

function classifyTransaction(tx){
  const partij = (tx["Naam tegenpartij"]||"").trim();
  const initieel = (tx["Naam initiërende partij"]||"").trim();
  const omschr = ((tx["Omschrijving-1"]||"") + " " + (tx["Omschrijving-2"]||"")).trim();
  const naam = partij || initieel || (omschr ? omschr.slice(0, NAME_FALLBACK_MAXLEN) : t("unknownCounterparty"));
  const blobNaam = naam.toLowerCase();
  const blobOmschr = omschr.toLowerCase();
  const amt = parseNLAmount(tx["Bedrag"]);
  const redenRetour = (tx["Reden retour"]||"").trim();

  // Herincasso/terugboeking: de bank markeert dit expliciet in "Reden retour"
  // (bv. "MD06-Oneens met incasso"). Dit is technische ruis, geen echte kostenpost.
  if(redenRetour){
    return {cat:"ignore", naam, amt};
  }

  // Eigen regels gaan vóór alles: dit is wat de gebruiker zelf heeft ingedeeld.
  const eigen = matchUserRule(blobNaam);
  if(eigen) return {cat: eigen.bucket, label: eigen.label || naam, naam, amt};

  // Geldmaat-geldopnames hebben een locatiesuffix in de naam (bv. "Geldmaat <straat A> 74" vs
  // "Geldmaat <straat B> 43") — dat zou anders als losse rijen in "Nog in te delen" komen te staan.
  // Samenvoegen tot één post zodra 'm die kant op gaat (via review), zodat je 'm in één keer kunt
  // toevoegen. Let op: "naam" blijft hier bewust de ORIGINELE tegenpartijnaam (mét locatie) — de
  // samengevoegde reviewregel heet zelf "Geldopname" (dat komt uit "label"), maar de individuele
  // opname in de uitklapbare deellijst moet juist wél de locatie tonen, anders is de deellijst
  // drie identieke regels en heeft uitklappen geen nut.
  if(blobNaam.includes("geldmaat")){
    return {cat:"review", label: resolveRuleLabel("@cash"), naam, amt};
  }
  // Maandelijkse rekeningkosten van de bank zelf: als abonnement herkend i.p.v. in de reviewlijst
  // te belanden. Alleen de vaste pakketafschrijving, niet elke transactie van de bank.
  if(blobNaam.includes("rabobank") && blobOmschr.includes("rabo standaard")){
    return {cat:"abonnementen", label: resolveRuleLabel("@bankCosts"), naam, amt};
  }
  // Salarisbetalingen zijn zelden aan de werkgeversnaam te herkennen (die verschilt per persoon),
  // maar wél aan het woord "salaris"/"salary" in de omschrijving — dat zetten werkgevers er vrijwel
  // altijd bij. Alleen bij een bijschrijving, anders is het een terugbetaling of correctie.
  if(amt > 0 && (blobOmschr.includes("salaris") || blobOmschr.includes("salary"))){
    // role meegeven: hierdoor weet de import welke inkomstenregel de salarisregel is, en blijft
    // de loonsverhoging per jaar werken na het vervangen van Basisdata (zie applyImportBasisdata).
    return {cat:"income", label: resolveRuleLabel("@salary"), role:"salary", naam, amt};
  }

  // De algemene regels matchen bewust alleen op de tegenpartijnaam (niet de vrije omschrijving),
  // zodat een toevallig woord in een omschrijving (bv. een voornaam) geen andere tegenpartij kaapt.
  for(const [keys,cat,label] of CATEGORY_RULES){
    if(keys.some(k=>blobNaam.includes(k))) return {cat, label: resolveRuleLabel(label), naam, amt};
  }

  return {cat:"review", label:naam, naam, amt};
}

/* Herkent teruggeboekte incasso's ("Reden retour" ingevuld, bv. "MD06-Oneens met incasso") en
   voorkomt dat ze verkeerd meetellen:
   1) De mislukte oorspronkelijke afschrijving hoort onlosmakelijk bij zijn eigen terugboeking —
      te herkennen aan exact dezelfde Transactiereferentie. Dat paar wordt samen genegeerd (netto
      nul), zodat een mislukte poging nooit alsnog als kostenpost meetelt.
   2) Is er, voor dezelfde tegenpartij + hetzelfde bedrag + dezelfde omschrijving (bv. "Termijnbedrag
      mei 2026"), later in dezelfde aanlevering wél een geslaagde afschrijving te vinden, dan is de
      terugboeking impliciet alsnog voldaan — die geslaagde regel telt gewoon normaal mee, er is
      verder niets nodig.
   3) Is die er niet, dan verdwijnt de terugboeking niet stilzwijgend: hij komt in een eigen lijst
      (zie renderStornoReviewCard) waar zelf gekozen kan worden of en in welk blok 'm alsnog als
      kostenpost meetelt — in plaats van de aanname dat "genegeerd" hetzelfde is als "voldaan". */
function resolveStornos(rows){
  const isStorno = r => !!(r["Reden retour"] && String(r["Reden retour"]).trim());
  const stornoRows = rows.filter(isStorno);
  const excluded = new Set();
  stornoRows.forEach(r => excluded.add(r));

  const identityKey = r => {
    const naam = (r["Naam tegenpartij"]||r["Naam initiërende partij"]||"").trim().toLowerCase();
    const omschr = ((r["Omschrijving-1"]||"") + " " + (r["Omschrijving-2"]||"")).trim().toLowerCase();
    return naam + "|" + omschr;
  };

  /* Eerst ALLE mislukte oorspronkelijke afschrijvingen wegstrepen (zelfde Transactiereferentie als
     een terugboeking), en pas daarna op zoek naar een geslaagde betaling. Die volgorde is wezenlijk:
     doe je het per terugboeking in één doorloop, dan is de nog niet weggestreepte helft van de
     tweede terugboeking een geldige kandidaat voor de eerste — en dan lijkt alles opgelost terwijl
     er niets betaald is. */
  rows.forEach(storno => {
    if(!isStorno(storno)) return;
    const ref = storno["Transactiereferentie"];
    if(!ref) return;
    rows.forEach(r => {
      if(r === storno) return;
      if(r["Transactiereferentie"] === ref && !isStorno(r)) excluded.add(r);
    });
  });

  const openTerugboekingen = [];
  // Welke geslaagde betalingen al aan een eerdere terugboeking zijn toegewezen.
  const geclaimd = new Set();
  stornoRows.forEach(storno => {
    const amt = Math.abs(parseNLAmount(storno["Bedrag"]));
    const naam = (storno["Naam tegenpartij"]||storno["Naam initiërende partij"]||t("unknownCounterparty")).trim();

    /* Eén geslaagde betaling lost precies ÉÉN terugboeking op. Daarom wordt de gevonden regel
       hieronder geclaimd (`geclaimd`) en telt hij bij een volgende storno niet meer mee.
       Tot v25 stond hier een stateless `rows.some(...)`: die claimde niets, dus twee mislukte
       incasso's van € 50 werden allebei "opgelost" door dezelfde ene betaling van € 50. De maand
       toonde dan € 50 kosten terwijl er € 100 openstond, en de kaart met openstaande
       terugboekingen — het enige vangnet hiervoor — bleef leeg. */
    const key = identityKey(storno);
    const kandidaat = rows.find(r => {
      if(isStorno(r) || excluded.has(r) || geclaimd.has(r)) return false;
      const rAmt = parseNLAmount(r["Bedrag"]);
      if(rAmt >= 0) return false; // moet zelf ook een afschrijving zijn
      if(Math.abs(Math.abs(rAmt) - amt) > AMOUNT_MATCH_EPSILON) return false;
      return identityKey(r) === key;
    });
    if(kandidaat) geclaimd.add(kandidaat);

    if(!kandidaat){
      openTerugboekingen.push({
        naam,
        amt: Math.round(amt*100)/100,
        datum: storno["Datum"] || "",
        target: null,
        addedItem: null,
      });
    }
  });

  return { rows: rows.filter(r => !excluded.has(r)), openTerugboekingen };
}

function buildMonthFromCSV(rows, filename){
  const ym = detectMonthFromFilename(filename) || detectMonthFromRows(rows);
  if(!ym) throw new Error(t("csvNoMonthError"));
  const key = `${ym.year}-${String(ym.month).padStart(2,"0")}`;

  const { rows: filteredRows, openTerugboekingen } = resolveStornos(rows);

  const cats = ["income","vasteLasten","abonnementen","variabeleLasten"];
  // Elke bucket-post houdt nu ook de individuele bijdragende transacties bij ("entries") — niet
  // alleen de opgetelde waarde. Nodig om achteraf een uitklapbare deellijst te kunnen tonen van wat
  // er precies in een samengevoegde regel zit (bv. meerdere Geldmaat-opnames, meerdere Bouwmarkt-
  // aankopen) i.p.v. alleen het totaal. Zie renderCompareCard/renderReviewCard.
  const buckets = {}; cats.forEach(c=>buckets[c]={});
  const reviewBucket = {};

  let rowCount = 0;
  filteredRows.forEach(r=>{
    if(r["Bedrag"] === undefined || r["Bedrag"] === "") return;
    rowCount++;
    const result = classifyTransaction(r);
    const {cat,label,amt} = result;

    if(cat === "ignore") return; // terugboeking/herincasso: bewust genegeerd

    const datum = r["Datum"] || "";
    const omschrijving = ((r["Omschrijving-1"]||"") + " " + (r["Omschrijving-2"]||"")).trim();
    const rawNaam = result.naam || label;

    if(cat === "review"){
      if(!reviewBucket[label]) reviewBucket[label] = { total:0, entries:[] };
      reviewBucket[label].total += amt;
      reviewBucket[label].entries.push({ naam: rawNaam, amt: Math.round(amt*100)/100, datum, omschrijving });
      return;
    }

    // Een creditbedrag op een tegenpartij die normaal alleen kosten afschrijft, is meestal een
    // terugbetaling/correctie van een eerdere afschrijving — geen nieuwe kostenpost. Een echte
    // terugboeking (mislukte incasso, "Reden retour" ingevuld) is op dit punt al lang verdwenen:
    // resolveStornos() filtert die rijen er helemaal uit vóórdat classifyTransaction ze ooit ziet
    // (zie hierboven). Wat híer overblijft is dus altijd een "losse" creditering zonder duidelijke
    // terugboekingsreden (bv. een handmatige PayPal-terugbetaling) — die mag niet stilzwijgend
    // verdwijnen (dat gebeurde eerder wél, en kostte zo onopgemerkt binnengekomen geld), dus komt
    // hij bij "Nog in te delen" te staan, gegroepeerd per label net als de andere combinatieregels
    // (zie ook Geldmaat hierboven), zodat zelf gekozen kan worden of het als inkomen meetelt of als
    // correctie op de kostenpost.
    if(cat !== "income" && amt > 0){
      // "inferredCat" onthoudt welke kostencategorie deze losse creditering normaal zou horen te
      // matchen (bv. "variabeleLasten" voor een PayPal-terugbetaling die anders bij "Online" zou
      // zijn opgeteld) — zie hieronder bij het samenstellen van "review", en renderReviewCard voor
      // waar dit de standaard-doelcategorie in de dropdown bepaalt i.p.v. altijd te gokken op
      // "inkomen" alleen omdat het bedrag toevallig positief is.
      if(!reviewBucket[label]) reviewBucket[label] = { total:0, entries:[], inferredCat: cat };
      reviewBucket[label].total += amt;
      reviewBucket[label].entries.push({ naam: rawNaam, amt: Math.round(amt*100)/100, datum, omschrijving });
      return;
    }

    const isIncome = (cat === "income");
    const contribution = isIncome ? amt : -amt; // kostenposten worden als positief bedrag opgeslagen
    if(!buckets[cat][label]) buckets[cat][label] = { total:0, entries:[] };
    buckets[cat][label].total += contribution;
    buckets[cat][label].entries.push({ naam: rawNaam, amt: Math.round(contribution*100)/100, datum, omschrijving });
  });

  const byDatum = (a,b) => (a.datum||"").localeCompare(b.datum||"");
  const toItems = bucket => Object.entries(bucket)
    .map(([l,data])=>({ l, v: Math.round(data.total*100)/100, entries: data.entries.slice().sort(byDatum) }))
    .filter(it=>Math.abs(it.v) > CENT_EPSILON)
    .sort((a,b)=> b.v - a.v);

  // Issue #11: nieuw geïmporteerde "nog in te delen"-posten staan standaard NIET aangevinkt — de
  // gebruiker moet ze bewust selecteren (of "Alles selecteren" gebruiken) vóór de bulk-toevoegknop
  // ze meeneemt, in plaats van dat per ongeluk alles in één klap wordt toegevoegd.
  const review = Object.entries(reviewBucket)
    .map(([naam,data])=>({
      naam, amt: Math.round(data.total*100)/100, target:null, addedItem:null, selected:false,
      entries: data.entries.slice().sort(byDatum),
      ...(data.inferredCat ? { inferredCat: data.inferredCat } : {}),
    }))
    .filter(it=>Math.abs(it.amt) > CENT_EPSILON)
    .sort((a,b)=> Math.abs(b.amt) - Math.abs(a.amt));

  // Issue #10: FinBo's eigen naamgevingsconventie voor imports ("JJJJ-CSV-MM"/"JJJJ-PDF-MM")
  // i.p.v. de rauwe bankbestandsnaam, die niets zegt (voorvoegsel + eigen IBAN + datumreeks).
  const importType = /\.pdf$/i.test(filename) ? "PDF" : "CSV";

  return {
    key,
    year: ym.year,
    monthIndex: ym.month,
    sourceFile: formatImportName(ym.year, ym.month, importType),
    sourceType: importType,
    rowCount,
    income: { items: toItems(buckets.income) },
    vasteLasten: { items: toItems(buckets.vasteLasten) },
    abonnementen: { items: toItems(buckets.abonnementen) },
    variabeleLasten: { items: toItems(buckets.variabeleLasten) },
    review,
    openTerugboekingen,
  };
}

function upsertMonth(monthObj){
  const idx = state.months.findIndex(m=>m.key===monthObj.key);
  // Bij een hernieuwde upload van dezelfde maand: koppeling met een eerder gekozen maandbudget
  // blijft behouden. Bij een compleet NIEUWE import (CSV of PDF) begint de maand ONgekoppeld ("Geen
  // maandbudget") totdat de gebruiker zelf een maandbudget kiest in de vergelijk-dropdown bovenaan
  // de maandpagina — er wordt niet langer automatisch het nieuwste maandbudget gekozen. Dit
  // voorkomt dat de "Openstaande terugboekingen"-dubbelcheck stilzwijgend afhankelijk is van welk
  // budget hier toevallig als standaard werd gekozen: die check zoekt nu zelf over ALLE
  // maandbudgetten (zie findMatchingOutstandingItem/renderStornoReviewCard) en gebruikt hiervoor
  // niet meer deze vergelijk-koppeling.
  monthObj.budgetId = (idx>=0 && state.months[idx].budgetId) ? state.months[idx].budgetId : null;
  if(idx>=0) state.months[idx] = monthObj; else state.months.push(monthObj);
  state.months.sort((a,b)=> a.key.localeCompare(b.key));
}

function handleCSVUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try{
      const bytes = new Uint8Array(ev.target.result);
      const text = decodeBankBytes(bytes);
      const rows = parseCSV(text);
      const monthObj = buildMonthFromCSV(rows, file.name);
      upsertMonth(monthObj);
      state.activeView = { type:"month", key: monthObj.key };
      renderAll();
    }catch(err){
      alert(t("csvParseError") + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = "";
}

/* ---------- PDF IMPORT: alternatief voor de CSV-export ----------
   Rabobank-rekeningafschriften als PDF hebben, anders dan de CSV-export, geen apart veld met het
   bedrag + teken: dat is alleen te herkennen aan óf het bedrag in de linkerkolom (debet, "Bedrag af")
   óf de rechterkolom (credit, "Bedrag bij") staat afgedrukt. Deze parser leest de tekst + positie van
   elk stukje tekst uit de PDF (via PDF.js), zet ze terug om in regels or "regels" (tekst met (bijna)
   dezelfde y-positie), herkent daarin per transactie de datum/type/naam/bedrag, en levert per
   transactie een object op in exact dezelfde vorm als een rij uit de CSV-export — zodat de rest van
   de import (classifyTransaction, resolveStornos, buildMonthFromCSV) ongewijzigd hergebruikt kan
   worden voor zowel CSV als PDF.
   Kanttekening: dit is beduidend fragieler dan de CSV-import (die gestructureerde velden heeft). Bij
   afwijkingen in de lay-out (bv. een andere banksoort-afschrift) kan dit missen of fouten geven —
   controleer de eerste keer altijd het resultaat. */
function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

async function parsePdfTransactions(arrayBuffer){
  if(!window.pdfjsLib){
    throw new Error(t("pdfLibError"));
  }
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

  const AMOUNT_RE = /^\d{1,3}(?:\.\d{3})*,\d{2}$/;
  const BLOCK_START_RE = /^(\d{2}-\d{2})\s+([a-z]{2,3})\s+(.*)$/i;
  const Y_TOL = 2.5;

  const transactions = [];
  let debetCreditThreshold = null; // x-grens tussen de "Bedrag af"- en "Bedrag bij"-kolom;
                                   // per blok vastgelegd (zie hieronder), want hij verschilt per pagina
  let naamColumnX = null; // linker x-grens van de "Naam/omschrijving"-kolom
  // Bewust BUITEN de pagina-loop: een enkele transactie kan met zijn vervolgregels over een
  // pagina-einde heen lopen (dat gebeurt echt — bv. een terugboeking waarvan de laatste regels
  // "Transactiereferentie: ..." en "Verwerkingsdatum: ..." toevallig net op de volgende pagina
  // staan). Zonder dit zou zo'n transactie stilzwijgend wegvallen (geen Verwerkingsdatum
  // gevonden), inclusief zijn eventuele koppeling aan een terugboeking.
  let block = null;

  for(let pageNum=1; pageNum<=pdf.numPages; pageNum++){
    const page = await pdf.getPage(pageNum);
    const content = await page.getTextContent();
    const items = content.items
      .map(it => ({ str: it.str, x: it.transform[4], y: it.transform[5] }))
      .filter(it => it.str.trim() !== "");

    const sorted = items.slice().sort((a,b)=> b.y - a.y || a.x - b.x);
    const lines = [];
    let currentLine = null;
    sorted.forEach(it=>{
      if(!currentLine || Math.abs(currentLine.y - it.y) > Y_TOL){
        currentLine = { y: it.y, items: [] };
        lines.push(currentLine);
      }
      currentLine.items.push(it);
    });
    lines.forEach(l => l.items.sort((a,b)=>a.x-b.x));

    // Kolomgrenzen herberekenen op basis van de kopregel ("Tegenrekening  Naam/omschrijving
    // Bedrag af (debet)  Bedrag bij (credit)") — via een tekst-naar-item-index-map i.p.v. één los
    // tekstitem, zodat het ook werkt als PDF.js de koplabels in meerdere kleinere stukjes tekst
    // opsplitst i.p.v. als één geheel. De Naam-kolomgrens laat toe de naam op de eerste regel altijd
    // positioneel te bepalen i.p.v. te gokken aan de hand van hoe de tekst eruitziet (zie hieronder
    // waarom dat laatste bij een korte, in hoofdletters geschreven naam als "TAF BV" fout gaat: die
    // is qua vorm niet te onderscheiden van een stukje Tegenrekening-IBAN).
    let headerLineIdx = -1;
    lines.forEach((line, idx) => {
      let text = "", map = [];
      line.items.forEach((it, i)=>{
        if(i>0){ text += " "; map.push(null); }
        for(let c=0;c<it.str.length;c++) map.push(it);
        text += it.str;
      });
      const iNaam = text.indexOf("Naam/omschrijving");
      const iDebet = text.indexOf("Bedrag af");
      const iCredit = text.indexOf("Bedrag bij");
      if(iNaam>=0){
        const naamItem = map[iNaam];
        if(naamItem) naamColumnX = naamItem.x;
        headerLineIdx = idx;
      }
      /* De grens tussen de "Bedrag af"- en "Bedrag bij"-kolom.
         Tot v25 was dat het midden tussen de LINKERranden van de twee koplabels. Dat klopt niet:
         bedragen staan rechts uitgelijnd in hun kolom, dus een korte afschrijving begint ver naar
         rechts — op de testpagina's tot x=485, terwijl dat midden op 480 lag. Elke afschrijving die
         net iets voorbij dat midden begon, werd als bijschrijving gelezen.
         Wat wél houdbaar is: een bedrag begint nooit vóór het koplabel van zijn eigen kolom. Een
         bijschrijving begint dus op of voorbij de linkerrand van "Bedrag bij", en een afschrijving
         altijd ervóór. De kleine speling vangt afrondingsverschillen in de PDF-coördinaten op. */
      if(iCredit>=0){
        const creditItem = map[iCredit];
        if(creditItem) debetCreditThreshold = creditItem.x - 10;
      }
    });

    // Alles tot en met de tabelkop ("Rente Type Tegenrekening Naam/omschrijving ... / datum")
    // overslaan: dat is altijd kop-/adresgegevens (adressant, IBAN, bladnummer, periode) die nooit
    // bij een transactie hoort. Nodig omdat een transactie soms met zijn vervolgregels over een
    // pagina-einde loopt (block blijft dan expres open, zie hieronder) — zonder dit zou die kop-
    // /adresruis er middenin belanden.
    const bodyLines = headerLineIdx >= 0 ? lines.slice(headerLineIdx + 2) : lines;

    bodyLines.forEach(line => {
      const text = line.items.map(it=>it.str).join(" ").replace(/\s+/g," ").trim();
      if(!text) return;

      const startMatch = text.match(BLOCK_START_RE);
      if(startMatch){
        const amtItem = [...line.items].reverse().find(it => AMOUNT_RE.test(it.str.trim()));
        // Naam positioneel bepalen: alle items die (ruim) binnen de Naam/omschrijving-kolom vallen,
        // met het bedrag-item er zelf weer uitgefilterd. Robuuster dan tekstpatronen gokken, want
        // een korte naam als "TAF BV" ziet er qua vorm identiek uit aan een IBAN-groepje.
        let naamFromPosition = "";
        if(naamColumnX !== null){
          const naamItems = line.items.filter(it => it.x >= naamColumnX - 3 && it !== amtItem);
          naamFromPosition = naamItems.map(it=>it.str).join(" ").replace(/\s+/g," ").trim();
        }
        block = {
          firstLineRest: startMatch[3],
          naamFromPosition,
          // De debet/credit-grens van de pagina waarop dit blok BEGINT. Tot v25 werd één gedeelde
          // variabele na afloop van de paginalus uitgelezen, waardoor de kolomindeling van de
          // laatste pagina met terugwerkende kracht gold voor het hele afschrift. Die grens
          // verschilt per pagina (op het testafschrift 480 / 455 / 527,5), dus bij een afschrift
          // waarvan de laatste pagina anders is opgemaakt sloegen tientallen afschrijvingen om in
          // inkomsten: een tekort van € 431 werd een overschot van € 456.
          debetCreditThreshold,
          amountStr: null,
          amountX: null,
          extraLines: [],
          verwerkingsdatum: null,
        };
        if(amtItem){ block.amountStr = amtItem.str.trim(); block.amountX = amtItem.x; }
        transactions.push(block);
        return;
      }

      if(!block) return; // ruis vóór de eerste transactie: kopregels, adres, footer, legenda

      const vwMatch = text.match(/Verwerkingsdatum:\s*(\d{2}-\d{2}-\d{4})/);
      if(vwMatch){
        block.verwerkingsdatum = vwMatch[1];
        block = null; // blok compleet — eventuele ruis erna (volgende kop/footer) wordt genegeerd
        return;
      }
      // Kop-/voettekst die per pagina terugkeert (bv. "Blad 7 van 14", "vervolg Rekeningafschrift",
      // de tabelkop zelf) mag nooit in de omschrijving van een nog openstaand blok terechtkomen —
      // dat kan gebeuren omdat een transactie soms met zijn vervolgregels over een pagina-einde
      // loopt (zie hierboven, block blijft dan expres open), waardoor deze ruis er middenin valt.
      // Let op: "Rabo Standaard" hoort hier NIET bij — dat is niet alleen kop-boilerplate, het is ook
      // de letterlijke vervolgregel van de maandelijkse rekeningkosten-transactie zelf ("Kosten" /
      // "Rabo Standaard" / "Periode ..."). Die regel per ongeluk wegfilteren brak de Rabobank-
      // herkenning (zie classifyTransaction). Alleen tekst die uitsluitend als paginakop voorkomt.
      const PAGE_NOISE_RE = /^(Blad\b|\d+ van \d+$|vervolg Rekeningafschrift|Rekeningafschrift$|Ten name van|IBAN\s*\/\s*Rekeningnummer|Datum vanaf|Datum tot en met|Rente\s*$|datum\s*$|Type Tegenrekening|CR\s*=|D\s*=\s*tekort)/i;
      if(PAGE_NOISE_RE.test(text)) return;
      block.extraLines.push(text);
    });
  }

  // Blokken zonder herkend bedrag of Verwerkingsdatum passen niet in de aannames hierboven en
  // worden overgeslagen i.p.v. met gokwerk verwerkt (liever een gemiste regel dan een foute).
  return transactions
    .filter(b => b.amountStr && b.verwerkingsdatum)
    .map(b => {
      const grens = b.debetCreditThreshold;
      const isCredit = grens !== null && grens !== undefined && b.amountX > grens;
      const amt = parseNLAmount(b.amountStr) * (isCredit ? 1 : -1);

      // Naam bij voorkeur positioneel bepaald (zie b.naamFromPosition hierboven) — robuuster dan
      // op basis van hoe de tekst eruitziet, want een korte naam als "TAF BV" is qua vorm niet te
      // onderscheiden van een stukje Tegenrekening-IBAN. Alleen als de Naam-kolomgrens deze pagina
      // niet gevonden kon worden (geen kopregel herkend) valt dit terug op tekstpatronen gokken.
      let naam;
      // `!b.naamFromPosition` en niet `=== undefined`: naamFromPosition is ALTIJD een string (hij
      // wordt op "" geïnitialiseerd), dus de undefined-check die hier tot v25 stond was altijd waar
      // en maakte de tekstuele terugval hieronder onbereikbaar. Die terugval is juist nodig als de
      // kolomkop niet gevonden is — bijvoorbeeld wanneer pdf.js "Naam/omschrijving" in twee stukjes
      // aanlevert, waarna elke tegenpartijnaam op deze pagina leeg blijft.
      if(b.naamFromPosition){
        naam = b.naamFromPosition;
      } else {
        const rest = b.firstLineRest.replace(new RegExp(escapeRegExp(b.amountStr) + "\\s*$"), "").trim();
        const ibanOnlyMatch = rest.match(/^[A-Z]{2}\d{2}(?:\s+[A-Z0-9]{2,6}){0,6}$/);
        if(ibanOnlyMatch){
          naam = ""; // Tegenrekening-IBAN vult de hele eerste regel al
        } else {
          const ibanWithNaamMatch = rest.match(/^([A-Z]{2}\d{2}(?:\s+[A-Z0-9]{2,6}){1,6})\s+(.+)$/);
          naam = (ibanWithNaamMatch ? ibanWithNaamMatch[2] : rest).trim();
        }
      }

      // Een "naam" die er zelf nog als een stukje IBAN uitziet (kort, alleen hoofdletters/cijfers,
      // geen spatie) is vrijwel zeker een restje Tegenrekening dat toch nog binnen de Naam-kolom
      // viel (bv. bij een ongebruikelijk lange IBAN) — behandel die net als "geen naam gevonden".
      if(naam && /^[A-Z0-9]{1,6}$/.test(naam)) naam = "";

      // Bij een (te) lange Tegenrekening-IBAN past de naam soms niet meer op de eerste regel en
      // staat 'm als allereerste vervolgregel (bv. de PayPal- en Amazon-incasso's in dit afschrift)
      // i.p.v. ernaast. Zonder naam op de eerste regel: als de eerste vervolgregel geen van de
      // vaste detail-labels is, is dat de naam.
      let extraLines = b.extraLines.slice();
      if(!naam && extraLines.length){
        const first = extraLines[0].trim();
        const isLabelLine = /^(Kenmerk|Transactiereferentie|Terugboeking|\.\s*Pas|Appr Cd|[A-Z]{2}\d{2}ZZZ)/i.test(first) || /^[A-Z]{2}\d{2}(\s|$)/.test(first);
        if(first && !isLabelLine){
          naam = first;
          extraLines = extraLines.slice(1);
        }
      }
      naam = naam || t("unknownCounterparty");

      const omschrijving = extraLines.join(" ").replace(/\s+/g," ").trim();
      const isStorno = /terugboeking\s*:/i.test(omschrijving);
      const refMatch = omschrijving.match(/Transactiereferentie:\s*([A-Za-z0-9]+)/i);
      const [dd,mm,yyyy] = b.verwerkingsdatum.split("-");

      return {
        "Datum": `${yyyy}-${mm}-${dd}`,
        "Bedrag": String(amt).replace(".", ","),
        "Naam tegenpartij": naam,
        "Naam initiërende partij": "",
        "Omschrijving-1": omschrijving,
        "Omschrijving-2": "",
        "Reden retour": isStorno ? "Terugboeking (PDF)" : "",
        "Transactiereferentie": refMatch ? refMatch[1] : "",
      };
    });
}

function handlePDFUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    try{
      const rows = await parsePdfTransactions(ev.target.result);
      const monthObj = buildMonthFromCSV(rows, file.name);
      upsertMonth(monthObj);
      state.activeView = { type:"month", key: monthObj.key };
      renderAll();
    }catch(err){
      alert(t("pdfParseError") + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = "";
}

   (Deze toelichting stond tot v25 het tegenovergestelde te beweren: dat opslaan het hele

   Zo wérkte het vóór de cloud-sync, maar die code is er al niet meer — er is geen
   showSaveFilePicker, geen createWritable en geen IndexedDB in dit bestand te vinden. De verouderde
   tekst was niet onschuldig: hij wekte de indruk dat een schoon uitgeleverd bestand zichzelf bij
   het eerste gebruik weer met data zou vullen, en dat is niet zo.)

   buildHtmlWithEmbeddedData() hieronder bestaat dus nog maar voor één ding: de knop "Exporteren",
   die een APART bestand downloadt (FinBo-backup-<datum>.html) met de app en je data ineen. Handig
   als offline back-up die overal te openen is zonder in te loggen — maar daarmee is dat gedownloade

   Bewust nog steeds GEEN localStorage/sessionStorage voor de data zelf; sessionStorage wordt alleen

/* Elke "<" moet ge-escaped worden zodat een categorienaam met daarin toevallig een scriptsluit-tag
   het ingebedde datablok niet kan afbreken — < is een geldige JSON-escape en levert bij het
   uitlezen gewoon weer het teken "<" op. */
function buildHtmlWithEmbeddedData(){
  const dataJson = JSON.stringify(state).replace(/</g, "\\u003C");
  const withData = PRISTINE_HTML.replace(
    /(<script type="application\/json" id="finbo-embedded-data">)[\s\S]*?(<\/script>)/,
    (_m, open, close) => open + dataJson + close
  );
  return "<!DOCTYPE html>\n" + withData;
}

function readEmbeddedData(){
  try{
    const el = document.getElementById("finbo-embedded-data");
    if(!el) return null;
    const txt = el.textContent.trim();
    if(!txt || txt === "{}") return null;
    return JSON.parse(txt);
  }catch(err){ console.error("Kon ingebedde data niet lezen:", err); return null; }
}

/* Zelfde truc, maar dan om de embedded data uit een extern HTML-bestand te lezen (bij handmatig
   verbinden/importeren van een andere kopie van dit bestand). */
function extractEmbeddedDataFromHtml(text){
  const m = text.match(/<script type="application\/json" id="finbo-embedded-data">([\s\S]*?)<\/script>/);
  if(!m) return null;
  const txt = m[1].trim();
  if(!txt || txt === "{}") return null;
  return JSON.parse(txt);
}

     naar je eigen rij in `finbo_state` geschreven (Row Level Security zorgt dat dat ook echt
     alleen jouw rij kan zijn — zie finbo_supabase_setup.sql). */

const FINBO_DEFAULT_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFsc25qbG56dmJnd3Z5am5zd3ZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczOTIwNjQsImV4cCI6MjEwMjk2ODA2NH0.5kByeZpQjtB7DPeQtFidOUSrdGst1Ox5_wyUZ9g9wKo";

/* ---- Versleuteling (WebCrypto: PBKDF2 sleutelafleiding + AES-GCM) ----
   Zie finbo_crypto_module.js voor de losstaand geteste versie hiervan — functioneel identiek. */
const FINBO_PBKDF2_ITERATIONS = 300000;
function bufToBase64(buf){ const b=new Uint8Array(buf); let s=""; for(let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
function base64ToBuf(b64){ const bin=atob(b64); const b=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i); return b.buffer; }
async function finboDeriveKey(password, saltBytes){
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name:"PBKDF2", salt:saltBytes, iterations:FINBO_PBKDF2_ITERATIONS, hash:"SHA-256" }, baseKey, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
}
async function finboEncryptState(stateObj, password){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await finboDeriveKey(password, salt);
  const plaintext = new TextEncoder().encode(JSON.stringify(stateObj));
  const ciphertextBuf = await crypto.subtle.encrypt({ name:"AES-GCM", iv }, key, plaintext);
  return { ciphertext: bufToBase64(ciphertextBuf), salt: bufToBase64(salt), iv: bufToBase64(iv) };
}
async function finboDecryptState(record, password){
  const salt = base64ToBuf(record.salt);
  const iv = base64ToBuf(record.iv);
  const key = await finboDeriveKey(password, salt);
  const ciphertext = base64ToBuf(record.ciphertext);
  let plainBuf;
  try{ plainBuf = await crypto.subtle.decrypt({ name:"AES-GCM", iv }, key, ciphertext); }
  catch(err){ throw new Error("FINBO_DECRYPT_FAILED"); }
  return JSON.parse(new TextDecoder().decode(plainBuf));
}

/* ---- Supabase-client + sessie/wachtwoord-state ---- */
const cloudClient = (typeof window.supabase !== "undefined")
